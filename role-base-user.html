<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal System Dashboard</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load LINE LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <!-- Tailwind Config for LINE Theme[cite: 1] -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        line: {
                            primary: '#0084FF',
                            success: '#17C950',
                            warning: '#FFC300',
                            danger: '#FF4458',
                            gray: '#B6C2C7',
                            darkGray: '#6C757D',
                            lightBg: '#F7F7F7'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* ซ่อน Element ไว้ก่อนตรวจสอบสิทธิ์ */
        .perm-required { display: none !important; }
        
        /* LINE Template Standard[cite: 1] */
        body { 
            background-color: #F7F7F7; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
        }
        .line-container { 
            max-width: 500px; /* Optimized for mobile to full Flex Message max[cite: 1] */
            margin: 0 auto; 
            min-height: 100vh; 
            background-color: #F7F7F7; 
        }
        .line-header { 
            background: linear-gradient(135deg, #0084FF 0%, #0066cc 100%); 
            color: white; 
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .menu-item {
            transition: all 0.3s ease;
        }
        .menu-item:active {
            background-color: #efefef;
        }
    </style>
</head>
<body>

    <script>
        // ================= CONFIGURATION =================
        const LIFF_ID = "2011487100-dldPQItq"; 
        const CENTRAL_API_URL = "https://script.google.com/macros/s/AKfycbyhkjQPwFOVw1v9tYcDBS4UV1JdtVagw62aBMl0Hqa6wymbqpgx9lUPZRRxyFnEXX8NzA/exec"; // นำ URL จาก GAS มาวาง
        const CURRENT_MENU_ID = "901"; // รหัส Portal Menu
        // =================================================
    </script>

    <!-- Loading Screen -->
    <div id="loadingScreen" class="line-container flex flex-col items-center justify-center h-screen">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-line-primary"></div>
        <p class="mt-4 text-line-darkGray text-sm">กำลังเชื่อมต่อ Portal System...</p>
    </div>

    <!-- Main Portal Application -->
    <div id="appScreen" class="line-container hidden pb-10">
        
        <!-- HEADER[cite: 1] -->
        <header class="line-header px-4 py-6 rounded-b-2xl">
            <h1 class="text-2xl font-bold mb-1">👋 Welcome, <span id="displayName">User</span></h1>
            <div class="flex items-center text-sm text-blue-100 opacity-90 mt-2">
                <span id="userRoleBadge" class="bg-white/30 px-3 py-1 rounded-full text-xs mr-2 shadow-sm font-semibold">Role</span>
                <span id="empIdDisplay">ID: --</span>
            </div>
        </header>

        <main class="p-4 space-y-6 mt-2">
            
            <!-- ADMIN SECTION (เห็นเฉพาะ ADMIN) -->
            <section id="adminPortal" class="perm-required bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="bg-red-50 p-3 border-b border-red-100">
                    <h2 class="text-sm font-bold text-red-600 uppercase tracking-wide flex items-center">
                        <span>👑 Administration (Admin Only)</span>
                    </h2>
                </div>
                <div class="p-2">
                    <a href="#" class="menu-item flex items-center p-3 border-b border-gray-50 text-gray-800">
                        <span class="text-xl w-8 text-center mr-3">👥</span>
                        <span class="flex-1 font-medium text-sm">จัดการผู้ใช้งานทั้งหมด (Select & Edit)</span>
                        <span class="text-gray-400">›</span>
                    </a>
                    <a href="#" class="menu-item flex items-center p-3 text-gray-800">
                        <span class="text-xl w-8 text-center mr-3">🔐</span>
                        <span class="flex-1 font-medium text-sm">จัดการสิทธิ์ (Role & Permissions)</span>
                        <span class="text-gray-400">›</span>
                    </a>
                </div>
            </section>

            <!-- GROUP 1: My Applications[cite: 1] -->
            <section class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wide p-4 border-b border-gray-100 bg-gray-50">
                    📋 Applications
                </h2>
                <div class="p-2">
                    <div class="grid grid-cols-2 gap-2 p-2">
                        <!-- ปุ่มจะแสดงตามสิทธิ์ -->
                        <button class="perm-required perm-create w-full bg-line-primary text-white font-medium py-3 rounded-lg text-sm shadow-sm">
                            ➕ สร้างรายการใหม่
                        </button>
                        <button class="perm-required perm-edit w-full bg-line-warning text-white font-medium py-3 rounded-lg text-sm shadow-sm">
                            ✏️ แก้ไขข้อมูล
                        </button>
                        <button class="perm-required perm-approve w-full bg-line-success text-white font-medium py-3 rounded-lg text-sm shadow-sm col-span-2">
                            ✅ อนุมัติรายการ (Pending)
                        </button>
                    </div>
                </div>
            </section>

            <!-- GROUP 2: Reports & Logs[cite: 1] -->
            <section class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wide p-4 border-b border-gray-100 bg-gray-50">
                    📊 Reports
                </h2>
                <div class="p-2">
                    <a href="#" class="menu-item flex items-center p-3 border-b border-gray-50 text-gray-800">
                        <span class="text-xl w-8 text-center mr-3">📝</span>
                        <span class="flex-1 font-medium text-sm">Activity Log</span>
                        <span class="text-gray-400">›</span>
                    </a>
                    <a href="#" class="menu-item flex items-center p-3 text-gray-800">
                        <span class="text-xl w-8 text-center mr-3">🔍</span>
                        <span class="flex-1 font-medium text-sm">Audit Trail</span>
                        <span class="text-gray-400">›</span>
                    </a>
                </div>
            </section>

            <!-- FOOTER[cite: 1] -->
            <footer class="text-center p-4 mt-6">
                <button class="perm-required perm-delete w-full bg-line-danger text-white font-medium py-3 rounded-lg shadow-sm mb-4">
                    🗑️ ลบข้อมูลระบบ (Danger Zone)
                </button>
                <p class="text-xs text-gray-400">Centralized Auth API © 2026</p>
            </footer>

        </main>
    </div>

    <!-- Application Core Logic -->
    <script>
        async function initApp() {
            try {
                await liff.init({ liffId: LIFF_ID });
                
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                const profile = await liff.getProfile();
                document.getElementById('displayName').textContent = profile.displayName;
                
                await verifyAccess(profile.userId);

            } catch (err) {
                console.error("LIFF Init Error:", err);
                alert("ไม่สามารถเชื่อมต่อ LINE ได้");
            }
        }

        async function verifyAccess(userId) {
            try {
                const response = await fetch(CENTRAL_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' }, // ป้องกัน CORS
                    body: JSON.stringify({
                        action: 'verifyAccess',
                        userId: userId,
                        menuId: CURRENT_MENU_ID
                    })
                });

                const data = await response.json();
                document.getElementById('loadingScreen').classList.add('hidden');

                if (data.status === 'not_registered') {
                    alert('คุณยังไม่ได้ลงทะเบียนในระบบ กรุณาติดต่อ HR');
                    liff.closeWindow();
                    return;
                }

                if (!data.allowed) {
                    alert('Access Denied: คุณไม่มีสิทธิ์เข้าใช้งาน Portal นี้');
                    liff.closeWindow();
                    return;
                }

                // แสดงผล Portal
                document.getElementById('appScreen').classList.remove('hidden');
                document.getElementById('userRoleBadge').textContent = data.jobPosition;
                document.getElementById('empIdDisplay').textContent = 'ID: ' + data.empId;

                // หากเป็น ADMIN ให้แสดง Section การจัดการผู้ใช้งาน (เห็นข้อมูลทุกคน)
                if (data.isAdmin) {
                    document.getElementById('adminPortal').classList.remove('perm-required');
                }

                // ปรับแต่ง DOM ตามสิทธิ์ (CRUD)
                applyPermissions(data.permissions);

            } catch (error) {
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์");
                console.error(error);
            }
        }

        function applyPermissions(perms) {
            if (perms.create) document.querySelectorAll('.perm-create').forEach(el => el.classList.remove('perm-required'));
            if (perms.edit) document.querySelectorAll('.perm-edit').forEach(el => el.classList.remove('perm-required'));
            if (perms.delete) document.querySelectorAll('.perm-delete').forEach(el => el.classList.remove('perm-required'));
            if (perms.approve) document.querySelectorAll('.perm-approve').forEach(el => el.classList.remove('perm-required'));
        }

        // เริ่มแอปเมื่อโหลดหน้าเสร็จสิ้น
        window.onload = initApp;
    </script>
</body>
</html>
