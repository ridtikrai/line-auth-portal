<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>User Management System</title>
    
    <!-- Load Tailwind & LINE LIFF -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <!-- Tailwind Config: LINE Template Colors[cite: 1] -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        line: {
                            primary: '#0084FF',
                            success: '#17C950',
                            warning: '#FFC300',
                            danger: '#FF4458',
                            gray: '#B6C2C7',
                            darkGray: '#6C757D',
                            bg: '#F7F7F7'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        /* สไตล์หลักตามมาตรฐาน LINE Template[cite: 1] */
        body { background-color: #F7F7F7; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        .line-app { max-width: 500px; margin: 0 auto; min-height: 100vh; background-color: #F7F7F7; position: relative; }
        .line-header { background: linear-gradient(135deg, #0084FF 0%, #0066cc 100%); color: white; }
        
        /* Class สำหรับซ่อน DOM ตามสิทธิ์ที่ถูกดึงมาจาก API */
        .perm-req { display: none !important; }
    </style>
</head>
<body>

    <script>
        // === CONFIGURATION ===
        const LIFF_ID = "2011487100-dldPQItq"; 
        const CENTRAL_API_URL = "https://script.google.com/macros/s/AKfycbyhkjQPwFOVw1v9tYcDBS4UV1JdtVagw62aBMl0Hqa6wymbqpgx9lUPZRRxyFnEXX8NzA/exec"; // วาง URL จาก Google Apps Script ที่นี่
        const CURRENT_MENU_ID = "901"; // รหัสเมนูสำหรับหน้าจอนี้
    </script>

    <!-- หน้าต่าง Loading -->
    <div id="loading" class="line-app flex flex-col items-center justify-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-line-primary"></div>
        <p class="mt-4 text-line-darkGray text-sm">กำลังโหลดระบบส่วนกลาง...</p>
    </div>

    <!-- หน้าต่างหลักของแอปพลิเคชัน (ซ่อนไว้จนกว่าสิทธิ์จะผ่าน) -->
    <div id="app" class="line-app hidden pb-20">
        
        <!-- HEADER (LINE Style)[cite: 1] -->
        <header class="line-header px-4 py-6 rounded-b-2xl shadow-sm">
            <h1 class="text-2xl font-bold mb-1" id="pageTitle">ระบบจัดการผู้ใช้งาน</h1>
            <div class="flex items-center text-sm mt-2 opacity-90">
                <span id="userRole" class="bg-white/30 px-3 py-1 rounded-full text-xs font-semibold mr-2">Role</span>
                <span id="userEmpId">ID: --</span>
            </div>
        </header>

        <main class="p-4 space-y-4">
            
            <!-- ส่วนแผงควบคุมหลัก -->
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-sm font-bold text-gray-600 uppercase tracking-wide">👥 รายชื่อพนักงาน</h2>
                <!-- ปุ่มเพิ่มผู้ใช้ (แสดงเฉพาะมีสิทธิ์ canCreate) -->
                <button onclick="openModal('add')" class="perm-req perm-create bg-line-primary text-white text-xs font-bold px-4 py-2 rounded-full shadow-sm active:bg-blue-700">
                    + เพิ่มข้อมูล
                </button>
            </div>

            <!-- กล่องแสดงรายการผู้ใช้งาน -->
            <div id="userList" class="space-y-3">
                <!-- ข้อมูลผู้ใช้งานจะถูก Render ที่นี่ -->
            </div>

        </main>
    </div>

    <!-- Modal Form (สำหรับ Add / Edit) -->
    <div id="userModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-xl overflow-hidden shadow-xl">
            <div class="bg-line-primary p-4 text-white font-bold" id="modalTitle">จัดการผู้ใช้งาน</div>
            <div class="p-4 space-y-3">
                <input type="hidden" id="formMode">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">LINE User ID</label>
                    <input type="text" id="inputUserId" class="w-full border rounded p-2 text-sm focus:border-line-primary outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">Employee ID</label>
                    <input type="text" id="inputEmpId" class="w-full border rounded p-2 text-sm focus:border-line-primary outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">Job Position (Role)</label>
                    <input type="text" id="inputPosition" class="w-full border rounded p-2 text-sm focus:border-line-primary outline-none">
                </div>
            </div>
            <div class="p-4 border-t flex justify-end space-x-2 bg-gray-50">
                <button onclick="closeModal()" class="px-4 py-2 bg-gray-200 text-gray-700 text-sm font-bold rounded-lg">ยกเลิก</button>
                <button onclick="saveUser()" class="px-4 py-2 bg-line-success text-white text-sm font-bold rounded-lg shadow-sm">บันทึก</button>
            </div>
        </div>
    </div>

    <script>
        // ตัวแปรเก็บสิทธิ์ที่ได้จาก API
        let userPermissions = {}; 
        let globalUsersData = [];

        // 1. เริ่มต้นระบบและ Login ผ่าน LIFF
        async function initApp() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                const profile = await liff.getProfile();
                await verifyAccess(profile.userId);
            } catch (err) {
                alert("ระบบขัดข้อง ไม่สามารถเชื่อมต่อ LINE ได้");
            }
        }

        // 2. เรียก API กลางเพื่อตรวจสอบสิทธิ์
        async function verifyAccess(userId) {
            try {
                const response = await fetch(CENTRAL_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: 'verifyAccess', userId: userId, menuId: CURRENT_MENU_ID })
                });

                const data = await response.json();
                
                if (!data.allowed) {
                    alert('Access Denied: คุณไม่มีสิทธิ์เข้าใช้งานหน้านี้');
                    liff.closeWindow();
                    return;
                }

                // สิทธิ์ผ่าน -> แสดงหน้าจอและตั้งค่าสิทธิ์
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                
                document.getElementById('userRole').textContent = data.jobPosition;
                document.getElementById('userEmpId').textContent = 'ID: ' + data.empId;
                if(data.menuName) document.getElementById('pageTitle').textContent = data.menuName;

                userPermissions = data.permissions;
                applyPermissionsToDOM();
                
                // โหลดรายชื่อพนักงาน
                await loadUsersList();

            } catch (error) {
                alert("เกิดข้อผิดพลาดในการตรวจสอบสิทธิ์");
            }
        }

        // 3. จัดการ DOM เปิดปุ่มต่างๆ ตามสิทธิ์ที่มี
        function applyPermissionsToDOM() {
            if (userPermissions.read) document.querySelectorAll('.perm-read').forEach(el => el.classList.remove('perm-req'));
            if (userPermissions.create) document.querySelectorAll('.perm-create').forEach(el => el.classList.remove('perm-req'));
            if (userPermissions.edit) document.querySelectorAll('.perm-edit').forEach(el => el.classList.remove('perm-req'));
            if (userPermissions.delete) document.querySelectorAll('.perm-delete').forEach(el => el.classList.remove('perm-req'));
            if (userPermissions.approve) document.querySelectorAll('.perm-approve').forEach(el => el.classList.remove('perm-req'));
        }

        // 4. ดึงข้อมูลรายการผู้ใช้งานจาก Sheet
        async function loadUsersList() {
            const listEl = document.getElementById('userList');
            listEl.innerHTML = '<div class="text-center text-sm text-gray-500 py-4">กำลังโหลดข้อมูล...</div>';
            
            const response = await fetch(CENTRAL_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({ action: 'getUsers' })
            });
            const result = await response.json();
            globalUsersData = result.data;
            renderUsers();
        }

        // 5. แสดงผลรายการผู้ใช้งานลงใน List
        function renderUsers() {
            const listEl = document.getElementById('userList');
            listEl.innerHTML = '';
            
            globalUsersData.forEach(user => {
                // สร้างการแสดงผลแต่ละบุคคลเป็นรูปแบบ Card ตามหลัก Touch-Friendly ของ LINE[cite: 1]
                let html = `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
                    <div>
                        <div class="font-bold text-gray-800 text-sm">${user.Emp_ID}</div>
                        <div class="text-xs text-gray-500 mt-1">Role: <span class="text-line-primary font-semibold">${user.Job_Position}</span></div>
                    </div>
                    <div class="flex space-x-2">`;
                
                // ตรวจสอบสิทธิ์ว่าจะให้เห็นปุ่ม Edit / Delete หรือไม่
                if (userPermissions.edit) {
                    html += `<button onclick="openModal('edit', '${user.userId}')" class="bg-line-warning text-white text-xs px-3 py-2 rounded font-bold">แก้ไข</button>`;
                }
                if (userPermissions.delete) {
                    html += `<button onclick="deleteUser('${user.userId}')" class="bg-line-danger text-white text-xs px-3 py-2 rounded font-bold">ลบ</button>`;
                }

                html += `</div></div>`;
                listEl.insertAdjacentHTML('beforeend', html);
            });
        }

        // ================= UI HANDLERS =================
        function openModal(mode, userId = null) {
            document.getElementById('userModal').classList.remove('hidden');
            document.getElementById('formMode').value = mode;
            
            if (mode === 'add') {
                document.getElementById('modalTitle').textContent = '➕ เพิ่มผู้ใช้งานใหม่';
                document.getElementById('inputUserId').value = '';
                document.getElementById('inputEmpId').value = '';
                document.getElementById('inputPosition').value = '';
                document.getElementById('inputUserId').readOnly = false;
            } else if (mode === 'edit') {
                document.getElementById('modalTitle').textContent = '✏️ แก้ไขข้อมูล';
                const user = globalUsersData.find(u => String(u.userId) === String(userId));
                document.getElementById('inputUserId').value = user.userId;
                document.getElementById('inputUserId').readOnly = true; // ล็อคไม่ให้แก้ key หลัก
                document.getElementById('inputEmpId').value = user.Emp_ID;
                document.getElementById('inputPosition').value = user.Job_Position;
            }
        }

        function closeModal() {
            document.getElementById('userModal').classList.add('hidden');
        }

        async function saveUser() {
            const mode = document.getElementById('formMode').value;
            const payload = {
                action: 'manageUser',
                mode: mode,
                user: {
                    userId: document.getElementById('inputUserId').value,
                    Emp_ID: document.getElementById('inputEmpId').value,
                    Job_Position: document.getElementById('inputPosition').value
                }
            };
            
            document.getElementById('modalTitle').textContent = 'กำลังบันทึก...';
            
            await fetch(CENTRAL_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(payload)
            });
            
            closeModal();
            loadUsersList(); // รีเฟรชรายการ
        }

        async function deleteUser(userId) {
            if(!confirm("ยืนยันการลบผู้ใช้นี้ออกจากระบบ?")) return;
            
            await fetch(CENTRAL_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({ action: 'manageUser', mode: 'delete', user: { userId: userId } })
            });
            loadUsersList();
        }

        // โหลดฟังก์ชันเริ่มต้นเมื่อ DOM พร้อม
        window.onload = initApp;
    </script>
</body>
</html>
