<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard</title>
    
    <!-- Load Tailwind & LIFF -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <!-- Tailwind Config based on LINE Template Standards -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        line: {
                            primary: '#0084FF',
                            success: '#17C950',
                            warning: '#FFC300',
                            danger: '#FF4458',
                            gray: '#B6C2C7',
                            bg: '#F7F7F7'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* ซ่อนปุ่มพื้นฐาน (รอ API ตอบกลับ) */
        .perm-required { display: none !important; }
        
        /* LINE Template Standard - Mobile First */
        body { background-color: #F7F7F7; font-family: -apple-system, sans-serif; }
        .line-container { max-width: 500px; margin: 0 auto; min-height: 100vh; background-color: #F7F7F7; }
        .line-header { background: linear-gradient(135deg, #0084FF 0%, #0066cc 100%); color: white; }
    </style>
</head>
<body>

    <script>
        // === การตั้งค่าโปรเจกต์ ===
        const LIFF_ID = "2011487100-dldPQItq"; 
        const CENTRAL_API_URL = "https://script.google.com/macros/s/AKfycbyhkjQPwFOVw1v9tYcDBS4UV1JdtVagw62aBMl0Hqa6wymbqpgx9lUPZRRxyFnEXX8NzA/exec"; // วาง URL จาก GAS
        const CURRENT_MENU_ID = 901; // สามารถส่งเป็นตัวเลขหรือ String ก็ได้แล้วในตอนนี้
    </script>

    <!-- Loading -->
    <div id="loadingScreen" class="line-container flex flex-col items-center justify-center h-screen">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-line-primary"></div>
        <p class="mt-4 text-gray-500 text-sm">กำลังตรวจสอบสิทธิ์...</p>
    </div>

    <!-- Main App -->
    <div id="appScreen" class="line-container hidden shadow-sm">
        
        <!-- Header LINE Style -->
        <header class="line-header px-4 py-6 rounded-b-xl shadow-md">
            <h1 id="menuTitle" class="text-2xl font-bold mb-1">Loading...</h1>
            <div class="flex items-center text-sm text-blue-100 opacity-90">
                <span id="userRoleBadge" class="bg-white/30 px-3 py-1 rounded-full text-xs mr-2">Role</span>
                <span id="empIdDisplay">ID: --</span>
            </div>
        </header>

        <main class="p-4 space-y-4">
            <!-- แผงควบคุมสิทธิ์ (Action Buttons) -->
            <div class="bg-white rounded-lg p-4 shadow-sm border border-gray-100">
                <p class="text-gray-600 text-sm mb-4">เครื่องมือจัดการข้อมูล</p>
                <div class="grid grid-cols-2 gap-3">
                    
                    <button class="perm-required perm-create w-full bg-line-primary text-white font-medium py-3 rounded-lg">
                        ➕ เพิ่มข้อมูล
                    </button>

                    <button class="perm-required perm-edit w-full bg-line-warning text-white font-medium py-3 rounded-lg">
                        ✏️ แก้ไขข้อมูล
                    </button>
                    
                    <button class="perm-required perm-approve w-full bg-line-success text-white font-medium py-3 rounded-lg col-span-2">
                        ✅ อนุมัติรายการ
                    </button>

                    <button class="perm-required perm-delete w-full bg-line-danger text-white font-medium py-3 rounded-lg col-span-2">
                        🗑️ ลบข้อมูล
                    </button>

                </div>
            </div>
        </main>
    </div>

    <script>
        async function initApp() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                const profile = await liff.getProfile();
                await verifyAccess(profile.userId);
            } catch (err) {
                alert("LIFF Error: ไม่สามารถเชื่อมต่อ LINE ได้");
            }
        }

        async function verifyAccess(userId) {
            try {
                const response = await fetch(CENTRAL_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' }, // ป้องกัน CORS
                    body: JSON.stringify({
                        action: 'verifyAccess',
                        userId: userId,
                        menuId: CURRENT_MENU_ID
                    })
                });

                const data = await response.json();
                document.getElementById('loadingScreen').classList.add('hidden');

                if (data.status === 'not_registered') {
                    alert('คุณยังไม่ได้ลงทะเบียนในระบบ');
                    liff.closeWindow();
                    return;
                }

                if (!data.allowed) {
                    alert('Access Denied: คุณไม่มีสิทธิ์เข้าถึงเมนูนี้');
                    liff.closeWindow();
                    return;
                }

                // แสดงผลและเปิดสิทธิ์ DOM
                document.getElementById('appScreen').classList.remove('hidden');
                document.getElementById('menuTitle').textContent = data.menuName;
                document.getElementById('userRoleBadge').textContent = data.jobPosition;
                document.getElementById('empIdDisplay').textContent = 'ID: ' + data.empId;

                applyPermissions(data.permissions);

            } catch (error) {
                alert("เกิดข้อผิดพลาดจากเซิร์ฟเวอร์");
            }
        }

        function applyPermissions(perms) {
            // ถอดคลาสซ่อน (display:none) ตามสิทธิ์ที่ได้รับมา[cite: 1]
            if (perms.create) document.querySelectorAll('.perm-create').forEach(el => el.classList.remove('perm-required'));
            if (perms.edit) document.querySelectorAll('.perm-edit').forEach(el => el.classList.remove('perm-required'));
            if (perms.delete) document.querySelectorAll('.perm-delete').forEach(el => el.classList.remove('perm-required'));
            if (perms.approve) document.querySelectorAll('.perm-approve').forEach(el => el.classList.remove('perm-required'));
        }

        window.onload = initApp;
    </script>
</body>
</html>
