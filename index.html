<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centralized Dashboard</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  
  <!-- LINE Template Colors[cite: 1] -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            linePrimary: '#0084FF',
            lineLightBg: '#F7F7F7',
            lineDarkGray: '#6C757D'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-lineLightBg font-sans text-gray-800 antialiased min-h-screen flex flex-col">

  <!-- Header Classic Design -->
  <header class="bg-gradient-to-r from-linePrimary to-blue-700 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <img id="profile-img" src="https://via.placeholder.com/40" alt="Profile" class="h-10 w-10 rounded-full border-2 border-white hidden object-cover shadow-sm">
        <div>
          <h1 class="text-base font-bold tracking-wide">Portal System</h1>
          <p id="user-info" class="text-xs opacity-90">กำลังเชื่อมต่อ...</p>
        </div>
      </div>
      
      <div class="flex flex-col items-end gap-1">
        <button onclick="logoutApp()" class="text-xs bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded border border-white/30 transition flex items-center gap-1 shadow-sm">
          <span>ออกจากระบบ</span>
        </button>
        <div class="text-[10px] opacity-90 flex items-center gap-1 mt-1 bg-black/10 px-2 py-0.5 rounded">
          <span>⏱️</span>
          <span id="timer-display" class="font-mono font-bold tracking-wider">60:00</span>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 flex-grow w-full">
    
    <!-- 1. Loading -->
    <div id="loading-screen" class="flex flex-col items-center justify-center py-20">
      <div class="animate-spin rounded-full h-10 w-10 border-b-4 border-linePrimary mb-4"></div>
      <p class="text-lineDarkGray text-sm font-medium">กำลังโหลดเมนูระบบ...</p>
    </div>

    <!-- 2. Error Screen -->
    <div id="error-screen" class="hidden max-w-md mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-8 text-center">
      <div class="text-4xl mb-3 text-red-500">⚠️</div>
      <h2 id="error-title" class="text-lg font-bold mb-2">ข้อผิดพลาด</h2>
      <p id="error-message" class="text-sm text-lineDarkGray mb-5">-</p>
      <button onclick="liff.closeWindow()" class="w-full bg-gray-200 text-gray-700 font-bold py-3.5 rounded-lg transition">
        ปิดหน้าต่าง
      </button>
    </div>

    <!-- 3. Dashboard Groups -->
    <div id="dashboard-screen" class="hidden space-y-8 pb-10">
      <div id="menu-container" class="space-y-6"></div>
    </div>

  </main>

  <script>
    // ==========================================
    // Configuration
    // ==========================================
    const LIFF_ID = "2011487100-dldPQItq";
    const CENTRAL_API_URL = "https://script.google.com/macros/s/AKfycbzDpOrouurlO_Wlr5RikWVYf8gAmQcN-TTC8yIk7nKLLEvwjYRio5utMrEdxUm4m5Ia/exec"; // วาง URL Web App ของคุณ
    const CURRENT_MENU_ID = "DASHBOARD"; // ประกาศไว้ตามกฎ แม้หน้าหลักจะดึงทั้งหมด
    
    let lineProfile = null;
    let clientInfo = { ip: "Unknown", location: "Unknown", device: navigator.userAgent };
    
    // Auto TimeOut 60 นาที (3600 วินาที)
    let timeoutLimit = 3600; 
    let timeRemaining = timeoutLimit;
    let timerInterval;
    let keepAliveInterval;

    async function initApp() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          lineProfile = await liff.getProfile();
          document.getElementById('profile-img').src = lineProfile.pictureUrl;
          document.getElementById('profile-img').classList.remove('hidden');
          
          await fetchClientInfo(); 
          await loadDashboard();
          
          startActivityTracker();
        }
      } catch (err) {
        showError("พบข้อผิดพลาด", "ไม่สามารถเชื่อมต่อ LINE LIFF ได้");
      }
    }

    // ระบบจับเวลา TimeOut และต่ออายุ lastLogin
    function startActivityTracker() {
      const resetTimer = () => { timeRemaining = timeoutLimit; };
      
      // ดักจับ Activity ทุกรูปแบบเพื่อ Reset TimeOut
      ['mousemove', 'keydown', 'touchstart', 'scroll', 'click'].forEach(evt => 
        window.addEventListener(evt, resetTimer, { passive: true })
      );

      // UI Timer
      timerInterval = setInterval(() => {
        timeRemaining--;
        let m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
        let s = (timeRemaining % 60).toString().padStart(2, '0');
        document.getElementById('timer-display').textContent = `${m}:${s}`;
        
        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          clearInterval(keepAliveInterval);
          alert("หมดเวลาการเชื่อมต่อ (60 นาที) เพื่อความปลอดภัย กรุณาเข้าสู่ระบบใหม่");
          logoutApp();
        }
      }, 1000);

      // ส่งสัญญาณ Keep Alive ไปอัปเดต lastLogin ทุกๆ 15 นาที หากมีการใช้งาน
      keepAliveInterval = setInterval(() => {
        if (timeRemaining > 300) { 
          fetch(CENTRAL_API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'keepAlive', userId: lineProfile.userId })
          });
        }
      }, 15 * 60 * 1000); 
    }

    // ดึง IP / Location สำหรับ พ.ร.บ. คอมพิวเตอร์
    async function fetchClientInfo() {
      try {
        const res = await fetch('https://ipapi.co/json/');
        if (res.ok) {
          const data = await res.json();
          clientInfo.ip = data.ip;
          clientInfo.location = `${data.city}, ${data.country_name}`;
        }
      } catch (e) {}
    }

    async function loadDashboard() {
      showScreen('loading-screen');
      try {
        const response = await fetch(CENTRAL_API_URL, {
          method: 'POST',
          body: JSON.stringify({ 
            action: 'verifyAccess', 
            userId: lineProfile.userId,
            menuId: CURRENT_MENU_ID,
            profile: lineProfile,
            clientInfo: clientInfo
          })
        });
        
        const data = await response.json();

        if (data.status === 'not_registered') {
          showError("ไม่พบข้อมูลผู้ใช้งาน", "กรุณาติดต่อ Admin เพื่อลงทะเบียน");
        } else if (data.status === 'success') {
          renderDashboard(data);
        } else {
          showError("ข้อผิดพลาด", data.message || "เกิดข้อผิดพลาดในระบบ");
        }
      } catch (error) {
        showError("พบข้อผิดพลาด", "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้");
      }
    }

    // ฟังก์ชัน Render เมนู (grid-cols-3 บนมือถือ)
    function renderDashboard(data) {
      showScreen('dashboard-screen');
      document.getElementById('user-info').textContent = `${lineProfile.displayName} | ตำแหน่ง: ${data.jobPosition}`;
      
      const container = document.getElementById('menu-container');
      container.innerHTML = '';

      if (!data.menuGroups || data.menuGroups.length === 0) {
        container.innerHTML = `<div class="bg-white p-6 rounded-lg text-lineDarkGray text-center border shadow-sm">คุณยังไม่มีสิทธิ์เข้าถึงเมนูใดๆ</div>`;
        return;
      }

      data.menuGroups.forEach(group => {
        const groupSection = document.createElement('div');
        
        // จัดการ Grid อย่างน้อย 3 คอลัมน์บนมือถือ[cite: 1] และ 4-5 บนจอใหญ่
        const menusHtml = group.menus.map(menu => `
          <a href="${menu.menuUrl}" class="flex flex-col items-center justify-start p-3 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md hover:border-linePrimary transition h-full active:scale-95">
            <div class="bg-blue-50 text-linePrimary p-2.5 rounded-full mb-2.5">
              <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            </div>
            <h3 class="text-[11px] sm:text-xs font-bold text-gray-800 text-center leading-tight line-clamp-2 w-full">${menu.menuName}</h3>
          </a>
        `).join('');

        groupSection.innerHTML = `
          <h2 class="text-sm font-bold text-linePrimary mb-3 tracking-wide pl-1 border-l-4 border-linePrimary leading-none">#${group.groupName}</h2>
          <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-2.5 sm:gap-4">
              ${menusHtml}
          </div>
        `;
        container.appendChild(groupSection);
      });
    }

    function showScreen(id) {
      ['loading-screen', 'error-screen', 'dashboard-screen'].forEach(s => {
        document.getElementById(s).classList.add('hidden');
      });
      document.getElementById(id).classList.remove('hidden');
    }

    function showError(title, message) {
      document.getElementById('error-title').textContent = title;
      document.getElementById('error-message').textContent = message;
      showScreen('error-screen');
    }

    function logoutApp() {
      if (liff.isLoggedIn()) {
        liff.logout();
        window.location.reload();
      }
    }

    window.onload = initApp;
  </script>
</body>
</html>
