  <script>


    // =====================================================
    // CONFIGURATION
    // =====================================================

    const LIFF_ID =
      "2011487100-dldPQItq";


    /*
     * ใช้ Central API URL ตัวเดิมจาก Portal
     */
    const CENTRAL_API_URL =
      "https://script.google.com/macros/s/AKfycbwphhIdSMHpTWHuFrRFTC3lEZe-QQCaZr2cebxb22cE9ph1eYPscyrxdw29T44DaUT9/exec";


    // =====================================================
    // SESSION CONFIGURATION
    // =====================================================

    const SESSION_TIMEOUT_SECONDS =
      60 * 60;


    const KEEP_ALIVE_INTERVAL =
      10 * 60 * 1000;


    // =====================================================
    // GLOBAL STATE
    // =====================================================

    let lineProfile =
      null;


    let portalSessionId =
      null;


    let clientInfo = {

      ip:
        "Unknown",

      location:
        "Unknown",

      device:
        navigator.userAgent

    };


    let timeoutLimit =
      SESSION_TIMEOUT_SECONDS;


    let timeRemaining =
      timeoutLimit;


    let timerInterval =
      null;


    let keepAliveInterval =
      null;


    let lastActivityAt =
      Date.now();


    let isLoggingOut =
      false;


    let isLaunching =
      false;



    // =====================================================
    // API HELPER
    // =====================================================

    async function callPortalApi(
      payload
    ) {

      const response =
        await fetch(
          CENTRAL_API_URL,
          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "text/plain;charset=utf-8"

            },

            body:
              JSON.stringify(
                payload
              )

          }
        );


      if (
        !response.ok
      ) {

        throw new Error(
          "Portal API HTTP " +
          response.status
        );

      }


      const text =
        await response.text();


      let data;


      try {

        data =
          JSON.parse(
            text
          );

      } catch (
        error
      ) {

        console.error(
          "Invalid Portal response:",
          text
        );


        throw new Error(
          "Portal API ส่งข้อมูลไม่ถูกต้อง"
        );

      }


      return data;

    }



    // =====================================================
    // INITIALIZE APP
    // =====================================================

    async function initApp() {

      showScreen(
        "loading-screen"
      );


      try {

        /*
         * -------------------------------------------------
         * Restore Session
         * -------------------------------------------------
         */

        portalSessionId =
          sessionStorage.getItem(
            "portalSessionId"
          );


        /*
         * -------------------------------------------------
         * LIFF
         * -------------------------------------------------
         */

        await liff.init({

          liffId:
            LIFF_ID

        });


        /*
         * -------------------------------------------------
         * LINE Login
         * -------------------------------------------------
         */

        if (
          !liff.isLoggedIn()
        ) {

          liff.login();

          return;

        }


        /*
         * -------------------------------------------------
         * LINE Profile
         * -------------------------------------------------
         */

        lineProfile =
          await liff.getProfile();


        if (
          lineProfile.pictureUrl
        ) {

          const profileImg =
            document.getElementById(
              "profile-img"
            );


          profileImg.src =
            lineProfile.pictureUrl;


          profileImg.classList.remove(
            "hidden"
          );

        }


        document.getElementById(
          "user-info"
        ).textContent =
          lineProfile.displayName ||
          "ผู้ใช้งาน";


        /*
         * -------------------------------------------------
         * Client Info
         * -------------------------------------------------
         */

        await fetchClientInfo();


        /*
         * -------------------------------------------------
         * Existing Portal Session
         * -------------------------------------------------
         *
         * ถ้ามี Session อยู่
         * ให้ตรวจ Session ก่อน
         *
         * แต่ Dashboard ยังคงใช้ getDashboard
         * เพื่อโหลดสิทธิ์จาก Server
         * -------------------------------------------------
         */

        if (
          portalSessionId
        ) {

          const sessionValid =
            await verifyPortalSession();


          if (
            sessionValid
          ) {

            await loadDashboard();

            startActivityTracker();

            return;

          }


          /*
           * Session หมดอายุ
           */

          sessionStorage.removeItem(
            "portalSessionId"
          );


          portalSessionId =
            null;

        }


        /*
         * -------------------------------------------------
         * First Login / Registration
         * -------------------------------------------------
         */

        await loadDashboard();

      } catch (
        error
      ) {

        console.error(
          "initApp ERROR:",
          error
        );


        showError(

          "พบข้อผิดพลาด",

          error.message ||
          "ไม่สามารถเชื่อมต่อ LINE หรือเซิร์ฟเวอร์ได้"

        );

      }

    }



    // =====================================================
    // VERIFY EXISTING SESSION
    // =====================================================

    async function verifyPortalSession() {

      if (
        !portalSessionId
      ) {

        return false;

      }


      try {

        const data =
          await callPortalApi({

            action:
              "verifySession",

            sessionId:
              portalSessionId

          });


        if (
          data.status ===
          "success"
        ) {

          return true;

        }


        return false;

      } catch (
        error
      ) {

        console.error(
          "verifyPortalSession ERROR:",
          error
        );


        return false;

      }

    }



    // =====================================================
    // LOAD DASHBOARD
    // =====================================================

    async function loadDashboard() {

      showScreen(
        "loading-screen"
      );


      try {

        const data =
          await callPortalApi({

            /*
             * สำคัญ:
             *
             * ใช้ getDashboard
             * ไม่ใช้ login
             */

            action:
              "getDashboard",

            userId:
              lineProfile.userId,

            profile:
              lineProfile,

            clientInfo:
              clientInfo

          });


        console.log(
          "getDashboard response:",
          data
        );


        /*
         * -------------------------------------------------
         * NOT REGISTERED
         * -------------------------------------------------
         */

        if (
          data.status ===
          "not_registered"
        ) {

          /*
           * ถ้าไม่ได้ลงทะเบียน
           * ต้องไปกรอกเบอร์
           */

          showScreen(
            "register-screen"
          );


          document.getElementById(
            "user-info"
          ).textContent =
            "กรุณายืนยันตัวตนด้วยเบอร์โทรศัพท์";


          return;

        }


        /*
         * -------------------------------------------------
         * ERROR
         * -------------------------------------------------
         */

        if (
          data.status ===
          "error"
        ) {

          showError(

            "ไม่สามารถเข้าใช้งานได้",

            data.message ||
            "บัญชีไม่สามารถใช้งานได้"

          );


          return;

        }


        /*
         * -------------------------------------------------
         * SUCCESS
         * -------------------------------------------------
         */

        if (
          data.status ===
          "success"
        ) {

          /*
           * Backend อาจสร้าง Session ใหม่
           */

          if (
            data.sessionId
          ) {

            portalSessionId =
              data.sessionId;


            sessionStorage.setItem(

              "portalSessionId",

              portalSessionId

            );

          }


          renderDashboard(
            data
          );


          return;

        }


        /*
         * -------------------------------------------------
         * Unknown Response
         * -------------------------------------------------
         */

        showError(

          "เข้าสู่ระบบไม่สำเร็จ",

          data.message ||
          "ระบบส่งข้อมูลไม่ถูกต้อง"

        );

      } catch (
        error
      ) {

        console.error(
          "loadDashboard ERROR:",
          error
        );


        showError(

          "พบข้อผิดพลาด",

          error.message ||
          "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้"

        );

      }

    }



    // =====================================================
    // PHONE VERIFICATION
    // =====================================================

    document
      .getElementById(
        "phone-form"
      )
      .addEventListener(
        "submit",
        async function (
          event
        ) {

          event.preventDefault();


          const phoneInput =
            document
              .getElementById(
                "phone-input"
              )
              .value
              .trim();


          /*
           * ------------------------------------------------
           * Validate Phone
           * ------------------------------------------------
           */

          if (
            !/^\d{10}$/.test(
              phoneInput
            )
          ) {

            alert(
              "กรุณากรอกเบอร์โทรศัพท์ 10 หลัก"
            );


            return;

          }


          const button =
            document.getElementById(
              "verify-phone-button"
            );


          button.disabled =
            true;


          button.textContent =
            "กำลังตรวจสอบ...";


          showScreen(
            "loading-screen"
          );


          try {

            const data =
              await callPortalApi({

                action:
                  "verifyPhone",

                userId:
                  lineProfile.userId,

                phone:
                  phoneInput,

                profile:
                  lineProfile,

                clientInfo:
                  clientInfo

              });


            console.log(
              "verifyPhone response:",
              data
            );


            /*
             * ------------------------------------------------
             * SHOW USER ID
             * ------------------------------------------------
             */

            if (
              data.status ===
              "show_userid"
            ) {

              showScreen(
                "copy-screen"
              );


              document.getElementById(
                "display-userid"
              ).textContent =
                data.lineUserId ||
                lineProfile.userId;


              return;

            }


            /*
             * ------------------------------------------------
             * SUCCESS
             *
             * กรณี Backend ผูกบัญชี/อนุมัติทันที
             * ------------------------------------------------
             */

            if (
              data.status ===
              "success"
            ) {

              if (
                data.sessionId
              ) {

                portalSessionId =
                  data.sessionId;


                sessionStorage.setItem(

                  "portalSessionId",

                  portalSessionId

                );

              }


              renderDashboard(
                data
              );


              startActivityTracker();


              return;

            }


            /*
             * ------------------------------------------------
             * ERROR
             * ------------------------------------------------
             */

            showError(

              "ตรวจสอบไม่สำเร็จ",

              data.message ||
              "ไม่สามารถตรวจสอบข้อมูลได้"

            );

          } catch (
            error
          ) {

            console.error(
              "verifyPhone ERROR:",
              error
            );


            showError(

              "การตรวจสอบล้มเหลว",

              error.message ||
              "โปรดลองอีกครั้ง"

            );

          } finally {

            button.disabled =
              false;


            button.textContent =
              "ตรวจสอบข้อมูล";

          }

        }
      );



    // =====================================================
    // COPY USER ID
    // =====================================================

    async function copyUserId() {

      const uid =
        lineProfile &&
        lineProfile.userId
          ? lineProfile.userId
          : "";


      if (!uid) {

        alert(
          "ไม่พบ LINE User ID"
        );


        return;

      }


      try {

        await navigator
          .clipboard
          .writeText(
            uid
          );


        alert(
          "คัดลอกรหัสสำเร็จ นำส่ง Admin เพื่อดำเนินการผูกบัญชี"
        );

      } catch (
        error
      ) {

        console.error(
          "Clipboard ERROR:",
          error
        );


        alert(
          "ไม่สามารถคัดลอกอัตโนมัติ กรุณาคัดลอกรหัสจากหน้าจอ"
        );

      }

    }



    // =====================================================
    // RENDER DASHBOARD
    // =====================================================

    function renderDashboard(
      data
    ) {

      showScreen(
        "dashboard-screen"
      );


      /*
       * -------------------------------------------------
       * User Information
       * -------------------------------------------------
       */

      const displayName =
        lineProfile &&
        lineProfile.displayName
          ? lineProfile.displayName
          : "-";


      const jobPosition =
        data.jobPosition ||
        data.session?.jobPosition ||
        "-";


      document.getElementById(
        "user-info"
      ).textContent =
        `${displayName} | ตำแหน่ง: ${jobPosition}`;


      /*
       * -------------------------------------------------
       * Menu Container
       * -------------------------------------------------
       */

      const container =
        document.getElementById(
          "menu-container"
        );


      container.innerHTML =
        "";


      /*
       * -------------------------------------------------
       * No Menu
       * -------------------------------------------------
       */

      if (
        !data.menuGroups ||
        !Array.isArray(
          data.menuGroups
        ) ||
        data.menuGroups.length ===
          0
      ) {

        container.innerHTML = `

          <div
            class="
              bg-white
              p-6
              rounded-xl
              text-gray-500
              text-center
              border
              border-gray-200
              shadow-sm
            "
          >

            คุณไม่มีสิทธิ์เข้าถึงเมนูใดๆ

          </div>

        `;


        return;

      }


      /*
       * -------------------------------------------------
       * Render Groups
       * -------------------------------------------------
       */

      data.menuGroups.forEach(
        function (
          group
        ) {

          const groupSection =
            document.createElement(
              "div"
            );


          const menus =
            Array.isArray(
              group.menus
            )
              ? group.menus
              : [];


          const menusHtml =
            menus
              .map(
                function (
                  menu
                ) {

                  const menuId =
                    String(
                      menu.menuId ||
                      ""
                    );


                  const menuName =
                    escapeHtml(
                      menu.menuName ||
                      ""
                    );


                  const menuUrl =
                    sanitizeUrl(
                      menu.menuUrl
                    );


                  /*
                   * --------------------------------------
                   * Menu ไม่มี URL
                   *
                   * ยังแสดง Menu
                   * แต่ไม่สามารถเปิดได้
                   * --------------------------------------
                   */

                  if (
                    !menuUrl
                  ) {

                    return `

                      <div
                        class="
                          flex
                          flex-col
                          items-center
                          justify-start
                          p-3
                          sm:p-4
                          bg-white
                          border
                          border-gray-200
                          rounded-xl
                          shadow-sm
                          h-full
                        "
                      >

                        <div
                          class="
                            bg-green-50
                            text-green-600
                            p-2.5
                            sm:p-3
                            rounded-full
                            mb-2
                            sm:mb-3
                          "
                        >

                          ${getMenuIcon()}

                        </div>


                        <h3
                          class="
                            text-[11px]
                            sm:text-xs
                            font-bold
                            text-gray-800
                            text-center
                            leading-tight
                            line-clamp-2
                            w-full
                          "
                        >
                          ${menuName}
                        </h3>

                      </div>

                    `;

                  }


                  /*
                   * --------------------------------------
                   * Menu มี URL
                   *
                   * ห้าม href ไป Destination โดยตรง
                   *
                   * ใช้ Launch Token
                   * --------------------------------------
                   */

                  const safeMenuId =
                    escapeJs(
                      menuId
                    );


                  const safeMenuUrl =
                    escapeJs(
                      menuUrl
                    );


                  return `

                    <a
                      href="#"
                      data-menu-id="${escapeHtml(menuId)}"
                      onclick="
                        launchMenu(
                          event,
                          '${safeMenuId}',
                          '${safeMenuUrl}'
                        )
                      "
                      class="
                        menu-card
                        flex
                        flex-col
                        items-center
                        justify-start
                        p-3
                        sm:p-4
                        bg-white
                        border
                        border-gray-200
                        rounded-xl
                        shadow-sm
                        hover:shadow-md
                        hover:border-green-300
                        transition
                        active:scale-95
                        h-full
                      "
                    >

                      <div
                        class="
                          bg-green-50
                          text-green-600
                          p-2.5
                          sm:p-3
                          rounded-full
                          mb-2
                          sm:mb-3
                        "
                      >

                        ${getMenuIcon()}

                      </div>


                      <h3
                        class="
                          text-[11px]
                          sm:text-xs
                          font-bold
                          text-gray-800
                          text-center
                          leading-tight
                          line-clamp-2
                          w-full
                        "
                      >
                        ${menuName}
                      </h3>

                    </a>

                  `;

                }
              )
              .join(
                ""
              );


          /*
           * --------------------------------------
           * Group
           * --------------------------------------
           */

          groupSection.innerHTML = `

            <h2
              class="
                text-[14px]
                font-bold
                text-green-600
                mb-3
                tracking-wide
                pl-2
                border-l-[3px]
                border-green-500
                leading-none
              "
            >
              ${escapeHtml(
                group.groupName ||
                "ทั่วไป"
              )}
            </h2>


            <div
              class="
                grid
                grid-cols-3
                sm:grid-cols-4
                md:grid-cols-5
                gap-3
                sm:gap-4
              "
            >

              ${menusHtml}

            </div>

          `;


          container.appendChild(
            groupSection
          );

        }
      );

    }



    // =====================================================
    // CREATE LAUNCH TOKEN
    // =====================================================

    async function createLaunchToken(
      menuId
    ) {

      if (
        !portalSessionId
      ) {

        throw new Error(
          "ไม่พบ Portal Session"
        );

      }


      if (
        !menuId
      ) {

        throw new Error(
          "ไม่พบ Menu ID"
        );

      }


      const data =
        await callPortalApi({

          action:
            "createLaunchToken",

          sessionId:
            portalSessionId,

          menuId:
            String(menuId)

        });


      console.log(
        "createLaunchToken response:",
        data
      );


      if (
        !data ||
        data.status !==
          "success"
      ) {

        throw new Error(

          data &&
          data.message
            ? data.message
            : "ไม่สามารถสร้าง Launch Token ได้"

        );

      }


      if (
        !data.launchToken
      ) {

        throw new Error(
          "Portal ไม่ได้ส่ง Launch Token กลับมา"
        );

      }


      return data.launchToken;

    }



    // =====================================================
    // LAUNCH DESTINATION MENU
    // =====================================================

    async function launchMenu(
      event,
      menuId,
      menuUrl
    ) {

      /*
       * Stop normal <a href>
       */

      if (
        event
      ) {

        event.preventDefault();

        event.stopPropagation();

      }


      /*
       * ป้องกัน Double Click
       */

      if (
        isLaunching
      ) {

        return;

      }


      /*
       * ตรวจ Session
       */

      if (
        !portalSessionId
      ) {

        await forceLogout(

          "Session หมดอายุ กรุณาเข้าสู่ระบบใหม่"

        );


        return;

      }


      /*
       * ตรวจ URL
       */

      const safeUrl =
        sanitizeUrl(
          menuUrl
        );


      if (
        !safeUrl
      ) {

        alert(
          "ไม่พบ URL ของเมนูนี้"
        );


        return;

      }


      isLaunching =
        true;


      /*
       * แสดงสถานะ Loading
       */

      if (
        event &&
        event.currentTarget
      ) {

        event.currentTarget.classList.add(
          "launching"
        );

      }


      try {

        /*
         * ------------------------------------------------
         * STEP 1
         *
         * Verify Portal Session
         * ------------------------------------------------
         */

        const sessionValid =
          await verifyPortalSession();


        if (
          !sessionValid
        ) {

          await forceLogout(

            "Session หมดอายุ กรุณาเข้าสู่ระบบใหม่"

          );


          return;

        }


        /*
         * ------------------------------------------------
         * STEP 2
         *
         * Create One-Time Launch Token
         * ------------------------------------------------
         */

        const launchToken =
          await createLaunchToken(
            menuId
          );


        /*
         * ------------------------------------------------
         * STEP 3
         *
         * Destination URL
         * ------------------------------------------------
         */

        const destination =
          new URL(
            safeUrl
          );


        /*
         * ห้ามส่ง Credential เดิม
         */

        [
          "uid",
          "userId",
          "sessionId",
          "token",
          "launchToken"
        ].forEach(
          function (
            key
          ) {

            destination.searchParams.delete(
              key
            );

          }
        );


        /*
         * ส่งเฉพาะ Launch Token
         */

        destination.searchParams.set(

          "launchToken",

          launchToken

        );


        /*
         * ------------------------------------------------
         * STEP 4
         *
         * ไป Destination
         * ------------------------------------------------
         */

        window.location.href =
          destination.toString();


      } catch (
        error
      ) {

        console.error(
          "launchMenu ERROR:",
          error
        );


        alert(

          error.message ||
          "ไม่สามารถเปิดระบบปลายทางได้"

        );

      } finally {

        isLaunching =
          false;


        if (
          event &&
          event.currentTarget
        ) {

          event.currentTarget.classList.remove(
            "launching"
          );

        }

      }

    }



    // =====================================================
    // ACTIVITY TRACKER
    // =====================================================

    function startActivityTracker() {

      stopActivityTracker();


      lastActivityAt =
        Date.now();


      timeRemaining =
        timeoutLimit;


      /*
       * -------------------------------------------------
       * User Activity
       * -------------------------------------------------
       */

      const resetActivity =
        function () {

          lastActivityAt =
            Date.now();


          timeRemaining =
            timeoutLimit;

        };


      [
        "mousemove",
        "keydown",
        "touchstart",
        "scroll",
        "click"
      ].forEach(
        function (
          eventName
        ) {

          window.addEventListener(

            eventName,

            resetActivity,

            {
              passive: true
            }

          );

        }
      );


      /*
       * -------------------------------------------------
       * Countdown
       * -------------------------------------------------
       */

      timerInterval =
        setInterval(

          async function () {

            const idleSeconds =
              Math.floor(

                (
                  Date.now() -
                  lastActivityAt
                ) / 1000

              );


            timeRemaining =
              Math.max(

                0,

                timeoutLimit -
                idleSeconds

              );


            updateTimerDisplay();


            if (
              timeRemaining <=
              0
            ) {

              await forceLogout(

                "หมดเวลาการเชื่อมต่อ กรุณาเข้าสู่ระบบใหม่"

              );

            }

          },

          1000

        );


      /*
       * -------------------------------------------------
       * KeepAlive
       * -------------------------------------------------
       */

      keepAliveInterval =
        setInterval(

          async function () {

            if (
              isLoggingOut
            ) {

              return;

            }


            if (
              !portalSessionId
            ) {

              return;

            }


            /*
             * ถ้ายังมีเวลาเหลือมากกว่า 5 นาที
             * ให้ต่อ Session
             */

            if (
              timeRemaining >
              300
            ) {

              await keepAlive();

            }

          },

          KEEP_ALIVE_INTERVAL

        );


      updateTimerDisplay();

    }



    // =====================================================
    // STOP ACTIVITY TRACKER
    // =====================================================

    function stopActivityTracker() {

      if (
        timerInterval
      ) {

        clearInterval(
          timerInterval
        );


        timerInterval =
          null;

      }


      if (
        keepAliveInterval
      ) {

        clearInterval(
          keepAliveInterval
        );


        keepAliveInterval =
          null;

      }

    }



    // =====================================================
    // KEEP ALIVE
    // =====================================================

    async function keepAlive() {

      try {

        const data =
          await callPortalApi({

            action:
              "keepAlive",

            sessionId:
              portalSessionId

          });


        if (
          !data ||
          data.status !==
            "success"
        ) {

          /*
           * Session หมดจริง
           */

          if (
            data &&
            data.message
          ) {

            console.warn(
              "KeepAlive:",
              data.message
            );

          }


          await forceLogout(

            "Session หมดอายุ กรุณาเข้าสู่ระบบใหม่"

          );

        }

      } catch (
        error
      ) {

        /*
         * Network Error ชั่วคราว
         *
         * ไม่ Logout ทันที
         */

        console.warn(
          "KeepAlive network error:",
          error
        );

      }

    }



    // =====================================================
    // TIMER DISPLAY
    // =====================================================

    function updateTimerDisplay() {

      const element =
        document.getElementById(
          "timer-display"
        );


      if (
        !element
      ) {

        return;

      }


      const total =
        Math.max(
          0,
          timeRemaining
        );


      const minutes =
        Math.floor(
          total / 60
        )
          .toString()
          .padStart(
            2,
            "0"
          );


      const seconds =
        (
          total % 60
        )
          .toString()
          .padStart(
            2,
            "0"
          );


      element.textContent =
        `${minutes}:${seconds}`;

    }



    // =====================================================
    // LOGOUT
    // =====================================================

    async function logoutApp() {

      if (
        isLoggingOut
      ) {

        return;

      }


      isLoggingOut =
        true;


      stopActivityTracker();


      try {

        if (
          portalSessionId
        ) {

          await callPortalApi({

            action:
              "logout",

            sessionId:
              portalSessionId

          });

        }

      } catch (
        error
      ) {

        console.warn(
          "Server logout error:",
          error
        );

      }


      /*
       * ลบ Portal Session
       */

      sessionStorage.removeItem(
        "portalSessionId"
      );


      portalSessionId =
        null;


      /*
       * Logout LINE
       */

      try {

        if (
          typeof liff !==
          "undefined" &&
          liff.isLoggedIn()
        ) {

          liff.logout();

        }

      } catch (
        error
      ) {

        console.warn(
          "LINE logout error:",
          error
        );

      }


      window.location.reload();

    }



    // =====================================================
    // FORCE LOGOUT
    // =====================================================

    async function forceLogout(
      message
    ) {

      if (
        isLoggingOut
      ) {

        return;

      }


      if (
        message
      ) {

        alert(
          message
        );

      }


      await logoutApp();

    }



    // =====================================================
    // RETRY
    // =====================================================

    function retryPortal() {

      window.location.reload();

    }



    // =====================================================
    // FETCH CLIENT INFO
    // =====================================================

    async function fetchClientInfo() {

      try {

        const response =
          await fetch(
            "https://ipapi.co/json/"
          );


        if (
          !response.ok
        ) {

          return;

        }


        const data =
          await response.json();


        clientInfo.ip =
          data.ip ||
          "Unknown";


        clientInfo.location =
          `${data.city || "Unknown"}, ${data.country_name || "Unknown"}`;

      } catch (
        error
      ) {

        /*
         * IP Service ล้มเหลว
         *
         * ไม่ให้ Login ล้มตาม
         */

        console.warn(
          "Client info unavailable"
        );

      }

    }



    // =====================================================
    // SCREEN HELPER
    // =====================================================

    function showScreen(
      id
    ) {

      const screens = [

        "loading-screen",

        "register-screen",

        "copy-screen",

        "error-screen",

        "dashboard-screen"

      ];


      screens.forEach(
        function (
          screenId
        ) {

          const element =
            document.getElementById(
              screenId
            );


          if (
            element
          ) {

            element.classList.add(
              "hidden"
            );

          }

        }
      );


      const target =
        document.getElementById(
          id
        );


      if (
        target
      ) {

        target.classList.remove(
          "hidden"
        );

      }

    }



    // =====================================================
    // ERROR
    // =====================================================

    function showError(
      title,
      message
    ) {

      const titleElement =
        document.getElementById(
          "error-title"
        );


      const messageElement =
        document.getElementById(
          "error-message"
        );


      if (
        titleElement
      ) {

        titleElement.textContent =
          title ||
          "ข้อผิดพลาด";

      }


      if (
        messageElement
      ) {

        messageElement.textContent =
          message ||
          "-";

      }


      showScreen(
        "error-screen"
      );

    }



    // =====================================================
    // URL SANITIZATION
    // =====================================================

    function sanitizeUrl(
      value
    ) {

      if (
        !value
      ) {

        return null;

      }


      try {

        const url =
          new URL(
            String(
              value
            ),
            window.location.href
          );


        /*
         * อนุญาตเฉพาะ HTTP / HTTPS
         */

        if (
          url.protocol !==
            "http:" &&
          url.protocol !==
            "https:"
        ) {

          return null;

        }


        return url.href;

      } catch (
        error
      ) {

        return null;

      }

    }



    // =====================================================
    // HTML ESCAPE
    // =====================================================

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }



    // =====================================================
    // JAVASCRIPT STRING ESCAPE
    // =====================================================

    function escapeJs(
      value
    ) {

      return String(
        value ?? ""
      )
        .replace(
          /\\/g,
          "\\\\"
        )
        .replace(
          /'/g,
          "\\'"
        )
        .replace(
          /"/g,
          '\\"'
        )
        .replace(
          /\r/g,
          "\\r"
        )
        .replace(
          /\n/g,
          "\\n"
        );

    }



    // =====================================================
    // MENU ICON
    // =====================================================

    function getMenuIcon() {

      return `

        <svg
          class="w-6 h-6 sm:w-7 sm:h-7"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="
              M19 11H5
              m14 0a2 2 0 012 2v6
              a2 2 0 01-2 2H5
              a2 2 0 01-2-2v-6
              a2 2 0 012-2
              m14 0V9
              a2 2 0 00-2-2
              M5 11V9
              a2 2 0 012-2
              m0 0V5
              a2 2 0 012-2h6
              a2 2 0 012 2v2
              M7 7h10
            "
          ></path>

        </svg>

      `;

    }



    // =====================================================
    // START
    // =====================================================

    window.addEventListener(
      "load",
      initApp
    );


  </script>
