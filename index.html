<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portal</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
      background: #f4f7f5;
      color: #1f2937;
    }

    button,
    input {
      font-family: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       Header
       ========================= */

    .header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      color: #15803d;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
    }

    .logout-btn {
      border: 1px solid #dc2626;
      background: #ffffff;
      color: #dc2626;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .logout-btn:hover {
      background: #fef2f2;
    }

    /* =========================
       Container
       ========================= */

    .container {
      width: min(1200px, calc(100% - 30px));
      margin: 25px auto 50px;
    }

    /* =========================
       Login
       ========================= */

    .login-card {
      max-width: 460px;
      margin: 70px auto;
      background: #ffffff;
      border-radius: 18px;
      padding: 30px;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.06);
    }

    .login-title {
      text-align: center;
      color: #15803d;
      margin-bottom: 8px;
      font-size: 25px;
      font-weight: 700;
    }

    .login-subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
    }

    .form-input {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      padding: 11px 13px;
      outline: none;
      font-size: 15px;
    }

    .form-input:focus {
      border-color: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.12);
    }

    .primary-btn {
      width: 100%;
      border: none;
      border-radius: 9px;
      padding: 12px;
      background: #16a34a;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .primary-btn:hover {
      background: #15803d;
    }

    .secondary-btn {
      width: 100%;
      border: 1px solid #16a34a;
      border-radius: 9px;
      padding: 11px;
      background: #ffffff;
      color: #15803d;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }

    /* =========================
       Status
       ========================= */

    .message {
      padding: 11px 13px;
      border-radius: 9px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .message.error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .message.success {
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    .message.info {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    /* =========================
       Dashboard
       ========================= */

    .welcome-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 22px;
      box-shadow:
        0 6px 20px rgba(0, 0, 0, 0.05);
    }

    .welcome-title {
      margin: 0;
      font-size: 22px;
      color: #166534;
    }

    .welcome-info {
      margin-top: 7px;
      color: #6b7280;
      font-size: 14px;
    }

    .session-bar {
      margin-top: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      background: #f0fdf4;
      border-radius: 8px;
      color: #166534;
      font-size: 13px;
    }

    /* =========================
       Group
       ========================= */

    .menu-group {
      margin-bottom: 28px;
    }

    .group-title {
      margin: 0 0 13px;
      font-size: 18px;
      font-weight: 700;
      color: #166534;
      border-left: 4px solid #22c55e;
      padding-left: 10px;
    }

    /* =========================
       Menu Grid
       ========================= */

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 15px;
    }

    .menu-card {
      min-width: 0;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 18px;
      min-height: 105px;
      box-shadow:
        0 5px 15px rgba(0, 0, 0, 0.04);
      cursor: pointer;
      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        border-color 0.15s ease;
    }

    .menu-card:hover {
      transform: translateY(-2px);
      border-color: #86efac;
      box-shadow:
        0 8px 22px rgba(0, 0, 0, 0.08);
    }

    .menu-card.disabled {
      cursor: not-allowed;
      opacity: 0.6;
      background: #f9fafb;
    }

    .menu-card.disabled:hover {
      transform: none;
      border-color: #e5e7eb;
      box-shadow:
        0 5px 15px rgba(0, 0, 0, 0.04);
    }

    .menu-name {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.45;
      color: #111827;
    }

    .menu-status {
      margin-top: 8px;
      font-size: 12px;
      color: #9ca3af;
    }

    .menu-arrow {
      float: right;
      color: #16a34a;
      font-size: 18px;
    }

    /* =========================
       Loading
       ========================= */

    .loading {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.85);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #dcfce7;
      border-top-color: #16a34a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       Responsive
       ========================= */

    @media (max-width: 900px) {

      .menu-grid {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }
    }

    /*
     * มือถือ:
     * ต้องการอย่างน้อย 3 เมนูต่อแถว
     */
    @media (max-width: 600px) {

      .container {
        width: calc(100% - 20px);
        margin-top: 15px;
      }

      .header {
        padding: 11px 12px;
      }

      .brand {
        font-size: 17px;
      }

      .user-area {
        font-size: 12px;
        gap: 6px;
      }

      .logout-btn {
        padding: 6px 9px;
        font-size: 12px;
      }

      .welcome-card {
        padding: 15px;
      }

      .welcome-title {
        font-size: 19px;
      }

      .menu-grid {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .menu-card {
        min-height: 92px;
        padding: 11px 8px;
        border-radius: 10px;
      }

      .menu-name {
        font-size: 12px;
        line-height: 1.35;
      }

      .menu-status {
        font-size: 10px;
      }

      .group-title {
        font-size: 16px;
      }
    }
  </style>
</head>


<body>

  <!-- =========================
       Loading
       ========================= -->

  <div id="loading" class="loading">

    <div class="spinner"></div>

    <div id="loadingText">
      กำลังตรวจสอบระบบ...
    </div>

  </div>


  <!-- =========================
       Header
       ========================= -->

  <header id="header" class="header hidden">

    <div class="header-inner">

      <div class="brand">
        Portal
      </div>

      <div class="user-area">

        <span id="headerUserName"></span>

        <button
          id="logoutBtn"
          class="logout-btn"
          onclick="logout()">
          ออกจากระบบ
        </button>

      </div>

    </div>

  </header>


  <!-- =========================
       Main
       ========================= -->

  <main class="container">


    <!-- Login -->

    <section id="loginSection" class="login-card hidden">

      <div class="login-title">
        Portal Login
      </div>

      <div class="login-subtitle">
        เข้าสู่ระบบด้วย LINE
      </div>

      <div id="loginMessage"></div>

      <div
        id="phoneSection"
        class="hidden">

        <div class="form-group">

          <label class="form-label">
            เบอร์โทรศัพท์
          </label>

          <input
            id="phoneInput"
            class="form-input"
            type="tel"
            maxlength="10"
            placeholder="กรอกเบอร์โทรศัพท์">

        </div>

        <button
          class="primary-btn"
          onclick="verifyPhone()">

          ยืนยันเบอร์โทรศัพท์

        </button>

      </div>


      <button
        id="registerBtn"
        class="secondary-btn hidden"
        onclick="goRegistration()">

        ลงทะเบียนผู้ใช้งาน

      </button>

    </section>


    <!-- Dashboard -->

    <section id="dashboardSection" class="hidden">

      <div class="welcome-card">

        <h1
          id="welcomeTitle"
          class="welcome-title">
          ยินดีต้อนรับ
        </h1>

        <div
          id="welcomeInfo"
          class="welcome-info">
        </div>

        <div class="session-bar">

          <span>
            Session:
            <strong id="sessionStatus">
              Active
            </strong>
          </span>

          <span id="sessionTime">
          </span>

        </div>

      </div>


      <div id="menuContainer"></div>

    </section>


  </main>


<script>

/*************************************************
 * CONFIG
 *************************************************/

const LIFF_ID =
  "2011487100-dldPQItq";

const CENTRAL_API_URL =
  "https://script.google.com/macros/s/AKfycbwphhIdSMHpTWHuFrRFTC3lEZe-QQCaZr2cebxb22C0e9ph1eYPscyrxdw29T44DaUT9/exec";


const SESSION_STORAGE_KEY =
  "portalSessionId";

const SESSION_MINUTES =
  60;

const KEEP_ALIVE_MINUTES =
  10;


/*************************************************
 * STATE
 *************************************************/

let currentSessionId = null;

let currentUser = null;

let liffInitialized = false;

let keepAliveTimer = null;

let inactivityTimer = null;

let sessionClockTimer = null;

let lastActivity = Date.now();


/*************************************************
 * INIT
 *************************************************/

document.addEventListener(
  "DOMContentLoaded",
  init
);


async function init() {

  try {

    showLoading(
      "กำลังเริ่มต้นระบบ..."
    );

    /*
     * LIFF
     */

    await liff.init({
      liffId: LIFF_ID
    });

    liffInitialized = true;


    /*
     * ตรวจ Session เดิม
     */

    const savedSession =
      sessionStorage.getItem(
        SESSION_STORAGE_KEY
      );

    if (savedSession) {

      showLoading(
        "กำลังตรวจสอบ Session..."
      );

      const result =
        await portalRequest({
          action: "verifySession",
          sessionId: savedSession
        });

      if (
        result.status === "success" &&
        result.session
      ) {

        currentSessionId =
          savedSession;

        currentUser =
          result.session;

        enterDashboard();

        return;
      }

      /*
       * Session หมดอายุ
       */

      sessionStorage.removeItem(
        SESSION_STORAGE_KEY
      );
    }


    /*
     * Login
     */

    if (!liff.isLoggedIn()) {

      hideLoading();

      showLogin(
        "กรุณาเข้าสู่ระบบด้วย LINE"
      );

      /*
       * ถ้าเป็น LIFF
       * ให้ Login
       */

      liff.login();

      return;
    }


    /*
     * ได้ LINE Profile แล้ว
     */

    showLoading(
      "กำลังตรวจสอบผู้ใช้งาน..."
    );

    const profile =
      await liff.getProfile();


    const result =
      await portalRequest({

        action: "checkUser",

        userId: profile.userId,

        profile: {
          userId: profile.userId,
          displayName: profile.displayName,
          pictureUrl: profile.pictureUrl
        }

      });


    handleLoginResult(result);


  } catch (err) {

    console.error(err);

    hideLoading();

    showLogin(
      "เกิดข้อผิดพลาด: " +
      err.message
    );
  }
}


/*************************************************
 * LOGIN RESULT
 *************************************************/

function handleLoginResult(result) {

  if (!result) {

    showLogin(
      "ไม่สามารถตรวจสอบผู้ใช้งานได้"
    );

    return;
  }


  /*
   * Login สำเร็จ
   */

  if (
    result.status === "success" &&
    result.user
  ) {

    currentUser =
      result.user;

    /*
     * ถ้า Backend ส่ง Session มา
     */

    if (result.sessionId) {

      currentSessionId =
        result.sessionId;

      sessionStorage.setItem(
        SESSION_STORAGE_KEY,
        currentSessionId
      );

      enterDashboard();

      return;
    }


    /*
     * กรณี Login สำเร็จแต่ยังต้อง
     * ยืนยันเบอร์โทรศัพท์
     */

    if (
      result.requirePhone ||
      result.needPhone
    ) {

      showPhoneVerification();

      return;
    }

    /*
     * กรณี User ผ่านแล้ว
     * แต่ไม่มี Session
     */

    if (result.message) {

      showLogin(
        result.message
      );

      return;
    }
  }


  /*
   * ยังไม่ได้ลงทะเบียน
   */

  if (
    result.code === "NOT_REGISTERED" ||
    result.code === "USER_NOT_FOUND"
  ) {

    showLogin(
      "ยังไม่ได้ลงทะเบียนในระบบ"
    );

    showRegisterButton();

    return;
  }


  /*
   * ต้องยืนยันเบอร์
   */

  if (
    result.code === "PHONE_REQUIRED" ||
    result.requirePhone
  ) {

    showPhoneVerification();

    return;
  }


  /*
   * รอ Admin อนุมัติ
   */

  if (
    result.code === "PENDING" ||
    result.code === "WAIT_APPROVAL"
  ) {

    showLogin(
      result.message ||
      "อยู่ระหว่างรอ Admin อนุมัติ"
    );

    return;
  }


  showLogin(
    result.message ||
    "เข้าสู่ระบบไม่สำเร็จ"
  );
}


/*************************************************
 * VERIFY PHONE
 *************************************************/

async function verifyPhone() {

  const phone =
    document
      .getElementById("phoneInput")
      .value
      .trim();


  if (!phone) {

    showLogin(
      "กรุณากรอกเบอร์โทรศัพท์"
    );

    return;
  }


  try {

    showLoading(
      "กำลังตรวจสอบเบอร์โทรศัพท์..."
    );


    const profile =
      await liff.getProfile();


    const result =
      await portalRequest({

        action: "verifyPhone",

        userId:
          profile.userId,

        phone: phone,

        profile: {
          userId:
            profile.userId,

          displayName:
            profile.displayName,

          pictureUrl:
            profile.pictureUrl
        }

      });


    if (
      result.status === "success"
    ) {

      /*
       * Session จาก Backend
       */

      if (result.sessionId) {

        currentSessionId =
          result.sessionId;

        sessionStorage.setItem(
          SESSION_STORAGE_KEY,
          currentSessionId
        );
      }


      /*
       * User จาก Backend
       */

      if (result.user) {

        currentUser =
          result.user;
      }


      /*
       * บาง Backend อาจส่ง
       * session object กลับมา
       */

      if (result.session) {

        currentUser =
          result.session;
      }


      enterDashboard();

      return;
    }


    if (
      result.code === "PENDING"
    ) {

      showLogin(
        result.message ||
        "ลงทะเบียนแล้ว กรุณารอ Admin อนุมัติ"
      );

      return;
    }


    showLogin(
      result.message ||
      "ตรวจสอบเบอร์โทรศัพท์ไม่สำเร็จ"
    );


  } catch (err) {

    console.error(err);

    showLogin(
      "เกิดข้อผิดพลาด: " +
      err.message
    );

  } finally {

    hideLoading();
  }
}


/*************************************************
 * ENTER DASHBOARD
 *************************************************/

async function enterDashboard() {

  hideLoading();

  document
    .getElementById("loginSection")
    .classList
    .add("hidden");

  document
    .getElementById("header")
    .classList
    .remove("hidden");

  document
    .getElementById("dashboardSection")
    .classList
    .remove("hidden");


  /*
   * User
   */

  const name =
    currentUser?.name ||
    currentUser?.displayName ||
    currentUser?.empName ||
    "ผู้ใช้งาน";


  document
    .getElementById("headerUserName")
    .textContent =
    name;


  document
    .getElementById("welcomeTitle")
    .textContent =
    "ยินดีต้อนรับ " + name;


  document
    .getElementById("welcomeInfo")
    .textContent =
    buildUserInfo();


  /*
   * Session
   */

  startSessionTimers();


  /*
   * Load Menu
   */

  await loadMenu();
}


/*************************************************
 * USER INFO
 *************************************************/

function buildUserInfo() {

  const empId =
    currentUser?.empId ||
    currentUser?.Emp_ID ||
    "";

  const role =
    currentUser?.role ||
    currentUser?.Job_Position ||
    "";

  const parts = [];

  if (empId) {
    parts.push(
      "รหัส: " + empId
    );
  }

  if (role) {
    parts.push(
      "สิทธิ์: " + role
    );
  }

  return parts.join("  |  ");
}


/*************************************************
 * LOAD MENU
 *************************************************/

async function loadMenu() {

  try {

    const result =
      await portalRequest({

        action: "getMenu",

        sessionId:
          currentSessionId

      });


    if (
      result.status !== "success"
    ) {

      /*
       * Session หมดอายุ
       */

      if (
        result.code ===
        "SESSION_EXPIRED"
      ) {

        handleSessionExpired();

        return;
      }


      throw new Error(
        result.message ||
        "ไม่สามารถโหลดเมนูได้"
      );
    }


    renderDashboard(
      result.menus || []
    );


  } catch (err) {

    console.error(err);

    document
      .getElementById("menuContainer")
      .innerHTML =

      `<div class="message error">
        ${escapeHtml(err.message)}
      </div>`;
  }
}


/*************************************************
 * RENDER DASHBOARD
 *************************************************/

function renderDashboard(menus) {

  const container =
    document
      .getElementById("menuContainer");


  container.innerHTML = "";


  /*
   * เอาเฉพาะ canRead
   */

  const readableMenus =
    menus.filter(menu =>
      menu.canRead === true ||
      String(menu.canRead)
        .toLowerCase() === "true" ||
      String(menu.canRead) === "1"
    );


  /*
   * Group
   *
   * ใช้ group สำหรับเรียง
   * แต่ไม่แสดงเลข group
   */

  const groups = {};


  readableMenus.forEach(menu => {

    const groupValue =
      menu.group ??
      menu.menuGroup ??
      "";


    const groupKey =
      String(groupValue);


    if (!groups[groupKey]) {

      groups[groupKey] = {

        sortValue:
          parseFloat(groupValue) ||
          999999,

        menuGroup:
          menu.menuGroup ||
          "เมนู",

        menus: []
      };
    }


    groups[groupKey]
      .menus
      .push(menu);

  });


  /*
   * เรียง group จากน้อย → มาก
   */

  const sortedGroups =
    Object.values(groups)
      .sort(
        (a, b) =>
          a.sortValue -
          b.sortValue
      );


  /*
   * Render
   */

  sortedGroups.forEach(group => {

    const section =
      document.createElement(
        "section"
      );

    section.className =
      "menu-group";


    const title =
      document.createElement(
        "h2"
      );

    title.className =
      "group-title";

    /*
     * แสดง menuGroup
     * ไม่แสดง group
     */

    title.textContent =
      group.menuGroup;


    const grid =
      document.createElement(
        "div"
      );

    grid.className =
      "menu-grid";


    group.menus.forEach(menu => {

      /*
       * สำคัญ:
       * ห้ามตัดเมนูที่ไม่มี URL
       *
       * เพราะ Backend พบว่า
       * readableMenus = 6
       * แต่ menuUrl ว่าง = 3
       *
       * ดังนั้นต้องแสดงทั้ง 6
       */

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "menu-card";


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "menu-name";


      /*
       * แสดงเฉพาะ menuName
       */

      name.textContent =
        menu.menuName ||
        "ไม่ระบุชื่อเมนู";


      card.appendChild(name);


      /*
       * มี URL
       */

      const url =
        sanitizeUrl(
          menu.menuUrl
        );


      if (url) {

        const arrow =
          document.createElement(
            "span"
          );

        arrow.className =
          "menu-arrow";

        arrow.textContent =
          "›";

        name.appendChild(
          arrow
        );


        card.addEventListener(
          "click",
          () => {

            openDestination(
              menu
            );

          }
        );

      } else {

        /*
         * ไม่มี URL:
         * แสดงเมนูแต่กดไม่ได้
         */

        card.classList.add(
          "disabled"
        );


        const status =
          document.createElement(
            "div"
          );

        status.className =
          "menu-status";

        status.textContent =
          "ยังไม่ได้กำหนดระบบปลายทาง";

        card.appendChild(
          status
        );
      }


      grid.appendChild(card);

    });


    section.appendChild(title);

    section.appendChild(grid);

    container.appendChild(section);

  });


  /*
   * ไม่มีเมนู
   */

  if (!sortedGroups.length) {

    container.innerHTML =
      `<div class="message info">
        คุณไม่มีสิทธิ์เข้าถึงเมนูใดๆ
      </div>`;
  }
}


/*************************************************
 * OPEN DESTINATION
 *
 * 1. ตรวจ Session
 * 2. ขอ Launch Token
 * 3. POST ไป Destination
 *************************************************/

async function openDestination(menu) {

  if (!menu) {
    return;
  }


  const url =
    sanitizeUrl(
      menu.menuUrl
    );


  /*
   * ไม่มี URL
   */

  if (!url) {

    return;
  }


  /*
   * ต้องมี Session
   */

  if (!currentSessionId) {

    handleSessionExpired();

    return;
  }


  try {

    showLoading(
      "กำลังเปิดระบบ..."
    );


    /*
     * เปิดหน้าต่างไว้ก่อน
     *
     * เพื่อป้องกัน Browser Block Popup
     */

    const destinationWindow =
      window.open(
        "about:blank",
        "_blank"
      );


    /*
     * ขอ Launch Token
     */

    const result =
      await portalRequest({

        action: "launch",

        sessionId:
          currentSessionId,

        menuId:
          String(
            menu.menuId || ""
          )
      });


    if (
      result.status !== "success"
    ) {

      if (
        destinationWindow
      ) {

        destinationWindow.close();
      }


      if (
        result.code ===
        "SESSION_EXPIRED"
      ) {

        handleSessionExpired();

        return;
      }


      throw new Error(
        result.message ||
        "ไม่สามารถสร้าง Launch Token ได้"
      );
    }


    /*
     * POST ไป Destination
     */

    postToDestination(
      destinationWindow,
      url,
      {

        launchToken:
          result.launchToken,

        menuId:
          String(
            menu.menuId || ""
          )
      }
    );


  } catch (err) {

    console.error(err);

    showLogin(
      "ไม่สามารถเปิดระบบปลายทาง: " +
      err.message
    );

  } finally {

    hideLoading();
  }
}


/*************************************************
 * POST TO DESTINATION
 *************************************************/

function postToDestination(
  destinationWindow,
  url,
  data
) {

  /*
   * ถ้า Browser Block Popup
   */

  if (!destinationWindow) {

    alert(
      "Browser บล็อกหน้าต่างใหม่ กรุณาอนุญาต Popup สำหรับ Portal"
    );

    return;
  }


  /*
   * เขียน HTML form ลงหน้าต่างใหม่
   */

  const formHtml = `

    <!DOCTYPE html>

    <html>

    <head>

      <meta charset="UTF-8">

      <title>กำลังเข้าสู่ระบบ...</title>

    </head>

    <body>

      <p>
        กำลังเข้าสู่ระบบ...
      </p>

      <form
        id="launchForm"
        method="POST"
        action="${escapeAttribute(url)}">

        <input
          type="hidden"
          name="launchToken"
          value="${escapeAttribute(
            data.launchToken
          )}">

        <input
          type="hidden"
          name="menuId"
          value="${escapeAttribute(
            data.menuId
          )}">

      </form>

      <script>

        document
          .getElementById("launchForm")
          .submit();

      <\/script>

    </body>

    </html>
  `;


  destinationWindow.document.open();

  destinationWindow.document.write(
    formHtml
  );

  destinationWindow.document.close();
}


/*************************************************
 * SESSION TIMER
 *************************************************/

function startSessionTimers() {

  stopSessionTimers();


  /*
   * Keep Alive
   */

  keepAliveTimer =
    setInterval(
      keepAlive,
      KEEP_ALIVE_MINUTES * 60 * 1000
    );


  /*
   * Inactivity
   */

  lastActivity =
    Date.now();


  const events = [
    "click",
    "mousemove",
    "keydown",
    "scroll",
    "touchstart"
  ];


  events.forEach(event => {

    document.addEventListener(
      event,
      updateActivity,
      { passive: true }
    );

  });


  inactivityTimer =
    setInterval(
      checkInactivity,
      60 * 1000
    );


  /*
   * Session clock
   */

  sessionClockTimer =
    setInterval(
      updateSessionClock,
      1000
    );

}


/*************************************************
 * STOP SESSION TIMER
 *************************************************/

function stopSessionTimers() {

  if (keepAliveTimer) {

    clearInterval(
      keepAliveTimer
    );

    keepAliveTimer = null;
  }


  if (inactivityTimer) {

    clearInterval(
      inactivityTimer
    );

    inactivityTimer = null;
  }


  if (sessionClockTimer) {

    clearInterval(
      sessionClockTimer
    );

    sessionClockTimer = null;
  }
}


/*************************************************
 * ACTIVITY
 *************************************************/

function updateActivity() {

  lastActivity =
    Date.now();
}


/*************************************************
 * INACTIVITY
 *************************************************/

function checkInactivity() {

  const inactiveMinutes =
    (
      Date.now() -
      lastActivity
    ) /
    60000;


  if (
    inactiveMinutes >=
    SESSION_MINUTES
  ) {

    handleSessionExpired();
  }
}


/*************************************************
 * KEEP ALIVE
 *************************************************/

async function keepAlive() {

  if (!currentSessionId) {
    return;
  }


  try {

    const result =
      await portalRequest({

        action: "keepAlive",

        sessionId:
          currentSessionId

      });


    if (
      result.status !== "success"
    ) {

      handleSessionExpired();

      return;
    }


    document
      .getElementById(
        "sessionStatus"
      )
      .textContent =
      "Active";


  } catch (err) {

    console.error(
      "KeepAlive error:",
      err
    );
  }
}


/*************************************************
 * SESSION CLOCK
 *************************************************/

function updateSessionClock() {

  if (!currentSessionId) {
    return;
  }


  const minutes =
    Math.floor(
      (
        Date.now() -
        lastActivity
      ) / 60000
    );


  const remaining =
    Math.max(
      0,
      SESSION_MINUTES -
      minutes
    );


  document
    .getElementById(
      "sessionTime"
    )
    .textContent =
    "หมดอายุเมื่อไม่มีการใช้งานประมาณ " +
    remaining +
    " นาที";
}


/*************************************************
 * SESSION EXPIRED
 *************************************************/

function handleSessionExpired() {

  stopSessionTimers();


  currentSessionId =
    null;

  currentUser =
    null;


  sessionStorage.removeItem(
    SESSION_STORAGE_KEY
  );


  document
    .getElementById(
      "dashboardSection"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "header"
    )
    .classList
    .add("hidden");


  showLogin(
    "Session หมดอายุ กรุณาเข้าสู่ระบบใหม่"
  );
}


/*************************************************
 * LOGOUT
 *************************************************/

async function logout() {

  try {

    showLoading(
      "กำลังออกจากระบบ..."
    );


    if (currentSessionId) {

      await portalRequest({

        action: "logout",

        sessionId:
          currentSessionId

      });
    }


  } catch (err) {

    console.error(err);

  } finally {

    stopSessionTimers();


    currentSessionId =
      null;

    currentUser =
      null;


    sessionStorage.removeItem(
      SESSION_STORAGE_KEY
    );


    /*
     * ไม่เรียก liff.logout()
     *
     * เพราะต้องการให้ LINE Login
     * ยังคงอยู่
     */

    hideLoading();

    showLogin(
      "ออกจากระบบแล้ว"
    );
  }
}


/*************************************************
 * PORTAL REQUEST
 *************************************************/

async function portalRequest(data) {

  const response =
    await fetch(
      CENTRAL_API_URL,
      {

        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(data)

      }
    );


  if (!response.ok) {

    throw new Error(
      "HTTP " +
      response.status
    );
  }


  const result =
    await response.json();


  return result;
}

/*************************************************
 * URL SANITIZE
 *************************************************/

function sanitizeUrl(value) {

  if (!value) {
    return "";
  }


  try {

    const url =
      new URL(
        String(value)
      );


    if (
      url.protocol !==
        "http:" &&
      url.protocol !==
        "https:"
    ) {

      return "";
    }


    return url.href;

  } catch (err) {

    return "";
  }
}


/*************************************************
 * ESCAPE
 *************************************************/

function escapeHtml(value) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


function escapeAttribute(value) {

  return escapeHtml(value);
}
