<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centralized Dashboard</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            linePrimary: '#0084FF',
            lineLightBg: '#F7F7F7',
            lineDarkGray: '#6C757D'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-lineLightBg font-sans text-gray-800 antialiased min-h-screen flex flex-col">

  <!-- Header Classic Design -->
  <header class="bg-gradient-to-r from-linePrimary to-blue-700 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <img id="profile-img" src="" alt="Profile" class="h-10 w-10 rounded-full border-2 border-white hidden object-cover shadow-sm">
        <div>
          <h1 class="text-base font-bold tracking-wide leading-tight">Portal System</h1>
          <p id="user-info" class="text-[11px] opacity-90">กำลังตรวจสอบ...</p>
        </div>
      </div>
      
      <div class="flex flex-col items-end gap-1">
        <!-- ออกจากระบบบน Header -->
        <button onclick="logoutApp()" class="text-xs bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded border border-white/30 transition flex items-center shadow-sm font-medium">
          ออกจากระบบ
        </button>
        <!-- Auto TimeOut -->
        <div class="text-[10px] opacity-90 flex items-center gap-1 mt-0.5 px-2 py-0.5 rounded">
          <span>⏱️ หมดเวลา:</span>
          <span id="timer-display" class="font-mono font-bold tracking-wider">60:00</span>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 flex-grow w-full">
    
    <!-- 1. Loading -->
    <div id="loading-screen" class="flex flex-col items-center justify-center py-20">
      <div class="animate-spin rounded-full h-10 w-10 border-b-4 border-linePrimary mb-4"></div>
      <p class="text-lineDarkGray text-sm font-medium">กำลังโหลดเมนูระบบ...</p>
    </div>

    <!-- 2. Verify Phone -->
    <div id="register-screen" class="hidden max-w-md mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-6">
      <h2 class="text-xl font-bold mb-2">ลงทะเบียนใช้งาน</h2>
      <p class="text-sm text-lineDarkGray mb-5">กรุณากรอกเบอร์โทรศัพท์เพื่อยืนยันตัวตน</p>
      <form id="phone-form" class="space-y-4">
        <div>
          <input type="text" id="phone-input" maxlength="10" required
            class="w-full p-4 border border-gray-300 rounded-lg focus:outline-none focus:border-linePrimary"
            placeholder="08xxxxxxxx" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        </div>
        <button type="submit" class="w-full bg-linePrimary text-white font-bold py-3.5 rounded-lg hover:bg-blue-700 transition">
          ตรวจสอบข้อมูล
        </button>
      </form>
    </div>

    <!-- 3. Copy User ID Screen (ให้ Admin จัดการ) -->
    <div id="copy-screen" class="hidden max-w-md mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-6 text-center">
      <div class="text-4xl mb-3">📱</div>
      <h2 class="text-lg font-bold mb-2">ยืนยันสำเร็จ</h2>
      <p class="text-sm text-lineDarkGray mb-4">คัดลอกรหัสอ้างอิงส่งให้ Admin เพื่อบันทึกข้อมูล</p>
      <div class="bg-gray-100 p-3 rounded-lg mb-4 font-mono text-xs break-all border border-gray-200 select-all" id="display-userid"></div>
      <button onclick="copyUserId()" class="w-full bg-green-500 text-white font-bold py-3 rounded-lg hover:bg-green-600 transition">
        คัดลอกรหัสอ้างอิง
      </button>
    </div>

    <!-- 4. Error Screen -->
    <div id="error-screen" class="hidden max-w-md mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-8 text-center">
      <div class="text-4xl mb-3 text-red-500">⚠️</div>
      <h2 id="error-title" class="text-lg font-bold mb-2">ข้อผิดพลาด</h2>
      <p id="error-message" class="text-sm text-lineDarkGray mb-5">-</p>
      <button onclick="showScreen('register-screen')" class="w-full bg-gray-200 text-gray-700 font-bold py-3.5 rounded-lg transition hover:bg-gray-300">
        กลับไปกรอกเบอร์โทรใหม่
      </button>
    </div>

    <!-- 5. Dashboard Menu Groups -->
    <div id="dashboard-screen" class="hidden pb-10">
      <div id="menu-container" class="space-y-6"></div>
    </div>

  </main>

  <script>
    // ==========================================
    // Configuration
    // ==========================================
    const LIFF_ID = "2011487100-dldPQItq";
    const CENTRAL_API_URL = "https://script.google.com/macros/s/AKfycbzDpOrouurlO_Wlr5RikWVYf8gAmQcN-TTC8yIk7nKLLEvwjYRio5utMrEdxUm4m5Ia/exec"; // วาง URL Web App 
    
    let lineProfile = null;
    let clientInfo = { ip: "Unknown", location: "Unknown", device: navigator.userAgent };
    
    // Auto TimeOut
    let timeoutLimit = 3600; 
    let timeRemaining = timeoutLimit;
    let timerInterval;
    let keepAliveInterval;

    async function initApp() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          lineProfile = await liff.getProfile();
          document.getElementById('profile-img').src = lineProfile.pictureUrl;
          document.getElementById('profile-img').classList.remove('hidden');
          
          await fetchClientInfo(); 
          await loadDashboard();
          
          startActivityTracker();
        }
      } catch (err) {
        showError("พบข้อผิดพลาด", "ไม่สามารถเชื่อมต่อ LINE LIFF ได้");
      }
    }

    function startActivityTracker() {
      const resetTimer = () => { timeRemaining = timeoutLimit; };
      
      // ดักจับการกระทำเพื่อรีเซ็ต TimeOut
      ['mousemove', 'keydown', 'touchstart', 'scroll', 'click'].forEach(evt => 
        window.addEventListener(evt, resetTimer, { passive: true })
      );

      // นับถอยหลัง 60 นาที
      timerInterval = setInterval(() => {
        timeRemaining--;
        let m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
        let s = (timeRemaining % 60).toString().padStart(2, '0');
        document.getElementById('timer-display').textContent = `${m}:${s}`;
        
        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          clearInterval(keepAliveInterval);
          alert("หมดเวลาการเชื่อมต่อ กรุณาเข้าสู่ระบบใหม่");
          logoutApp();
        }
      }, 1000);

      // แจ้งเซิร์ฟเวอร์ทุกๆ 15 นาที เพื่อต่ออายุ lastLogin
      keepAliveInterval = setInterval(() => {
        if (timeRemaining > 300) { 
          fetch(CENTRAL_API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'keepAlive', userId: lineProfile.userId })
          });
        }
      }, 15 * 60 * 1000); 
    }

    async function fetchClientInfo() {
      try {
        const res = await fetch('https://ipapi.co/json/');
        if (res.ok) {
          const data = await res.json();
          clientInfo.ip = data.ip;
          clientInfo.location = `${data.city}, ${data.country_name}`;
        }
      } catch (e) {}
    }

    async function loadDashboard() {
      showScreen('loading-screen');
      try {
        const response = await fetch(CENTRAL_API_URL, {
          method: 'POST',
          body: JSON.stringify({ 
            action: 'getDashboard', 
            userId: lineProfile.userId,
            profile: lineProfile,
            clientInfo: clientInfo
          })
        });
        
        const data = await response.json();

        if (data.status === 'not_registered') {
          showScreen('register-screen');
          document.getElementById('user-info').textContent = 'กรุณายืนยันตัวตน';
        } else if (data.status === 'success') {
          renderDashboard(data);
        } else {
          showError("ข้อผิดพลาด", data.message || "เกิดข้อผิดพลาดในระบบ");
        }
      } catch (error) {
        showError("พบข้อผิดพลาด", "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้");
      }
    }

    document.getElementById('phone-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const phoneInput = document.getElementById('phone-input').value;
      if (phoneInput.length !== 10) return alert("กรุณากรอกเบอร์โทรศัพท์ 10 หลัก");

      showScreen('loading-screen');
      try {
        const response = await fetch(CENTRAL_API_URL, {
          method: 'POST',
          body: JSON.stringify({ 
            action: 'verifyPhone', 
            userId: lineProfile.userId, 
            phone: phoneInput,
            profile: lineProfile,
            clientInfo: clientInfo 
          })
        });
        
        const data = await response.json();
        if (data.status === 'show_userid') {
          showScreen('copy-screen');
          document.getElementById('display-userid').textContent = data.lineUserId;
        } else {
          showError("ตรวจสอบไม่สำเร็จ", data.message);
        }
      } catch (error) {
        showError("การตรวจสอบล้มเหลว", "โปรดลองอีกครั้ง");
      }
    });

    function copyUserId() {
      navigator.clipboard.writeText(lineProfile.userId).then(() => {
        alert("คัดลอกรหัสสำเร็จ นำส่ง Admin ได้เลยครับ");
      });
    }

    // ฟังก์ชัน Render เมนู (แบ่งกลุ่ม และบังคับ grid-cols-3 บนมือถือ)
    function renderDashboard(data) {
      showScreen('dashboard-screen');
      document.getElementById('user-info').textContent = `${lineProfile.displayName} | ตำแหน่ง: ${data.jobPosition}`;
      
      const container = document.getElementById('menu-container');
      container.innerHTML = '';

      if (!data.menuGroups || data.menuGroups.length === 0) {
        container.innerHTML = `<div class="bg-white p-6 rounded-lg text-lineDarkGray text-center border shadow-sm">คุณไม่มีสิทธิ์เข้าถึงเมนูใดๆ</div>`;
        return;
      }

      data.menuGroups.forEach(group => {
        const groupSection = document.createElement('div');
        
        const menusHtml = group.menus.map(menu => `
          <a href="${menu.menuUrl}" class="flex flex-col items-center justify-center p-3 sm:p-4 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md hover:border-linePrimary transition active:scale-95 h-full">
            <div class="bg-blue-50 text-linePrimary p-2.5 sm:p-3 rounded-full mb-2 sm:mb-3">
              <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            </div>
            <h3 class="text-[11px] sm:text-xs font-bold text-gray-800 text-center leading-tight line-clamp-2">${menu.menuName}</h3>
          </a>
        `).join('');

        // บังคับการแสดงผล grid-cols-3 บนมือถือ (3 เมนูต่อแถว)
        groupSection.innerHTML = `
          <h2 class="text-[13px] font-bold text-linePrimary mb-3 tracking-wide pl-2 border-l-[3px] border-linePrimary leading-none">#${group.groupName}</h2>
          <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-2.5 sm:gap-4">
              ${menusHtml}
          </div>
        `;
        container.appendChild(groupSection);
      });
    }

    function showScreen(id) {
      ['loading-screen', 'register-screen', 'error-screen', 'dashboard-screen', 'copy-screen'].forEach(s => {
        document.getElementById(s).classList.add('hidden');
      });
      document.getElementById(id).classList.remove('hidden');
    }

    function showError(title, message) {
      document.getElementById('error-title').textContent = title;
      document.getElementById('error-message').textContent = message;
      showScreen('error-screen');
    }

    function logoutApp() {
      if (liff.isLoggedIn()) {
        liff.logout();
        window.location.reload();
      }
    }

    window.onload = initApp;
  </script>
</body>
</html>
