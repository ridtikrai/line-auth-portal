<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portal System</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            linePrimary: "#0084FF",
            lineLightBg: "#F7F7F7",
            lineDarkGray: "#6C757D"
          }
        }
      }
    };
  </script>

  <style>
    .menu-card {
      min-height: 70px;
    }

    @media (max-width: 640px) {
      .menu-card {
        min-height: 62px;
      }
    }
  </style>
</head>

<body class="bg-lineLightBg font-sans text-gray-800 antialiased min-h-screen flex flex-col">

<header class="bg-gradient-to-r from-linePrimary to-blue-700 text-white shadow-md sticky top-0 z-50">

  <div class="max-w-5xl mx-auto px-3 sm:px-4 py-3 flex justify-between items-center">

    <div class="flex items-center gap-2.5 min-w-0">

      <img
        id="profile-img"
        src=""
        alt="Profile"
        class="h-9 w-9 sm:h-10 sm:w-10 rounded-full border-2 border-white hidden object-cover shadow-sm flex-shrink-0"
      >

      <div class="min-w-0">

        <h1 class="text-sm sm:text-base font-bold tracking-wide leading-tight">
          Portal System
        </h1>

        <p
          id="user-info"
          class="text-[10px] sm:text-[11px] opacity-90 truncate"
        >
          กำลังตรวจสอบ...
        </p>

      </div>
    </div>

    <div class="flex flex-col items-end gap-1 flex-shrink-0">

      <button
        onclick="logoutApp()"
        class="text-[10px] sm:text-xs bg-white/20 hover:bg-white/30 text-white px-2.5 sm:px-3 py-1.5 rounded border border-white/30 transition font-medium"
      >
        ออกจากระบบ
      </button>

      <div class="text-[9px] sm:text-[10px] opacity-90 flex items-center gap-1 px-2 py-0.5 rounded bg-black/10">
        <span>⏱️</span>
        <span
          id="timer-display"
          class="font-mono font-bold tracking-wider"
        >
          60:00
        </span>
      </div>

    </div>
  </div>
</header>


<main class="max-w-5xl mx-auto p-3 sm:p-4 flex-grow w-full">

  <!-- Loading -->

  <div
    id="loading-screen"
    class="flex flex-col items-center justify-center py-20"
  >

    <div class="animate-spin rounded-full h-10 w-10 border-b-4 border-linePrimary mb-4"></div>

    <p class="text-lineDarkGray text-sm font-medium">
      กำลังตรวจสอบสิทธิ์...
    </p>

  </div>


  <!-- Register -->

  <div
    id="register-screen"
    class="hidden max-w-md mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-5 sm:p-6"
  >

    <h2 class="text-xl font-bold mb-2">
      ลงทะเบียนใช้งาน
    </h2>

    <p class="text-sm text-lineDarkGray mb-5">
      กรุณากรอกเบอร์โทรศัพท์เพื่อยืนยันตัวตน
    </p>

    <form
      id="phone-form"
      class="space-y-4"
    >

      <input
        type="text"
        id="phone-input"
        maxlength="10"
        required
        inputmode="numeric"
        autocomplete="tel"
        class="w-full p-4 border border-gray-300 rounded-lg focus:outline-none focus:border-linePrimary text-center tracking-widest text-lg"
        placeholder="08xxxxxxxx"
      >

      <button
        type="submit"
        class="w-full bg-linePrimary text-white font-bold py-3.5 rounded-lg hover:bg-blue-700 transition"
      >
        ตรวจสอบข้อมูล
      </button>

    </form>
  </div>


  <!-- Copy UID -->

  <div
    id="copy-screen"
    class="hidden max-w-md mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-6 text-center"
  >

    <div class="text-4xl mb-3">
      📱
    </div>

    <h2 class="text-lg font-bold mb-2">
      ยืนยันข้อมูลสำเร็จ
    </h2>

    <p class="text-sm text-lineDarkGray mb-4">
      คัดลอกรหัสอ้างอิงส่งให้ Admin เพื่อดำเนินการผูกบัญชี
    </p>

    <div
      id="display-userid"
      class="bg-gray-100 p-3 rounded-lg mb-4 font-mono text-xs break-all border border-gray-200 select-all"
    ></div>

    <button
      onclick="copyUserId()"
      class="w-full bg-green-500 text-white font-bold py-3 rounded-lg hover:bg-green-600 transition"
    >
      คัดลอกรหัสอ้างอิง
    </button>

  </div>


  <!-- Error -->

  <div
    id="error-screen"
    class="hidden max-w-md mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-8 text-center"
  >

    <div class="text-4xl mb-3 text-red-500">
      ⚠️
    </div>

    <h2
      id="error-title"
      class="text-lg font-bold mb-2"
    >
      ข้อผิดพลาด
    </h2>

    <p
      id="error-message"
      class="text-sm text-lineDarkGray mb-5"
    >
      -
    </p>

    <button
      onclick="retryLogin()"
      class="w-full bg-gray-200 text-gray-700 font-bold py-3.5 rounded-lg transition hover:bg-gray-300"
    >
      ลองเข้าสู่ระบบอีกครั้ง
    </button>

  </div>


  <!-- Dashboard -->

  <div
    id="dashboard-screen"
    class="hidden pb-10"
  >

    <div
      id="menu-container"
      class="space-y-5 sm:space-y-6"
    ></div>

  </div>

</main>


<script>

const LIFF_ID =
  "2011487100-dldPQItq";

const CENTRAL_API_URL =
  "https://script.google.com/macros/s/AKfycbwphhIdSMHpTWHuFrRFTC3lEZe-QQCaZr2cebxb22cE9ph1eYPscyrxdw29T44DaUT9/exec";


const SESSION_STORAGE_KEY =
  "portal_session_id";

const SESSION_EXPIRES_KEY =
  "portal_session_expires";


let lineProfile = null;

let clientInfo = {
  ip: "Unknown",
  location: "Unknown",
  device: navigator.userAgent
};


const timeoutLimit = 3600;

let timeRemaining =
  timeoutLimit;

let timerInterval = null;

let keepAliveInterval = null;

let isLoggingOut = false;


/* ==========================================
   Init
========================================== */

async function initApp() {

  try {

    await liff.init({
      liffId: LIFF_ID
    });


    if (!liff.isLoggedIn()) {

      liff.login();

      return;
    }


    lineProfile =
      await liff.getProfile();


    updateProfile();


    await fetchClientInfo();


    const existingSession =
      sessionStorage.getItem(
        SESSION_STORAGE_KEY
      );


    if (existingSession) {

      const valid =
        await verifyExistingSession(
          existingSession
        );

      if (valid) {

        await loadDashboard(
          existingSession
        );

        startActivityTracker();

        return;
      }

      clearSession();
    }


    await loginWithLine();


  } catch (error) {

    console.error(error);

    showError(
      "พบข้อผิดพลาด",
      "ไม่สามารถเชื่อมต่อ LINE LIFF ได้"
    );
  }
}


/* ==========================================
   Profile
========================================== */

function updateProfile() {

  if (!lineProfile) {
    return;
  }

  const image =
    document.getElementById(
      "profile-img"
    );

  if (lineProfile.pictureUrl) {

    image.src =
      lineProfile.pictureUrl;

    image.classList.remove(
      "hidden"
    );
  }
}


/* ==========================================
   Login LINE UID
========================================== */

async function loginWithLine() {

  showScreen(
    "loading-screen"
  );

  try {

    const data =
      await apiRequest({
        action: "login",

        userId:
          lineProfile.userId,

        profile:
          lineProfile,

        clientInfo:
          clientInfo
      });


    if (
      data.status ===
      "not_registered"
    ) {

      document.getElementById(
        "user-info"
      ).textContent =
        "กรุณายืนยันตัวตน";

      showScreen(
        "register-screen"
      );

      return;
    }


    if (
      data.status ===
      "inactive"
    ) {

      showError(
        "ไม่สามารถเข้าใช้งานได้",
        data.message ||
        "บัญชีถูกระงับการใช้งาน"
      );

      return;
    }


    if (
      data.status ===
      "success"
    ) {

      saveSession(
        data.sessionId,
        data.expiresAt
      );

      renderDashboard(
        data
      );

      startActivityTracker();

      return;
    }


    showError(
      "เกิดข้อผิดพลาด",
      data.message ||
      "ไม่สามารถเข้าสู่ระบบได้"
    );


  } catch (error) {

    console.error(error);

    showError(
      "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้",
      "กรุณาตรวจสอบการเชื่อมต่อแล้วลองใหม่อีกครั้ง"
    );
  }
}


/* ==========================================
   Existing Session
========================================== */

async function verifyExistingSession(
  sessionId
) {

  try {

    const data =
      await apiRequest({
        action:
          "verifySession",

        sessionId:
          sessionId
      });


    if (
      data.status ===
      "success"
    ) {

      if (data.expiresAt) {

        sessionStorage.setItem(
          SESSION_EXPIRES_KEY,
          String(
            data.expiresAt
          )
        );
      }

      return true;
    }


    return false;

  } catch (error) {

    console.error(
      "verifyExistingSession",
      error
    );

    return false;
  }
}


/* ==========================================
   Dashboard
========================================== */

async function loadDashboard(
  sessionId
) {

  showScreen(
    "loading-screen"
  );

  try {

    const data =
      await apiRequest({

        action:
          "getDashboard",

        sessionId:
          sessionId,

        userId:
          lineProfile.userId,

        profile:
          lineProfile,

        clientInfo:
          clientInfo
      });


    if (
      data.status ===
      "session_expired"
    ) {

      clearSession();

      await loginWithLine();

      return;
    }


    if (
      data.status ===
      "inactive"
    ) {

      clearSession();

      showError(
        "ไม่สามารถเข้าใช้งานได้",
        data.message ||
        "บัญชีถูกระงับการใช้งาน"
      );

      return;
    }


    if (
      data.status ===
      "not_registered"
    ) {

      clearSession();

      await loginWithLine();

      return;
    }


    if (
      data.status ===
      "success"
    ) {

      saveSession(
        data.sessionId,
        data.expiresAt
      );

      renderDashboard(
        data
      );

      return;
    }


    showError(
      "เกิดข้อผิดพลาด",
      data.message ||
      "ไม่สามารถโหลด Dashboard ได้"
    );


  } catch (error) {

    console.error(error);

    showError(
      "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้",
      "กรุณาลองใหม่อีกครั้ง"
    );
  }
}


/* ==========================================
   Phone Verification
========================================== */

document
  .getElementById(
    "phone-form"
  )
  .addEventListener(
    "submit",
    async function(e) {

      e.preventDefault();


      const phone =
        document
          .getElementById(
            "phone-input"
          )
          .value
          .replace(
            /[^0-9]/g,
            ""
          );


      if (
        phone.length !== 10
      ) {

        alert(
          "กรุณากรอกเบอร์โทรศัพท์ 10 หลัก"
        );

        return;
      }


      showScreen(
        "loading-screen"
      );


      try {

        const data =
          await apiRequest({

            action:
              "verifyPhone",

            userId:
              lineProfile.userId,

            phone:
              phone,

            profile:
              lineProfile,

            clientInfo:
              clientInfo
          });


        if (
          data.status ===
          "show_userid"
        ) {

          document.getElementById(
            "display-userid"
          ).textContent =
            data.lineUserId;

          showScreen(
            "copy-screen"
          );

          return;
        }


        showError(
          "ตรวจสอบไม่สำเร็จ",
          data.message ||
          "ไม่สามารถตรวจสอบข้อมูลได้"
        );


      } catch (error) {

        console.error(error);

        showError(
          "การตรวจสอบล้มเหลว",
          "โปรดลองอีกครั้ง"
        );
      }

    }
  );


/* ==========================================
   Copy UID
========================================== */

function copyUserId() {

  if (!lineProfile) {
    return;
  }


  const uid =
    lineProfile.userId;


  if (
    navigator.clipboard &&
    navigator.clipboard.writeText
  ) {

    navigator.clipboard
      .writeText(uid)
      .then(() => {

        alert(
          "คัดลอกรหัสสำเร็จ นำส่ง Admin ได้เลยครับ"
        );

      })
      .catch(() => {

        fallbackCopy(uid);

      });

  } else {

    fallbackCopy(uid);

  }
}


function fallbackCopy(text) {

  const textarea =
    document.createElement(
      "textarea"
    );

  textarea.value =
    text;

  textarea.style.position =
    "fixed";

  textarea.style.opacity =
    "0";

  document.body.appendChild(
    textarea
  );

  textarea.select();

  document.execCommand(
    "copy"
  );

  textarea.remove();

  alert(
    "คัดลอกรหัสสำเร็จ"
  );
}


/* ==========================================
   Render Dashboard
========================================== */

function renderDashboard(
  data
) {

  showScreen(
    "dashboard-screen"
  );


  document.getElementById(
    "user-info"
  ).textContent =
    `${lineProfile.displayName} | ตำแหน่ง: ${data.jobPosition}`;


  const container =
    document.getElementById(
      "menu-container"
    );


  container.innerHTML =
    "";


  if (
    !data.menuGroups ||
    data.menuGroups.length === 0
  ) {

    container.innerHTML = `
      <div class="bg-white p-5 rounded-xl text-lineDarkGray text-center border shadow-sm text-sm">
        คุณไม่มีสิทธิ์เข้าถึงเมนูใดๆ
      </div>
    `;

    return;
  }


  data.menuGroups.forEach(
    group => {

      const section =
        document.createElement(
          "section"
        );


      const menuHtml =
        group.menus
          .map(menu => {

            const url =
              menu.menuUrl || "#";


            return `
              <a
                href="${escapeHtml(url)}"
                class="menu-card flex items-center justify-center
                       bg-white border border-gray-200 rounded-lg
                       shadow-sm hover:shadow-md hover:border-linePrimary
                       active:scale-95 transition
                       px-2 py-2 sm:px-3 sm:py-3"
              >

                <h3
                  class="text-[10px] sm:text-xs font-semibold
                         text-gray-800 text-center
                         leading-tight line-clamp-2
                         w-full break-words"
                >
                  ${escapeHtml(menu.menuName)}
                </h3>

              </a>
            `;

          })
          .join("");


      section.innerHTML = `

        <h2
          class="text-[13px] sm:text-sm font-bold
                 text-linePrimary mb-2.5 sm:mb-3
                 pl-2 border-l-[3px]
                 border-linePrimary leading-none"
        >
          ${escapeHtml(group.groupName)}
        </h2>

        <div
          class="grid
                 grid-cols-3
                 sm:grid-cols-4
                 md:grid-cols-5
                 gap-2
                 sm:gap-3
                 md:gap-4"
        >
          ${menuHtml}
        </div>
      `;


      container.appendChild(
        section
      );

    }
  );
}


/* ==========================================
   Activity / Timeout
========================================== */

function startActivityTracker() {

  if (timerInterval) {
    clearInterval(
      timerInterval
    );
  }


  if (keepAliveInterval) {
    clearInterval(
      keepAliveInterval
    );
  }


  timeRemaining =
    timeoutLimit;


  const resetTimer = () => {

    timeRemaining =
      timeoutLimit;
  };


  [
    "mousemove",
    "keydown",
    "touchstart",
    "scroll",
    "click"
  ].forEach(
    eventName => {

      window.addEventListener(
        eventName,
        resetTimer,
        {
          passive: true
        }
      );

    }
  );


  timerInterval =
    setInterval(
      () => {

        timeRemaining--;

        if (
          timeRemaining < 0
        ) {

          timeRemaining = 0;
        }


        const minutes =
          Math.floor(
            timeRemaining / 60
          )
          .toString()
          .padStart(2, "0");


        const seconds =
          (
            timeRemaining % 60
          )
          .toString()
          .padStart(2, "0");


        document.getElementById(
          "timer-display"
        ).textContent =
          `${minutes}:${seconds}`;


        if (
          timeRemaining <= 0
        ) {

          clearInterval(
            timerInterval
          );

          clearInterval(
            keepAliveInterval
          );

          alert(
            "หมดเวลาการเชื่อมต่อ กรุณาเข้าสู่ระบบใหม่"
          );

          logoutApp();
        }

      },
      1000
    );


  keepAliveInterval =
    setInterval(
      async () => {

        const sessionId =
          sessionStorage.getItem(
            SESSION_STORAGE_KEY
          );


        if (!sessionId) {
          return;
        }


        if (
          timeRemaining <= 300
        ) {
          return;
        }


        try {

          const data =
            await apiRequest({

              action:
                "keepAlive",

              sessionId:
                sessionId

            });


          if (
            data.status ===
            "success"
          ) {

            saveSession(
              sessionId,
              data.expiresAt
            );

          }
          else if (
            data.status ===
            "session_expired"
          ) {

            clearSession();

            await loginWithLine();

          }

        } catch (error) {

          console.error(
            "keepAlive",
            error
          );
        }

      },
      15 * 60 * 1000
    );
}


/* ==========================================
   Session
========================================== */

function saveSession(
  sessionId,
  expiresAt
) {

  if (!sessionId) {
    return;
  }


  sessionStorage.setItem(
    SESSION_STORAGE_KEY,
    sessionId
  );


  if (expiresAt) {

    sessionStorage.setItem(
      SESSION_EXPIRES_KEY,
      String(expiresAt)
    );
  }
}


function clearSession() {

  sessionStorage.removeItem(
    SESSION_STORAGE_KEY
  );

  sessionStorage.removeItem(
    SESSION_EXPIRES_KEY
  );
}


/* ==========================================
   API
========================================== */

async function apiRequest(
  payload
) {

  const response =
    await fetch(
      CENTRAL_API_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(payload)
      }
    );


  if (!response.ok) {

    throw new Error(
      "HTTP " +
      response.status
    );
  }


  return await response.json();
}


/* ==========================================
   Client Info
========================================== */

async function fetchClientInfo() {

  try {

    const response =
      await fetch(
        "https://ipapi.co/json/"
      );


    if (!response.ok) {
      return;
    }


    const data =
      await response.json();


    clientInfo.ip =
      data.ip ||
      "Unknown";


    clientInfo.location =
      `${data.city || "Unknown"}, ${data.country_name || "Unknown"}`;


  } catch (error) {

    console.warn(
      "Cannot obtain client info"
    );
  }
}


/* ==========================================
   Screen
========================================== */

function showScreen(id) {

  [
    "loading-screen",
    "register-screen",
    "error-screen",
    "dashboard-screen",
    "copy-screen"
  ].forEach(
    screenId => {

      const element =
        document.getElementById(
          screenId
        );

      if (element) {

        element.classList.add(
          "hidden"
        );
      }

    }
  );


  const target =
    document.getElementById(
      id
    );


  if (target) {

    target.classList.remove(
      "hidden"
    );
  }
}


/* ==========================================
   Error
========================================== */

function showError(
  title,
  message
) {

  document.getElementById(
    "error-title"
  ).textContent =
    title || "ข้อผิดพลาด";


  document.getElementById(
    "error-message"
  ).textContent =
    message || "-";


  showScreen(
    "error-screen"
  );
}


/* ==========================================
   Retry
========================================== */

async function retryLogin() {

  showScreen(
    "loading-screen"
  );

  clearSession();

  try {

    if (
      !liff.isLoggedIn()
    ) {

      liff.login();

      return;
    }


    lineProfile =
      await liff.getProfile();


    updateProfile();

    await loginWithLine();

  } catch (error) {

    console.error(error);

    showError(
      "เข้าสู่ระบบไม่สำเร็จ",
      "กรุณาลองใหม่อีกครั้ง"
    );
  }
}


/* ==========================================
   Logout
========================================== */

async function logoutApp() {

  if (isLoggingOut) {
    return;
  }

  isLoggingOut = true;


  const sessionId =
    sessionStorage.getItem(
      SESSION_STORAGE_KEY
    );


  try {

    if (sessionId) {

      await apiRequest({

        action:
          "logout",

        sessionId:
          sessionId

      });
    }

  } catch (error) {

    console.warn(
      "Logout server error",
      error
    );

  } finally {

    clearSession();


    try {

      if (
        liff.isLoggedIn()
      ) {

        liff.logout();
      }

    } catch (error) {
      console.warn(error);
    }


    window.location.reload();
  }
}


/* ==========================================
   HTML Escape
========================================== */

function escapeHtml(value) {

  return String(
    value || ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/* ==========================================
   Start
========================================== */

window.addEventListener(
  "load",
  initApp
);
