<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portal System</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- =====================================================
       Tailgrids Inspired
       White + Green Theme
       ===================================================== -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            portal: {
              50:  '#f0fdf4',
              100: '#dcfce7',
              200: '#bbf7d0',
              300: '#86efac',
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d'
            }
          }
        }
      }
    }
  </script>

  <style>
    html,
    body {
      min-height: 100%;
    }

    body {
      background: #f8fafc;
    }

    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .portal-card {
      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        border-color 0.15s ease;
    }

    .portal-card:hover {
      transform: translateY(-2px);
    }

    .portal-card:active {
      transform: scale(0.97);
    }

    .disabled-card {
      opacity: 0.55;
      cursor: not-allowed;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- =====================================================
       HEADER
       ===================================================== -->
  <header
    class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-50">

    <div
      class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">

      <!-- Profile -->
      <div class="flex items-center gap-3 min-w-0">

        <img
          id="profile-img"
          src=""
          alt="Profile"
          class="h-10 w-10 rounded-full border-2 border-portal-500 hidden object-cover shadow-sm">

        <div class="min-w-0">

          <h1
            class="text-base font-bold text-portal-700 tracking-wide leading-tight">
            Portal System
          </h1>

          <p
            id="user-info"
            class="text-[11px] text-slate-500 truncate">
            กำลังตรวจสอบ...
          </p>

        </div>
      </div>

      <!-- Right -->
      <div class="flex flex-col items-end gap-1 ml-3">

        <button
          id="logout-button"
          type="button"
          onclick="logoutApp()"
          class="text-[11px] sm:text-xs
                 bg-portal-600
                 hover:bg-portal-700
                 text-white
                 px-3 py-1.5
                 rounded-lg
                 transition
                 shadow-sm
                 font-medium">

          ออกจากระบบ

        </button>

        <div
          class="text-[9px] sm:text-[10px]
                 text-slate-500
                 flex items-center gap-1
                 px-2 py-0.5">

          <span>⏱️</span>

          <span
            id="timer-display"
            class="font-mono font-bold tracking-wider">
            60:00
          </span>

        </div>

      </div>

    </div>
  </header>


  <!-- =====================================================
       MAIN
       ===================================================== -->
  <main
    class="max-w-4xl mx-auto p-4 flex-grow w-full">


    <!-- ===================================================
         1. LOADING
         =================================================== -->
    <div
      id="loading-screen"
      class="flex flex-col items-center justify-center py-20">

      <div
        class="animate-spin
               rounded-full
               h-10 w-10
               border-4
               border-portal-100
               border-t-portal-600
               mb-4">
      </div>

      <p
        id="loading-message"
        class="text-slate-500 text-sm font-medium">
        กำลังตรวจสอบสิทธิ์การใช้งาน...
      </p>

    </div>


    <!-- ===================================================
         2. REGISTER PHONE
         =================================================== -->
    <div
      id="register-screen"
      class="hidden
             max-w-md
             mx-auto
             bg-white
             rounded-2xl
             shadow-sm
             border
             border-slate-200
             p-6">

      <div class="text-center mb-6">

        <div
          class="mx-auto
                 w-14 h-14
                 rounded-full
                 bg-portal-50
                 text-portal-600
                 flex
                 items-center
                 justify-center
                 text-2xl
                 mb-3">
          📱
        </div>

        <h2
          class="text-xl
                 font-bold
                 text-slate-800
                 mb-2">
          ลงทะเบียนใช้งาน
        </h2>

        <p
          class="text-sm
                 text-slate-500">
          กรุณากรอกเบอร์โทรศัพท์เพื่อยืนยันตัวตน
        </p>

      </div>


      <form
        id="phone-form"
        class="space-y-4">

        <div>

          <label
            for="phone-input"
            class="block
                   text-xs
                   font-semibold
                   text-slate-600
                   mb-2">
            เบอร์โทรศัพท์
          </label>

          <input
            type="text"
            id="phone-input"
            maxlength="10"
            inputmode="numeric"
            autocomplete="tel"
            required

            class="w-full
                   p-4
                   border
                   border-slate-300
                   rounded-xl
                   focus:outline-none
                   focus:ring-2
                   focus:ring-portal-500
                   focus:border-portal-500
                   text-center
                   tracking-widest
                   text-lg"

            placeholder="08xxxxxxxx"

            oninput="
              this.value =
              this.value.replace(/[^0-9]/g, '')
            "
          >

        </div>


        <button
          id="verify-phone-button"
          type="submit"

          class="w-full
                 bg-portal-600
                 hover:bg-portal-700
                 text-white
                 font-bold
                 py-3.5
                 rounded-xl
                 transition
                 shadow-sm">

          ตรวจสอบข้อมูล

        </button>

      </form>

    </div>


    <!-- ===================================================
         3. COPY USER ID
         =================================================== -->

      id="copy-screen"
      class="hidden
             max-w-md
             mx-auto
             bg-white
             rounded-2xl
             shadow-sm
             border
             border-slate-200
             p-6
             text-center">

      <div
        class="mx-auto
               w-14 h-14
               rounded-full
               bg-portal-50
               text-portal-600
               flex
               items-center
               justify-center
               text-2xl
               mb-3">
        ✓
      </div>

      <h2
        class="text-lg
               font-bold
               text-slate-800
               mb-2">
        ยืนยันข้อมูลสำเร็จ
      </h2>

      <p
        class="text-sm
               text-slate-500
               mb-4">
        คัดลอกรหัสอ้างอิงส่งให้ Admin
        เพื่อดำเนินการผูกบัญชี LINE
      </p>

      <div
        id="display-userid"

        class="bg-slate-50
               p-3
               rounded-xl
               mb-4
               font-mono
               text-xs
               break-all
               border
               border-slate-200
               select-all">
      </div>

      <button
        type="button"
        onclick="copyUserId()"

        class="w-full
               bg-portal-600
               hover:bg-portal-700
               text-white
               font-bold
               py-3
               rounded-xl
               transition">

        คัดลอกรหัสอ้างอิง

      </button>

    </div>


    <!-- ===================================================
         4. ERROR
         =================================================== -->
    <div
      id="error-screen"
      class="hidden
             max-w-md
             mx-auto
             bg-white
             rounded-2xl
             shadow-sm
             border
             border-slate-200
             p-8
             text-center">

      <div
        class="mx-auto
               w-14 h-14
               rounded-full
               bg-red-50
               text-red-500
               flex
               items-center
               justify-center
               text-2xl
               mb-3">
        ⚠️
      </div>

      <h2
        id="error-title"
        class="text-lg
               font-bold
               text-slate-800
               mb-2">
        ข้อผิดพลาด
      </h2>

      <p
        id="error-message"
        class="text-sm
               text-slate-500
               mb-5">
        -
      </p>

      <button
        type="button"
        onclick="retryLogin()"

        class="w-full
               bg-portal-600
               hover:bg-portal-700
               text-white
               font-bold
               py-3.5
               rounded-xl
               transition">

        เข้าสู่ระบบใหม่

      </button>

    </div>


    <!-- ===================================================
         5. DASHBOARD
         =================================================== -->
    <div
      id="dashboard-screen"
      class="hidden pb-10">

      <div
        id="menu-container"
        class="space-y-7">
      </div>

    </div>

  </main>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->
  <script>

    /* =====================================================
       CONFIGURATION
       ===================================================== */

    const LIFF_ID =
      "2011487100-dldPQItq";


    /*
     * IMPORTANT
     *
     * ใช้ Portal Core URL ล่าสุด
     */
    const CENTRAL_API_URL =
      "https://script.google.com/macros/s/AKfycbwphhIdSMHpTWHuFrRFTC3lEZe-QQCaZr2cebxb22cE9ph1eYPscyrxdw29T44DaUT9/exec";


    /* =====================================================
       SESSION STORAGE KEY
       ===================================================== */

    const SESSION_STORAGE_KEY =
      "PORTAL_SESSION_ID";


    const SESSION_EXPIRES_KEY =
      "PORTAL_SESSION_EXPIRES_AT";


    /* =====================================================
       APPLICATION STATE
       ===================================================== */

    let lineProfile = null;

    let clientInfo = {
      ip: "Unknown",
      location: "Unknown",
      device: navigator.userAgent
    };


    let portalSessionId = null;

    let portalSessionExpiresAt = null;

    let timerInterval = null;

    let keepAliveInterval = null;

    let isLaunching = false;

    let isLoggingOut = false;


    /* =====================================================
       TIMEOUT
       ===================================================== */

    const SESSION_TIMEOUT_SECONDS =
      60 * 60;

    const KEEP_ALIVE_SECONDS =
      15 * 60;


    let timeRemaining =
      SESSION_TIMEOUT_SECONDS;


    /* =====================================================
       SAFE STORAGE
       ===================================================== */

    function getStoredSessionId() {

      try {

        return sessionStorage.getItem(
          SESSION_STORAGE_KEY
        );

      } catch (error) {

        console.warn(
          "sessionStorage unavailable",
          error
        );

        return null;
      }
    }


    function saveSession(
      sessionId,
      expiresAt
    ) {

      if (!sessionId) {
        return false;
      }

      portalSessionId =
        String(sessionId);


      portalSessionExpiresAt =
        expiresAt
          ? Number(expiresAt)
          : null;


      try {

        sessionStorage.setItem(
          SESSION_STORAGE_KEY,
          portalSessionId
        );


        if (portalSessionExpiresAt) {

          sessionStorage.setItem(
            SESSION_EXPIRES_KEY,
            String(portalSessionExpiresAt)
          );

        }

        return true;

      } catch (error) {

        console.error(
          "saveSession ERROR:",
          error
        );

        return false;
      }
    }


    function restoreSession() {

      try {

        const sessionId =
          sessionStorage.getItem(
            SESSION_STORAGE_KEY
          );


        const expiresAt =
          sessionStorage.getItem(
            SESSION_EXPIRES_KEY
          );


        if (!sessionId) {
          return false;
        }


        portalSessionId =
          sessionId;


        portalSessionExpiresAt =
          expiresAt
            ? Number(expiresAt)
            : null;


        return true;

      } catch (error) {

        console.warn(
          "restoreSession ERROR:",
          error
        );

        return false;
      }
    }


    function clearPortalSession() {

      portalSessionId = null;

      portalSessionExpiresAt = null;


      try {

        sessionStorage.removeItem(
          SESSION_STORAGE_KEY
        );

        sessionStorage.removeItem(
          SESSION_EXPIRES_KEY
        );

      } catch (error) {

        console.warn(
          "clearPortalSession ERROR:",
          error
        );
      }
    }


    /* =====================================================
       API
       ===================================================== */

    async function callPortalApi(payload) {

      const response =
        await fetch(
          CENTRAL_API_URL,
          {
            method: "POST",

            /*
             * ใช้ text/plain
             * เพื่อหลีกเลี่ยง CORS preflight
             */
            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:
              JSON.stringify(payload),

            cache: "no-store"
          }
        );


      const text =
        await response.text();


      if (
        response.status < 200 ||
        response.status >= 300
      ) {

        throw new Error(
          "Portal API HTTP Error: " +
          response.status
        );
      }


      let data;


      try {

        data =
          JSON.parse(text);

      } catch (error) {

        console.error(
          "Invalid Portal API response:",
          text
        );

        throw new Error(
          "Portal ส่งข้อมูลกลับมาไม่ถูกต้อง"
        );
      }


      return data;
    }


    /* =====================================================
       INIT
       ===================================================== */

    async function initApp() {

      showScreen(
        "loading-screen"
      );


      setLoadingMessage(
        "กำลังเชื่อมต่อ LINE..."
      );


      try {

        await liff.init({
          liffId: LIFF_ID
        });


        if (!liff.isLoggedIn()) {

          /*
           * ยังไม่ Login LINE
           */
          liff.login();

          return;
        }


        /*
         * ดึง Profile
         */
        lineProfile =
          await liff.getProfile();


        if (!lineProfile ||
            !lineProfile.userId) {

          throw new Error(
            "ไม่สามารถอ่าน LINE User ID ได้"
          );
        }


        setProfile();


        /*
         * ดึงข้อมูล Client
         *
         * ถ้า IP API ใช้งานไม่ได้
         * ก็ไม่ให้ Login ล้ม
         */
        await fetchClientInfo();


        /*
         * =================================================
         * สำคัญที่สุด
         *
         * ตรวจว่ามี Session เดิมหรือไม่
         * ก่อนที่จะเรียก verifySession
         * =================================================
         */

        const hasStoredSession =
          restoreSession();


        if (hasStoredSession &&
            portalSessionId) {

          setLoadingMessage(
            "กำลังตรวจสอบ Session..."
          );


          const valid =
            await verifyPortalSession();


          if (valid) {

            /*
             * Session เดิมยังใช้ได้
             * ไม่ต้อง getDashboard ซ้ำ
             */
            renderExistingSessionDashboard();

            startActivityTracker();

            return;
          }


          /*
           * Session เดิมใช้ไม่ได้
           *
           * ล้างเฉพาะ Session
           * แล้ว Login Flow ใหม่
           *
           * ไม่ logout LINE
           */
          clearPortalSession();
        }


        /*
         * =================================================
         * ไม่มี Session
         *
         * ห้ามเรียก verifySession
         *
         * ให้ getDashboard ก่อน
         * =================================================
         */

        await loadDashboard();

      } catch (error) {

        console.error(
          "initApp ERROR:",
          error
        );


        showError(
          "พบข้อผิดพลาด",
          error.message ||
          "ไม่สามารถเชื่อมต่อ LINE หรือ Portal ได้"
        );
      }
    }


    /* =====================================================
       PROFILE
       ===================================================== */

    function setProfile() {

      const profileImage =
        document.getElementById(
          "profile-img"
        );


      if (
        lineProfile &&
        lineProfile.pictureUrl
      ) {

        profileImage.src =
          lineProfile.pictureUrl;

        profileImage.classList.remove(
          "hidden"
        );
      }


      document.getElementById(
        "user-info"
      ).textContent =
        lineProfile.displayName ||
        "ผู้ใช้งาน";
    }


    /* =====================================================
       CLIENT INFO
       ===================================================== */

    async function fetchClientInfo() {

      try {

        const controller =
          new AbortController();


        const timeout =
          setTimeout(
            () => controller.abort(),
            5000
          );


        const response =
          await fetch(
            "https://ipapi.co/json/",
            {
              signal:
                controller.signal,

              cache:
                "no-store"
            }
          );


        clearTimeout(timeout);


        if (!response.ok) {
          return;
        }


        const data =
          await response.json();


        clientInfo.ip =
          data.ip ||
          "Unknown";


        clientInfo.location =
          (
            data.city
              ? data.city + ", "
              : ""
          ) +
          (
            data.country_name ||
            "Unknown"
          );

      } catch (error) {

        /*
         * ไม่ให้ IP API ทำให้ Login ล้ม
         */
        console.warn(
          "fetchClientInfo skipped:",
          error
        );
      }
    }


    /* =====================================================
       FIRST LOGIN
       ===================================================== */

    async function loadDashboard() {

      showScreen(
        "loading-screen"
      );


      setLoadingMessage(
        "กำลังตรวจสอบสิทธิ์การใช้งาน..."
      );


      try {

        /*
         * IMPORTANT
         *
         * ครั้งแรกใช้ getDashboard
         * ไม่ใช่ verifySession
         */
        const data =
          await callPortalApi({

            action:
              "getDashboard",

            userId:
              lineProfile.userId,

            profile:
              lineProfile,

            clientInfo:
              clientInfo

          });


        console.log(
          "getDashboard:",
          data
        );


        /* -----------------------------------------------
           NOT REGISTERED
           ----------------------------------------------- */

        if (
          data.status ===
          "not_registered"
        ) {

          /*
           * ไม่มี Session เป็นเรื่องปกติ
           * สำหรับ User ใหม่
           */
          clearPortalSession();


          showScreen(
            "register-screen"
          );


          document.getElementById(
            "user-info"
          ).textContent =
            "กรุณายืนยันตัวตน";


          return;
        }


        /* -----------------------------------------------
           SUCCESS
           ----------------------------------------------- */

        if (
          data.status ===
          "success"
        ) {

          /*
           * =================================================
           * รับ Session จาก Backend
           *
           * รองรับชื่อ field หลายแบบ
           * เพื่อไม่ทำลาย response เดิม
           * =================================================
           */

          const sessionId =
            data.sessionId ||
            (
              data.session &&
              data.session.sessionId
            );


          const expiresAt =
            data.expiresAt ||
            (
              data.session &&
              data.session.expiresAt
            );


          /*
           * ถ้า Backend ส่ง Session มา
           * ให้เก็บทันที
           */
          if (sessionId) {

            saveSession(
              sessionId,
              expiresAt
            );

          } else {

            /*
             * ไม่บังคับ logout
             *
             * เพราะ Dashboard เดิมอาจยัง render ได้
             * แต่จะไม่สามารถใช้ Launch Token
             * จนกว่า Backend จะส่ง sessionId
             */
            console.warn(
              "getDashboard success but no sessionId returned"
            );
          }


          renderDashboard(
            data
          );


          startActivityTracker();


          return;
        }


        /* -----------------------------------------------
           ERROR
           ----------------------------------------------- */

        showError(
          "ไม่สามารถเข้าสู่ระบบ",
          data.message ||
          "เกิดข้อผิดพลาดในการตรวจสอบสิทธิ์"
        );


      } catch (error) {

        console.error(
          "loadDashboard ERROR:",
          error
        );


        showError(
          "พบข้อผิดพลาด",
          error.message ||
          "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้"
        );
      }
    }


    /* =====================================================
       VERIFY EXISTING SESSION
       ===================================================== */

    async function verifyPortalSession() {

      /*
       * สำคัญ:
       *
       * ถ้าไม่มี Session
       * ให้คืน false ทันที
       *
       * ไม่ยิง API
       * ไม่แสดง Session expired
       */
      if (!portalSessionId) {

        return false;
      }


      try {

        const data =
          await callPortalApi({

            action:
              "verifySession",

            sessionId:
              portalSessionId

          });


        if (
          data &&
          data.status ===
          "success"
        ) {

          /*
           * ถ้า Backend ส่ง expiresAt กลับมา
           * update local value
           */
          if (data.expiresAt) {

            portalSessionExpiresAt =
              Number(
                data.expiresAt
              );


            try {

              sessionStorage.setItem(
                SESSION_EXPIRES_KEY,
                String(
                  portalSessionExpiresAt
                )
              );

            } catch (error) {}
          }


          return true;
        }


        return false;

      } catch (error) {

        console.error(
          "verifyPortalSession ERROR:",
          error
        );

        return false;
      }
    }


    /* =====================================================
       RENDER EXISTING SESSION
       ===================================================== */

    function renderExistingSessionDashboard() {

      /*
       * หลัง Refresh
       *
       * ไม่มีข้อมูล menu อยู่ใน Browser
       * ดังนั้นต้องใช้ getDashboard เพื่อโหลด menu
       *
       * แต่ไม่ต้องสร้าง flow Login ใหม่
       */
      loadDashboardFromExistingSession();
    }


    async function loadDashboardFromExistingSession() {

      showScreen(
        "loading-screen"
      );


      setLoadingMessage(
        "กำลังโหลดเมนูระบบ..."
      );


      try {

        /*
         * ใช้ getDashboard ตาม API เดิม
         *
         * Session ที่มีอยู่จะยังอยู่ใน
         * sessionStorage
         */
        const data =
          await callPortalApi({

            action:
              "getDashboard",

            userId:
              lineProfile.userId,

            profile:
              lineProfile,

            clientInfo:
              clientInfo,

            sessionId:
              portalSessionId

          });


        if (
          data.status ===
          "success"
        ) {

          /*
           * Backend อาจส่ง Session ใหม่กลับมา
           * ให้ update ไว้
           */
          const sessionId =
            data.sessionId ||
            (
              data.session &&
              data.session.sessionId
            );


          const expiresAt =
            data.expiresAt ||
            (
              data.session &&
              data.session.expiresAt
            );


          if (sessionId) {

            saveSession(
              sessionId,
              expiresAt
            );
          }


          renderDashboard(
            data
          );


          return;
        }


        /*
         * ถ้ากลายเป็น not_registered
         * แสดงลงทะเบียน
         */
        if (
          data.status ===
          "not_registered"
        ) {

          clearPortalSession();


          showScreen(
            "register-screen"
          );


          document.getElementById(
            "user-info"
          ).textContent =
            "กรุณายืนยันตัวตน";


          return;
        }


        showError(
          "ไม่สามารถโหลดระบบ",
          data.message ||
          "ไม่สามารถโหลด Dashboard ได้"
        );

      } catch (error) {

        console.error(
          "loadDashboardFromExistingSession ERROR:",
          error
        );


        showError(
          "พบข้อผิดพลาด",
          error.message ||
          "ไม่สามารถโหลด Dashboard ได้"
        );
      }
    }

      .getElementById(

            );

          );


          setLoadingMessage(
            "กำลังตรวจสอบข้อมูล..."
          );


          try {

            const data =
              await callPortalApi({

                action:
                  "verifyPhone",

                userId:
                  lineProfile.userId,

                phone:
                  phoneInput,

                profile:
                  lineProfile,

                clientInfo:
                  clientInfo

              });


            console.log(
              "verifyPhone:",
              data
            );


            if (
              data.status ===
              "show_userid"
            ) {

              showScreen(
                "copy-screen"
              );


              document.getElementById(
                "display-userid"
              ).textContent =
                data.lineUserId ||
                lineProfile.userId;


              return;
            }


            if (
              data.status ===
              "success"
            ) {

              /*

              await loadDashboard();

            );

          } catch (error) {

            console.error(
              "verifyPhone ERROR:",

            );


            showError(
              "การตรวจสอบล้มเหลว",
              error.message ||
              "โปรดลองอีกครั้ง"

          } finally {

            button.textContent =
              "ตรวจสอบข้อมูล";

        );

          );

    /* =====================================================
       CREATE LAUNCH TOKEN
       ===================================================== */

    async function createLaunchToken(
      menuId
    ) {

      if (!portalSessionId) {

        throw new Error(
          "ไม่พบ Portal Session"
        );
      }


      if (!menuId) {

        throw new Error(
          "ไม่พบ Menu ID"
        );
      }


      const data =
        await callPortalApi({

          action:
            "createLaunchToken",

          sessionId:
            portalSessionId,

          menuId:
            String(menuId)

        });


      if (
        !data ||
        data.status !==
        "success"
      ) {

        throw new Error(
          data &&
          data.message
            ? data.message
            : "ไม่สามารถสร้าง Launch Token ได้"
        );
      }


      if (!data.launchToken) {

        throw new Error(
          "Portal ไม่ได้ส่ง Launch Token กลับมา"
        );
      }


      return data.launchToken;
    }


    /* =====================================================
       LAUNCH MENU
       ===================================================== */

    async function launchMenu(
      event,
      menuId,
      menuUrl
    ) {

      if (event) {

        event.preventDefault();

        event.stopPropagation();
      }


      if (isLaunching) {
        return;
      }


      /*
       * ไม่มี Session
       *
       * อย่าเรียกว่า Session expired ทันที
       * ให้ตรวจสอบใหม่ก่อน
       */
      if (!portalSessionId) {

        const restored =
          restoreSession();


        if (!restored) {

          await forceSessionLogin(
            "ไม่พบ Session กรุณาเข้าสู่ระบบใหม่"
          );

          return;
        }
      }


      const safeUrl =
        sanitizeUrl(
          menuUrl
        );


      if (!safeUrl) {

        alert(
          "ไม่พบ URL ของเมนูนี้"
        );

        return;
      }


      isLaunching =
        true;


      try {

        /*
         * ตรวจ Session ก่อน
         */
        const sessionValid =
          await verifyPortalSession();


        if (!sessionValid) {

          clearPortalSession();


          await forceSessionLogin(
            "Session หมดอายุ กรุณาเข้าสู่ระบบใหม่"
          );


          return;
        }


        /*
         * สร้าง One-Time Launch Token
         */
        const launchToken =
          await createLaunchToken(
            menuId
          );


        /*
         * Destination URL
         */
        const destination =
          new URL(
            safeUrl,
            window.location.href
          );


        /*
         * ลบ Credential เก่าทั้งหมด
         *
         * ไม่ให้ UID
         * ไม่ให้ userId
         * ไม่ให้ sessionId
         */
        [
          "uid",
          "userId",
          "sessionId",
          "token",
          "launchToken"
        ].forEach(
          function(key) {

            destination.searchParams.delete(
              key
            );

          }
        );


        /*
         * ใส่เฉพาะ One-Time Launch Token
         */
        destination.searchParams.set(
          "launchToken",
          launchToken
        );


        /*
         * Redirect
         */
        window.location.href =
          destination.toString();


      } catch (error) {

        console.error(
          "launchMenu ERROR:",
          error
        );


        alert(
          error.message ||
          "ไม่สามารถเปิดระบบปลายทางได้"
        );

      } finally {

        isLaunching =
          false;
      }
    }


    /* =====================================================
       ACTIVITY TRACKER
       ===================================================== */

    function startActivityTracker() {

      stopActivityTracker();


      timeRemaining =
        SESSION_TIMEOUT_SECONDS;


      updateTimerDisplay();


      /*
       * User Activity
       *
       * การกระทำของ User
       * รีเซ็ต UI Timer
       */
      const resetTimer =
        function() {

          timeRemaining =
            SESSION_TIMEOUT_SECONDS;

          updateTimerDisplay();
        };


      [
        "mousemove",
        "keydown",
        "touchstart",
        "scroll",
        "click"
      ].forEach(
        function(eventName) {

          window.addEventListener(
            eventName,
            resetTimer,
            {
              passive: true
            }
          );

        }
      );


      /*
       * UI countdown
       */
      timerInterval =
        setInterval(
          function() {

            timeRemaining--;

            updateTimerDisplay();


            if (
              timeRemaining <= 0
            ) {

              stopActivityTracker();


              forceSessionLogin(
                "หมดเวลาการเชื่อมต่อ กรุณาเข้าสู่ระบบใหม่"
              );

            }

          },
          1000
        );


      /*
       * Keep Alive
       *
       * สำคัญ:
       * ใช้ sessionId
       * ไม่ใช้ userId
       */
      keepAliveInterval =
        setInterval(
          async function() {

            if (
              !portalSessionId
            ) {
              return;
            }


            try {

              const data =
                await callPortalApi({

                  action:
                    "keepAlive",

                  sessionId:
                    portalSessionId

                });


              if (
                !data ||
                data.status !==
                "success"
              ) {

                console.warn(
                  "KeepAlive failed:",
                  data
                );
              }

            } catch (error) {

              console.warn(
                "KeepAlive ERROR:",
                error
              );
            }

          },
          KEEP_ALIVE_SECONDS * 1000
        );
    }


    function stopActivityTracker() {

      if (timerInterval) {

        clearInterval(
          timerInterval
        );

        timerInterval =
          null;
      }


      if (keepAliveInterval) {

        clearInterval(
          keepAliveInterval
        );

        keepAliveInterval =
          null;
      }
    }


    function updateTimerDisplay() {

      const element =
        document.getElementById(
          "timer-display"
        );


      if (!element) {
        return;
      }


      const seconds =
        Math.max(
          0,
          timeRemaining
        );


      const minutes =
        Math.floor(
          seconds / 60
        );


      const secs =
        seconds % 60;


      element.textContent =
        String(minutes)
          .padStart(2, "0") +
        ":" +
        String(secs)
          .padStart(2, "0");
    }


    /* =====================================================
       FORCE SESSION LOGIN
       ===================================================== */

    async function forceSessionLogin(
      message
    ) {

      if (isLoggingOut) {
        return;
      }


      isLoggingOut =
        true;


      stopActivityTracker();


      clearPortalSession();


      /*
       * สำคัญมาก
       *
       * ไม่ logout LINE
       *
       * เพราะถ้า logout LINE
       * User จะถูกบังคับ Login LINE ใหม่
       *
       * เราต้องการแค่สร้าง Portal Session ใหม่
       */
      showScreen(
        "loading-screen"
      );


      setLoadingMessage(
        message ||
        "กำลังเข้าสู่ระบบใหม่..."
      );


      try {

        /*
         * getDashboard
         * จะตรวจ Emp / ACTIVE / สิทธิ์ใหม่
         */
        await loadDashboard();

      } finally {

        isLoggingOut =
          false;
      }
    }


    /* =====================================================
       LOGOUT
       ===================================================== */

    async function logoutApp() {

      if (isLoggingOut) {
        return;
      }


      isLoggingOut =
        true;


      stopActivityTracker();


      const currentSession =
        portalSessionId;


      try {

        /*
         * แจ้ง Portal Logout
         */
        if (currentSession) {

          try {

            await callPortalApi({

              action:
                "logout",

              sessionId:
                currentSession

            });

          } catch (error) {

            console.warn(
              "Portal logout API error:",
              error
            );
          }
        }

      } finally {

        clearPortalSession();


        /*
         * Logout LINE
         */
        try {

          if (
            liff.isLoggedIn()
          ) {

            liff.logout();
          }

        } catch (error) {

          console.warn(
            "LIFF logout error:",
            error
          );
        }


        window.location.reload();
      }
    }


    /* =====================================================
       RETRY LOGIN
       ===================================================== */

    function retryLogin() {

      clearPortalSession();


      /*
       * ไม่ logout LINE
       *
       * เรียก init ใหม่
       */
      isLoggingOut =
        false;


      initApp();
    }


    /* =====================================================
       SCREEN
       ===================================================== */

    function showScreen(
      id
    ) {

      [
        "loading-screen",
        "register-screen",
        "copy-screen",
        "error-screen",
        "dashboard-screen"
      ].forEach(
        function(screenId) {

          const element =
            document.getElementById(

            );


          if (element) {

            element.classList.add(
              "hidden"
            );
          }

        }
      );


      const target =
        document.getElementById(
          id
        );


      if (target) {

        target.classList.remove(
          "hidden"
        );
      }
    }

    ) {

      const element =

      );
    }


    /* =====================================================
       URL SANITIZATION
       ===================================================== */

    function sanitizeUrl(
      url
    ) {

      if (!url) {
        return null;
      }


      try {

        const value =
          String(url)
            .trim();


        if (!value) {
          return null;
        }


        const parsed =
          new URL(
            value,
            window.location.href
          );


        /*
         * อนุญาตเฉพาะ HTTP/HTTPS
         */
        if (
          parsed.protocol !==
            "https:" &&
          parsed.protocol !==
            "http:"
        ) {

          return null;
        }


        return parsed.toString();

      } catch (error) {

        console.warn(
          "Invalid URL:",
          url
        );

        return null;
      }
    }


    /* =====================================================
       HTML ESCAPE
       ===================================================== */

    function escapeHtml(
      value
    ) {

      return String(
        value == null
          ? ""
          : value
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }


    function escapeAttribute(
      value
    ) {

      return escapeHtml(
        value
      );
    }


    /* =====================================================
       START
       ===================================================== */

    window.addEventListener(
      "load",
      function() {

        initApp();

      }
