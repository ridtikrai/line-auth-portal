<!DOCTYPE html>

<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Centralized Portal</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- Tailgrids-inspired : White + Green -->

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            linePrimary: '#16A34A',
            linePrimaryDark: '#15803D',
            lineLightBg: '#F8FAFC',
            lineDarkGray: '#64748B'
          }
        }
      }
    }
  </script>

  <style>
    body {
      background: #f8fafc;
    }

    .menu-card {
      transition:
        transform .15s ease,
        box-shadow .15s ease,
        border-color .15s ease;
    }

    .menu-card:hover {
      transform: translateY(-2px);
    }

    .menu-card:active {
      transform: scale(.97);
    }

    .launch-loading {
      pointer-events: none;
      opacity: .65;
    }
  </style>

</head>

<body class="bg-lineLightBg font-sans text-gray-800 antialiased min-h-screen flex flex-col">

  <!-- =========================================================
       HEADER
  ========================================================== -->

  <header class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-50">

<div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">

  <div class="flex items-center gap-3">

    <img
      id="profile-img"
      src=""
      alt="Profile"
      class="h-10 w-10 rounded-full border-2 border-green-100 hidden object-cover shadow-sm"
    >

    <div>
      <h1 class="text-base font-bold tracking-wide leading-tight text-gray-800">
        Portal System
      </h1>

      <p
        id="user-info"
        class="text-[11px] text-gray-500"
      >
        กำลังตรวจสอบ...
      </p>
    </div>

  </div>

  <div class="flex flex-col items-end gap-1">

    <button
      onclick="logoutApp()"
      class="text-[11px] sm:text-xs bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg transition shadow-sm font-medium"
    >
      ออกจากระบบ
    </button>

    <div
      class="text-[9px] sm:text-[10px] text-gray-500 flex items-center gap-1 mt-0.5 px-2 py-0.5 rounded bg-gray-100"
    >
      <span>⏱️</span>
      <span
        id="timer-display"
        class="font-mono font-bold tracking-wider"
      >
        60:00
      </span>
    </div>

  </div>

</div>

  </header>

  <!-- =========================================================
       MAIN
  ========================================================== -->

  <main class="max-w-4xl mx-auto p-4 flex-grow w-full">

<!-- =======================================================
     1. LOADING
======================================================== -->
<div
  id="loading-screen"
  class="flex flex-col items-center justify-center py-20"
>

  <div
    class="animate-spin rounded-full h-10 w-10 border-b-4 border-green-600 mb-4"
  ></div>

  <p class="text-gray-500 text-sm font-medium">
    กำลังตรวจสอบสิทธิ์การใช้งาน...
  </p>

</div>


<!-- =======================================================
     2. REGISTER
======================================================== -->
<div
  id="register-screen"
  class="hidden max-w-md mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-6"
>

  <div class="text-center mb-5">

    <div class="text-4xl mb-3">
      📱
    </div>

    <h2 class="text-xl font-bold mb-2 text-gray-800">
      ลงทะเบียนใช้งาน
    </h2>

    <p class="text-sm text-gray-500">
      กรุณากรอกเบอร์โทรศัพท์เพื่อยืนยันตัวตน
    </p>

  </div>

  <form
    id="phone-form"
    class="space-y-4"
  >

    <div>

      <input
        type="text"
        id="phone-input"
        maxlength="10"
        required
        inputmode="numeric"
        autocomplete="tel"
        class="w-full p-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-200 focus:border-green-500 text-center tracking-widest text-lg"
        placeholder="08xxxxxxxx"
        oninput="this.value = this.value.replace(/[^0-9]/g, '')"
      >

    </div>

    <button
      type="submit"
      class="w-full bg-green-600 text-white font-bold py-3.5 rounded-lg hover:bg-green-700 transition shadow-sm"
    >
      ตรวจสอบข้อมูล
    </button>

  </form>

</div>


<!-- =======================================================
     3. COPY UID
======================================================== -->
<div
  id="copy-screen"
  class="hidden max-w-md mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-6 text-center"
>

  <div class="text-4xl mb-3">
    📱
  </div>

  <h2 class="text-lg font-bold mb-2 text-gray-800">
    ยืนยันสำเร็จ
  </h2>

  <p class="text-sm text-gray-500 mb-4">
    คัดลอกรหัสอ้างอิงส่งให้ Admin เพื่อดำเนินการผูกบัญชี
  </p>

  <div
    id="display-userid"
    class="bg-gray-100 p-3 rounded-lg mb-4 font-mono text-xs break-all border border-gray-200 select-all"
  ></div>

  <button
    onclick="copyUserId()"
    class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition shadow-sm"
  >
    คัดลอกรหัสอ้างอิง
  </button>

</div>


<!-- =======================================================
     4. ERROR
======================================================== -->
<div
  id="error-screen"
  class="hidden max-w-md mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-8 text-center"
>

  <div class="text-4xl mb-3 text-red-500">
    ⚠️
  </div>

  <h2
    id="error-title"
    class="text-lg font-bold mb-2"
  >
    ข้อผิดพลาด
  </h2>

  <p
    id="error-message"
    class="text-sm text-gray-500 mb-5"
  >
    -
  </p>

  <button
    onclick="retryPortal()"
    class="w-full bg-gray-100 text-gray-700 font-bold py-3.5 rounded-lg transition hover:bg-gray-200"
  >
    ลองใหม่
  </button>

</div>


<!-- =======================================================
     5. DASHBOARD
======================================================== -->
<div
  id="dashboard-screen"
  class="hidden pb-10"
>

  <div
    id="menu-container"
    class="space-y-6"
  ></div>

</div>

  </main>

  <!-- =========================================================
       JAVASCRIPT
  ========================================================== -->

  <script>

    // =========================================================
    // CONFIGURATION
    // =========================================================

    const LIFF_ID =
      "2011487100-dldPQItq";

    const CENTRAL_API_URL =
      "https://script.google.com/macros/s/AKfycbwphhIdSMHpTWHuFrRFTC3lEZe-QQCaZr2cebxb22cE9ph1eYPscyrxdw29T44DaUT9/exec";


    // =========================================================
    // SESSION POLICY
    // =========================================================

    const INACTIVITY_LIMIT =
      60 * 60; // 60 นาที

    const KEEP_ALIVE_INTERVAL =
      10 * 60 * 1000; // 10 นาที


    // =========================================================
    // GLOBAL STATE
    // =========================================================

    let lineProfile = null;

    let clientInfo = {
      ip: "Unknown",
      location: "Unknown",
      device: navigator.userAgent
    };

    let portalSessionId = null;

    let timeRemaining =
      INACTIVITY_LIMIT;

    let timerInterval = null;

    let keepAliveInterval = null;

    let lastActivityAt =
      Date.now();

    let isLoggingOut = false;

    let isLaunchingMenu = false;


    // =========================================================
    // INITIALIZE
    // =========================================================

    async function initApp() {

      try {

        showScreen("loading-screen");

        /*
         * Restore Portal Session
         *
         * ไม่ใช้ LINE UID เป็น Session Credential
         */
        portalSessionId =
          sessionStorage.getItem(
            "portalSessionId"
          );

        await liff.init({
          liffId: LIFF_ID
        });


        // -----------------------------------------------------
        // LINE Login
        // -----------------------------------------------------

        if (!liff.isLoggedIn()) {

          liff.login();

          return;
        }


        // -----------------------------------------------------
        // LINE Profile
        // -----------------------------------------------------

        lineProfile =
          await liff.getProfile();


        document.getElementById(
          "profile-img"
        ).src =
          lineProfile.pictureUrl || "";

        document.getElementById(
          "profile-img"
        ).classList.remove("hidden");


        // -----------------------------------------------------
        // Client Information
        // -----------------------------------------------------

        await fetchClientInfo();


        // -----------------------------------------------------
        // Existing Portal Session
        // -----------------------------------------------------

        if (portalSessionId) {

          const valid =
            await verifyPortalSession();

          if (valid) {

            /*
             * Session ยังใช้ได้
             *
             * แต่ต้องโหลด Dashboard ใหม่เพื่อ
             * ดึงข้อมูลสิทธิ์ล่าสุดจาก Server
             */
            await loadDashboard();

            startActivityTracker();

            return;
          }


          // Session ไม่ valid
          sessionStorage.removeItem(
            "portalSessionId"
          );

          portalSessionId = null;
        }


        // -----------------------------------------------------
        // Login / Registration
        // -----------------------------------------------------

        await loginToPortal();

      } catch (error) {

        console.error(
          "initApp error:",
          error
        );

        showError(
          "พบข้อผิดพลาด",
          "ไม่สามารถเชื่อมต่อ LINE หรือระบบยืนยันตัวตนได้"
        );
      }
    }


    // =========================================================
    // LOGIN TO PORTAL
    // =========================================================

    async function loginToPortal() {

      showScreen(
        "loading-screen"
      );

      try {

        /*
         * ใช้ getDashboard เป็น Entry Point
         *
         * เพราะ Backend Production ปัจจุบัน
         * รองรับ getDashboard
         */
        const response =
          await fetch(
            CENTRAL_API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body: JSON.stringify({

                action:
                  "getDashboard",

                userId:
                  lineProfile.userId,

                profile: {

                  displayName:
                    lineProfile.displayName || "",

                  pictureUrl:
                    lineProfile.pictureUrl || ""

                },

                clientInfo:
                  clientInfo

              })
            }
          );


        const data =
          await response.json();


        // -----------------------------------------------------
        // NOT REGISTERED
        // -----------------------------------------------------

        if (
          data.status ===
          "not_registered"
        ) {

          /*
           * สำคัญ:
           *
           * LINE UID ยังไม่ถูกผูกกับ Emp
           * ต้องไปกรอกเบอร์โทร
           */
          showScreen(
            "register-screen"
          );

          document.getElementById(
            "user-info"
          ).textContent =
            "กรุณายืนยันตัวตนด้วยเบอร์โทรศัพท์";

          return;
        }


        // -----------------------------------------------------
        // ERROR
        // -----------------------------------------------------

        if (
          data.status ===
          "error"
        ) {

          showError(
            "ไม่สามารถเข้าใช้งานได้",
            data.message ||
              "บัญชีไม่สามารถใช้งานได้"
          );

          return;
        }


        // -----------------------------------------------------
        // SUCCESS
        // -----------------------------------------------------

        if (
          data.status !==
          "success"
        ) {

          showError(
            "เข้าสู่ระบบไม่สำเร็จ",
            data.message ||
              "เกิดข้อผิดพลาดในระบบ"
          );

          return;
        }


        // -----------------------------------------------------
        // Portal Session
        // -----------------------------------------------------

        portalSessionId =
          data.sessionId;


        if (!portalSessionId) {

          throw new Error(
            "Central Auth ไม่ได้ส่ง sessionId กลับมา"
          );
        }


        /*
         * เก็บเฉพาะ Session ID
         *
         * ไม่เก็บ UID เป็น Session Credential
         */
        sessionStorage.setItem(
          "portalSessionId",
          portalSessionId
        );


        renderDashboard(
          data
        );

        startActivityTracker();

      } catch (error) {

        console.error(
          "loginToPortal error:",
          error
        );

        showError(
          "พบข้อผิดพลาด",
          "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้"
        );
      }
    }


    // =========================================================
    // ACTIVITY TRACKER
    // =========================================================

    function startActivityTracker() {

      stopActivityTracker();

      lastActivityAt =
        Date.now();

      timeRemaining =
        INACTIVITY_LIMIT;


      const markActivity =
        () => {

          lastActivityAt =
            Date.now();

          timeRemaining =
            INACTIVITY_LIMIT;

        };


      [
        "mousemove",
        "keydown",
        "touchstart",
        "scroll",
        "click"
      ].forEach(
        evt => {

          window.addEventListener(
            evt,
            markActivity,
            {
              passive: true
            }
          );

        }
      );


      timerInterval =
        setInterval(
          async () => {

            const idleSeconds =
              Math.floor(
                (
                  Date.now() -
                  lastActivityAt
                ) / 1000
              );


            timeRemaining =
              Math.max(
                0,
                INACTIVITY_LIMIT -
                idleSeconds
              );


            updateTimerDisplay();


            if (
              timeRemaining <=
              0
            ) {

              await forceLogout(
                "หมดเวลาการเชื่อมต่อเนื่องจากไม่มีการใช้งาน 60 นาที"
              );

            }

          },
          1000
        );


      /*
       * Server KeepAlive
       */
      keepAliveInterval =
        setInterval(
          async () => {

            if (
              isLoggingOut ||
              !portalSessionId
            ) {
              return;
            }


            if (
              timeRemaining <=
              300
            ) {
              return;
            }


            await keepAlive();

          },
          KEEP_ALIVE_INTERVAL
        );


      updateTimerDisplay();
    }


    // =========================================================
    // STOP ACTIVITY TRACKER
    // =========================================================

    function stopActivityTracker() {

      if (
        timerInterval
      ) {

        clearInterval(
          timerInterval
        );

        timerInterval =
          null;
      }


      if (
        keepAliveInterval
      ) {

        clearInterval(
          keepAliveInterval
        );

        keepAliveInterval =
          null;
      }
    }


    // =========================================================
    // TIMER DISPLAY
    // =========================================================

    function updateTimerDisplay() {

      const total =
        Math.max(
          0,
          timeRemaining
        );


      const m =
        Math.floor(
          total / 60
        )
          .toString()
          .padStart(
            2,
            "0"
          );


      const s =
        (
          total % 60
        )
          .toString()
          .padStart(
            2,
            "0"
          );


      const el =
        document.getElementById(
          "timer-display"
        );


      if (el) {

        el.textContent =
          `${m}:${s}`;

      }
    }


    // =========================================================
    // KEEP ALIVE
    // =========================================================

    async function keepAlive() {

      try {

        const response =
          await fetch(
            CENTRAL_API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body: JSON.stringify({

                action:
                  "keepAlive",

                sessionId:
                  portalSessionId

              })
            }
          );


        const data =
          await response.json();


        if (
          data.status !==
          "success"
        ) {

          await forceLogout(
            "Session หมดอายุ กรุณาเข้าสู่ระบบใหม่"
          );

        }

      } catch (error) {

        /*
         * Network error ชั่วคราว
         * ไม่ Logout ทันที
         */
        console.error(
          "KeepAlive failed:",
          error
        );
      }
    }


    // =========================================================
    // VERIFY PORTAL SESSION
    // =========================================================

    async function verifyPortalSession() {

      if (
        !portalSessionId
      ) {
        return false;
      }


      try {

        const response =
          await fetch(
            CENTRAL_API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body: JSON.stringify({

                action:
                  "verifySession",

                sessionId:
                  portalSessionId,

                /*
                 * Portal หน้าแรก
                 * ใช้สำหรับตรวจว่า Session ยัง valid
                 */
                menuId:
                  "PORTAL"

              })
            }
          );


        const data =
          await response.json();


        return (
          data.status ===
          "success"
        );

      } catch (error) {

        console.error(
          "verifySession failed:",
          error
        );

        return false;
      }
    }


    // =========================================================
    // LOAD DASHBOARD
    // =========================================================

    async function loadDashboard() {

      showScreen(
        "loading-screen"
      );


      try {

        const response =
          await fetch(
            CENTRAL_API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body: JSON.stringify({

                action:
                  "getDashboard",

                userId:
                  lineProfile.userId,

                profile: {

                  displayName:
                    lineProfile.displayName || "",

                  pictureUrl:
                    lineProfile.pictureUrl || ""

                },

                clientInfo:
                  clientInfo

              })
            }
          );


        const data =
          await response.json();


        if (
          data.status ===
          "not_registered"
        ) {

          /*
           * กรณี Session เดิมยังอยู่
           * แต่บัญชีไม่พบแล้ว
           */
          sessionStorage.removeItem(
            "portalSessionId"
          );

          portalSessionId =
            null;

          showScreen(
            "register-screen"
          );

          return;
        }


        if (
          data.status ===
          "success"
        ) {

          /*
           * ถ้า Backend ส่ง Session ใหม่
           * ให้ update
           */
          if (
            data.sessionId
          ) {

            portalSessionId =
              data.sessionId;

            sessionStorage.setItem(
              "portalSessionId",
              portalSessionId
            );

          }


          renderDashboard(
            data
          );

          return;
        }


        showError(
          "ไม่สามารถโหลดเมนูได้",
          data.message ||
            "เกิดข้อผิดพลาด"
        );

      } catch (error) {

        console.error(
          "loadDashboard error:",
          error
        );

        showError(
          "พบข้อผิดพลาด",
          "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้"
        );
      }
    }


    // =========================================================
    // VERIFY PHONE
    // =========================================================

    document
      .getElementById(
        "phone-form"
      )
      .addEventListener(
        "submit",
        async e => {

          e.preventDefault();


          const phoneInput =
            document
              .getElementById(
                "phone-input"
              )
              .value
              .trim();


          if (
            !/^\d{10}$/.test(
              phoneInput
            )
          ) {

            alert(
              "กรุณากรอกเบอร์โทรศัพท์ 10 หลัก"
            );

            return;
          }


          showScreen(
            "loading-screen"
          );


          try {

            const response =
              await fetch(
                CENTRAL_API_URL,
                {
                  method: "POST",

                  headers: {
                    "Content-Type":
                      "text/plain;charset=utf-8"
                  },

                  body: JSON.stringify({

                    action:
                      "verifyPhone",

                    userId:
                      lineProfile.userId,

                    phone:
                      phoneInput,

                    profile: {

                      displayName:
                        lineProfile.displayName || "",

                      pictureUrl:
                        lineProfile.pictureUrl || ""

                    },

                    clientInfo:
                      clientInfo

                  })
                }
              );


            const data =
              await response.json();


            if (
              data.status ===
              "show_userid"
            ) {

              showScreen(
                "copy-screen"
              );


              document.getElementById(
                "display-userid"
              ).textContent =
                data.lineUserId ||
                lineProfile.userId;


              return;
            }


            showError(
              "ตรวจสอบไม่สำเร็จ",
              data.message ||
                "ไม่สามารถตรวจสอบข้อมูลได้"
            );

          } catch (error) {

            console.error(
              "verifyPhone error:",
              error
            );

            showError(
              "การตรวจสอบล้มเหลว",
              "โปรดลองอีกครั้ง"
            );
          }

        }
      );


    // =========================================================
    // COPY LINE UID
    // =========================================================

    function copyUserId() {

      const uid =
        lineProfile?.userId ||
        "";


      if (!uid) {

        alert(
          "ไม่พบ LINE UID"
        );

        return;
      }


      if (
        navigator.clipboard
      ) {

        navigator.clipboard
          .writeText(uid)
          .then(
            () => {

              alert(
                "คัดลอกรหัสสำเร็จ นำส่ง Admin เพื่อดำเนินการผูกบัญชี"
              );

            }
          )
          .catch(
            () => {

              alert(
                "ไม่สามารถคัดลอกอัตโนมัติ กรุณาคัดลอกรหัสจากหน้าจอ"
              );

            }
          );

      } else {

        alert(
          "กรุณาคัดลอกรหัสจากหน้าจอ"
        );

      }
    }


    // =========================================================
    // RENDER DASHBOARD
    // =========================================================

    function renderDashboard(
      data
    ) {

      showScreen(
        "dashboard-screen"
      );


      document.getElementById(
        "user-info"
      ).textContent =
        `${lineProfile.displayName || "-"} | ตำแหน่ง: ${data.jobPosition || "-"}`;


      const container =
        document.getElementById(
          "menu-container"
        );


      container.innerHTML =
        "";


      if (
        !data.menuGroups ||
        !Array.isArray(
          data.menuGroups
        ) ||
        data.menuGroups.length ===
          0
      ) {

        container.innerHTML = `
          <div class="bg-white p-6 rounded-xl text-gray-500 text-center border border-gray-200 shadow-sm">
            คุณไม่มีสิทธิ์เข้าถึงเมนูใดๆ
          </div>
        `;

        return;
      }


      data.menuGroups.forEach(
        group => {

          const groupSection =
            document.createElement(
              "div"
            );


          const menus =
            Array.isArray(
              group.menus
            )
              ? group.menus
              : [];


          const menusHtml =
            menus
              .map(
                menu => {

                  /*
                   * สำคัญ
                   *
                   * ไม่ใช้ menuUrl เป็น href
                   *
                   * menuId ถูกเก็บใน DOM
                   * แต่ไม่แสดงบนหน้าจอ
                   */
                  const menuId =
                    escapeHtml(
                      String(
                        menu.menuId ??
                        ""
                      )
                    );


                  const menuName =
                    escapeHtml(
                      menu.menuName ||
                        ""
                    );


                  /*
                   * ถ้าไม่มี URL
                   * ให้ยังแสดง Menu
                   * แต่ไม่สามารถกดได้
                   */
                  const hasUrl =
                    !!sanitizeUrl(
                      menu.menuUrl
                    );


                  if (
                    !hasUrl
                  ) {

                    return `
                      <div
                        class="menu-card flex flex-col items-center justify-start p-3 sm:p-4 bg-white border border-gray-200 rounded-xl shadow-sm h-full"
                      >

                        <div
                          class="bg-green-50 text-green-600 p-2.5 sm:p-3 rounded-full mb-2 sm:mb-3"
                        >

                          <svg
                            class="w-6 h-6 sm:w-7 sm:h-7"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                          >

                            <path
                              stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
                            >
                            </path>

                          </svg>

                        </div>

                        <h3
                          class="text-[11px] sm:text-xs font-bold text-gray-800 text-center leading-tight line-clamp-2 w-full"
                        >
                          ${menuName}
                        </h3>

                      </div>
                    `;

                  }


                  return `
                    <a
                      href="#"
                      data-menu-id="${menuId}"
                      onclick="launchMenu(event, '${escapeJs(String(menu.menuId ?? ""))}', '${escapeJs(String(menu.menuUrl ?? ""))}')"
                      class="menu-card flex flex-col items-center justify-start p-3 sm:p-4 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md hover:border-green-300 transition active:scale-95 h-full"
                    >

                      <div
                        class="bg-green-50 text-green-600 p-2.5 sm:p-3 rounded-full mb-2 sm:mb-3"
                      >

                        <svg
                          class="w-6 h-6 sm:w-7 sm:h-7"
                          fill="none"
                          stroke="currentColor"
                          viewBox="0 0 24 24"
                        >

                          <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
                          >
                          </path>

                        </svg>

                      </div>

                      <h3
                        class="text-[11px] sm:text-xs font-bold text-gray-800 text-center leading-tight line-clamp-2 w-full"
                      >
                        ${menuName}
                      </h3>

                    </a>
                  `;

                }
              )
              .join("");


          groupSection.innerHTML = `

            <h2
              class="text-[14px] font-bold text-green-600 mb-3 tracking-wide pl-2 border-l-[3px] border-green-500 leading-none"
            >
              ${escapeHtml(
                group.groupName ||
                "ทั่วไป"
              )}
            </h2>

            <div
              class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3 sm:gap-4"
            >
              ${menusHtml}
            </div>

          `;


          container.appendChild(
            groupSection
          );

        }
      );
    }


    // =========================================================
    // CREATE LAUNCH TOKEN
    // =========================================================

    async function createLaunchToken(
      menuId
    ) {

      if (
        !portalSessionId
      ) {

        throw new Error(
          "ไม่พบ Portal Session"
        );
      }


      if (
        !menuId
      ) {

        throw new Error(
          "ไม่พบ Menu ID"
        );
      }


      const response =
        await fetch(
          CENTRAL_API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body: JSON.stringify({

              action:
                "createLaunchToken",

              sessionId:
                portalSessionId,

              menuId:
                String(menuId)

            })
          }
        );


      const data =
        await response.json();


      if (
        !data ||
        data.status !==
          "success"
      ) {

        throw new Error(
          data?.message ||
          "ไม่สามารถสร้าง Launch Token ได้"
        );
      }


      if (
        !data.launchToken
      ) {

        throw new Error(
          "Portal ไม่ได้ส่ง Launch Token กลับมา"
        );
      }


      return data.launchToken;
    }


    // =========================================================
    // LAUNCH MENU
    // =========================================================

    async function launchMenu(
      event,
      menuId,
      menuUrl
    ) {

      if (event) {

        event.preventDefault();

        event.stopPropagation();

      }


      if (
        isLaunchingMenu
      ) {
        return;
      }


      if (
        !portalSessionId
      ) {

        await forceLogout(
          "Session หมดอายุ กรุณาเข้าสู่ระบบใหม่"
        );

        return;
      }


      const safeUrl =
        sanitizeUrl(
          menuUrl
        );


      if (!safeUrl) {

        alert(
          "ไม่พบ URL ของเมนูนี้"
        );

        return;
      }


      isLaunchingMenu =
        true;


      try {

        /*
         * ---------------------------------------------------
         * STEP 1
         * Verify Portal Session
         * ---------------------------------------------------
         */
        const valid =
          await verifyPortalSession();


        if (!valid) {

          await forceLogout(
            "Session หมดอายุ กรุณาเข้าสู่ระบบใหม่"
          );

          return;
        }


        /*
         * ---------------------------------------------------
         * STEP 2
         * Create One-Time Launch Token
         * ---------------------------------------------------
         */
        const launchToken =
          await createLaunchToken(
            menuId
          );


        /*
         * ---------------------------------------------------
         * STEP 3
         * Build Destination URL
         *
         * ห้ามส่ง:
         * - portalSessionId
         * - LINE UID
         * - userId
         *
         * ส่งเฉพาะ Launch Token
         * ---------------------------------------------------
         */
        const url =
          new URL(
            safeUrl
          );


        /*
         * ลบ Credential เดิมทั้งหมด
         */
        [
          "sessionId",
          "uid",
          "userId",
          "token",
          "launchToken"
        ].forEach(
          key => {
            url.searchParams.delete(
              key
            );
          }
        );


        /*
         * One-Time Launch Token
         */
        url.searchParams.set(
          "launchToken",
          launchToken
        );


        /*
         * ---------------------------------------------------
         * STEP 4
         * ไปยัง Destination
         * ---------------------------------------------------
         */
        window.location.href =
          url.toString();

      } catch (error) {

        console.error(
          "launchMenu error:",
          error
        );

        alert(
          error.message ||
          "ไม่สามารถเปิดระบบปลายทางได้"
        );

      } finally {

        isLaunchingMenu =
          false;

      }
    }


    // =========================================================
    // URL VALIDATION
    // =========================================================

    function sanitizeUrl(
      url
    ) {

      try {

        if (!url) {
          return null;
        }


        const parsed =
          new URL(
            url,
            window.location.href
          );


        if (
          ![
            "http:",
            "https:"
          ].includes(
            parsed.protocol
          )
        ) {

          return null;
        }


        return parsed.href;

      } catch (e) {

        return null;

      }
    }


    // =========================================================
    // HTML ESCAPE
    // =========================================================

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }


    // =========================================================
    // JAVASCRIPT STRING ESCAPE
    // =========================================================

    function escapeJs(
      value
    ) {

      return String(
        value ?? ""
      )
        .replace(
          /\\/g,
          "\\\\"
        )
        .replace(
          /'/g,
          "\\'"
        )
        .replace(
          /"/g,
          '\\"'
        )
        .replace(
          /\r/g,
          "\\r"
        )
        .replace(
          /\n/g,
          "\\n"
        );
    }


    // =========================================================
    // LOGOUT
    // =========================================================

    async function logoutApp() {

      if (
        isLoggingOut
      ) {
        return;
      }


      isLoggingOut =
        true;


      stopActivityTracker();


      try {

        if (
          portalSessionId
        ) {

          await fetch(
            CENTRAL_API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body: JSON.stringify({

                action:
                  "logout",

                sessionId:
                  portalSessionId

              })
            }
          );

        }

      } catch (error) {

        console.error(
          "Logout server error:",
          error
        );
      }


      sessionStorage.removeItem(
        "portalSessionId"
      );


      portalSessionId =
        null;


      try {

        if (
          liff.isLoggedIn()
        ) {

          liff.logout();

        }

      } catch (e) {

        console.error(
          "LINE logout error:",
          e
        );

      }


      window.location.reload();
    }


    // =========================================================
    // FORCE LOGOUT
    // =========================================================

    async function forceLogout(
      message
    ) {

      if (
        isLoggingOut
      ) {
        return;
      }


      alert(
        message
      );


      await logoutApp();
    }


    // =========================================================
    // RETRY
    // =========================================================

    function retryPortal() {

      window.location.reload();

    }


    // =========================================================
    // CLIENT INFORMATION
    // =========================================================

    async function fetchClientInfo() {

      try {

        const res =
          await fetch(
            "https://ipapi.co/json/"
          );


        if (
          res.ok
        ) {

          const data =
            await res.json();


          clientInfo.ip =
            data.ip ||
            "Unknown";


          clientInfo.location =
            `${data.city || "Unknown"}, ${data.country_name || "Unknown"}`;

        }

      } catch (e) {

        /*
         * IP lookup ล้มเหลว
         * ไม่ให้ Login ล้มตาม
         */
      }
    }


    // =========================================================
    // SCREEN HELPER
    // =========================================================

    function showScreen(
      id
    ) {

      [
        "loading-screen",
        "register-screen",
        "error-screen",
        "dashboard-screen",
        "copy-screen"
      ].forEach(
        screenId => {

          const el =
            document.getElementById(
              screenId
            );

          if (el) {

            el.classList.add(
              "hidden"
            );

          }

        }
      );


      const target =
        document.getElementById(
          id
        );


      if (target) {

        target.classList.remove(
          "hidden"
        );

      }
    }


    // =========================================================
    // ERROR SCREEN
    // =========================================================

    function showError(
      title,
      message
    ) {

      document.getElementById(
        "error-title"
      ).textContent =
        title ||
        "ข้อผิดพลาด";


      document.getElementById(
        "error-message"
      ).textContent =
        message ||
        "-";


      showScreen(
        "error-screen"
      );
    }


    // =========================================================
    // START
    // =========================================================

    window.onload =
      initApp;

  </script>
