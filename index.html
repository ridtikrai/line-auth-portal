<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Portal</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        "Segoe UI",
        "Noto Sans Thai",
        Arial,
        sans-serif;
      background: #f5f7f6;
      color: #1f2937;
    }

    body {
      min-height: 100vh;
    }

    button,
    input {
      font-family: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* =========================================================
       LOGIN
       ========================================================= */

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        linear-gradient(
          135deg,
          #eef8f2 0%,
          #f7fbf8 50%,
          #ffffff 100%
        );
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 24px;
      padding: 34px 28px;
      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.08);
      border: 1px solid #e6ece8;
      text-align: center;
    }

    .logo-box {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e9f8ef;
      color: #198754;
      font-size: 32px;
      font-weight: 700;
    }

    .login-card h1 {
      margin: 0;
      font-size: 27px;
      font-weight: 700;
      color: #166534;
    }

    .login-card p {
      margin: 10px 0 25px;
      color: #6b7280;
      font-size: 14px;
      line-height: 1.7;
    }

    .login-btn {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 14px 18px;
      background: #198754;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .login-btn:hover {
      background: #157347;
      transform: translateY(-1px);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* =========================================================
       APP
       ========================================================= */

    .app {
      min-height: 100vh;
      background: #f5f7f6;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #e5e7eb;
    }

    .topbar-inner {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e9f8ef;
      color: #198754;
      font-weight: 700;
      font-size: 20px;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 700;
      color: #166534;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-subtitle {
      margin-top: 2px;
      font-size: 12px;
      color: #6b7280;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-info {
      text-align: right;
    }

    .user-name {
      font-size: 14px;
      font-weight: 600;
      color: #374151;
    }

    .user-role {
      margin-top: 2px;
      font-size: 12px;
      color: #198754;
      font-weight: 600;
    }

    .logout-btn {
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #374151;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
      transition: 0.2s ease;
    }

    .logout-btn:hover {
      background: #f3f4f6;
    }

    /* =========================================================
       SESSION BAR
       ========================================================= */

    .session-wrapper {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 14px 24px 0;
    }

    .session-bar {
      width: 100%;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 9px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: #6b7280;
    }

    .session-status {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .session-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }

    .session-time {
      font-weight: 600;
      color: #374151;
    }

    /* =========================================================
       MAIN
       ========================================================= */

    .main {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }

    .welcome {
      margin-bottom: 26px;
    }

    .welcome h2 {
      margin: 0;
      font-size: 25px;
      color: #1f2937;
    }

    .welcome p {
      margin: 7px 0 0;
      color: #6b7280;
      font-size: 14px;
    }

    /* =========================================================
       MENU GROUP
       ========================================================= */

    .menu-group {
      margin-bottom: 30px;
    }

    .menu-group-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 13px;
    }

    .menu-group-line {
      width: 5px;
      height: 24px;
      border-radius: 10px;
      background: #198754;
      flex: 0 0 5px;
    }

    .menu-group-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: #166534;
    }

    /* =========================================================
       MENU GRID
       ========================================================= */

    .menu-grid {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .menu-card {
      position: relative;
      min-height: 132px;
      padding: 18px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 17px;
      box-shadow:
        0 5px 16px rgba(0, 0, 0, 0.045);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
      overflow: hidden;
    }

    .menu-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: #198754;
      opacity: 0;
      transition: 0.2s ease;
    }

    .menu-card:hover {
      transform: translateY(-3px);
      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.08);
      border-color: #b8dfc9;
    }

    .menu-card:hover::before {
      opacity: 1;
    }

    .menu-card.disabled {
      cursor: not-allowed;
      opacity: 0.62;
      background: #fafafa;
    }

    .menu-card.disabled:hover {
      transform: none;
      box-shadow:
        0 5px 16px rgba(0, 0, 0, 0.045);
      border-color: #e5e7eb;
    }

    .menu-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .menu-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #eef9f2;
      color: #198754;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      font-weight: 700;
      flex: 0 0 42px;
    }

    .menu-status {
      font-size: 11px;
      color: #9ca3af;
      font-weight: 500;
      text-align: right;
    }

    .menu-card-bottom {
      margin-top: 15px;
    }

    .menu-name {
      font-size: 15px;
      line-height: 1.45;
      font-weight: 650;
      color: #374151;
      word-break: break-word;
    }

    .menu-action {
      margin-top: 6px;
      font-size: 12px;
      color: #198754;
      font-weight: 600;
    }

    .menu-card.disabled .menu-action {
      color: #9ca3af;
    }

    /* =========================================================
       EMPTY
       ========================================================= */

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      color: #6b7280;
    }

    .empty-icon {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .empty-title {
      font-size: 17px;
      font-weight: 650;
      color: #374151;
    }

    .empty-text {
      margin-top: 5px;
      font-size: 13px;
    }

    /* =========================================================
       LOADING
       ========================================================= */

    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(4px);
    }

    .loading-box {
      min-width: 180px;
      padding: 22px;
      border-radius: 16px;
      background: #ffffff;
      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    .spinner {
      width: 32px;
      height: 32px;
      margin: 0 auto 12px;
      border-radius: 50%;
      border: 3px solid #dff1e6;
      border-top-color: #198754;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      font-size: 13px;
      color: #6b7280;
    }

    /* =========================================================
       ALERT
       ========================================================= */

    .alert {
      position: fixed;
      left: 50%;
      bottom: 25px;
      z-index: 10000;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 500px;
      padding: 13px 16px;
      border-radius: 12px;
      background: #ffffff;
      border: 1px solid #fecaca;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.12);
      color: #991b1b;
      font-size: 13px;
      line-height: 1.5;
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-width: 1100px) {

      .menu-grid {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }
    }

    /*
      Mobile:
      ต้องการอย่างน้อย 3 เมนูต่อแถว
    */

    @media (max-width: 700px) {

      .topbar-inner {
        padding: 12px 15px;
      }

      .brand-title {
        font-size: 15px;
      }

      .brand-subtitle {
        display: none;
      }

      .brand-icon {
        width: 40px;
        height: 40px;
        flex-basis: 40px;
      }

      .user-info {
        display: none;
      }

      .logout-btn {
        padding: 7px 10px;
        font-size: 12px;
      }

      .session-wrapper {
        padding:
          10px 12px 0;
      }

      .main {
        padding:
          18px 12px 25px;
      }

      .welcome {
        margin-bottom: 21px;
      }

      .welcome h2 {
        font-size: 21px;
      }

      .welcome p {
        font-size: 13px;
      }

      /*
        สำคัญ:
        Mobile = 3 columns
      */

      .menu-grid {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
        gap: 9px;
      }

      .menu-card {
        min-height: 110px;
        padding: 11px;
        border-radius: 13px;
      }

      .menu-icon {
        width: 32px;
        height: 32px;
        flex-basis: 32px;
        border-radius: 9px;
        font-size: 14px;
      }

      .menu-name {
        font-size: 12px;
        line-height: 1.35;
      }

      .menu-action {
        font-size: 10px;
        margin-top: 4px;
      }

      .menu-status {
        font-size: 9px;
      }

      .menu-group {
        margin-bottom: 23px;
      }

      .menu-group-title {
        font-size: 16px;
      }

      .menu-group-line {
        height: 20px;
        width: 4px;
        flex-basis: 4px;
      }
    }

    @media (max-width: 380px) {

      .menu-grid {
        gap: 7px;
      }

      .menu-card {
        min-height: 100px;
        padding: 9px;
      }

      .menu-icon {
        width: 29px;
        height: 29px;
        flex-basis: 29px;
        font-size: 12px;
      }

      .menu-name {
        font-size: 11px;
      }

      .menu-action {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <!-- =======================================================
       LOGIN PAGE
       ======================================================= -->

  <section
    id="loginPage"
    class="login-page"
  >

    <div class="login-card">

      <div class="logo-box">
        P
      </div>

      <h1>
        Portal
      </h1>

      <p>
        ระบบศูนย์กลางสำหรับเข้าสู่ระบบสารสนเทศ
      </p>

      <button
        id="loginBtn"
        class="login-btn"
        type="button"
        onclick="loginWithLine()"
      >
        เข้าสู่ระบบด้วย LINE
      </button>

    </div>

  </section>


  <!-- =======================================================
       APPLICATION
       ======================================================= -->

  <section
    id="app"
    class="app hidden"
  >

    <!-- TOP BAR -->

    <header class="topbar">

      <div class="topbar-inner">

        <div class="brand">

          <div class="brand-icon">
            P
          </div>

          <div class="brand-text">

            <div class="brand-title">
              Portal
            </div>

            <div class="brand-subtitle">
              Central Information Portal
            </div>

          </div>

        </div>


        <div class="user-area">

          <div class="user-info">

            <div
              id="userName"
              class="user-name"
            >
              -
            </div>

            <div
              id="userRole"
              class="user-role"
            >
              -
            </div>

          </div>


          <button
            class="logout-btn"
            type="button"
            onclick="logout()"
          >
            ออกจากระบบ
          </button>

        </div>

      </div>

    </header>


    <!-- SESSION -->

    <div class="session-wrapper">

      <div class="session-bar">

        <div class="session-status">

          <span class="session-dot"></span>

          <span>
            Session
          </span>

          <span
            id="sessionStatus"
            class="session-time"
          >
            Active
          </span>

        </div>


        <div>
          <span>
            ตรวจสอบล่าสุด:
          </span>

          <span
            id="lastCheck"
            class="session-time"
          >
            -
          </span>
        </div>

      </div>

    </div>


    <!-- MAIN -->

    <main class="main">

      <div class="welcome">

        <h2>
          ระบบสารสนเทศ
        </h2>

        <p>
          กรุณาเลือกระบบที่คุณมีสิทธิ์เข้าถึง
        </p>

      </div>


      <div id="menuContainer">

        <!-- JS render menu -->

      </div>

    </main>

  </section>


  <!-- =======================================================
       LOADING
       ======================================================= -->

  <div
    id="loadingOverlay"
    class="loading-overlay hidden"
  >

    <div class="loading-box">

      <div class="spinner"></div>

      <div
        id="loadingText"
        class="loading-text"
      >
        กำลังดำเนินการ...
      </div>

    </div>

  </div>


  <!-- =======================================================
       ALERT
       ======================================================= -->

  <div
    id="alertBox"
    class="alert hidden"
  ></div>


  <script>

    /* =========================================================
       CONFIG
       ========================================================= */

    const LIFF_ID =
      "2011487100-dldPQItq";

    const CENTRAL_API_URL =
      "https://script.google.com/macros/s/AKfycbwphhIdSMHpTWHuFrRFTC3lEZe-QQCaZr2cebxb22C0e9ph1eYPscyrxdw29T44DaUT9/exec";


    const SESSION_STORAGE_KEY =
      "portalSessionId";

    const SESSION_MINUTES =
      60;

    const KEEP_ALIVE_MINUTES =
      10;


    /* =========================================================
       GLOBAL STATE
       ========================================================= */

    let currentSessionId =
      sessionStorage.getItem(
        SESSION_STORAGE_KEY
      );

    let currentUser =
      null;

    let liffInitialized =
      false;

    let keepAliveTimer =
      null;

    let inactivityTimer =
      null;

    let sessionCountdownTimer =
      null;

    let lastActivity =
      Date.now();

    let sessionExpireAt =
      0;


    /* =========================================================
       DOM
       ========================================================= */

    const loginPage =
      document.getElementById(
        "loginPage"
      );

    const app =
      document.getElementById(
        "app"
      );

    const loginBtn =
      document.getElementById(
        "loginBtn"
      );

    const loadingOverlay =
      document.getElementById(
        "loadingOverlay"
      );

    const loadingText =
      document.getElementById(
        "loadingText"
      );

    const alertBox =
      document.getElementById(
        "alertBox"
      );

    const userName =
      document.getElementById(
        "userName"
      );

    const userRole =
      document.getElementById(
        "userRole"
      );

    const menuContainer =
      document.getElementById(
        "menuContainer"
      );

    const sessionStatus =
      document.getElementById(
        "sessionStatus"
      );

    const lastCheck =
      document.getElementById(
        "lastCheck"
      );


    /* =========================================================
       INIT
       ========================================================= */

    document.addEventListener(
      "DOMContentLoaded",
      init
    );


    async function init() {

      try {

        showLoading(
          "กำลังเตรียมระบบ..."
        );

        await initLiff();

        if (currentSessionId) {

          const valid =
            await validateSession();

          if (valid) {

            await loadMenu();

            showApp();

            startSessionManager();

            hideLoading();

            return;
          }

        }

        hideLoading();

        showLogin();

      } catch (err) {

        console.error(
          "init error:",
          err
        );

        hideLoading();

        showLogin();

        showAlert(
          err.message ||
          "ไม่สามารถเริ่มต้นระบบได้"
        );

      }

    }


    /* =========================================================
       LIFF
       ========================================================= */

    async function initLiff() {

      if (liffInitialized) {
        return;
      }

      console.log(
        "LIFF_ID:",
        LIFF_ID
      );

      await liff.init({
        liffId: LIFF_ID
      });

      liffInitialized =
        true;

      console.log(
        "LIFF initialized"
      );

    }


    /* =========================================================
       LOGIN
       ========================================================= */

    async function loginWithLine() {

      try {

        if (!liffInitialized) {
          await initLiff();
        }

        if (!liff.isLoggedIn()) {

          liff.login();

          return;
        }

        showLoading(
          "กำลังตรวจสอบบัญชี..."
        );

        const profile =
          await liff.getProfile();

        console.log(
          "LINE profile:",
          profile
        );

        const result =
          await portalRequest({
            action: "checkUser",
            userId: profile.userId,
            profile: profile
          });

        console.log(
          "checkUser result:",
          result
        );

        if (
          !result ||
          result.status !== "success"
        ) {

          hideLoading();

          showAlert(
            result?.message ||
            "ไม่สามารถตรวจสอบผู้ใช้งานได้"
          );

          return;
        }


        /* -----------------------------------------------------
           ถ้า User มีอยู่แล้ว
           ----------------------------------------------------- */

        if (
          result.user &&
          result.user.registered
        ) {

          currentUser =
            result.user;

          await createPortalSession(
            profile
          );

          return;
        }


        /* -----------------------------------------------------
           User ยังไม่ลงทะเบียน
           ----------------------------------------------------- */

        hideLoading();

        await registerUser(
          profile
        );

      } catch (err) {

        console.error(
          "login error:",
          err
        );

        hideLoading();

        showAlert(
          err.message ||
          "เข้าสู่ระบบไม่สำเร็จ"
        );

      }

    }


    /* =========================================================
       REGISTER
       ========================================================= */

    async function registerUser(
      profile
    ) {

      const phone =
        window.prompt(
          "กรุณากรอกหมายเลขโทรศัพท์เพื่อสมัครใช้งาน"
        );

      if (!phone) {
        return;
      }

      try {

        showLoading(
          "กำลังตรวจสอบหมายเลขโทรศัพท์..."
        );

        const result =
          await portalRequest({
            action: "verifyPhone",
            userId: profile.userId,
            profile: profile,
            phone: String(phone).trim()
          });

        console.log(
          "verifyPhone result:",
          result
        );

        if (
          !result ||
          result.status !== "success"
        ) {

          hideLoading();

          showAlert(
            result?.message ||
            "ไม่สามารถตรวจสอบหมายเลขโทรศัพท์ได้"
          );

          return;
        }


        currentUser =
          result.user ||
          result.data ||
          null;


        await createPortalSession(
          profile
        );

      } catch (err) {

        console.error(
          "register error:",
          err
        );

        hideLoading();

        showAlert(
          err.message ||
          "ลงทะเบียนไม่สำเร็จ"
        );

      }

    }


    /* =========================================================
       CREATE SESSION
       ========================================================= */

    async function createPortalSession(
      profile
    ) {

      /*
        หมายเหตุ:
        Session จริงถูกสร้างโดย Portal API
        ไม่สร้าง session ฝั่ง browser เอง
      */

      const result =
        await portalRequest({
          action: "login",
          userId: profile.userId,
          profile: profile
        });

      console.log(
        "login result:",
        result
      );

      if (
        !result ||
        result.status !== "success"
      ) {

        hideLoading();

        showAlert(
          result?.message ||
          "ไม่สามารถสร้าง Session ได้"
        );

        return;
      }


      currentSessionId =
        result.sessionId ||
        result.session?.sessionId ||
        result.token;


      if (!currentSessionId) {

        hideLoading();

        showAlert(
          "Portal ไม่ได้ส่ง Session ID กลับมา"
        );

        return;
      }


      sessionStorage.setItem(
        SESSION_STORAGE_KEY,
        currentSessionId
      );


      if (result.session) {

        currentUser =
          result.session;

      } else if (result.user) {

        currentUser =
          result.user;

      }


      await loadMenu();

      showApp();

      startSessionManager();

      hideLoading();

    }


    /* =========================================================
       PORTAL REQUEST
       ========================================================= */

    async function portalRequest(
      payload
    ) {

      console.log(
        "Portal Request:",
        payload
      );

      let response;

      try {

        response =
          await fetch(
            CENTRAL_API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body:
                JSON.stringify(payload),

              redirect:
                "follow"
            }
          );

      } catch (err) {

        console.error(
          "Fetch error:",
          err
        );

        throw new Error(
          "Failed to fetch"
        );
      }


      const text =
        await response.text();

      console.log(
        "Portal Response:",
        text
      );


      if (!response.ok) {

        throw new Error(
          "Portal API HTTP " +
          response.status
        );

      }


      if (!text) {

        throw new Error(
          "Portal API returned empty response"
        );

      }


      let result;

      try {

        result =
          JSON.parse(text);

      } catch (err) {

        console.error(
          "JSON parse error:",
          text
        );

        throw new Error(
          "Portal API returned invalid JSON"
        );

      }


      return result;

    }


    /* =========================================================
       VALIDATE SESSION
       ========================================================= */

    async function validateSession() {

      if (!currentSessionId) {
        return false;
      }

      try {

        const result =
          await portalRequest({
            action: "verifySession",
            sessionId:
              currentSessionId
          });


        if (
          !result ||
          result.status !== "success"
        ) {

          handleSessionExpired();

          return false;
        }


        if (result.session) {

          currentUser =
            result.session;

        }


        updateSessionTime();

        return true;

      } catch (err) {

        console.error(
          "validateSession error:",
          err
        );

        /*
          สำคัญ:
          ไม่ logout ทันทีเมื่อ network error
          เพราะผู้ใช้อาจ refresh หรือ network สะดุด
        */

        return false;
      }

    }


    /* =========================================================
       LOAD MENU
       ========================================================= */

    async function loadMenu() {

      if (!currentSessionId) {

        throw new Error(
          "Session required"
        );

      }


      const result =
        await portalRequest({
          action: "getMenu",
          sessionId:
            currentSessionId
        });


      console.log(
        "getMenu result:",
        result
      );


      if (
        !result ||
        result.status !== "success"
      ) {

        throw new Error(
          result?.message ||
          "ไม่สามารถโหลดเมนูได้"
        );

      }


      const menus =
        Array.isArray(result.menus)
          ? result.menus
          : [];


      renderDashboard(
        menus
      );

    }


    /* =========================================================
       RENDER DASHBOARD
       ========================================================= */

    function renderDashboard(
      menus
    ) {

      menuContainer.innerHTML =
        "";


      /*
        แสดงเฉพาะเมนูที่ canRead = true

        แต่!!!

        ไม่ filter menuUrl

        เพราะ menuUrl ว่างไม่ได้หมายความว่า
        user ไม่มีสิทธิ์

        จากข้อมูลปัจจุบัน:
        readableMenus = 6
        menusWithoutUrl = 3

        ดังนั้นต้องแสดงครบทั้ง 6
      */

      const readableMenus =
        menus.filter(
          menu =>
            menu.canRead === true ||
            menu.canRead === 1 ||
            String(menu.canRead).toLowerCase() === "true"
        );


      if (
        readableMenus.length === 0
      ) {

        menuContainer.innerHTML = `
          <div class="empty-state">

            <div class="empty-icon">
              🔒
            </div>

            <div class="empty-title">
              ไม่มีเมนูที่สามารถเข้าถึงได้
            </div>

            <div class="empty-text">
              กรุณาติดต่อผู้ดูแลระบบ
            </div>

          </div>
        `;

        return;
      }


      /*
        Group ตาม group
      */

      const groups =
        {};


      readableMenus.forEach(
        menu => {

          const group =
            Number.isFinite(
              Number(menu.group)
            )
              ? Number(menu.group)
              : 999999;


          if (!groups[group]) {

            groups[group] =
              {
                group,
                menuGroup:
                  menu.menuGroup ||
                  "เมนูระบบ",
                menus: []
              };

          }


          groups[group]
            .menus
            .push(menu);

        }
      );


      /*
        เรียง group จากน้อย -> มาก
      */

      const sortedGroups =
        Object.values(groups)
          .sort(
            (a, b) =>
              a.group - b.group
          );


      /*
        Render
      */

      sortedGroups.forEach(
        group => {

          const section =
            document.createElement(
              "section"
            );

          section.className =
            "menu-group";


          const header =
            document.createElement(
              "div"
            );

          header.className =
            "menu-group-header";


          const line =
            document.createElement(
              "div"
            );

          line.className =
            "menu-group-line";


          const title =
            document.createElement(
              "h3"
            );

          title.className =
            "menu-group-title";

          /*
            ไม่แสดงเลข group
            แสดง menuGroup เท่านั้น
          */

          title.textContent =
            group.menuGroup;


          header.appendChild(
            line
          );

          header.appendChild(
            title
          );


          const grid =
            document.createElement(
              "div"
            );

          grid.className =
            "menu-grid";


          /*
            เรียง menu ภายใน group
            โดยไม่เปลี่ยน permission
          */

          group.menus.sort(
            (a, b) => {

              const nameA =
                String(
                  a.menuName || ""
                );

              const nameB =
                String(
                  b.menuName || ""
                );

              return nameA.localeCompare(
                nameB,
                "th"
              );

            }
          );


          group.menus.forEach(
            menu => {

              grid.appendChild(
                createMenuCard(
                  menu
                )
              );

            }
          );


          section.appendChild(
            header
          );

          section.appendChild(
            grid
          );

          menuContainer.appendChild(
            section
          );

        }
      );

    }


    /* =========================================================
       CREATE MENU CARD
       ========================================================= */

    function createMenuCard(
      menu
    ) {

      const card =
        document.createElement(
          "div"
        );


      const url =
        sanitizeUrl(
          menu.menuUrl
        );


      /*
        menuUrl ว่าง:
        แสดงเมนูได้ แต่กดเข้าไม่ได้
      */

      if (!url) {

        card.className =
          "menu-card disabled";

      } else {

        card.className =
          "menu-card";

        card.onclick =
          () => openMenu(menu);

      }


      const top =
        document.createElement(
          "div"
        );

      top.className =
        "menu-card-top";


      const icon =
        document.createElement(
          "div"
        );

      icon.className =
        "menu-icon";

      icon.textContent =
        getMenuIcon(
          menu.menuName
        );


      const status =
        document.createElement(
          "div"
        );

      status.className =
        "menu-status";


      if (url) {

        status.textContent =
          "พร้อมใช้งาน";

      } else {

        status.textContent =
          "ยังไม่กำหนด URL";

      }


      top.appendChild(
        icon
      );

      top.appendChild(
        status
      );


      const bottom =
        document.createElement(
          "div"
        );

      bottom.className =
        "menu-card-bottom";


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "menu-name";

      /*
        แสดงเฉพาะ menuName
        ไม่แสดง menuId
      */

      name.textContent =
        menu.menuName ||
        "ไม่ระบุชื่อเมนู";


      const action =
        document.createElement(
          "div"
        );

      action.className =
        "menu-action";


      if (url) {

        action.textContent =
          "เข้าสู่ระบบ →";

      } else {

        action.textContent =
          "รอการกำหนดระบบ";

      }


      bottom.appendChild(
        name
      );

      bottom.appendChild(
        action
      );


      card.appendChild(
        top
      );

      card.appendChild(
        bottom
      );


      return card;

    }


    /* =========================================================
       MENU ICON
       ========================================================= */

    function getMenuIcon(
      menuName
    ) {

      const name =
        String(
          menuName || ""
        );


      if (
        /ผู้ใช้|บุคลากร|employee/i
          .test(name)
      ) {
        return "👤";
      }


      if (
        /รายงาน|report/i
          .test(name)
      ) {
        return "📊";
      }


      if (
        /ตั้งค่า|config|setting/i
          .test(name)
      ) {
        return "⚙";
      }


      if (
        /สิทธิ์|permission|role/i
          .test(name)
      ) {
        return "🔐";
      }


      if (
        /ระบบ|system/i
          .test(name)
      ) {
        return "🖥";
      }


      if (
        /ข้อมูล|data/i
          .test(name)
      ) {
        return "📁";
      }


      return "▦";

    }


    /* =========================================================
       SANITIZE URL
       ========================================================= */

    function sanitizeUrl(
      value
    ) {

      if (!value) {
        return "";
      }


      try {

        const url =
          new URL(
            String(value).trim()
          );


        if (
          url.protocol !== "http:" &&
          url.protocol !== "https:"
        ) {

          return "";

        }


        return url.href;

      } catch (err) {

        return "";

      }

    }


    /* =========================================================
       OPEN MENU - SECURE LAUNCH
       ========================================================= */

    async function openMenu(
      menu
    ) {

      if (!menu) {
        return;
      }


      const targetUrl =
        sanitizeUrl(
          menu.menuUrl
        );


      /*
        ป้องกันกรณีไม่มี URL
      */

      if (!targetUrl) {

        showAlert(
          "เมนูนี้ยังไม่ได้กำหนด URL"
        );

        return;
      }


      /*
        ต้องมี Session
      */

      if (!currentSessionId) {

        showAlert(
          "Session หมดอายุ กรุณาเข้าสู่ระบบใหม่"
        );

        handleSessionExpired();

        return;
      }


      /*
        ป้องกัน double click
      */

      if (
        cardOpening
      ) {
        return;
      }


      cardOpening =
        true;


      try {

        showLoading(
          "กำลังตรวจสอบสิทธิ์..."
        );


        /*
          1. ขอ Launch Token จาก Portal

          Browser ส่งแค่ sessionId
          และ menuId

          ไม่ส่ง role
          ไม่ส่ง empId
        */

        const result =
          await portalRequest({
            action: "launch",
            sessionId:
              currentSessionId,
            menuId:
              String(
                menu.menuId || ""
              )
          });


        console.log(
          "launch result:",
          result
        );


        if (
          !result ||
          result.status !== "success"
        ) {

          throw new Error(
            result?.message ||
            "ไม่สามารถสร้าง Launch Token ได้"
          );

        }


        const launchToken =
          result.launchToken;


        if (!launchToken) {

          throw new Error(
            "Portal ไม่ได้ส่ง Launch Token"
          );

        }


        /*
          2. ส่ง POST ไป Destination

          ไม่ส่ง uid
          ไม่ส่ง role
          ไม่ส่ง empId

          ส่งเฉพาะ:
            launchToken
            menuId
        */

        submitLaunchPost(
          targetUrl,
          launchToken,
          String(
            menu.menuId || ""
          )
        );


        hideLoading();

      } catch (err) {

        console.error(
          "openMenu error:",
          err
        );

        hideLoading();

        showAlert(
          err.message ||
          "ไม่สามารถเปิดระบบได้"
        );

      } finally {

        setTimeout(
          () => {
            cardOpening =
              false;
          },
          800
        );

      }

    }


    let cardOpening =
      false;


    /* =========================================================
       SUBMIT POST TO DESTINATION
       ========================================================= */

    function submitLaunchPost(
      targetUrl,
      launchToken,
      menuId
    ) {

      /*
        เปิดหน้าต่างก่อน submit
        เพื่อไม่ให้ browser block popup
      */

      const targetName =
        "portalTarget_" +
        Date.now();


      const targetWindow =
        window.open(
          "about:blank",
          targetName
        );


      if (!targetWindow) {

        throw new Error(
          "Browser ปิดกั้น Popup กรุณาอนุญาต Popup สำหรับ Portal"
        );

      }


      /*
        สร้าง form POST
      */

      const form =
        document.createElement(
          "form"
        );


      form.method =
        "POST";

      form.action =
        targetUrl;

      form.target =
        targetName;

      form.style.display =
        "none";


      /*
        launchToken
      */

      const tokenInput =
        document.createElement(
          "input"
        );

      tokenInput.type =
        "hidden";

      tokenInput.name =
        "launchToken";

      tokenInput.value =
        launchToken;


      /*
        menuId
      */

      const menuInput =
        document.createElement(
          "input"
        );

      menuInput.type =
        "hidden";

      menuInput.name =
        "menuId";

      menuInput.value =
        menuId;


      form.appendChild(
        tokenInput
      );

      form.appendChild(
        menuInput
      );


      document.body.appendChild(
        form
      );


      form.submit();


      /*
        ลบ form หลัง submit
      */

      setTimeout(
        () => {

          try {

            form.remove();

          } catch (err) {}

        },
        1000
      );

    }


    /* =========================================================
       SESSION MANAGER
       ========================================================= */

    function startSessionManager() {

      stopSessionManager();


      lastActivity =
        Date.now();


      sessionExpireAt =
        Date.now() +
        SESSION_MINUTES *
        60 *
        1000;


      updateSessionTime();


      /*
        Keep Alive ทุก 10 นาที
      */

      keepAliveTimer =
        setInterval(
          async () => {

            await keepAlive();

          },
          KEEP_ALIVE_MINUTES *
          60 *
          1000
        );


      /*
        ตรวจ inactivity
        ทุก 30 วินาที
      */

      inactivityTimer =
        setInterval(
          () => {

            checkInactivity();

          },
          30 * 1000
        );


      /*
        Session countdown
      */

      sessionCountdownTimer =
        setInterval(
          () => {

            updateSessionTime();

          },
          1000
        );


      /*
        Activity events
      */

      [
        "click",
        "mousemove",
        "keydown",
        "scroll",
        "touchstart"
      ].forEach(
        eventName => {

          document.addEventListener(
            eventName,
            registerActivity,
            {
              passive: true
            }
          );

        }
      );

    }


    function stopSessionManager() {

      if (
        keepAliveTimer
      ) {

        clearInterval(
          keepAliveTimer
        );

        keepAliveTimer =
          null;

      }


      if (
        inactivityTimer
      ) {

        clearInterval(
          inactivityTimer
        );

        inactivityTimer =
          null;

      }


      if (
        sessionCountdownTimer
      ) {

        clearInterval(
          sessionCountdownTimer
        );

        sessionCountdownTimer =
          null;

      }

    }


    /* =========================================================
       ACTIVITY
       ========================================================= */

    function registerActivity() {

      lastActivity =
        Date.now();

    }


    /* =========================================================
       INACTIVITY
       ========================================================= */

    function checkInactivity() {

      const inactiveMs =
        Date.now() -
        lastActivity;


      const maxInactiveMs =
        SESSION_MINUTES *
        60 *
        1000;


      if (
        inactiveMs >=
        maxInactiveMs
      ) {

        showAlert(
          "ไม่มีการใช้งานเกินเวลาที่กำหนด"
        );

        handleSessionExpired();

      }

    }


    /* =========================================================
       KEEP ALIVE
       ========================================================= */

    async function keepAlive() {

      if (!currentSessionId) {
        return;
      }


      try {

        const result =
          await portalRequest({
            action: "keepAlive",
            sessionId:
              currentSessionId
          });


        console.log(
          "keepAlive:",
          result
        );


        if (
          result &&
          result.status ===
          "success"
        ) {

          if (
            result.session
          ) {

            currentUser =
              result.session;

          }


          lastActivity =
            Date.now();


          sessionExpireAt =
            Date.now() +
            SESSION_MINUTES *
            60 *
            1000;


          updateSessionTime();

          return;
        }


        if (
          result?.code ===
          "SESSION_EXPIRED"
        ) {

          handleSessionExpired();

        }

      } catch (err) {

        /*
          Network error:
          ไม่ logout ทันที
        */

        console.warn(
          "keepAlive failed:",
          err
        );

      }

    }


    /* =========================================================
       SESSION DISPLAY
       ========================================================= */

    function updateSessionTime() {

      if (!sessionExpireAt) {

        sessionStatus.textContent =
          "Active";

        return;
      }


      const remaining =
        Math.max(
          0,
          sessionExpireAt -
          Date.now()
        );


      const totalSeconds =
        Math.floor(
          remaining / 1000
        );


      const minutes =
        Math.floor(
          totalSeconds / 60
        );


      const seconds =
        totalSeconds % 60;


      sessionStatus.textContent =
        String(minutes)
          .padStart(2, "0") +
        ":" +
        String(seconds)
          .padStart(2, "0");


      if (
        remaining <= 0
      ) {

        handleSessionExpired();

      }

    }


    function updateSessionTimeAfterValidation() {

      sessionExpireAt =
        Date.now() +
        SESSION_MINUTES *
        60 *
        1000;

      updateSessionTime();

    }


    function updateSessionTime() {

      if (!currentSessionId) {

        sessionStatus.textContent =
          "Inactive";

        return;
      }


      if (!sessionExpireAt) {

        sessionStatus.textContent =
          "Active";

        return;
      }


      const remaining =
        Math.max(
          0,
          sessionExpireAt -
          Date.now()
        );


      const totalSeconds =
        Math.floor(
          remaining / 1000
        );


      const minutes =
        Math.floor(
          totalSeconds / 60
        );


      const seconds =
        totalSeconds % 60;


      sessionStatus.textContent =
        String(minutes)
          .padStart(2, "0") +
        ":" +
        String(seconds)
          .padStart(2, "0");


      if (
        remaining <= 0
      ) {

        handleSessionExpired();

      }

    }


    /* =========================================================
       SESSION EXPIRED
       ========================================================= */

    function handleSessionExpired() {

      stopSessionManager();


      currentSessionId =
        null;

      currentUser =
        null;

      sessionExpireAt =
        0;


      sessionStorage.removeItem(
        SESSION_STORAGE_KEY
      );


      showLogin();

    }


    /* =========================================================
       LOGOUT
       ========================================================= */

    async function logout() {

      const confirmed =
        window.confirm(
          "ต้องการออกจากระบบหรือไม่?"
        );


      if (!confirmed) {
        return;
      }


      try {

        if (currentSessionId) {

          await portalRequest({
            action: "logout",
            sessionId:
              currentSessionId
          });

        }

      } catch (err) {

        console.warn(
          "logout API error:",
          err
        );

      }


      stopSessionManager();


      currentSessionId =
        null;

      currentUser =
        null;

      sessionExpireAt =
        0;


      sessionStorage.removeItem(
        SESSION_STORAGE_KEY
      );


      /*
        ไม่เรียก liff.logout()
        เพื่อไม่ให้ LINE Login หลุดโดยไม่จำเป็น
      */

      showLogin();

    }


    /* =========================================================
       SHOW APP
       ========================================================= */

    function showApp() {

      loginPage.classList.add(
        "hidden"
      );

      app.classList.remove(
        "hidden"
      );


      if (currentUser) {

        userName.textContent =
          currentUser.name ||
          currentUser.empName ||
          currentUser.userName ||
          "-";


        userRole.textContent =
          currentUser.role ||
          currentUser.Job_Position ||
          "-";

      }


      updateLastCheck();

    }


    /* =========================================================
       SHOW LOGIN
       ========================================================= */

    function showLogin() {

      app.classList.add(
        "hidden"
      );

      loginPage.classList.remove(
        "hidden"
      );

      loginBtn.disabled =
        false;

    }


    /* =========================================================
       LAST CHECK
       ========================================================= */

    function updateLastCheck() {

      const now =
        new Date();

      lastCheck.textContent =
        now.toLocaleTimeString(
          "th-TH",
          {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
          }
        );

    }


    /* =========================================================
       LOADING
       ========================================================= */

    function showLoading(
      message
    ) {

      loadingText.textContent =
        message ||
        "กำลังดำเนินการ...";


      loadingOverlay.classList.remove(
        "hidden"
      );

    }


    function hideLoading() {

      loadingOverlay.classList.add(
        "hidden"
      );

    }


    /* =========================================================
       ALERT
       ========================================================= */

    let alertTimer =
      null;


    function showAlert(
      message
    ) {

      alertBox.textContent =
        message ||
        "เกิดข้อผิดพลาด";


      alertBox.classList.remove(
        "hidden"
      );


      if (alertTimer) {

        clearTimeout(
          alertTimer
        );

      }


      alertTimer =
        setTimeout(
          () => {

            alertBox.classList.add(
              "hidden"
            );

          },
          5000
        );

    }

  </script>

</body>
</html>
