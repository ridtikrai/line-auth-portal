<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Centralized Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- LINE Template Colors -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            linePrimary: '#0084FF',
            lineLightBg: '#F7F7F7',
            lineDarkGray: '#6C757D'
          }
        }
      }
    }
  </script>
</head>

<body class="bg-lineLightBg font-sans text-gray-800 antialiased min-h-screen flex flex-col">

  <!-- =========================================================
       HEADER
       ========================================================= -->
  <header class="bg-gradient-to-r from-linePrimary to-blue-700 text-white shadow-md sticky top-0 z-50">

    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">

      <div class="flex items-center gap-3">

        <img
          id="profile-img"
          src=""
          alt="Profile"
          class="h-10 w-10 rounded-full border-2 border-white hidden object-cover shadow-sm"
        >

        <div>
          <h1 class="text-base font-bold tracking-wide leading-tight">
            Portal System
          </h1>

          <p
            id="user-info"
            class="text-[11px] opacity-90"
          >
            กำลังตรวจสอบ...
          </p>
        </div>

      </div>

      <div class="flex flex-col items-end gap-1">

        <!-- Logout -->
        <button
          onclick="logoutApp()"
          class="text-[11px] sm:text-xs bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded border border-white/30 transition flex items-center shadow-sm font-medium"
        >
          ออกจากระบบ
        </button>

        <!-- Idle Timeout Display -->
        <div
          class="text-[9px] sm:text-[10px] opacity-90 flex items-center gap-1 mt-0.5 px-2 py-0.5 rounded bg-black/10"
        >
          <span>⏱️</span>

          <span
            id="timer-display"
            class="font-mono font-bold tracking-wider"
          >
            60:00
          </span>

        </div>

      </div>

    </div>

  </header>


  <!-- =========================================================
       MAIN
       ========================================================= -->
  <main class="max-w-4xl mx-auto p-4 flex-grow w-full">

    <!-- =======================================================
         1. LOADING SCREEN
         ======================================================= -->
    <div
      id="loading-screen"
      class="flex flex-col items-center justify-center py-20"
    >

      <div
        class="animate-spin rounded-full h-10 w-10 border-b-4 border-linePrimary mb-4"
      ></div>

      <p
        id="loading-message"
        class="text-lineDarkGray text-sm font-medium"
      >
        กำลังโหลดเมนูระบบ...
      </p>

    </div>


    <!-- =======================================================
         2. VERIFY PHONE
         ======================================================= -->
    <div
      id="register-screen"
      class="hidden max-w-md mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-6"
    >

      <h2 class="text-xl font-bold mb-2">
        ลงทะเบียนใช้งาน
      </h2>

      <p class="text-sm text-lineDarkGray mb-5">
        กรุณากรอกเบอร์โทรศัพท์เพื่อยืนยันตัวตน
      </p>

      <form
        id="phone-form"
        class="space-y-4"
      >

        <div>

          <input
            type="text"
            id="phone-input"
            maxlength="10"
            required
            autocomplete="tel"
            class="w-full p-4 border border-gray-300 rounded-lg focus:outline-none focus:border-linePrimary text-center tracking-widest text-lg"
            placeholder="08xxxxxxxx"
            oninput="this.value = this.value.replace(/[^0-9]/g, '')"
          >

        </div>

        <button
          id="verify-phone-button"
          type="submit"
          class="w-full bg-linePrimary text-white font-bold py-3.5 rounded-lg hover:bg-blue-700 transition"
        >
          ตรวจสอบข้อมูล
        </button>

      </form>

    </div>


    <!-- =======================================================
         3. COPY USER ID SCREEN
         ======================================================= -->
    <div
      id="copy-screen"
      class="hidden max-w-md mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-6 text-center"
    >

      <div class="text-4xl mb-3">
        📱
      </div>

      <h2 class="text-lg font-bold mb-2">
        ยืนยันสำเร็จ
      </h2>

      <p class="text-sm text-lineDarkGray mb-4">
        คัดลอกรหัสอ้างอิงส่งให้ Admin เพื่อบันทึกข้อมูล
      </p>

      <div
        class="bg-gray-100 p-3 rounded-lg mb-4 font-mono text-xs break-all border border-gray-200 select-all"
        id="display-userid"
      ></div>

      <button
        onclick="copyUserId()"
        class="w-full bg-green-500 text-white font-bold py-3 rounded-lg hover:bg-green-600 transition"
      >
        คัดลอกรหัสอ้างอิง
      </button>

    </div>


    <!-- =======================================================
         4. ERROR SCREEN
         ======================================================= -->
    <div
      id="error-screen"
      class="hidden max-w-md mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-8 text-center"
    >

      <div class="text-4xl mb-3 text-red-500">
        ⚠️
      </div>

      <h2
        id="error-title"
        class="text-lg font-bold mb-2"
      >
        ข้อผิดพลาด
      </h2>

      <p
        id="error-message"
        class="text-sm text-lineDarkGray mb-5"
      >
        -
      </p>

      <button
        onclick="retryLogin()"
        class="w-full bg-gray-200 text-gray-700 font-bold py-3.5 rounded-lg transition hover:bg-gray-300"
      >
        ลองเข้าสู่ระบบอีกครั้ง
      </button>

    </div>


    <!-- =======================================================
         5. DASHBOARD
         ======================================================= -->
    <div
      id="dashboard-screen"
      class="hidden pb-10"
    >

      <div
        id="menu-container"
        class="space-y-6"
      ></div>

    </div>

  </main>


  <!-- =========================================================
       JAVASCRIPT
       ========================================================= -->
  <script>

    // =========================================================
    // CONFIGURATION
    // =========================================================

    const LIFF_ID = "2011487100-dldPQItq";

    const CENTRAL_API_URL =
      "https://script.google.com/macros/s/AKfycbwphhIdSMHpTWHuFrRFTC3lEZe-QQCaZr2cebxb22cE9ph1eYPscyrxdw29T44DaUT9/exec";
      


    // =========================================================
    // SESSION CONFIGURATION
    // =========================================================

    // Server Session
    // Absolute TTL = 4 ชั่วโมง
    const SESSION_ABSOLUTE_TTL = 4 * 60 * 60;

    // Server Idle Timeout = 60 นาที
    const SESSION_IDLE_TIMEOUT = 60 * 60;

    // Frontend timer
    // ใช้สำหรับแสดงผล UX เท่านั้น
    const FRONTEND_TIMEOUT = SESSION_IDLE_TIMEOUT;

    // KeepAlive ทุก 15 นาที
    const KEEP_ALIVE_INTERVAL = 15 * 60 * 1000;


    // =========================================================
    // SESSION STORAGE KEY
    // =========================================================

    const SESSION_STORAGE_KEY = "portalSessionId";


    // =========================================================
    // GLOBAL VARIABLES
    // =========================================================

    let lineProfile = null;

    let portalSessionId = null;

    let clientInfo = {
      ip: "Unknown",
      location: "Unknown",
      device: navigator.userAgent
    };

    let timeoutLimit = FRONTEND_TIMEOUT;

    let timeRemaining = timeoutLimit;

    let timerInterval = null;

    let keepAliveInterval = null;

    let isLoggingOut = false;

    let isInitializing = false;


    // =========================================================
    // INITIALIZE APPLICATION
    // =========================================================

    async function initApp() {

      if (isInitializing) {
        return;
      }

      isInitializing = true;

      try {

        // -----------------------------------------------------
        // 1. Initialize LIFF
        // -----------------------------------------------------

        await liff.init({
          liffId: LIFF_ID
        });


        // -----------------------------------------------------
        // 2. LINE Login
        // -----------------------------------------------------

        if (!liff.isLoggedIn()) {

          liff.login();

          return;
        }


        // -----------------------------------------------------
        // 3. Get LINE Profile
        // -----------------------------------------------------

        lineProfile = await liff.getProfile();


        // -----------------------------------------------------
        // 4. Display Profile
        // -----------------------------------------------------

        if (lineProfile.pictureUrl) {

          const profileImg =
            document.getElementById("profile-img");

          profileImg.src = lineProfile.pictureUrl;

          profileImg.classList.remove("hidden");
        }


        // -----------------------------------------------------
        // 5. Try existing Session first
        //
        // Refresh browser:
        // sessionStorage still contains sessionId
        // -----------------------------------------------------

        const existingSession =
          sessionStorage.getItem(SESSION_STORAGE_KEY);


        if (existingSession) {

          portalSessionId = existingSession;

          const valid =
            await validateExistingSession();

          if (valid) {

            startActivityTracker();

            return;
          }

          // Session invalid
          clearPortalSession();
        }


        // -----------------------------------------------------
        // 6. Fetch client information
        // -----------------------------------------------------

        await fetchClientInfo();


        // -----------------------------------------------------
        // 7. Normal Login
        // -----------------------------------------------------

        await loginToPortal();


      } catch (error) {

        console.error("initApp error:", error);

        showError(
          "พบข้อผิดพลาด",
          "ไม่สามารถเชื่อมต่อระบบได้ กรุณาลองใหม่อีกครั้ง"
        );

      } finally {

        isInitializing = false;
      }
    }


    // =========================================================
    // LOGIN TO PORTAL
    // =========================================================

    async function loginToPortal() {

      showLoading("กำลังตรวจสอบสิทธิ์การใช้งาน...");


      try {

        const data = await callApi({

          action: "login",

          userId: lineProfile.userId,

          profile: lineProfile,

          clientInfo: clientInfo

        });


        // -----------------------------------------------------
        // User not registered
        // -----------------------------------------------------

        if (data.status === "not_registered") {

          document.getElementById("user-info").textContent =
            "กรุณายืนยันตัวตน";

          showScreen("register-screen");

          return;
        }


        // -----------------------------------------------------
        // Login success
        // -----------------------------------------------------

        if (data.status === "success") {

          if (!data.sessionId) {

            throw new Error(
              "Server ไม่ได้ส่ง sessionId กลับมา"
            );
          }


          // Save session
          savePortalSession(data.sessionId);


          // Save / display user data
          renderDashboard(data);


          // Start frontend timer
          startActivityTracker();


          return;
        }


        // -----------------------------------------------------
        // Error
        // -----------------------------------------------------

        showError(
          "ไม่สามารถเข้าสู่ระบบได้",
          data.message || "เกิดข้อผิดพลาดในระบบ"
        );

      } catch (error) {

        console.error("loginToPortal error:", error);

        showError(
          "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้",
          "กรุณาลองใหม่อีกครั้ง"
        );
      }
    }


    // =========================================================
    // SAVE SESSION
    // =========================================================

    function savePortalSession(sessionId) {

      if (!sessionId) {
        return;
      }

      portalSessionId = sessionId;

      sessionStorage.setItem(
        SESSION_STORAGE_KEY,
        sessionId
      );
    }


    // =========================================================
    // CLEAR SESSION
    // =========================================================

    function clearPortalSession() {

      portalSessionId = null;

      sessionStorage.removeItem(
        SESSION_STORAGE_KEY
      );
    }


    // =========================================================
    // VALIDATE EXISTING SESSION
    // =========================================================

    async function validateExistingSession() {

      if (!portalSessionId) {
        return false;
      }


      try {

        showLoading(
          "กำลังตรวจสอบ Session..."
        );


        const data = await callApi({

          action: "verifySession",

          sessionId: portalSessionId,

          menuId: "PORTAL"

        });


        if (
          data.status === "success" &&
          data.valid === true
        ) {

          // Server may return current user data
          if (data.user) {

            document.getElementById("user-info").textContent =
              `${lineProfile.displayName} | ตำแหน่ง: ${data.user.jobPosition || ""}`;
          }

          // Load menus again from server
          await reloadDashboardUsingSession();

          return true;
        }


        return false;

      } catch (error) {

        console.error(
          "validateExistingSession error:",
          error
        );

        return false;
      }
    }


    // =========================================================
    // RELOAD DASHBOARD USING SESSION
    // =========================================================

    async function reloadDashboardUsingSession() {

      showLoading(
        "กำลังโหลดเมนูระบบ..."
      );


      try {

        const data = await callApi({

          action: "getDashboard",

          sessionId: portalSessionId

        });


        if (data.status === "success") {

          renderDashboard(data);

          return;
        }


        if (data.status === "session_expired") {

          clearPortalSession();

          await loginToPortal();

          return;
        }


        if (data.status === "not_registered") {

          clearPortalSession();

          showScreen("register-screen");

          return;
        }


        showError(
          "ไม่สามารถโหลดเมนูได้",
          data.message || "เกิดข้อผิดพลาดในระบบ"
        );

      } catch (error) {

        console.error(
          "reloadDashboardUsingSession error:",
          error
        );

        showError(
          "ไม่สามารถโหลดเมนูได้",
          "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้"
        );
      }
    }


    // =========================================================
    // PHONE VERIFICATION
    // =========================================================

    document
      .getElementById("phone-form")
      .addEventListener("submit", async function(e) {

        e.preventDefault();


        const phoneInput =
          document
            .getElementById("phone-input")
            .value
            .trim();


        if (phoneInput.length !== 10) {

          alert(
            "กรุณากรอกเบอร์โทรศัพท์ 10 หลัก"
          );

          return;
        }


        const button =
          document.getElementById(
            "verify-phone-button"
          );


        button.disabled = true;

        button.textContent =
          "กำลังตรวจสอบ...";


        showLoading(
          "กำลังตรวจสอบข้อมูล..."
        );


        try {

          const data = await callApi({

            action: "verifyPhone",

            userId: lineProfile.userId,

            phone: phoneInput,

            profile: lineProfile,

            clientInfo: clientInfo

          });


          // ---------------------------------------------------
          // Verification successful
          // ---------------------------------------------------

          if (data.status === "show_userid") {

            showScreen("copy-screen");


            document
              .getElementById("display-userid")
              .textContent =
                data.lineUserId;


            return;
          }


          // ---------------------------------------------------
          // Already registered
          // ---------------------------------------------------

          if (data.status === "success") {

            if (data.sessionId) {

              savePortalSession(
                data.sessionId
              );

              renderDashboard(data);

              startActivityTracker();

              return;
            }


            // fallback
            await loginToPortal();

            return;
          }


          // ---------------------------------------------------
          // Error
          // ---------------------------------------------------

          showError(
            "ตรวจสอบไม่สำเร็จ",
            data.message ||
              "ไม่สามารถตรวจสอบข้อมูลได้"
          );

        } catch (error) {

          console.error(
            "verifyPhone error:",
            error
          );


          showError(
            "การตรวจสอบล้มเหลว",
            "โปรดลองอีกครั้ง"
          );

        } finally {

          button.disabled = false;

          button.textContent =
            "ตรวจสอบข้อมูล";
        }

      });


    // =========================================================
    // COPY LINE USER ID
    // =========================================================

    async function copyUserId() {

      try {

        await navigator.clipboard.writeText(
          lineProfile.userId
        );

        alert(
          "คัดลอกรหัสสำเร็จ นำส่ง Admin ได้เลยครับ"
        );

      } catch (error) {

        console.error(
          "copyUserId error:",
          error
        );

        alert(
          "ไม่สามารถคัดลอกอัตโนมัติได้ กรุณากดค้างเพื่อคัดลอกรหัส"
        );
      }
    }


    // =========================================================
    // RENDER DASHBOARD
    // =========================================================

    function renderDashboard(data) {

      showScreen("dashboard-screen");


      // -------------------------------------------------------
      // User information
      // -------------------------------------------------------

      const position =
        data.jobPosition || "";


      document.getElementById(
        "user-info"
      ).textContent =
        `${lineProfile.displayName} | ตำแหน่ง: ${position}`;


      // -------------------------------------------------------
      // Menu container
      // -------------------------------------------------------

      const container =
        document.getElementById(
          "menu-container"
        );


      container.innerHTML = "";


      // -------------------------------------------------------
      // No menu
      // -------------------------------------------------------

      if (
        !data.menuGroups ||
        data.menuGroups.length === 0
      ) {

        container.innerHTML = `
          <div class="bg-white p-6 rounded-lg text-lineDarkGray text-center border shadow-sm">
            คุณไม่มีสิทธิ์เข้าถึงเมนูใดๆ
          </div>
        `;

        return;
      }


      // -------------------------------------------------------
      // Render menu groups
      // -------------------------------------------------------

      data.menuGroups.forEach(group => {

        const groupSection =
          document.createElement("div");


        // -----------------------------------------------------
        // Menu cards
        // -----------------------------------------------------

        const menusHtml =
          group.menus.map(menu => {

            // IMPORTANT:
            // ไม่ใช้ href=menu.menuUrl ตรง ๆ อีกแล้ว
            //
            // เมื่อกดเมนู:
            // 1. ขอ One-Time Launch Token
            // 2. Server ตรวจ Session + RBAC
            // 3. ได้ token
            // 4. redirect ไป destination
            //
            const safeMenuName =
              escapeHtml(
                menu.menuName || ""
              );


            const menuId =
              escapeHtml(
                menu.menuId || ""
              );


            return `
              <button
                type="button"
                onclick="openMenu('${escapeJs(menuId)}')"
                class="flex flex-col items-center justify-start p-3 sm:p-4 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md hover:border-linePrimary transition active:scale-95 h-full w-full"
              >

                <div class="bg-blue-50 text-linePrimary p-2.5 sm:p-3 rounded-full mb-2 sm:mb-3">

                  <svg
                    class="w-6 h-6 sm:w-7 sm:h-7"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >

                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
                    ></path>

                  </svg>

                </div>

                <h3
                  class="text-[11px] sm:text-xs font-bold text-gray-800 text-center leading-tight line-clamp-2 w-full"
                >
                  ${safeMenuName}
                </h3>

              </button>
            `;

          }).join("");


        // -----------------------------------------------------
        // Group HTML
        // -----------------------------------------------------

        groupSection.innerHTML = `

          <h2
            class="text-[14px] font-bold text-linePrimary mb-3 tracking-wide pl-2 border-l-[3px] border-linePrimary leading-none"
          >
            ${escapeHtml(group.groupName || "")}
          </h2>

          <div
            class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3 sm:gap-4"
          >
            ${menusHtml}
          </div>

        `;


        container.appendChild(
          groupSection
        );

      });

    }


    // =========================================================
    // OPEN MENU
    // =========================================================

    async function openMenu(menuId) {

      if (!menuId) {

        alert(
          "ไม่พบ Menu ID"
        );

        return;
      }


      if (!portalSessionId) {

        alert(
          "Session หมดอายุ กรุณาเข้าสู่ระบบใหม่"
        );

        await forceLogout();

        return;
      }


      // Prevent double click
      const buttons =
        document.querySelectorAll(
          "#menu-container button"
        );


      buttons.forEach(btn => {

        btn.disabled = true;

        btn.classList.add(
          "opacity-60",
          "cursor-wait"
        );

      });


      showLoading(
        "กำลังตรวจสอบสิทธิ์และเตรียมระบบ..."
      );


      try {

        // -----------------------------------------------------
        // Ask Portal server for One-Time Launch Token
        // -----------------------------------------------------

        const data = await callApi({

          action: "createLaunchToken",

          sessionId: portalSessionId,

          menuId: menuId

        });


        // -----------------------------------------------------
        // Session expired
        // -----------------------------------------------------

        if (
          data.status === "session_expired" ||
          data.status === "invalid_session"
        ) {

          clearPortalSession();

          alert(
            "Session หมดอายุ กรุณาเข้าสู่ระบบใหม่"
          );

          await forceLogout();

          return;
        }


        // -----------------------------------------------------
        // No permission
        // -----------------------------------------------------

        if (
          data.status === "forbidden"
        ) {

          showError(
            "ไม่มีสิทธิ์ใช้งาน",
            "คุณไม่มีสิทธิ์เข้าถึงระบบนี้"
          );

          return;
        }


        // -----------------------------------------------------
        // Success
        // -----------------------------------------------------

        if (
          data.status === "success" &&
          data.token &&
          data.menuUrl
        ) {

          /*
           * Token example:
           *
           * https://dashboard.../exec?token=xxxxxxxx
           *
           * Token:
           * - short lived
           * - one time use
           * - tied to user + menuId
           */

          const launchUrl =
            buildLaunchUrl(
              data.menuUrl,
              data.token
            );


          // Navigate to destination
          window.location.href =
            launchUrl;


          return;
        }


        showError(
          "ไม่สามารถเปิดระบบได้",
          data.message ||
            "ไม่สามารถสร้าง Launch Token ได้"
        );

      } catch (error) {

        console.error(
          "openMenu error:",
          error
        );


        showError(
          "ไม่สามารถเปิดระบบได้",
          "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้"
        );

      } finally {

        buttons.forEach(btn => {

          btn.disabled = false;

          btn.classList.remove(
            "opacity-60",
            "cursor-wait"
          );

        });

      }
    }


    // =========================================================
    // BUILD LAUNCH URL
    // =========================================================

    function buildLaunchUrl(
      baseUrl,
      token
    ) {

      try {

        const url =
          new URL(
            baseUrl,
            window.location.origin
          );


        url.searchParams.set(
          "token",
          token
        );


        return url.toString();

      } catch (error) {

        // fallback
        const separator =
          baseUrl.includes("?")
            ? "&"
            : "?";


        return (
          baseUrl +
          separator +
          "token=" +
          encodeURIComponent(token)
        );
      }
    }


    // =========================================================
    // ACTIVITY TRACKER
    // =========================================================

    function startActivityTracker() {

      stopActivityTracker();


      // -------------------------------------------------------
      // Reset local timer when user interacts
      // -------------------------------------------------------

      const resetTimer = () => {

        timeRemaining =
          timeoutLimit;

        updateTimerDisplay();
      };


      [
        "mousemove",
        "keydown",
        "touchstart",
        "scroll",
        "click"
      ].forEach(evt => {

        window.addEventListener(
          evt,
          resetTimer,
          {
            passive: true
          }
        );

      });


      // -------------------------------------------------------
      // Local countdown
      // -------------------------------------------------------

      timerInterval =
        setInterval(() => {

          timeRemaining--;

          updateTimerDisplay();


          if (
            timeRemaining <= 0
          ) {

            stopActivityTracker();

            alert(
              "หมดเวลาการเชื่อมต่อ กรุณาเข้าสู่ระบบใหม่"
            );

            forceLogout();

          }

        }, 1000);


      // -------------------------------------------------------
      // KeepAlive
      // -------------------------------------------------------

      keepAliveInterval =
        setInterval(
          async () => {

            if (!portalSessionId) {
              return;
            }


            try {

              const data =
                await callApi({

                  action: "keepAlive",

                  sessionId:
                    portalSessionId

                });


              if (
                data.status === "success"
              ) {

                // Server confirmed session alive

                timeRemaining =
                  timeoutLimit;

                updateTimerDisplay();

                return;
              }


              // Session expired
              if (
                data.status ===
                  "session_expired" ||
                data.status ===
                  "invalid_session"
              ) {

                stopActivityTracker();

                clearPortalSession();

                alert(
                  "Session หมดอายุ กรุณาเข้าสู่ระบบใหม่"
                );

                forceLogout();

              }

            } catch (error) {

              console.error(
                "keepAlive error:",
                error
              );

              /*
               * Do NOT immediately logout because
               * network may temporarily fail.
               *
               * Server session remains authoritative.
               */
            }

          },
          KEEP_ALIVE_INTERVAL
        );


      updateTimerDisplay();
    }


    // =========================================================
    // STOP ACTIVITY TRACKER
    // =========================================================

    function stopActivityTracker() {

      if (timerInterval) {

        clearInterval(
          timerInterval
        );

        timerInterval = null;
      }


      if (keepAliveInterval) {

        clearInterval(
          keepAliveInterval
        );

        keepAliveInterval = null;
      }
    }


    // =========================================================
    // TIMER DISPLAY
    // =========================================================

    function updateTimerDisplay() {

      const timer =
        document.getElementById(
          "timer-display"
        );


      if (!timer) {
        return;
      }


      const safeTime =
        Math.max(
          0,
          timeRemaining
        );


      const m =
        Math.floor(
          safeTime / 60
        )
        .toString()
        .padStart(2, "0");


      const s =
        (safeTime % 60)
        .toString()
        .padStart(2, "0");


      timer.textContent =
        `${m}:${s}`;
    }


    // =========================================================
    // FETCH CLIENT INFO
    // =========================================================

    async function fetchClientInfo() {

      /*
       * This is informational only.
       *
       * Do not use IP/location as authentication
       * or authorization decision.
       */

      try {

        const res =
          await fetch(
            "https://ipapi.co/json/",
            {
              method: "GET",
              cache: "no-store"
            }
          );


        if (res.ok) {

          const data =
            await res.json();


          clientInfo.ip =
            data.ip || "Unknown";


          clientInfo.location =
            `${data.city || "Unknown"}, ${data.country_name || "Unknown"}`;
        }

      } catch (e) {

        // Optional information only.
        // Ignore failure.
      }
    }


    // =========================================================
    // GENERIC API CALL
    // =========================================================

    async function callApi(payload) {

      const response =
        await fetch(
          CENTRAL_API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:
              JSON.stringify(payload),

            cache: "no-store"
          }
        );


      if (!response.ok) {

        throw new Error(
          `HTTP ${response.status}`
        );
      }


      return await response.json();
    }


    // =========================================================
    // SHOW LOADING
    // =========================================================

    function showLoading(message) {

      const loadingMessage =
        document.getElementById(
          "loading-message"
        );


      if (loadingMessage) {

        loadingMessage.textContent =
          message ||
          "กำลังโหลด...";
      }


      showScreen(
        "loading-screen"
      );
    }


    // =========================================================
    // SHOW SCREEN
    // =========================================================

    function showScreen(id) {

      [
        "loading-screen",
        "register-screen",
        "error-screen",
        "dashboard-screen",
        "copy-screen"
      ].forEach(screenId => {

        const element =
          document.getElementById(
            screenId
          );


        if (element) {

          element.classList.add(
            "hidden"
          );
        }

      });


      const target =
        document.getElementById(id);


      if (target) {

        target.classList.remove(
          "hidden"
        );
      }
    }


    // =========================================================
    // SHOW ERROR
    // =========================================================

    function showError(
      title,
      message
    ) {

      document.getElementById(
        "error-title"
      ).textContent =
        title || "ข้อผิดพลาด";


      document.getElementById(
        "error-message"
      ).textContent =
        message ||
        "เกิดข้อผิดพลาดในระบบ";


      showScreen(
        "error-screen"
      );
    }


    // =========================================================
    // RETRY LOGIN
    // =========================================================

    async function retryLogin() {

      clearPortalSession();

      showLoading(
        "กำลังเริ่มการเข้าสู่ระบบ..."
      );


      try {

        await loginToPortal();

      } catch (error) {

        showError(
          "ไม่สามารถเข้าสู่ระบบได้",
          "กรุณาลองใหม่อีกครั้ง"
        );
      }
    }


    // =========================================================
    // LOGOUT
    // =========================================================

    async function logoutApp() {

      if (isLoggingOut) {
        return;
      }

      isLoggingOut = true;


      try {

        stopActivityTracker();


        // -----------------------------------------------------
        // Destroy server session
        // -----------------------------------------------------

        if (portalSessionId) {

          try {

            await callApi({

              action: "logout",

              sessionId:
                portalSessionId

            });

          } catch (error) {

            console.warn(
              "Server logout failed:",
              error
            );
          }
        }

      } finally {

        clearPortalSession();


        // -----------------------------------------------------
        // LINE Logout
        // -----------------------------------------------------

        try {

          if (
            typeof liff !== "undefined" &&
            liff.isLoggedIn()
          ) {

            liff.logout();
          }

        } catch (error) {

          console.warn(
            "LIFF logout failed:",
            error
          );
        }


        // -----------------------------------------------------
        // Reload
        // -----------------------------------------------------

        window.location.reload();
      }
    }


    // =========================================================
    // FORCE LOGOUT
    // =========================================================

    async function forceLogout() {

      if (isLoggingOut) {
        return;
      }


      stopActivityTracker();

      clearPortalSession();


      try {

        if (
          typeof liff !== "undefined" &&
          liff.isLoggedIn()
        ) {

          liff.logout();
        }

      } catch (error) {

        console.warn(
          "forceLogout LIFF error:",
          error
        );
      }


      window.location.reload();
    }


    // =========================================================
    // ESCAPE HTML
    // =========================================================

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }


    // =========================================================
    // ESCAPE JAVASCRIPT STRING
    // =========================================================

    function escapeJs(value) {

      return String(value ?? "")
        .replace(
          /\\/g,
          "\\\\"
        )
        .replace(
          /'/g,
          "\\'"
        )
        .replace(
          /"/g,
          '\\"'
        )
        .replace(
          /\r/g,
          "\\r"
        )
        .replace(
          /\n/g,
          "\\n"
        );
    }


    // =========================================================
    // PAGE LOAD
    // =========================================================

    window.addEventListener(
      "load",
      initApp
    );


  </script>
