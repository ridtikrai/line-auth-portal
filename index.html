<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Centralized Auth</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- กำหนดสีตาม LINE Template Design Standards -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              linePrimary: '#0084FF',
              lineLightBg: '#F7F7F7',
              lineDarkGray: '#6C757D'
            }
          }
        }
      }
    </script>
</head>
<body class="bg-lineLightBg font-sans text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Header Section -->
    <header class="bg-gradient-to-r from-linePrimary to-blue-600 text-white p-6 shadow-md">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-wide">👋 Welcome</h1>
                <p id="user-info" class="text-sm opacity-90 mt-1">กำลังโหลดข้อมูล...</p>
            </div>
            <!-- Profile Image (ดึงจาก LIFF) -->
            <img id="profile-img" src="" alt="Profile" class="h-12 w-12 rounded-full border-2 border-white hidden">
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow w-full max-w-3xl mx-auto p-4 mt-2">
        
        <!-- Loading State -->
        <div id="loading-screen" class="flex flex-col items-center justify-center py-20">
            <div class="animate-spin rounded-full h-10 w-10 border-b-4 border-linePrimary mb-4"></div>
            <p class="text-lineDarkGray font-medium">กำลังตรวจสอบสิทธิ์...</p>
        </div>

        <!-- Error State -->
        <div id="error-screen" class="hidden bg-white rounded-lg shadow-sm border p-6 text-center">
            <div class="text-4xl mb-4 text-red-500">⛔</div>
            <h2 class="text-xl font-bold text-gray-800 mb-2">ปฏิเสธการเข้าถึง</h2>
            <p id="error-message" class="text-lineDarkGray mb-6">คุณไม่มีสิทธิ์เข้าใช้งานระบบนี้</p>
        </div>

        <!-- Dashboard Menu (Grouped) -->
        <div id="dashboard-screen" class="hidden space-y-6">
            <div id="menu-container">
                <!-- ข้อมูลกลุ่มเมนูจะถูก Render ที่นี่ผ่าน JavaScript -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center p-6 text-lineDarkGray text-sm">
        <p>Centralized Authentication System</p>
        <button onclick="liff.logout(); window.location.reload();" class="mt-4 text-red-500 hover:underline">
            ออกจากระบบ
        </button>
    </footer>

    <script>
        // ==========================================
        // ตัวแปรการตั้งค่าระบบ (Configuration)
        // ==========================================
        const LIFF_ID = "2011487100-dldPQItq";
        const CENTRAL_API_URL = "https://script.google.com/macros/s/AKfycbzDpOrouurlO_Wlr5RikWVYf8gAmQcN-TTC8yIk7nKLLEvwjYRio5utMrEdxUm4m5Ia/exec"; // วาง URL Web App ของคุณที่นี่
        // นำ CURRENT_MENU_ID ออกตามคำขอ เพราะหน้านี้คือ Dashboard หลัก
        
        let lineProfile = null;

        // ==========================================
        // 1. Initialize LIFF
        // ==========================================
        async function initApp() {
            try {
                await liff.init({ liffId: LIFF_ID });
                
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    lineProfile = await liff.getProfile();
                    
                    // แสดงรูปโปรไฟล์ LINE
                    const profileImg = document.getElementById('profile-img');
                    profileImg.src = lineProfile.pictureUrl;
                    profileImg.classList.remove('hidden');
                    
                    await verifyAccess();
                }
            } catch (err) {
                showError("เกิดข้อผิดพลาดในการเชื่อมต่อระบบ LINE");
                console.error(err);
            }
        }

        // ==========================================
        // 2. ตรวจสอบสิทธิ์ (Verify Access)
        // ==========================================
        async function verifyAccess() {
            try {
                // ส่ง POST แบบ plain/text เพื่อเลี่ยง CORS preflight ฝั่ง GAS
                const response = await fetch(CENTRAL_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        action: 'verifyAccess', 
                        userId: lineProfile.userId 
                    })
                });
                
                const data = await response.json();

                if (data.status === 'success' && data.allowed) {
                    renderDashboard(data);
                } else {
                    showError(data.message || "ไม่พบข้อมูลผู้ใช้งาน หรือบัญชีถูกระงับ");
                }
            } catch (error) {
                showError("เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์");
            }
        }

        // ==========================================
        // 3. จัดการ DOM แสดงกลุ่มเมนู (LINE Template Concept)
        // ==========================================
        function renderDashboard(data) {
            showScreen('dashboard-screen');
            
            // อัปเดตข้อมูลผู้ใช้งานบน Header
            document.getElementById('user-info').textContent = `${lineProfile.displayName} | ตำแหน่ง: ${data.jobPosition}`;
            
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            if (!data.menuGroups || data.menuGroups.length === 0) {
                container.innerHTML = `<div class="bg-yellow-50 p-4 rounded text-yellow-700 text-center">คุณยังไม่ได้รับสิทธิ์ให้เข้าถึงเมนูใดๆ</div>`;
                return;
            }

            // สร้าง UI กลุ่มเมนูตาม LINE Template Design (Responsive)
            data.menuGroups.forEach(group => {
                const groupDiv = document.createElement('div');
                groupDiv.className = "mb-6";
                
                // สร้าง HTML สำหรับแต่ละเมนูในการ์ด
                const menusHtml = group.menus.map(menu => `
                    <a href="${menu.menuUrl}" class="flex items-center p-4 border-b border-gray-100 hover:bg-gray-50 transition duration-200">
                        <div class="bg-blue-50 text-linePrimary p-2 rounded-lg mr-4">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        </div>
                        <div class="flex-grow">
                            <h3 class="text-sm font-bold text-gray-800">${menu.menuName}</h3>
                        </div>
                        <div class="text-gray-300">›</div>
                    </a>
                `).join('');

                groupDiv.innerHTML = `
                    <h2 class="text-xs font-bold text-lineDarkGray uppercase mb-3 pl-2 tracking-wider">${group.groupName}</h2>
                    <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100">
                        ${menusHtml}
                    </div>
                `;
                container.appendChild(groupDiv);
            });
        }

        // ==========================================
        // 4. Utilities
        // ==========================================
        function showScreen(screenId) {
            ['loading-screen', 'error-screen', 'dashboard-screen'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }

        function showError(message) {
            document.getElementById('error-message').textContent = message;
            showScreen('error-screen');
        }

        // เริ่มแอปพลิเคชันเมื่อโหลด DOM เสร็จ
        window.onload = initApp;
    </script>
</body>
</html>
