<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portal System</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- LINE LIFF -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0084FF',
            primaryDark: '#006FE6',
            bgSoft: '#F8FAFC',
            textDark: '#1E293B',
            textMuted: '#64748B'
          }
        }
      }
    }
  </script>

  <style>

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        "Inter",
        "Noto Sans Thai",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    /* ================================
       MENU CARD
    ================================= */

    .menu-card {
      min-height: 118px;
      transition:
        transform .18s ease,
        box-shadow .18s ease,
        border-color .18s ease;
    }

    .menu-card:hover {
      transform: translateY(-2px);
    }

    .menu-card:active {
      transform: scale(.97);
    }

    /* ================================
       MOBILE
    ================================= */

    @media (max-width: 640px) {

      .menu-card {
        min-height: 105px;
      }

      .menu-name {
        font-size: 12px;
        line-height: 1.45;
      }

      .menu-icon {
        width: 38px;
        height: 38px;
      }
    }

    /* ================================
       GROUP ACCORDION
    ================================= */

    .group-content {
      overflow: hidden;
      transition:
        max-height .3s ease,
        opacity .2s ease;
    }

    .group-content.closed {
      max-height: 0 !important;
      opacity: 0;
    }

    .group-arrow {
      transition: transform .25s ease;
    }

    .group-arrow.rotate {
      transform: rotate(180deg);
    }

    /* ================================
       SCROLLBAR
    ================================= */

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 10px;
    }

  </style>

</head>


<body class="bg-bgSoft text-textDark antialiased min-h-screen">


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script>

    // =====================================================
    // CONFIG
    // =====================================================

    const LIFF_ID = "2011487100-dldPQItq";

    const CENTRAL_API_URL =
      "https://script.google.com/macros/s/AKfycbzDpOrouurlO_Wlr5RikWVYf8gAmQcN-TTC8yIk7nKLLEvwjYRio5utMrEdxUm4m5Ia/exec";


    // =====================================================
    // STATE
    // =====================================================

    let lineProfile = null;

    let clientInfo = {
      ip: "Unknown",
      location: "Unknown",
      device: navigator.userAgent
    };

    let sessionId =
      sessionStorage.getItem("portalSessionId") || null;

    const timeoutLimit = 3600;

    let timeRemaining = timeoutLimit;

    let timerInterval = null;

    let keepAliveInterval = null;


    // =====================================================
    // INIT
    // =====================================================

    async function initApp() {

      try {

        await liff.init({
          liffId: LIFF_ID
        });


        if (!liff.isLoggedIn()) {

          liff.login();

          return;

        }


        lineProfile = await liff.getProfile();


        const profileImg =
          document.getElementById("profile-img");

        const profilePlaceholder =
          document.getElementById("profile-placeholder");


        if (lineProfile.pictureUrl) {

          profileImg.src =
            lineProfile.pictureUrl;

          profileImg.classList.remove("hidden");

          profilePlaceholder.classList.add("hidden");

        }


        await fetchClientInfo();

        await loadDashboard();

        startActivityTracker();

      }

      catch (error) {

        console.error(error);

        showError(
          "พบข้อผิดพลาด",
          "ไม่สามารถเชื่อมต่อ LINE LIFF ได้"
        );

      }

    }


    // =====================================================
    // ACTIVITY TRACKER
    // =====================================================

    function startActivityTracker() {

      const resetTimer = () => {

        timeRemaining = timeoutLimit;

      };


      [
        "mousemove",
        "keydown",
        "touchstart",
        "scroll",
        "click"
      ].forEach(evt => {

        window.addEventListener(
          evt,
          resetTimer,
          { passive: true }
        );

      });


      timerInterval = setInterval(() => {

        timeRemaining--;

        const minutes =
          Math.floor(timeRemaining / 60)
            .toString()
            .padStart(2, "0");

        const seconds =
          (timeRemaining % 60)
            .toString()
            .padStart(2, "0");


        const timer =
          document.getElementById("timer-display");


        if (timer) {

          timer.textContent =
            `${minutes}:${seconds}`;

        }


        if (timeRemaining <= 0) {

          clearInterval(timerInterval);

          clearInterval(keepAliveInterval);

          alert(
            "หมดเวลาการเชื่อมต่อ กรุณาเข้าสู่ระบบใหม่"
          );

          logoutApp();

        }

      }, 1000);


      // Keep Alive ทุก 15 นาที

      keepAliveInterval = setInterval(async () => {

        if (
          sessionId &&
          timeRemaining > 300
        ) {

          try {

            const response =
              await fetch(
                CENTRAL_API_URL,
                {
                  method: "POST",
                  body: JSON.stringify({
                    action: "keepAlive",
                    sessionId: sessionId
                  })
                }
              );


            const data =
              await response.json();


            if (
              data.status === "session_expired"
            ) {

              sessionStorage.removeItem(
                "portalSessionId"
              );

              sessionId = null;

              alert(
                "Session หมดอายุ กรุณาเข้าสู่ระบบใหม่"
              );

              window.location.reload();

            }

          }

          catch (error) {

            console.warn(
              "KeepAlive error:",
              error
            );

          }

        }

      }, 15 * 60 * 1000);

    }


    // =====================================================
    // CLIENT INFO
    // =====================================================

    async function fetchClientInfo() {

      try {

        const res =
          await fetch(
            "https://ipapi.co/json/"
          );


        if (res.ok) {

          const data =
            await res.json();


          clientInfo.ip =
            data.ip || "Unknown";


          clientInfo.location =
            `${data.city || "Unknown"}, ${data.country_name || "Unknown"}`;

        }

      }

      catch (error) {

        console.warn(
          "Client info unavailable"
        );

      }

    }


    // =====================================================
    // LOAD DASHBOARD
    // =====================================================

    async function loadDashboard() {

      showScreen("loading-screen");


      try {

        const payload = {

          action: "getDashboard",

          profile: lineProfile,

          clientInfo: clientInfo

        };


        /*
         * ถ้ามี Session อยู่แล้ว
         * ไม่ต้องส่ง userId เป็นตัวหลัก
         */

        if (sessionId) {

          payload.sessionId =
            sessionId;

        }
        else {

          payload.userId =
            lineProfile.userId;

        }


        const response =
          await fetch(
            CENTRAL_API_URL,
            {
              method: "POST",
              body: JSON.stringify(payload)
            }
          );


        const data =
          await response.json();


        // ==========================================
        // SESSION EXPIRED
        // ==========================================

        if (
          data.status ===
          "session_expired"
        ) {

          sessionStorage.removeItem(
            "portalSessionId"
          );

          sessionId = null;

          showError(
            "Session หมดอายุ",
            "กรุณาเข้าสู่ระบบใหม่"
          );

          return;

        }


        // ==========================================
        // NOT REGISTERED
        // ==========================================

        if (
          data.status ===
          "not_registered"
        ) {

          showScreen(
            "register-screen"
          );

          document.getElementById(
            "user-info"
          ).textContent =
            "กรุณายืนยันตัวตน";

          return;

        }


        // ==========================================
        // SUCCESS
        // ==========================================

        if (
          data.status ===
          "success"
        ) {

          if (data.sessionId) {

            sessionId =
              data.sessionId;

            sessionStorage.setItem(
              "portalSessionId",
              sessionId
            );

          }


          renderDashboard(data);

          return;

        }


        showError(
          "ข้อผิดพลาด",
          data.message ||
          "เกิดข้อผิดพลาดในระบบ"
        );

      }

      catch (error) {

        console.error(error);

        showError(
          "พบข้อผิดพลาด",
          "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้"
        );

      }

    }


    // =====================================================
    // PHONE VERIFY
    // =====================================================

    document
      .getElementById("phone-form")
      .addEventListener(
        "submit",
        async function (e) {

          e.preventDefault();


          const phoneInput =
            document
              .getElementById("phone-input")
              .value
              .trim();


          if (
            phoneInput.length !== 10
          ) {

            alert(
              "กรุณากรอกเบอร์โทรศัพท์ 10 หลัก"
            );

            return;

          }


          showScreen(
            "loading-screen"
          );


          try {

            const response =
              await fetch(
                CENTRAL_API_URL,
                {
                  method: "POST",
                  body: JSON.stringify({

                    action: "verifyPhone",

                    userId:
                      lineProfile.userId,

                    phone:
                      phoneInput,

                    profile:
                      lineProfile,

                    clientInfo:
                      clientInfo

                  })

                }
              );


            const data =
              await response.json();


            if (
              data.status ===
              "show_userid"
            ) {

              showScreen(
                "copy-screen"
              );


              document
                .getElementById(
                  "display-userid"
                )
                .textContent =
                data.lineUserId;


            }
            else {

              showError(
                "ตรวจสอบไม่สำเร็จ",
                data.message ||
                "ไม่สามารถตรวจสอบข้อมูลได้"
              );

            }

          }

          catch (error) {

            console.error(error);

            showError(
              "การตรวจสอบล้มเหลว",
              "โปรดลองอีกครั้ง"
            );

          }

        }
      );


    // =====================================================
    // COPY USER ID
    // =====================================================

    function copyUserId() {

      navigator.clipboard
        .writeText(
          lineProfile.userId
        )
        .then(() => {

          alert(
            "คัดลอกรหัสสำเร็จ นำส่ง Admin ได้เลยครับ"
          );

        });

    }


    // =====================================================
    // RENDER DASHBOARD
    // =====================================================

    function renderDashboard(data) {

      showScreen(
        "dashboard-screen"
      );


      document.getElementById(
        "user-info"
      ).textContent =
        `${lineProfile.displayName} • ${data.jobPosition}`;


      const container =
        document.getElementById(
          "menu-container"
        );


      container.innerHTML = "";


      if (
        !data.menuGroups ||
        data.menuGroups.length === 0
      ) {

        container.innerHTML = `

          <div
            class="
              bg-white
              border border-slate-200
              rounded-2xl
              p-8
              text-center
              shadow-sm
            "
          >

            <div class="text-4xl mb-3">
              📭
            </div>

            <p
              class="
                text-sm
                font-medium
                text-slate-500
              "
            >
              คุณไม่มีสิทธิ์เข้าถึงเมนูใดๆ
            </p>

          </div>

        `;

        return;

      }


      // =================================================
      // SORT GROUP
      // =================================================

      const groups =
        [...data.menuGroups];


      groups.sort(
        (a, b) => {

          const aSort =
            Number(
              a.sortValue || 9999
            );

          const bSort =
            Number(
              b.sortValue || 9999
            );

          return aSort - bSort;

        }
      );


      // =================================================
      // RENDER GROUP
      // =================================================

      groups.forEach(
        (group, groupIndex) => {

          const groupSection =
            document.createElement(
              "section"
            );


          groupSection.className =
            "bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden";


          // ---------------------------------------------
          // GROUP HEADER
          // ---------------------------------------------

          const header =
            document.createElement(
              "button"
            );


          header.type =
            "button";


          header.className = `
            w-full
            px-4 sm:px-5
            py-4
            flex
            items-center
            justify-between
            gap-3
            text-left
            hover:bg-slate-50
            transition
          `;


          header.innerHTML = `

            <div class="flex items-center gap-3 min-w-0">

              <div
                class="
                  shrink-0
                  w-9 h-9
                  rounded-xl
                  bg-primary/10
                  text-primary
                  flex
                  items-center
                  justify-center
                "
              >

                <svg
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >

                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 6h16M4 12h16M4 18h16"
                  />

                </svg>

              </div>


              <div class="min-w-0">

                <h3
                  class="
                    font-bold
                    text-sm
                    sm:text-base
                    text-slate-800
                    truncate
                  "
                >
                  ${escapeHtml(
                    group.groupName
                  )}
                </h3>

                <p
                  class="
                    text-[11px]
                    text-slate-400
                    mt-0.5
                  "
                >
                  ${group.menus.length}
                  เมนู
                </p>

              </div>

            </div>


            <svg
              class="
                group-arrow
                w-5 h-5
                text-slate-400
                shrink-0
              "
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >

              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 9l-7 7-7-7"
              />

            </svg>

          `;


          // ---------------------------------------------
          // GROUP CONTENT
          // ---------------------------------------------

          const content =
            document.createElement(
              "div"
            );


          content.className =
            "group-content";


          const grid =
            document.createElement(
              "div"
            );


          grid.className = `
            px-3 sm:px-5
            pb-5
            grid
            grid-cols-3
            sm:grid-cols-3
            md:grid-cols-4
            lg:grid-cols-5
            xl:grid-cols-6
            gap-2.5
            sm:gap-3
          `;


          // =============================================
          // SORT MENU BY MENU ID
          // =============================================

          const menus =
            [...group.menus];


          menus.sort(
            (a, b) => {

              return Number(
                a.menuId || 999999
              ) -
              Number(
                b.menuId || 999999
              );

            }
          );


          // =============================================
          // MENU CARD
          // =============================================

          menus.forEach(
            menu => {

              const link =
                document.createElement(
                  "a"
                );


              link.href =
                menu.menuUrl || "#";


              link.className = `
                menu-card
                group
                flex
                flex-col
                items-center
                justify-center
                text-center
                p-3
                rounded-xl
                border
                border-slate-200
                bg-white
                hover:border-primary/40
                hover:shadow-md
                transition
              `;


              /*
               * IMPORTANT
               *
               * ไม่แสดง:
               * - Menu ID
               * - Code
               * - menuId
               *
               * แสดงเฉพาะ menuName
               */


              link.innerHTML = `

                <div
                  class="
                    menu-icon
                    w-10 h-10
                    rounded-xl
                    bg-primary/10
                    text-primary
                    flex
                    items-center
                    justify-center
                    mb-2.5
                    shrink-0
                    group-hover:bg-primary
                    group-hover:text-white
                    transition
                  "
                >

                  <svg
                    class="w-5 h-5"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >

                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="1.8"
                      d="M4 6.5A2.5 2.5 0 016.5 4h11A2.5 2.5 0 0120 6.5v11a2.5 2.5 0 01-2.5 2.5h-11A2.5 2.5 0 014 17.5v-11z"
                    />

                    <path
                      stroke-linecap="round"
                      stroke-width="1.8"
                      d="M8 8h8M8 12h8M8 16h5"
                    />

                  </svg>

                </div>


                <span
                  class="
                    menu-name
                    text-[11px]
                    sm:text-xs
                    font-semibold
                    text-slate-700
                    leading-[1.45]
                    line-clamp-3
                    w-full
                  "
                >
                  ${escapeHtml(
                    menu.menuName || ""
                  )}
                </span>

              `;


              grid.appendChild(
                link
              );

            }
          );


          content.appendChild(
            grid
          );


          groupSection.appendChild(
            header
          );

          groupSection.appendChild(
            content
          );


          container.appendChild(
            groupSection
          );


          // =============================================
          // ACCORDION
          // =============================================

          let opened =
            true;


          header.addEventListener(
            "click",
            () => {

              opened =
                !opened;


              const arrow =
                header.querySelector(
                  ".group-arrow"
                );


              if (opened) {

                content.classList.remove(
                  "closed"
                );

                content.style.maxHeight =
                  content.scrollHeight +
                  "px";

                arrow.classList.add(
                  "rotate"
                );

              }
              else {

                content.classList.add(
                  "closed"
                );

                content.style.maxHeight =
                  "0px";

                arrow.classList.remove(
                  "rotate"
                );

              }

            }
          );


          // เปิด Group แรก
          // และ Group อื่นเปิดด้วยในครั้งแรก

          requestAnimationFrame(
            () => {

              content.style.maxHeight =
                content.scrollHeight +
                "px";

              const arrow =
                header.querySelector(
                  ".group-arrow"
                );

              arrow.classList.add(
                "rotate"
              );

            }
          );

        }
      );

    }


    // =====================================================
    // ESCAPE HTML
    // =====================================================

    function escapeHtml(value) {

      return String(value || "")
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    // =====================================================
    // SCREEN
    // =====================================================

    function showScreen(id) {

      [
        "loading-screen",
        "register-screen",
        "error-screen",
        "dashboard-screen",
        "copy-screen"
      ].forEach(
        screen => {

          document
            .getElementById(screen)
            .classList.add("hidden");

        }
      );


      document
        .getElementById(id)
        .classList.remove("hidden");

    }


    // =====================================================
    // ERROR
    // =====================================================

    function showError(
      title,
      message
    ) {

      document.getElementById(
        "error-title"
      ).textContent =
        title;


      document.getElementById(
        "error-message"
      ).textContent =
        message;


      showScreen(
        "error-screen"
      );

    }


    // =====================================================
    // LOGOUT
    // =====================================================

    async function logoutApp() {

      try {

        if (sessionId) {

          await fetch(
            CENTRAL_API_URL,
            {
              method: "POST",
              body: JSON.stringify({

                action: "logout",

                sessionId:
                  sessionId

              })
            }
          );

        }

      }
      catch (error) {

        console.warn(
          "Logout API error:",
          error
        );

      }


      sessionStorage.removeItem(
        "portalSessionId"
      );


      sessionId = null;


      try {

        if (
          typeof liff !== "undefined" &&
          liff.isLoggedIn()
        ) {

          liff.logout();

        }

      }
      catch (error) {

        console.warn(
          "LIFF logout error:",
          error
        );

      }


      window.location.reload();

    }


    // =====================================================
    // START
    // =====================================================

    window.onload =
      initApp;

  </script>

</body>
</html>
