<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Patient Care System</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    /* =====================================================
       PATIENT CARE SYSTEM
       UI STYLE GUIDE
       ===================================================== */

    :root {

      /* Safe & Trusted Green */
      --green-900: #166534;
      --green-800: #15803D;
      --green-700: #15803D;
      --green-600: #16A34A;
      --green-500: #22C55E;

      /* Calming Sage */
      --green-100: #DCFCE7;
      --green-50: #F0FDF4;

      /* Background */
      --bg: #F7FAF8;
      --surface: #FFFFFF;

      /* Text */
      --text-primary: #1F2937;
      --text-secondary: #4B5563;
      --text-muted: #6B7280;

      /* Accent */
      --accent: #F59E0B;
      --accent-dark: #D97706;

      /* Status */
      --success: #16A34A;
      --danger: #DC2626;

      /* Border */
      --border: #E5E7EB;

      /* Shadow */
      --shadow-sm:
        0 2px 8px rgba(22, 101, 52, 0.08);

      --shadow-md:
        0 8px 24px rgba(22, 101, 52, 0.10);

      /* Radius */
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 20px;
    }


    /* =====================================================
       BASE
       ===================================================== */

    * {
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }

    body {

      margin: 0;

      background: var(--bg);

      color: var(--text-primary);

      font-family:
        "Noto Sans Thai",
        "Noto Sans",
        Inter,
        Arial,
        sans-serif;

      font-size: 17px;

      line-height: 1.6;

      -webkit-font-smoothing: antialiased;
    }


    button,
    input,
    select,
    textarea {

      font-family: inherit;
    }


    button {
      cursor: pointer;
    }


    /* =====================================================
       HEADER
       ===================================================== */

    .top-header {

      position: sticky;

      top: 0;

      z-index: 100;

      width: 100%;

      background: rgba(255, 255, 255, 0.96);

      backdrop-filter: blur(12px);

      border-bottom:
        1px solid var(--border);

      box-shadow:
        0 2px 12px rgba(22, 101, 52, 0.06);
    }


    .header-inner {

      width: min(1400px, 100%);

      min-height: 76px;

      margin: auto;

      padding:
        10px 24px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;
    }


    /* =====================================================
       USER PROFILE
       ===================================================== */

    .profile-area {

      display: flex;

      align-items: center;

      gap: 13px;

      min-width: 0;
    }


    .profile-image {

      width: 48px;

      height: 48px;

      border-radius: 50%;

      object-fit: cover;

      background: var(--green-100);

      border:
        2px solid var(--green-100);

      flex-shrink: 0;
    }


    .profile-placeholder {

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 22px;

      color: var(--green-900);

      font-weight: 700;
    }


    .profile-info {

      min-width: 0;
    }


    .profile-name {

      font-size: 17px;

      font-weight: 700;

      color: var(--text-primary);

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    .profile-role {

      font-size: 14px;

      font-weight: 500;

      color: var(--text-secondary);

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    /* =====================================================
       SESSION
       ===================================================== */

    .session-area {

      display: flex;

      align-items: center;

      gap: 10px;

      flex-shrink: 0;
    }


    .session-status {

      display: flex;

      align-items: center;

      gap: 8px;

      min-height: 42px;

      padding:
        7px 13px;

      border-radius: 999px;

      background: var(--green-50);

      border:
        1px solid var(--green-100);
    }


    .session-dot {

      width: 10px;

      height: 10px;

      border-radius: 50%;

      background: var(--success);

      box-shadow:
        0 0 0 4px rgba(22, 163, 74, 0.10);
    }


    .session-label {

      font-size: 13px;

      color: var(--text-secondary);

      line-height: 1.2;
    }


    .session-time {

      font-size: 15px;

      font-weight: 800;

      color: var(--green-900);

      font-variant-numeric: tabular-nums;
    }


    .logout-button {

      min-height: 42px;

      padding:
        8px 15px;

      border-radius: 10px;

      border:
        1px solid #FECACA;

      background: #FEF2F2;

      color: var(--danger);

      font-size: 14px;

      font-weight: 700;

      transition:
        all .2s ease;
    }


    .logout-button:hover {

      background: #FEE2E2;
    }


    /* =====================================================
       MAIN
       ===================================================== */

    .main-container {

      width: min(1400px, 100%);

      margin: auto;

      padding:
        34px 24px 60px;
    }


    /* =====================================================
       SYSTEM TITLE
       ===================================================== */

    .system-heading {

      margin-bottom: 32px;
    }


    .system-title {

      margin: 0;

      font-size: clamp(25px, 3vw, 34px);

      line-height: 1.3;

      font-weight: 800;

      letter-spacing: -0.3px;

      color: var(--green-900);
    }


    .system-description {

      margin:
        7px 0 0;

      color: var(--text-secondary);

      font-size: 16px;

      font-weight: 500;
    }


    /* =====================================================
       MENU GROUP
       ===================================================== */

    .menu-group {

      margin-bottom: 36px;
    }


    .menu-group-header {

      display: flex;

      align-items: center;

      gap: 12px;

      margin-bottom: 14px;
    }


    .menu-group-line {

      width: 5px;

      height: 28px;

      border-radius: 999px;

      background: var(--green-600);

      flex-shrink: 0;
    }


    .menu-group-title {

      margin: 0;

      font-size: 21px;

      font-weight: 800;

      color: var(--green-900);
    }


    /* =====================================================
       MENU GRID
       ===================================================== */

    .menu-grid {

      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 16px;
    }


    /* =====================================================
       MENU CARD
       ===================================================== */

    .menu-card {

      min-height: 128px;

      padding: 20px;

      display: flex;

      align-items: center;

      gap: 16px;

      background: var(--surface);

      border:
        1px solid var(--border);

      border-radius: var(--radius-md);

      box-shadow: var(--shadow-sm);

      text-decoration: none;

      color: inherit;

      transition:
        transform .18s ease,
        box-shadow .18s ease,
        border-color .18s ease;

      -webkit-tap-highlight-color:
        transparent;
    }


    .menu-card:hover {

      transform:
        translateY(-2px);

      border-color:
        rgba(22, 163, 74, 0.30);

      box-shadow:
        var(--shadow-md);
    }


    .menu-card:focus-visible {

      outline:
        3px solid rgba(22, 163, 74, 0.30);

      outline-offset: 3px;
    }


    /* =====================================================
       MENU ICON
       ===================================================== */

    .menu-icon {

      width: 52px;

      height: 52px;

      display: flex;

      align-items: center;

      justify-content: center;

      flex-shrink: 0;

      border-radius: 14px;

      background: var(--green-100);

      color: var(--green-900);

      font-size: 25px;

      font-weight: 800;
    }


    .menu-content {

      min-width: 0;

      flex: 1;
    }


    .menu-name {

      font-size: 17px;

      line-height: 1.4;

      font-weight: 800;

      color: var(--text-primary);

      overflow-wrap: anywhere;
    }


    .menu-arrow {

      flex-shrink: 0;

      color: var(--green-600);

      font-size: 21px;

      font-weight: 800;
    }


    /* =====================================================
       DISABLED MENU
       ===================================================== */

    .menu-card.disabled {

      cursor: not-allowed;

      opacity: 0.60;

      background:
        #F9FAFB;

      box-shadow: none;
    }


    .menu-card.disabled:hover {

      transform: none;

      border-color:
        var(--border);

      box-shadow: none;
    }


    .menu-card.disabled .menu-icon {

      background: #E5E7EB;

      color: #6B7280;
    }


    .menu-card.disabled .menu-arrow {

      color: #9CA3AF;
    }


    /* =====================================================
       EMPTY STATE
       ===================================================== */

    .empty-state {

      padding: 42px 20px;

      text-align: center;

      background: white;

      border:
        1px solid var(--border);

      border-radius: var(--radius-md);

      color: var(--text-secondary);
    }


    .empty-icon {

      font-size: 38px;

      margin-bottom: 8px;
    }


    .empty-title {

      font-size: 18px;

      font-weight: 800;

      color: var(--text-primary);
    }


    .empty-description {

      margin-top: 4px;

      font-size: 15px;
    }


    /* =====================================================
       LOADING
       ===================================================== */

    .loading {

      min-height: 60vh;

      display: flex;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      gap: 15px;
    }


    .loading-spinner {

      width: 42px;

      height: 42px;

      border-radius: 50%;

      border:
        4px solid var(--green-100);

      border-top-color:
        var(--green-600);

      animation:
        spin 0.8s linear infinite;
    }


    .loading-text {

      font-size: 16px;

      font-weight: 600;

      color: var(--text-secondary);
    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }
    }


    /* =====================================================
       ERROR
       ===================================================== */

    .error-box {

      max-width: 600px;

      margin: 80px auto;

      padding: 30px;

      background: white;

      border:
        1px solid #FECACA;

      border-radius: var(--radius-md);

      text-align: center;
    }


    .error-title {

      color: var(--danger);

      font-size: 21px;

      font-weight: 800;

      margin-bottom: 8px;
    }


    .error-message {

      color: var(--text-secondary);

      font-size: 16px;
    }


    .retry-button {

      margin-top: 20px;

      padding:
        11px 22px;

      border: 0;

      border-radius: 10px;

      background: var(--green-700);

      color: white;

      font-size: 16px;

      font-weight: 700;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 900px) {

      .menu-grid {

        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }

      .menu-card {

        padding: 15px;

        min-height: 115px;

        gap: 10px;

        flex-direction: column;

        align-items: flex-start;

        justify-content: center;
      }

      .menu-icon {

        width: 44px;

        height: 44px;

        font-size: 21px;
      }

      .menu-name {

        font-size: 16px;
      }

      .menu-arrow {

        display: none;
      }
    }


    @media (max-width: 600px) {

      .header-inner {

        min-height: 70px;

        padding:
          9px 14px;

        gap: 8px;
      }


      .profile-image {

        width: 43px;

        height: 43px;
      }


      .profile-name {

        font-size: 15px;
      }


      .profile-role {

        font-size: 12px;
      }


      .session-status {

        min-height: 38px;

        padding:
          5px 9px;

        gap: 6px;
      }


      .session-label {

        display: none;
      }


      .session-time {

        font-size: 13px;
      }


      .logout-button {

        width: 38px;

        height: 38px;

        padding: 0;

        font-size: 0;
      }


      .logout-button::before {

        content: "↪";

        font-size: 19px;
      }


      .main-container {

        padding:
          25px 12px 40px;
      }


      .system-heading {

        margin-bottom: 24px;
      }


      .system-title {

        font-size: 25px;
      }


      .system-description {

        font-size: 15px;
      }


      /*
       * สำคัญ:
       * Mobile แสดง 3 เมนูต่อแถว
       */

      .menu-grid {

        grid-template-columns:
          repeat(3, minmax(0, 1fr));

        gap: 8px;
      }


      .menu-card {

        min-height: 105px;

        padding: 11px 8px;

        border-radius: 12px;

        gap: 7px;
      }


      .menu-icon {

        width: 39px;

        height: 39px;

        border-radius: 11px;

        font-size: 19px;
      }


      .menu-name {

        width: 100%;

        font-size: 14px;

        line-height: 1.35;

        text-align: center;
      }


      .menu-content {

        width: 100%;
      }


      .menu-group-header {

        margin-bottom: 11px;
      }


      .menu-group-title {

        font-size: 18px;
      }


      .menu-group-line {

        width: 4px;

        height: 23px;
      }
    }


    @media (max-width: 380px) {

      .profile-role {

        display: none;
      }


      .menu-grid {

        gap: 6px;
      }


      .menu-card {

        min-height: 96px;

        padding:
          8px 5px;
      }


      .menu-icon {

        width: 35px;

        height: 35px;

        font-size: 17px;
      }


      .menu-name {

        font-size: 13px;
      }
    }

  </style>
</head>


<body>

  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="top-header">

    <div class="header-inner">

      <!-- LINE PROFILE -->

      <div class="profile-area">

        <img
          id="profileImage"
          class="profile-image"
          alt="LINE Profile"
          style="display:none;"
        >

        <div
          id="profilePlaceholder"
          class="profile-image profile-placeholder"
        >
          👤
        </div>

        <div class="profile-info">

          <div
            id="profileName"
            class="profile-name"
          >
            -
          </div>

          <div
            id="profileRole"
            class="profile-role"
          >
            -
          </div>

        </div>

      </div>


      <!-- SESSION -->

      <div class="session-area">

        <div class="session-status">

          <span class="session-dot"></span>

          <span class="session-label">
            Session
          </span>

          <span
            id="sessionTime"
            class="session-time"
          >
            60:00
          </span>

        </div>


        <button
          id="logoutButton"
          class="logout-button"
          type="button"
        >
          ออกจากระบบ
        </button>

      </div>

    </div>

  </header>


  <!-- =====================================================
       MAIN
       ===================================================== -->

  <main id="app">

    <div class="loading">

      <div class="loading-spinner"></div>

      <div class="loading-text">
        กำลังตรวจสอบสิทธิ์การใช้งาน...
      </div>

    </div>

  </main>


<script>

  /* =====================================================
     CONFIG
     ===================================================== */

  const LIFF_ID =
    "2011487100-dldPQItq";

  const CENTRAL_API_URL =
    "/api/portal";


  const SESSION_KEY =
    "portalSessionId";


  const SESSION_MINUTES =
    60;


  const KEEP_ALIVE_MINUTES =
    10;


  /* =====================================================
     STATE
     ===================================================== */

  let currentSessionId =
    sessionStorage.getItem(SESSION_KEY);

  let currentUser =
    null;

  let liffInitialized =
    false;

  let sessionTimer =
    null;

  let keepAliveTimer =
    null;

  let sessionRemaining =
    SESSION_MINUTES * 60;


  /* =====================================================
     INIT
     ===================================================== */

  document.addEventListener(
    "DOMContentLoaded",
    initApp
  );


  async function initApp() {

    try {

      console.log(
        "LIFF_ID =",
        LIFF_ID
      );


      await liff.init({
        liffId: LIFF_ID
      });


      liffInitialized =
        true;


      console.log(
        "LIFF initialized"
      );


      await loadLineProfile();


      if (currentSessionId) {

        console.log(
          "Checking saved session..."
        );


        const result =
          await verifyPortalSession(
            currentSessionId
          );


        if (
          result &&
          result.status === "success"
        ) {

          currentUser =
            result.session;


          startSessionTimer();

          startKeepAlive();

          await loadMenu();

          return;
        }


        sessionStorage.removeItem(
          SESSION_KEY
        );

        currentSessionId =
          null;
      }


      await login();

    } catch (error) {

      console.error(
        "initApp failed:",
        error
      );

      showError(
        "ไม่สามารถเข้าสู่ระบบได้",
        error.message
      );
    }
  }


  /* =====================================================
     LINE PROFILE
     ===================================================== */

  async function loadLineProfile() {

    if (!liffInitialized) {
      return;
    }


    try {

      const profile =
        await liff.getProfile();


      const image =
        document.getElementById(
          "profileImage"
        );

      const placeholder =
        document.getElementById(
          "profilePlaceholder"
        );

      const name =
        document.getElementById(
          "profileName"
        );


      if (profile.pictureUrl) {

        image.src =
          profile.pictureUrl;

        image.style.display =
          "block";

        placeholder.style.display =
          "none";
      }


      if (profile.displayName) {

        name.textContent =
          profile.displayName;
      }

    } catch (error) {

      console.warn(
        "LINE profile unavailable:",
        error
      );
    }
  }


  /* =====================================================
     LOGIN
     ===================================================== */

  async function login() {

    showLoading(
      "กำลังตรวจสอบบัญชี..."
    );


    try {

      const profile =
        await liff.getProfile();


      const result =
        await portalRequest({
          action: "checkUser",
          userId: profile.userId
        });


      if (
        result.status === "success"
      ) {

        currentSessionId =
          result.sessionId;


        sessionStorage.setItem(
          SESSION_KEY,
          currentSessionId
        );


        currentUser =
          result.user;


        updateProfile();


        startSessionTimer();

        startKeepAlive();

        await loadMenu();

        return;
      }


      if (
        result.code ===
        "NOT_REGISTERED"
      ) {

        showError(
          "ยังไม่ได้ลงทะเบียน",
          "กรุณาติดต่อผู้ดูแลระบบเพื่อลงทะเบียนใช้งาน"
        );

        return;
      }


      if (
        result.code ===
        "NOT_ACTIVE"
      ) {

        showError(
          "บัญชียังไม่ได้รับอนุญาต",
          result.message
        );

        return;
      }


      throw new Error(
        result.message ||
        "ไม่สามารถเข้าสู่ระบบได้"
      );

    } catch (error) {

      console.error(
        "login failed:",
        error
      );

      showError(
        "เข้าสู่ระบบไม่สำเร็จ",
        error.message
      );
    }
  }


  /* =====================================================
     VERIFY SESSION
     ===================================================== */

  async function verifyPortalSession(
    sessionId
  ) {

    return portalRequest({

      action:
        "verifySession",

      sessionId:
        sessionId
    });
  }


  /* =====================================================
     KEEP ALIVE
     ===================================================== */

  function startKeepAlive() {

    if (keepAliveTimer) {

      clearInterval(
        keepAliveTimer
      );
    }


    keepAliveTimer =
      setInterval(
        async () => {

          if (!currentSessionId) {
            return;
          }


          try {

            const result =
              await portalRequest({

                action:
                  "keepAlive",

                sessionId:
                  currentSessionId

              });


            if (
              result.status !==
              "success"
            ) {

              forceLogout(
                "Session หมดอายุ"
              );

              return;
            }


            sessionRemaining =
              SESSION_MINUTES * 60;

          } catch (error) {

            console.error(
              "keepAlive failed:",
              error
            );
          }

        },

        KEEP_ALIVE_MINUTES *
        60 *
        1000
      );
  }


  /* =====================================================
     SESSION TIMER
     ===================================================== */

  function startSessionTimer() {

    if (sessionTimer) {

      clearInterval(
        sessionTimer
      );
    }


    sessionRemaining =
      SESSION_MINUTES * 60;


    updateSessionTime();


    sessionTimer =
      setInterval(
        () => {

          sessionRemaining--;

          updateSessionTime();


          if (
            sessionRemaining <= 0
          ) {

            clearInterval(
              sessionTimer
            );

            forceLogout(
              "Session หมดอายุ"
            );
          }

        },

        1000
      );
  }


  function updateSessionTime() {

    const element =
      document.getElementById(
        "sessionTime"
      );


    const minutes =
      Math.floor(
        sessionRemaining / 60
      );


    const seconds =
      sessionRemaining % 60;


    element.textContent =
      String(minutes).padStart(2, "0") +
      ":" +
      String(seconds).padStart(2, "0");
  }


  /* =====================================================
     LOAD MENU
     ===================================================== */

  async function loadMenu() {

    showLoading(
      "กำลังโหลดเมนู..."
    );


    try {

      const result =
        await portalRequest({

          action:
            "getMenu",

          sessionId:
            currentSessionId

        });


      if (
        result.status !==
        "success"
      ) {

        throw new Error(
          result.message ||
          "ไม่สามารถโหลดเมนูได้"
        );
      }


      renderDashboard(
        result.menus || []
      );


      updateProfile();

    } catch (error) {

      console.error(
        "loadMenu failed:",
        error
      );


      showError(
        "ไม่สามารถโหลดเมนูได้",
        error.message
      );
    }
  }


  /* =====================================================
     RENDER DASHBOARD
     ===================================================== */

  function renderDashboard(
    menus
  ) {

    const app =
      document.getElementById(
        "app"
      );


    if (
      !Array.isArray(menus) ||
      menus.length === 0
    ) {

      app.innerHTML = `

        <div class="main-container">

          <div class="system-heading">

            <h1 class="system-title">
              ระบบศูนย์ดูแลผู้ป่วย
            </h1>

            <p class="system-description">
              Patient Care System
            </p>

          </div>

          <div class="empty-state">

            <div class="empty-icon">
              📋
            </div>

            <div class="empty-title">
              ไม่พบเมนูที่สามารถใช้งานได้
            </div>

            <div class="empty-description">
              กรุณาติดต่อผู้ดูแลระบบเพื่อตรวจสอบสิทธิ์
            </div>

          </div>

        </div>

      `;

      return;
    }


    /*
     * Group ตาม group
     */

    const groups = {};


    menus.forEach(
      menu => {

        if (
          menu.canRead !== true &&
          String(menu.canRead)
            .toLowerCase() !== "true"
        ) {
          return;
        }


        const group =
          menu.group !== undefined &&
          menu.group !== null
            ? String(menu.group)
            : "9999";


        if (!groups[group]) {

          groups[group] = [];

        }


        groups[group].push(
          menu
        );
      }
    );


    /*
     * เรียง group จากน้อย → มาก
     */

    const sortedGroups =
      Object.keys(groups)
        .sort(
          (a, b) =>
            Number(a) - Number(b)
        );


    let html = `

      <div class="main-container">

        <div class="system-heading">

          <h1 class="system-title">
            ระบบศูนย์ดูแลผู้ป่วย
          </h1>

          <p class="system-description">
            Patient Care System
          </p>

        </div>

    `;


    sortedGroups.forEach(
      group => {

        const groupMenus =
          groups[group];


        /*
         * menuGroup ใช้เป็นหัวข้อ
         * ไม่แสดงเลข group
         */

        const groupName =
          groupMenus.find(
            menu =>
              menu.menuGroup
          )?.menuGroup ||
          "เมนูระบบ";


        html += `

          <section class="menu-group">

            <div class="menu-group-header">

              <div class="menu-group-line"></div>

              <h2 class="menu-group-title">
                ${escapeHtml(groupName)}
              </h2>

            </div>

            <div class="menu-grid">

        `;


        groupMenus.forEach(
          menu => {

            const menuName =
              menu.menuName ||
              menu.menuId ||
              "เมนู";


            const url =
              sanitizeUrl(
                menu.menuUrl
              );


            /*
             * ถ้าไม่มี URL
             * ยังแสดง Menu
             * แต่กดไม่ได้
             */

            if (!url) {

              html += `

                <div
                  class="menu-card disabled"
                  aria-disabled="true"
                  title="ยังไม่ได้กำหนด URL"
                >

                  <div class="menu-icon">
                    ${getMenuIcon(menu)}
                  </div>

                  <div class="menu-content">

                    <div class="menu-name">
                      ${escapeHtml(menuName)}
                    </div>

                  </div>

                  <div class="menu-arrow">
                    —
                  </div>

                </div>

              `;

              return;
            }


            html += `

              <a
                class="menu-card"
                href="${escapeAttribute(url)}"
                target="_blank"
                rel="noopener noreferrer"
              >

                <div class="menu-icon">
                  ${getMenuIcon(menu)}
                </div>

                <div class="menu-content">

                  <div class="menu-name">
                    ${escapeHtml(menuName)}
                  </div>

                </div>

                <div class="menu-arrow">
                  ›
                </div>

              </a>

            `;
          }
        );


        html += `

            </div>

          </section>

        `;
      }
    );


    html += `

      </div>

    `;


    app.innerHTML =
      html;
  }


  /* =====================================================
     MENU ICON
     ===================================================== */

  function getMenuIcon(
    menu
  ) {

    const text =
      String(
        menu.menuName ||
        menu.menuId ||
        ""
      ).toLowerCase();


    if (
      text.includes("ผู้ป่วย") ||
      text.includes("patient")
    ) {
      return "♙";
    }


    if (
      text.includes("รายงาน") ||
      text.includes("report")
    ) {
      return "▤";
    }


    if (
      text.includes("ตั้งค่า") ||
      text.includes("setting")
    ) {
      return "⚙";
    }


    if (
      text.includes("บุคลากร") ||
      text.includes("employee")
    ) {
      return "♟";
    }


    if (
      text.includes("ผู้ใช้") ||
      text.includes("user")
    ) {
      return "●";
    }


    if (
      text.includes("อนุมัติ") ||
      text.includes("approve")
    ) {
      return "✓";
    }


    return "＋";
  }


  /* =====================================================
     PROFILE
     ===================================================== */

  function updateProfile() {

    if (!currentUser) {
      return;
    }


    const name =
      document.getElementById(
        "profileName"
      );


    const role =
      document.getElementById(
        "profileRole"
      );


    if (currentUser.name) {

      name.textContent =
        currentUser.name;
    }


    if (currentUser.role) {

      role.textContent =
        currentUser.role;
    }
  }


  /* =====================================================
     LOGOUT
     ===================================================== */

  document
    .getElementById("logoutButton")
    .addEventListener(
      "click",
      logout
    );


  async function logout() {

    const confirmed =
      confirm(
        "ต้องการออกจากระบบหรือไม่?"
      );


    if (!confirmed) {
      return;
    }


    try {

      if (currentSessionId) {

        await portalRequest({

          action:
            "logout",

          sessionId:
            currentSessionId

        });
      }

    } catch (error) {

      console.warn(
        "logout API failed:",
        error
      );

    } finally {

      sessionStorage.removeItem(
        SESSION_KEY
      );


      currentSessionId =
        null;


      currentUser =
        null;


      if (sessionTimer) {

        clearInterval(
          sessionTimer
        );
      }


      if (keepAliveTimer) {

        clearInterval(
          keepAliveTimer
        );
      }


      /*
       * ไม่เรียก liff.logout()
       * เพื่อไม่ให้ LINE Login หลุด
       */

      location.reload();
    }
  }


  /* =====================================================
     FORCE LOGOUT
     ===================================================== */

  function forceLogout(
    message
  ) {

    alert(
      message ||
      "Session หมดอายุ"
    );


    sessionStorage.removeItem(
      SESSION_KEY
    );


    currentSessionId =
      null;


    location.reload();
  }


  /* =====================================================
     PORTAL REQUEST
     ===================================================== */

  async function portalRequest(
    payload
  ) {

    console.log(
      "Portal Request:",
      payload
    );


    const response =
      await fetch(
        CENTRAL_API_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify(
              payload
            )
        }
      );


    const result =
      await response.json();


    console.log(
      "Portal Response:",
      result
    );


    if (!response.ok) {

      throw new Error(
        result.message ||
        "Portal API Error"
      );
    }


    if (
      result.status === "error"
    ) {

      throw new Error(
        result.message ||
        "Portal API Error"
      );
    }


    return result;
  }


  /* =====================================================
     URL SANITIZE
     ===================================================== */

  function sanitizeUrl(
    value
  ) {

    if (!value) {
      return "";
    }


    try {

      const url =
        new URL(
          String(value),
          window.location.origin
        );


      if (
        url.protocol !==
          "http:" &&
        url.protocol !==
          "https:"
      ) {

        return "";
      }


      return url.href;

    } catch (error) {

      return "";
    }
  }


  /* =====================================================
     HTML ESCAPE
     ===================================================== */

  function escapeHtml(
    value
  ) {

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );
  }


  function escapeAttribute(
    value
  ) {

    return escapeHtml(
      value
    );
  }


  /* =====================================================
     LOADING
     ===================================================== */

  function showLoading(
    message
  ) {

    document.getElementById(
      "app"
    ).innerHTML = `

      <div class="loading">

        <div class="loading-spinner"></div>

        <div class="loading-text">
          ${escapeHtml(message)}
        </div>

      </div>

    `;
  }


  /* =====================================================
     ERROR
     ===================================================== */

  function showError(
    title,
    message
  ) {

    document.getElementById(
      "app"
    ).innerHTML = `

      <div class="main-container">

        <div class="error-box">

          <div class="error-title">
            ${escapeHtml(title)}
          </div>

          <div class="error-message">
            ${escapeHtml(message || "")}
          </div>

          <button
            class="retry-button"
            onclick="location.reload()"
          >
            ลองใหม่อีกครั้ง
          </button>

        </div>

      </div>

    `;
  }

</script>

</body>
</html>
