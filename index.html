<!DOCTYPE html>

<html lang="th">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>Portal System</title>

  <!-- Tailwind -->

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- LINE LIFF -->

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- Tailgrids / Portal Theme -->

  <script>

    tailwind.config = {

      theme: {

        extend: {

          colors: {

            linePrimary: '#16A34A',

            linePrimaryDark: '#15803D',

            lineLightBg: '#F8FAFC',

            lineDarkGray: '#64748B'

          }

        }

      }

    };

  </script>

  <style>

    body {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .menu-card {
      min-height: 112px;
    }

    @media (max-width: 640px) {

      .menu-card {
        min-height: 108px;
      }

    }

  </style>

</head>

<body
  class="bg-lineLightBg font-sans text-gray-800 antialiased min-h-screen flex flex-col"
>

  <!-- ================================================= -->

  <!-- HEADER -->

  <!-- ================================================= -->

  <header
    class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-50"
  >


<div
  class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center"
>


  <!-- User -->
  <div class="flex items-center gap-3">

    <img
      id="profile-img"
      src=""
      alt="Profile"
      class="h-10 w-10 rounded-full border-2 border-green-100 hidden object-cover shadow-sm"
    >


    <div>

      <h1
        class="text-base font-bold tracking-wide leading-tight text-gray-800"
      >
        Portal System
      </h1>

      <p
        id="user-info"
        class="text-[11px] text-gray-500"
      >
        กำลังตรวจสอบ...
      </p>

    </div>

  </div>


  <!-- Right -->
  <div class="flex flex-col items-end gap-1">


    <!-- Logout -->
    <button
      id="logout-button"
      type="button"
      onclick="logoutApp()"
      class="text-[11px] sm:text-xs bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg transition flex items-center shadow-sm font-medium"
    >
      ออกจากระบบ
    </button>


    <!-- Timer -->
    <div
      class="text-[9px] sm:text-[10px] text-gray-500 flex items-center gap-1 mt-0.5 px-2 py-0.5 rounded bg-gray-100"
    >

      <span>⏱️</span>

      <span
        id="timer-display"
        class="font-mono font-bold tracking-wider"
      >
        60:00
      </span>

    </div>

  </div>

</div>


  </header>

  <!-- ================================================= -->

  <!-- MAIN -->

  <!-- ================================================= -->

  <main
    class="max-w-4xl mx-auto p-4 flex-grow w-full"
  >


<!-- ================================================= -->
<!-- 1. LOADING -->
<!-- ================================================= -->

<div
  id="loading-screen"
  class="flex flex-col items-center justify-center py-20"
>

  <div
    class="animate-spin rounded-full h-10 w-10 border-b-4 border-green-600 mb-4"
  ></div>

  <p
    id="loading-message"
    class="text-gray-500 text-sm font-medium"
  >
    กำลังตรวจสอบสิทธิ์การใช้งาน...
  </p>

</div>



<!-- ================================================= -->
<!-- 2. REGISTER -->
<!-- ================================================= -->

<div
  id="register-screen"
  class="hidden max-w-md mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-6"
>

  <div class="text-center mb-5">

    <div
      class="mx-auto mb-3 w-14 h-14 rounded-full bg-green-50 text-green-600 flex items-center justify-center"
    >

      <svg
        class="w-7 h-7"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >

        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
        />

      </svg>

    </div>


    <h2
      class="text-xl font-bold mb-2 text-gray-800"
    >
      ลงทะเบียนใช้งาน
    </h2>


    <p
      class="text-sm text-gray-500"
    >
      ไม่พบ LINE ID นี้ในระบบ
      กรุณากรอกเบอร์โทรศัพท์เพื่อยืนยันตัวตน
    </p>

  </div>


  <form
    id="phone-form"
    class="space-y-4"
  >

    <div>

      <input
        type="text"
        id="phone-input"
        maxlength="10"
        inputmode="numeric"
        autocomplete="tel"
        required
        class="w-full p-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-100 focus:border-green-600 text-center tracking-widest text-lg"
        placeholder="08xxxxxxxx"
      >

    </div>


    <button
      id="phone-submit-button"
      type="submit"
      class="w-full bg-green-600 text-white font-bold py-3.5 rounded-lg hover:bg-green-700 transition"
    >
      ตรวจสอบข้อมูล
    </button>

  </form>

</div>



<!-- ================================================= -->
<!-- 3. COPY USER ID -->
<!-- ================================================= -->

<div
  id="copy-screen"
  class="hidden max-w-md mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-6 text-center"
>

  <div class="text-4xl mb-3">
    📱
  </div>


  <h2
    class="text-lg font-bold mb-2"
  >
    ยืนยันสำเร็จ
  </h2>


  <p
    class="text-sm text-gray-500 mb-4"
  >
    คัดลอกรหัสอ้างอิงส่งให้ Admin
    เพื่อบันทึกข้อมูล
  </p>


  <div
    class="bg-gray-100 p-3 rounded-lg mb-4 font-mono text-xs break-all border border-gray-200 select-all"
    id="display-userid"
  ></div>


  <button
    type="button"
    onclick="copyUserId()"
    class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition"
  >
    คัดลอกรหัสอ้างอิง
  </button>

</div>



<!-- ================================================= -->
<!-- 4. ERROR -->
<!-- ================================================= -->

<div
  id="error-screen"
  class="hidden max-w-md mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-8 text-center"
>

  <div
    class="text-4xl mb-3"
  >
    ⚠️
  </div>


  <h2
    id="error-title"
    class="text-lg font-bold mb-2 text-gray-800"
  >
    ข้อผิดพลาด
  </h2>


  <p
    id="error-message"
    class="text-sm text-gray-500 mb-5"
  >
    -
  </p>


  <button
    type="button"
    onclick="retryLogin()"
    class="w-full bg-green-600 text-white font-bold py-3.5 rounded-lg transition hover:bg-green-700"
  >
    ลองเข้าสู่ระบบใหม่
  </button>

</div>



<!-- ================================================= -->
<!-- 5. DASHBOARD -->
<!-- ================================================= -->

<div
  id="dashboard-screen"
  class="hidden pb-10"
>

  <div
    id="menu-container"
    class="space-y-6"
  ></div>

</div>


  </main>

  <!-- ================================================= -->

  <!-- JAVASCRIPT -->

  <!-- ================================================= -->

  <script>


    /* ==================================================
       CONFIGURATION
       ================================================== */

    const LIFF_ID =
      "2011487100-dldPQItq";


    /*
     * Portal Core URL
     *
     * ใช้ URL เดียวกับ PortalClient.gs
     */
    const CENTRAL_API_URL =
      "https://script.google.com/macros/s/AKfycbwphhIdSMHpTWHuFrRFTC3lEZe-QQCaZr2cebxb22cE9ph1eYPscyrxdw29T44DaUT9/exec";


    /*
     * Session timeout
     *
     * 60 นาที
     */
    const SESSION_TIMEOUT =
      60 * 60;


    /*
     * ส่ง KeepAlive ทุก 15 นาที
     */
    const KEEP_ALIVE_INTERVAL =
      15 * 60 * 1000;


    /*
     * Portal Session
     */
    let portalSessionId = null;


    /*
     * LINE Profile
     */
    let lineProfile = null;


    /*
     * Client Information
     */
    let clientInfo = {

      ip: "Unknown",

      location: "Unknown",

      device:
        navigator.userAgent || "Unknown"

    };


    /*
     * Timer
     */
    let timeRemaining =
      SESSION_TIMEOUT;


    let timerInterval =
      null;


    let keepAliveInterval =
      null;


    /*
     * ป้องกันเปิดเมนูซ้ำ
     */
    let launchingMenu =
      false;



    /* ==================================================
       INITIALIZE
       ================================================== */

    async function initApp() {

      try {

        showScreen("loading-screen");

        setLoadingMessage(
          "กำลังตรวจสอบ Session..."
        );


        /*
         * ----------------------------------------------
         * 1. ตรวจ Session เดิมก่อน
         * ----------------------------------------------
         */

        const savedSession =
          sessionStorage.getItem(
            "portalSessionId"
          );


        if (savedSession) {

          const valid =
            await verifyPortalSession(
              savedSession
            );


          if (valid) {

            portalSessionId =
              savedSession;


            setLoadingMessage(
              "กำลังโหลดข้อมูล..."
            );


            await loadDashboardBySession();


            startActivityTracker();

            return;

          }


          /*
           * Session หมดอายุ
           */
          sessionStorage.removeItem(
            "portalSessionId"
          );

          portalSessionId =
            null;

        }


        /*
         * ----------------------------------------------
         * 2. เริ่ม LINE Login
         * ----------------------------------------------
         */

        setLoadingMessage(
          "กำลังเชื่อมต่อ LINE..."
        );


        await liff.init({

          liffId:
            LIFF_ID

        });


        if (
          !liff.isLoggedIn()
        ) {

          liff.login();

          return;

        }


        /*
         * ----------------------------------------------
         * 3. ดึง LINE Profile
         * ----------------------------------------------
         */

        lineProfile =
          await liff.getProfile();


        showProfile();


        /*
         * ----------------------------------------------
         * 4. Client Info
         * ----------------------------------------------
         */

        await fetchClientInfo();


        /*
         * ----------------------------------------------
         * 5. ตรวจสอบสิทธิ์กับ Portal
         * ----------------------------------------------
         */

        await loadDashboard();


        startActivityTracker();


      } catch (error) {

        console.error(
          "initApp:",
          error
        );


        showError(
          "ไม่สามารถเข้าสู่ระบบ",
          error.message ||
          "ไม่สามารถเชื่อมต่อ Portal ได้"
        );

      }

    }



    /* ==================================================
       LOAD DASHBOARD BY EXISTING SESSION
       ================================================== */

    async function loadDashboardBySession() {

      try {

        /*
         * Portal Session ยัง valid
         *
         * ขอ Dashboard จาก Portal
         */
        const response =
          await postPortal({

            action:
              "verifySession",

            sessionId:
              portalSessionId,

            menuId:
              "PORTAL"

          });


        if (
          response.status !== "success"
        ) {

          throw new Error(
            response.message ||
            "Session หมดอายุ"
          );

        }


        /*
         * ถ้ามีข้อมูล Session
         */
        if (
          response.session
        ) {

          /*
           * Profile จาก Session
           */
          if (
            response.session.profile
          ) {

            lineProfile =
              response.session.profile;

            showProfile();

          }

        }


        /*
         * โหลด Dashboard ใหม่
         */
        await loadDashboardByUser();


      } catch (error) {

        console.error(
          "loadDashboardBySession:",
          error
        );


        sessionStorage.removeItem(
          "portalSessionId"
        );


        portalSessionId =
          null;


        /*
         * กลับไปตรวจ LINE
         */
        await initializeLineLogin();

      }

    }



    /* ==================================================
       INITIALIZE LINE LOGIN
       ================================================== */

    async function initializeLineLogin() {

      setLoadingMessage(
        "กำลังเชื่อมต่อ LINE..."
      );


      await liff.init({

        liffId:
          LIFF_ID

      });


      if (
        !liff.isLoggedIn()
      ) {

        liff.login();

        return;

      }


      lineProfile =
        await liff.getProfile();


      showProfile();


      await fetchClientInfo();


      await loadDashboard();


      startActivityTracker();

    }



    /* ==================================================
       LOAD DASHBOARD
       ================================================== */

    async function loadDashboard() {

      showScreen(
        "loading-screen"
      );


      setLoadingMessage(
        "กำลังตรวจสอบสิทธิ์..."
      );


      if (
        !lineProfile ||
        !lineProfile.userId
      ) {

        throw new Error(
          "ไม่พบ LINE User ID"
        );

      }


      const result =
        await postPortal({

          action:
            "getDashboard",

          userId:
            lineProfile.userId,

          profile: {

            userId:
              lineProfile.userId,

            displayName:
              lineProfile.displayName || "",

            pictureUrl:
              lineProfile.pictureUrl || "",

            statusMessage:
              lineProfile.statusMessage || "",

            language:
              lineProfile.language || ""

          },

          clientInfo:
            clientInfo

        });


      /*
       * ----------------------------------------------
       * ยังไม่ลงทะเบียน
       * ----------------------------------------------
       */

      if (
        result.status ===
        "not_registered"
      ) {

        showScreen(
          "register-screen"
        );


        document.getElementById(
          "user-info"
        ).textContent =
          "กรุณายืนยันตัวตน";


        return;

      }


      /*
       * ----------------------------------------------
       * ไม่ได้รับอนุมัติ / ไม่ Active
       * ----------------------------------------------
       */

      if (
        result.status ===
        "pending"
      ) {

        showError(
          "รอการอนุมัติ",
          result.message ||
          "บัญชีของคุณอยู่ระหว่างรอการอนุมัติจากผู้ดูแลระบบ"
        );


        return;

      }


      if (
        result.status ===
        "inactive"
      ) {

        showError(
          "ไม่สามารถใช้งานได้",
          result.message ||
          "บัญชีของคุณยังไม่ได้รับสิทธิ์ใช้งาน"
        );


        return;

      }


      /*
       * ----------------------------------------------
       * SUCCESS
       * ----------------------------------------------
       */

      if (
        result.status ===
        "success"
      ) {


        /*
         * สำคัญ:
         *
         * Portal Session ถูกสร้างจาก Portal
         */
        if (
          result.sessionId
        ) {

          portalSessionId =
            result.sessionId;


          sessionStorage.setItem(
            "portalSessionId",
            portalSessionId
          );

        }


        renderDashboard(
          result
        );


        return;

      }


      throw new Error(
        result.message ||
        "ไม่สามารถตรวจสอบสิทธิ์ได้"
      );

    }



    /* ==================================================
       LOAD DASHBOARD BY USER
       ================================================== */

    async function loadDashboardByUser() {

      if (
        !lineProfile ||
        !lineProfile.userId
      ) {

        throw new Error(
          "ไม่พบข้อมูล LINE User"
        );

      }


      const result =
        await postPortal({

          action:
            "getDashboard",

          userId:
            lineProfile.userId,

          profile:
            lineProfile,

          clientInfo:
            clientInfo

        });


      if (
        result.status ===
        "not_registered"
      ) {

        showScreen(
          "register-screen"
        );

        return;

      }


      if (
        result.status !==
        "success"
      ) {

        throw new Error(
          result.message ||
          "ไม่สามารถโหลด Dashboard ได้"
        );

      }


      /*
       * ถ้า Portal ส่ง Session ใหม่มา
       */
      if (
        result.sessionId
      ) {

        portalSessionId =
          result.sessionId;


        sessionStorage.setItem(
          "portalSessionId",
          portalSessionId
        );

      }


      renderDashboard(
        result
      );

    }



    /* ==================================================
       VERIFY PORTAL SESSION
       ================================================== */

    async function verifyPortalSession(
      sessionId
    ) {

      if (!sessionId) {

        return false;

      }


      try {

        const result =
          await postPortal({

            action:
              "verifySession",

            sessionId:
              sessionId,

            menuId:
              "PORTAL"

          });


        return (
          result &&
          result.status ===
          "success"
        );


      } catch (error) {

        console.error(
          "verifyPortalSession:",
          error
        );


        return false;

      }

    }



    /* ==================================================
       PHONE VERIFICATION
       ================================================== */

    document
      .getElementById(
        "phone-form"
      )
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();


          const phoneInput =
            document
              .getElementById(
                "phone-input"
              )
              .value
              .trim();


          if (
            !/^[0-9]{10}$/.test(
              phoneInput
            )
          ) {

            alert(
              "กรุณากรอกเบอร์โทรศัพท์ 10 หลัก"
            );

            return;

          }


          try {

            showScreen(
              "loading-screen"
            );


            setLoadingMessage(
              "กำลังตรวจสอบข้อมูล..."
            );


            const result =
              await postPortal({

                action:
                  "verifyPhone",

                userId:
                  lineProfile.userId,

                phone:
                  phoneInput,

                profile:
                  lineProfile,

                clientInfo:
                  clientInfo

              });


            /*
             * ------------------------------------------
             * พบข้อมูลพนักงาน
             * ------------------------------------------
             */

            if (
              result.status ===
              "show_userid"
            ) {

              showScreen(
                "copy-screen"
              );


              document.getElementById(
                "display-userid"
              ).textContent =
                result.lineUserId ||
                lineProfile.userId;


              return;

            }


            /*
             * บาง Backend อาจส่ง success
             * พร้อม Session กลับมา
             */
            if (
              result.status ===
              "success"
            ) {

              if (
                result.sessionId
              ) {

                portalSessionId =
                  result.sessionId;


                sessionStorage.setItem(
                  "portalSessionId",
                  portalSessionId
                );

              }


              await loadDashboardByUser();

              return;

            }


            /*
             * Pending
             */
            if (
              result.status ===
              "pending"
            ) {

              showError(
                "รอการอนุมัติ",
                result.message ||
                "ระบบบันทึกข้อมูลแล้ว กรุณารอ Admin อนุมัติ"
              );


              return;

            }


            throw new Error(
              result.message ||
              "ไม่สามารถตรวจสอบข้อมูลได้"
            );


          } catch (error) {

            console.error(
              "verifyPhone:",
              error
            );


            showError(
              "ตรวจสอบไม่สำเร็จ",
              error.message ||
              "โปรดลองอีกครั้ง"
            );

          }

        }
      );



    /* ==================================================
       COPY USER ID
       ================================================== */

    async function copyUserId() {

      const userId =
        lineProfile &&
        lineProfile.userId
          ? lineProfile.userId
          : "";


      if (!userId) {

        alert(
          "ไม่พบรหัสอ้างอิง"
        );

        return;

      }


      try {

        await navigator.clipboard.writeText(
          userId
        );


        alert(
          "คัดลอกรหัสสำเร็จ นำส่ง Admin ได้เลยครับ"
        );


      } catch (error) {

        /*
         * Fallback
         */
        const textArea =
          document.createElement(
            "textarea"
          );


        textArea.value =
          userId;


        document.body.appendChild(
          textArea
        );


        textArea.select();


        document.execCommand(
          "copy"
        );


        textArea.remove();


        alert(
          "คัดลอกรหัสสำเร็จ"
        );

      }

    }



    /* ==================================================
       RENDER DASHBOARD
       ================================================== */

    function renderDashboard(
      data
    ) {

      showScreen(
        "dashboard-screen"
      );


      /*
       * User Info
       */
      const displayName =
        lineProfile &&
        lineProfile.displayName
          ? lineProfile.displayName
          : "ผู้ใช้งาน";


      const jobPosition =
        data.jobPosition ||
        "ผู้ใช้งาน";


      document.getElementById(
        "user-info"
      ).textContent =
        `${displayName} | ตำแหน่ง: ${jobPosition}`;


      const container =
        document.getElementById(
          "menu-container"
        );


      container.innerHTML =
        "";


      /*
       * ไม่มีเมนู
       */
      if (
        !data.menuGroups ||
        !Array.isArray(
          data.menuGroups
        ) ||
        data.menuGroups.length === 0
      ) {

        container.innerHTML = `

          <div
            class="bg-white p-6 rounded-xl text-gray-500 text-center border border-gray-200 shadow-sm"
          >

            <div class="text-3xl mb-3">
              🔒
            </div>

            <div class="font-bold text-gray-700 mb-1">
              คุณไม่มีสิทธิ์เข้าถึงเมนูใดๆ
            </div>

            <div class="text-xs text-gray-400">
              กรุณาติดต่อผู้ดูแลระบบ
            </div>

          </div>

        `;


        return;

      }


      /*
       * Render Group
       */
      data.menuGroups.forEach(
        function(group) {

          const groupSection =
            document.createElement(
              "div"
            );


          /*
           * Group title
           */
          const groupTitle =
            document.createElement(
              "h2"
            );


          groupTitle.className =
            "text-[14px] font-bold text-green-700 mb-3 tracking-wide pl-2 border-l-[3px] border-green-600 leading-none";


          groupTitle.textContent =
            group.groupName ||
            group.menuGroup ||
            "เมนูระบบ";


          groupSection.appendChild(
            groupTitle
          );


          /*
           * Grid
           *
           * Mobile = 3 columns
           */
          const grid =
            document.createElement(
              "div"
            );


          grid.className =
            "grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3 sm:gap-4";


          /*
           * Menus
           */
          const menus =
            Array.isArray(
              group.menus
            )
              ? group.menus
              : [];


          menus.forEach(
            function(menu) {

              /*
               * ไม่แสดงเมนูที่ไม่มี URL
               */
              if (
                !menu ||
                !menu.menuUrl
              ) {

                return;

              }


              /*
               * Card
               */
              const card =
                document.createElement(
                  "a"
                );


              card.href =
                "#";


              card.className =
                "menu-card flex flex-col items-center justify-start p-3 sm:p-4 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md hover:border-green-500 transition active:scale-95 h-full";


              /*
               * เก็บข้อมูลไว้ใน dataset
               *
               * ไม่แสดงให้ User เห็น
               */
              card.dataset.menuId =
                String(
                  menu.menuId || ""
                );


              card.dataset.menuUrl =
                String(
                  menu.menuUrl || ""
                );


              card.dataset.menuName =
                String(
                  menu.menuName || ""
                );


              /*
               * Icon
               *
               * สีเขียว ไม่ใช่สีฟ้า
               */
              const icon =
                document.createElement(
                  "div"
                );


              icon.className =
                "bg-green-50 text-green-600 p-2.5 sm:p-3 rounded-full mb-2 sm:mb-3";


              icon.innerHTML = `

                <svg
                  class="w-6 h-6 sm:w-7 sm:h-7"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >

                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
                  />

                </svg>

              `;


              /*
               * Menu name
               */
              const title =
                document.createElement(
                  "h3"
                );


              title.className =
                "text-[11px] sm:text-xs font-bold text-gray-800 text-center leading-tight line-clamp-2 w-full";


              title.textContent =
                menu.menuName ||
                "ระบบ";


              card.appendChild(
                icon
              );


              card.appendChild(
                title
              );


              /*
               * Click
               */
              card.addEventListener(
                "click",
                function(event) {

                  openPortalMenu(
                    event,
                    card
                  );

                }
              );


              grid.appendChild(
                card
              );

            }
          );


          /*
           * ถ้า Group ไม่มีเมนูที่มี URL
           */
          if (
            grid.children.length === 0
          ) {

            return;

          }


          groupSection.appendChild(
            grid
          );


          container.appendChild(
            groupSection
          );

        }
      );


      /*
       * ถ้าสุดท้ายไม่มีเมนูเลย
       */
      if (
        container.children.length === 0
      ) {

        container.innerHTML = `

          <div
            class="bg-white p-6 rounded-xl text-gray-500 text-center border border-gray-200 shadow-sm"
          >

            <div class="text-3xl mb-3">
              🔒
            </div>

            <div class="font-bold text-gray-700">
              คุณไม่มีสิทธิ์เข้าถึงเมนูใดๆ
            </div>

          </div>

        `;

      }

    }



    /* ==================================================
       OPEN PORTAL MENU
       ================================================== */

    async function openPortalMenu(
      event,
      card
    ) {

      event.preventDefault();


      /*
       * ป้องกัน Double Click
       */
      if (
        launchingMenu
      ) {

        return;

      }


      /*
       * ต้องมี Portal Session
       */
      if (
        !portalSessionId
      ) {

        showError(
          "Session หมดอายุ",
          "กรุณาเข้าสู่ระบบใหม่"
        );


        return;

      }


      const menuId =
        card.dataset.menuId;


      const menuUrl =
        card.dataset.menuUrl;


      const menuName =
        card.dataset.menuName ||
        "ระบบปลายทาง";


      if (
        !menuId ||
        !menuUrl
      ) {

        showError(
          "ไม่สามารถเปิดระบบ",
          "เมนูนี้ยังไม่ได้กำหนดระบบปลายทาง"
        );


        return;

      }


      /*
       * ตรวจ URL ก่อน
       */
      const safeUrl =
        sanitizeUrl(
          menuUrl
        );


      if (!safeUrl) {

        showError(
          "ไม่สามารถเปิดระบบ",
          "URL ของระบบปลายทางไม่ถูกต้อง"
        );


        return;

      }


      launchingMenu =
        true;


      const originalHTML =
        card.innerHTML;


      try {

        /*
         * UI Loading
         */
        card.style.pointerEvents =
          "none";


        card.classList.add(
          "opacity-60"
        );


        card.innerHTML = `

          <div
            class="flex flex-col items-center justify-center h-full"
          >

            <div
              class="animate-spin rounded-full h-6 w-6 border-b-2 border-green-600 mb-2"
            ></div>

            <span
              class="text-[10px] text-gray-500 text-center"
            >
              กำลังตรวจสอบ...
            </span>

          </div>

        `;


        /*
         * ----------------------------------------------
         * ขอ Launch Token
         *
         * Session + menuId
         *
         * Portal เป็นผู้ตรวจ RBAC
         * ----------------------------------------------
         */

        const result =
          await postPortal({

            action:
              "launch",

            sessionId:
              portalSessionId,

            menuId:
              String(menuId)

          });


        /*
         * ----------------------------------------------
         * Launch ไม่สำเร็จ
         * ----------------------------------------------
         */

        if (
          !result ||
          result.status !==
          "success"
        ) {

          throw new Error(
            result &&
            result.message
              ? result.message
              : "Portal ไม่สามารถสร้าง Launch Token ได้"
          );

        }


        /*
         * รองรับชื่อ field ที่ Backend
         * อาจใช้ launchToken / token
         */
        const launchToken =
          result.launchToken ||
          result.token;


        if (!launchToken) {

          throw new Error(
            "Portal ไม่ได้ส่ง Launch Token กลับมา"
          );

        }


        /*
         * ----------------------------------------------
         * สร้าง Destination URL
         * ----------------------------------------------
         */
        const destination =
          new URL(
            safeUrl
          );


        /*
         * ห้ามส่ง Session ID
         *
         * ส่งเฉพาะ Launch Token
         */
        destination.searchParams.set(
          "launchToken",
          launchToken
        );


        /*
         * ----------------------------------------------
         * Redirect
         * ----------------------------------------------
         */
        window.location.href =
          destination.toString();


      } catch (error) {

        console.error(
          "openPortalMenu:",
          error
        );


        /*
         * คืน Card
         */
        card.innerHTML =
          originalHTML;


        card.style.pointerEvents =
          "";


        card.classList.remove(
          "opacity-60"
        );


        showError(
          "ไม่สามารถเปิดระบบ",
          error.message ||
          `ไม่สามารถเปิด ${menuName} ได้`
        );


      } finally {

        launchingMenu =
          false;

      }

    }



    /* ==================================================
       SANITIZE URL
       ================================================== */

    function sanitizeUrl(
      value
    ) {

      if (!value) {

        return "";

      }


      try {

        const url =
          new URL(
            String(value)
          );


        /*
         * อนุญาตเฉพาะ HTTPS
         */
        if (
          url.protocol !==
          "https:"
        ) {

          return "";

        }


        return url.toString();


      } catch (error) {

        return "";

      }

    }



    /* ==================================================
       KEEP ALIVE
       ================================================== */

    function startActivityTracker() {

      /*
       * เคลียร์ของเดิมก่อน
       */
      stopActivityTracker();


      timeRemaining =
        SESSION_TIMEOUT;


      updateTimerDisplay();


      /*
       * User Activity
       */
      const resetTimer =
        function() {

          timeRemaining =
            SESSION_TIMEOUT;

        };


      [
        "mousemove",
        "keydown",
        "touchstart",
        "scroll",
        "click"
      ].forEach(
        function(eventName) {

          window.addEventListener(
            eventName,
            resetTimer,
            {
              passive: true
            }
          );

        }
      );


      /*
       * Local Timer
       */
      timerInterval =
        setInterval(
          function() {

            timeRemaining--;


            updateTimerDisplay();


            if (
              timeRemaining <=
              0
            ) {

              stopActivityTracker();


              alert(
                "หมดเวลาการเชื่อมต่อ กรุณาเข้าสู่ระบบใหม่"
              );


              logoutApp();

            }

          },
          1000
        );


      /*
       * Server KeepAlive
       */
      keepAliveInterval =
        setInterval(
          async function() {

            if (
              !portalSessionId
            ) {

              return;

            }


            if (
              timeRemaining <=
              300
            ) {

              return;

            }


            try {

              const result =
                await postPortal({

                  action:
                    "keepAlive",

                  sessionId:
                    portalSessionId

                });


              /*
               * ถ้า Session หมดอายุ
               */
              if (
                !result ||
                result.status !==
                "success"
              ) {

                console.warn(
                  "KeepAlive failed:",
                  result
                );

              }

            } catch (error) {

              console.warn(
                "KeepAlive error:",
                error
              );

            }

          },
          KEEP_ALIVE_INTERVAL
        );

    }



    /* ==================================================
       STOP ACTIVITY TRACKER
       ================================================== */

    function stopActivityTracker() {

      if (
        timerInterval
      ) {

        clearInterval(
          timerInterval
        );

        timerInterval =
          null;

      }


      if (
        keepAliveInterval
      ) {

        clearInterval(
          keepAliveInterval
        );

        keepAliveInterval =
          null;

      }

    }



    /* ==================================================
       TIMER DISPLAY
       ================================================== */

    function updateTimerDisplay() {

      const timer =
        document.getElementById(
          "timer-display"
        );


      if (!timer) {

        return;

      }


      const minutes =
        Math.floor(
          Math.max(
            timeRemaining,
            0
          ) / 60
        )
        .toString()
        .padStart(
          2,
          "0"
        );


      const seconds =
        (
          Math.max(
            timeRemaining,
            0
          ) % 60
        )
        .toString()
        .padStart(
          2,
          "0"
        );


      timer.textContent =
        `${minutes}:${seconds}`;

    }



    /* ==================================================
       FETCH CLIENT INFO
       ================================================== */

    async function fetchClientInfo() {

      try {

        const response =
          await fetch(
            "https://ipapi.co/json/",
            {
              method: "GET",
              cache: "no-store"
            }
          );


        if (
          response.ok
        ) {

          const data =
            await response.json();


          clientInfo.ip =
            data.ip ||
            "Unknown";


          clientInfo.location =
            data.city &&
            data.country_name
              ? `${data.city}, ${data.country_name}`
              : "Unknown";

        }

      } catch (error) {

        /*
         * ไม่ให้ IP API ทำให้ Login ล้มเหลว
         */
        console.warn(
          "fetchClientInfo:",
          error
        );

      }

    }



    /* ==================================================
       POST PORTAL API
       ================================================== */

    async function postPortal(
      payload
    ) {

      const response =
        await fetch(
          CENTRAL_API_URL,
          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "text/plain;charset=utf-8"

            },

            body:
              JSON.stringify(
                payload
              ),

            cache:
              "no-store"

          }
        );


      const text =
        await response.text();


      let result;


      try {

        result =
          JSON.parse(
            text
          );

      } catch (error) {

        console.error(
          "Portal response:",
          text
        );


        throw new Error(
          "Portal ส่งข้อมูลกลับมาไม่ถูกต้อง"
        );

      }


      if (
        !result
      ) {

        throw new Error(
          "ไม่ได้รับข้อมูลจาก Portal"
        );

      }


      return result;

    }



    /* ==================================================
       SHOW SCREEN
       ================================================== */

    function showScreen(
      id
    ) {

      [
        "loading-screen",
        "register-screen",
        "error-screen",
        "dashboard-screen",
        "copy-screen"
      ].forEach(
        function(screenId) {

          const element =
            document.getElementById(
              screenId
            );


          if (
            element
          ) {

            element.classList.add(
              "hidden"
            );

          }

        }
      );


      const target =
        document.getElementById(
          id
        );


      if (
        target
      ) {

        target.classList.remove(
          "hidden"
        );

      }

    }



    /* ==================================================
       LOADING MESSAGE
       ================================================== */

    function setLoadingMessage(
      message
    ) {

      const element =
        document.getElementById(
          "loading-message"
        );


      if (
        element
      ) {

        element.textContent =
          message;

      }

    }



    /* ==================================================
       SHOW ERROR
       ================================================== */

    function showError(
      title,
      message
    ) {

      const titleElement =
        document.getElementById(
          "error-title"
        );


      const messageElement =
        document.getElementById(
          "error-message"
        );


      if (
        titleElement
      ) {

        titleElement.textContent =
          title ||
          "ข้อผิดพลาด";

      }


      if (
        messageElement
      ) {

        messageElement.textContent =
          message ||
          "เกิดข้อผิดพลาดในระบบ";

      }


      showScreen(
        "error-screen"
      );

    }



    /* ==================================================
       SHOW PROFILE
       ================================================== */

    function showProfile() {

      if (
        !lineProfile
      ) {

        return;

      }


      const profileImage =
        document.getElementById(
          "profile-img"
        );


      if (
        profileImage &&
        lineProfile.pictureUrl
      ) {

        profileImage.src =
          lineProfile.pictureUrl;


        profileImage.classList.remove(
          "hidden"
        );

      }


      const userInfo =
        document.getElementById(
          "user-info"
        );


      if (
        userInfo
      ) {

        userInfo.textContent =
          lineProfile.displayName ||
          "กำลังตรวจสอบ...";

      }

    }



    /* ==================================================
       LOGOUT
       ================================================== */

    async function logoutApp() {

      try {

        stopActivityTracker();


        /*
         * แจ้ง Portal ให้ invalidate Session
         */
        if (
          portalSessionId
        ) {

          try {

            await postPortal({

              action:
                "logout",

              sessionId:
                portalSessionId

            });

          } catch (error) {

            console.warn(
              "Portal logout:",
              error
            );

          }

        }


      } finally {

        /*
         * ล้าง Session
         */
        sessionStorage.removeItem(
          "portalSessionId"
        );


        portalSessionId =
          null;


        /*
         * LINE Logout
         */
        try {

          if (
            typeof liff !==
            "undefined" &&
            liff.isLoggedIn()
          ) {

            liff.logout();

          }

        } catch (error) {

          console.warn(
            "LIFF logout:",
            error
          );

        }


        /*
         * Reload
         */
        window.location.reload();

      }

    }



    /* ==================================================
       RETRY LOGIN
       ================================================== */

    function retryLogin() {

      sessionStorage.removeItem(
        "portalSessionId"
      );


      portalSessionId =
        null;


      window.location.reload();

    }



    /* ==================================================
       START
       ================================================== */

    window.addEventListener(
      "load",
      function() {

        initApp();

      }
    );


  </script>
