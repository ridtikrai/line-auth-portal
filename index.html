<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Portal</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7f6;
  color: #333;
}

.container {
  max-width: 900px;
  margin: 40px auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 30px;
  box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

h1 {
  margin-top: 0;
}

button {
  width: 100%;
  padding: 13px;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
  margin-top: 10px;
}

.primary {
  background: #06c755;
  color: white;
}

.secondary {
  background: #eee;
}

input {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 16px;
}

.menu {
  padding: 18px;
  margin: 10px 0;
  border: 1px solid #eee;
  border-radius: 10px;
  cursor: pointer;
}

.menu:hover {
  background: #f5f5f5;
}

.hidden {
  display: none;
}

.message {
  margin-top: 15px;
  text-align: center;
}
</style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginPage" class="card">

    <h1>Portal</h1>

    <p>เข้าสู่ระบบด้วย LINE</p>

    <button
      class="primary"
      onclick="loginLINE()">
      เข้าสู่ระบบ
    </button>

    <div id="loginMessage" class="message"></div>

  </div>


  <!-- REGISTER -->
  <div id="registerPage" class="card hidden">

    <h1>ลงทะเบียน</h1>

    <p>กรุณากรอกเบอร์โทรศัพท์</p>

    <input
      id="phone"
      type="tel"
      placeholder="เบอร์โทรศัพท์">

    <button
      class="primary"
      onclick="register()">
      ลงทะเบียน
    </button>

    <button
      class="secondary"
      onclick="location.reload()">
      กลับ
    </button>

    <div id="registerMessage" class="message"></div>

  </div>


  <!-- MENU -->
  <div id="menuPage" class="card hidden">

    <h1>ระบบ Portal</h1>

    <div id="userInfo"></div>

    <hr>

    <div id="menuList"></div>

    <button
      class="secondary"
      onclick="logout()">
      ออกจากระบบ
    </button>

  </div>

</div>


<script>

/*************************************************
 * 🔧 ตั้งค่าเพียง 2 จุด
 *************************************************/

const LIFF_ID =
  '2011487100-dldPQItq';

const PORTAL_API =
  'https://script.google.com/macros/s/AKfycbwphhIdSMHpTWHuFrRFTC3lEZe-QQCaZr2cebxb22cE9ph1eYPscyrxdw29T44DaUT9/exec';


let lineUserId = '';
let sessionId = '';


/*************************************************
 * เริ่มระบบ
 *************************************************/

async function init() {

  try {

    await liff.init({
      liffId: LIFF_ID
    });

    if (!liff.isLoggedIn()) {

      document
        .getElementById('loginPage')
        .classList.remove('hidden');

      return;
    }

    const profile = await liff.getProfile();

    lineUserId = profile.userId;

    await login();

  } catch (err) {

    show(
      'loginMessage',
      'ไม่สามารถเชื่อมต่อระบบได้'
    );

    console.error(err);
  }
}


/*************************************************
 * LINE Login
 *************************************************/

async function loginLINE() {

  if (!liff.isLoggedIn()) {

    liff.login({
      redirectUri: location.href
    });

    return;
  }

  await login();
}


/*************************************************
 * Login Portal
 *************************************************/

async function login() {

  const result = await api({
    action: 'login',
    userId: lineUserId
  });

  if (result.status !== 'success') {

    if (result.code === 'NOT_REGISTERED') {

      showPage('registerPage');

      return;
    }

    show(
      'loginMessage',
      result.message
    );

    return;
  }

  sessionId = result.sessionId;

  sessionStorage.setItem(
    'portalSession',
    sessionId
  );

  await loadMenu();
}


/*************************************************
 * Registration
 *************************************************/

async function register() {

  const phone =
    document
      .getElementById('phone')
      .value
      .trim();

  const result = await api({
    action: 'register',
    userId: lineUserId,
    phone: phone
  });

  show(
    'registerMessage',
    result.message
  );

  if (result.status === 'success') {

    setTimeout(() => {
      location.reload();
    }, 1500);
  }
}


/*************************************************
 * Load Menu
 *************************************************/

async function loadMenu() {

  const result = await api({
    action: 'menu',
    sessionId: sessionId
  });

  if (result.status !== 'success') {

    sessionStorage.removeItem('portalSession');

    showPage('loginPage');

    show(
      'loginMessage',
      result.message
    );

    return;
  }

  document
    .getElementById('userInfo')
    .innerHTML =
      `<b>${result.user.name}</b>
       (${result.user.role})`;

  const list =
    document.getElementById('menuList');

  list.innerHTML = '';

  if (!result.menus.length) {

    list.innerHTML =
      '<p>คุณไม่มีสิทธิ์เข้าถึงเมนูใดๆ</p>';

    showPage('menuPage');

    return;
  }

  result.menus.forEach(menu => {

    const div =
      document.createElement('div');

    div.className = 'menu';

    div.innerHTML =
      `<b>${menu.menuName}</b>
       <br>
       <small>${menu.group}</small>`;

    div.onclick = () => openSystem(menu);

    list.appendChild(div);
  });

  showPage('menuPage');

  startKeepAlive();
}


/*************************************************
 * เปิดระบบปลายทาง
 *************************************************/

async function openSystem(menu) {

  const result = await api({
    action: 'launch',
    sessionId: sessionId
  });

  if (result.status !== 'success') {

    alert(result.message);

    return;
  }

  /*
   * POST Launch Token ไปยัง Destination
   * ไม่ใส่ Token ใน URL
   */

  const form =
    document.createElement('form');

  form.method = 'POST';
  form.action = menu.url;
  form.target = '_blank';

  const input =
    document.createElement('input');

  input.type = 'hidden';
  input.name = 'launchToken';
  input.value = result.launchToken;

  form.appendChild(input);

  document.body.appendChild(form);

  form.submit();

  form.remove();
}


/*************************************************
 * KeepAlive
 *************************************************/

function startKeepAlive() {

  setInterval(async () => {

    if (!sessionId) return;

    const result = await api({
      action: 'keepAlive',
      sessionId: sessionId
    });

    if (result.status !== 'success') {

      sessionStorage.removeItem(
        'portalSession'
      );

      location.reload();
    }

  }, 10 * 60 * 1000);
}


/*************************************************
 * Logout
 *************************************************/

async function logout() {

  await api({
    action: 'logout',
    sessionId: sessionId
  });

  sessionStorage.removeItem(
    'portalSession'
  );

  sessionId = '';

  location.reload();
}


/*************************************************
 * API
 *************************************************/

async function api(data) {

  const response =
    await fetch(PORTAL_API, {

      method: 'POST',

      headers: {
        'Content-Type':
          'text/plain;charset=utf-8'
      },

      body: JSON.stringify(data)
    });

  return await response.json();
}


/*************************************************
 * UI
 *************************************************/

function showPage(id) {

  [
    'loginPage',
    'registerPage',
    'menuPage'
  ].forEach(page => {

    document
      .getElementById(page)
      .classList.add('hidden');
  });

  document
    .getElementById(id)
    .classList.remove('hidden');
}


function show(id, text) {

  document
    .getElementById(id)
    .textContent = text;
}


init();

</script>

</body>
</html>
