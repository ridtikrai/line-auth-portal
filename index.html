<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Portal</title>

  <!-- LINE LIFF -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        "Noto Sans Thai",
        "Segoe UI",
        Arial,
        sans-serif;
      background: #f4f8f6;
      color: #26332d;
    }


    /* =========================================
       HEADER
       ========================================= */

    .header {
      background: #ffffff;
      border-bottom: 1px solid #dfe8e3;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: #168a5a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 700;
      font-size: 18px;
    }

    .brand-text {
      line-height: 1.25;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      color: #126b47;
    }

    .brand-subtitle {
      font-size: 12px;
      color: #75827c;
    }


    /* =========================================
       USER
       ========================================= */

    .user-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-info {
      text-align: right;
    }

    .user-name {
      font-size: 14px;
      font-weight: 700;
    }

    .user-role {
      font-size: 12px;
      color: #6d7973;
    }

    .profile-image {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background: #dfeae5;
    }


    /* =========================================
       MAIN
       ========================================= */

    .container {
      width: min(1200px, 94%);
      margin: 0 auto;
      padding: 30px 0 50px;
    }


    .welcome {
      margin-bottom: 28px;
    }

    .welcome h1 {
      margin: 0 0 6px;
      font-size: 28px;
      color: #155c41;
    }

    .welcome p {
      margin: 0;
      color: #6b7771;
      font-size: 14px;
    }


    /* =========================================
       LOADING
       ========================================= */

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #68766f;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #dce9e3;
      border-top-color: #168a5a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }


    /* =========================================
       GROUP
       ========================================= */

    .menu-group {
      margin-bottom: 30px;
    }

    .group-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .group-line {
      width: 5px;
      height: 26px;
      border-radius: 5px;
      background: #168a5a;
    }

    .group-title h2 {
      margin: 0;
      font-size: 20px;
      color: #185d43;
    }


    /* =========================================
       MENU GROUP
       ========================================= */

    .menu-subgroup {
      margin-bottom: 18px;
    }

    .menu-subgroup-title {
      font-size: 14px;
      font-weight: 700;
      color: #68756f;
      margin-bottom: 10px;
    }


    /* =========================================
       MENU GRID
       ========================================= */

    .menu-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }


    /* =========================================
       MENU CARD
       ========================================= */

    .menu-card {
      background: #ffffff;
      border: 1px solid #dce7e1;
      border-radius: 14px;
      padding: 20px;
      min-height: 110px;
      cursor: pointer;
      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        border-color 0.15s ease;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .menu-card:hover {
      transform: translateY(-2px);
      border-color: #80bda4;
      box-shadow:
        0 8px 22px rgba(20, 80, 55, 0.10);
    }

    .menu-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: #e8f5ef;
      color: #168a5a;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      font-size: 18px;
      font-weight: 700;
    }

    .menu-name {
      font-size: 15px;
      font-weight: 700;
      color: #264137;
      line-height: 1.45;
    }


    /* =========================================
       NO MENU
       ========================================= */

    .no-menu {
      background: #ffffff;
      border: 1px solid #e1e8e4;
      border-radius: 14px;
      padding: 35px;
      text-align: center;
      color: #6f7c75;
    }


    /* =========================================
       LOGIN / REGISTER
       ========================================= */

    .center-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: min(430px, 100%);
      background: #ffffff;
      border-radius: 18px;
      padding: 34px;
      box-shadow:
        0 12px 35px rgba(20, 70, 50, 0.10);
      border: 1px solid #e1eae5;
    }

    .login-logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: #168a5a;
      color: #ffffff;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: 700;
    }

    .login-card h1 {
      text-align: center;
      margin: 0 0 8px;
      color: #145d42;
      font-size: 24px;
    }

    .login-description {
      text-align: center;
      color: #718078;
      font-size: 14px;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .form-control {
      width: 100%;
      border: 1px solid #ccd9d2;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
    }

    .form-control:focus {
      border-color: #168a5a;
      box-shadow:
        0 0 0 3px rgba(22, 138, 90, 0.10);
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      background: #168a5a;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #117349;
    }

    .btn-secondary {
      background: #edf3ef;
      color: #245b44;
      margin-top: 10px;
    }


    /* =========================================
       MESSAGE
       ========================================= */

    .message {
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }

    .message.error {
      display: block;
      background: #fff1f1;
      color: #a53c3c;
      border: 1px solid #f0cccc;
    }

    .message.success {
      display: block;
      background: #edf9f2;
      color: #25704b;
      border: 1px solid #cbe8d7;
    }


    /* =========================================
       LOGOUT
       ========================================= */

    .logout-btn {
      border: 1px solid #d5e0da;
      background: #ffffff;
      color: #5f6e66;
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
      font-size: 12px;
    }

    .logout-btn:hover {
      background: #f4f8f6;
    }


    /* =========================================
       RESPONSIVE
       ========================================= */

    @media (max-width: 650px) {

      .header {
        padding: 12px 15px;
      }

      .brand-subtitle {
        display: none;
      }

      .user-info {
        display: none;
      }

      .container {
        width: 92%;
        padding-top: 22px;
      }

      .welcome h1 {
        font-size: 23px;
      }

      .menu-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .menu-card {
        padding: 15px;
        min-height: 100px;
      }

      .menu-name {
        font-size: 14px;
      }

    }

  </style>

</head>


<body>


<!-- =====================================================
     LOGIN PAGE
     ===================================================== -->

<div id="loginPage" class="center-page">

  <div class="login-card">

    <div class="login-logo">
      P
    </div>

    <h1>Portal</h1>

    <div class="login-description">
      ระบบศูนย์กลางสำหรับเข้าสู่ระบบงาน
    </div>

    <div
      id="loginMessage"
      class="message"
    ></div>

    <button
      id="loginButton"
      class="btn btn-primary"
      onclick="startLogin()"
    >
      เข้าสู่ระบบด้วย LINE
    </button>

  </div>

</div>



<!-- =====================================================
     REGISTER PAGE
     ===================================================== -->

<div
  id="registerPage"
  class="center-page"
  style="display:none;"
>

  <div class="login-card">

    <div class="login-logo">
      P
    </div>

    <h1>ลงทะเบียนใช้งาน</h1>

    <div class="login-description">

      ไม่พบข้อมูลการลงทะเบียนของคุณ
      <br>
      กรุณาระบุหมายเลขโทรศัพท์

    </div>


    <div
      id="registerMessage"
      class="message"
    ></div>


    <form
      onsubmit="handlePhoneSubmit(event)"
    >

      <div class="form-group">

        <label>
          หมายเลขโทรศัพท์
        </label>

        <input
          id="phoneInput"
          class="form-control"
          type="tel"
          inputmode="numeric"
          maxlength="10"
          placeholder="กรอกหมายเลขโทรศัพท์"
          required
        >

      </div>


      <button
        type="submit"
        id="registerButton"
        class="btn btn-primary"
      >
        ยืนยันการลงทะเบียน
      </button>

    </form>


    <button
      class="btn btn-secondary"
      onclick="backToLogin()"
    >
      กลับ
    </button>

  </div>

</div>



<!-- =====================================================
     MAIN PORTAL
     ===================================================== -->

<div
  id="portalPage"
  style="display:none;"
>

  <header class="header">

    <div class="brand">

      <div class="brand-icon">
        P
      </div>

      <div class="brand-text">

        <div class="brand-title">
          Portal
        </div>

        <div class="brand-subtitle">
          ระบบศูนย์กลาง
        </div>

      </div>

    </div>


    <div class="user-area">

      <div class="user-info">

        <div
          id="userName"
          class="user-name"
        >
          -
        </div>

        <div
          id="userRole"
          class="user-role"
        >
          -
        </div>

      </div>


      <img
        id="profileImage"
        class="profile-image"
        src=""
        alt="Profile"
        style="display:none;"
      >


      <button
        class="logout-btn"
        onclick="logout()"
      >
        ออกจากระบบ
      </button>

    </div>

  </header>


  <main class="container">

    <div class="welcome">

      <h1 id="welcomeName">
        ยินดีต้อนรับ
      </h1>

      <p>
        กรุณาเลือกระบบที่ต้องการใช้งาน
      </p>

    </div>


    <div
      id="menuLoading"
      class="loading"
    >

      <div class="spinner"></div>

      กำลังโหลดเมนู...

    </div>


    <div
      id="menuContainer"
      style="display:none;"
    ></div>


  </main>

</div>



<script>


/* =========================================================
   CONFIG
   ========================================================= */

const LIFF_ID =
  "2011487100-dldPQItq";


const CENTRAL_API_URL =
  "https://script.google.com/macros/s/AKfycbwphhIdSMHpTWHuFrRFTC3lEZe-QQCaZr2cebxb22cE9ph1eYPscyrxdw29T44DaUT9/exec";


const SESSION_KEY =
  "portalSessionId";


const SESSION_MINUTES =
  60;


const KEEP_ALIVE_MINUTES =
  10;



/* =========================================================
   GLOBAL
   ========================================================= */

let currentProfile = null;

let currentSession = null;

let keepAliveTimer = null;



/* =========================================================
   INIT
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    initApp();

  }
);



async function initApp() {

  try {

    console.log(
      "LIFF_ID =",
      LIFF_ID
    );


    /* ---------------------------------------------
       LIFF INIT
       --------------------------------------------- */

    await liff.init({
      liffId: LIFF_ID
    });


    console.log(
      "LIFF initialized"
    );


    /* ---------------------------------------------
       Check saved session
       --------------------------------------------- */

    const savedSession =
      sessionStorage.getItem(
        SESSION_KEY
      );


    if (savedSession) {

      console.log(
        "Checking saved session..."
      );


      const result =
        await verifyPortalSession(
          savedSession
        );


      console.log(
        "verifySession:",
        result
      );


      if (
        result &&
        result.status === "success"
      ) {

        currentSession =
          result.session;


        showPortalPage();

        startKeepAlive();

        await loadMenu();

        return;

      }


      sessionStorage.removeItem(
        SESSION_KEY
      );

    }


    /* ---------------------------------------------
       No valid session
       --------------------------------------------- */

    showLoginPage();


  } catch (error) {

    console.error(
      "initApp:",
      error
    );


    showLoginMessage(
      error.message ||
      "ไม่สามารถเริ่มระบบได้",
      "error"
    );

  }

}



/* =========================================================
   LINE LOGIN
   ========================================================= */

async function startLogin() {

  try {

    setLoginButton(
      true,
      "กำลังเข้าสู่ระบบ..."
    );


    if (!liff.isLoggedIn()) {

      liff.login();

      return;

    }


    await processLineLogin();


  } catch (error) {

    console.error(
      "startLogin:",
      error
    );


    showLoginMessage(
      error.message ||
      "เข้าสู่ระบบไม่สำเร็จ",
      "error"
    );


    setLoginButton(
      false,
      "เข้าสู่ระบบด้วย LINE"
    );

  }

}



async function processLineLogin() {

  try {

    /* ---------------------------------------------
       Get LINE Profile
       --------------------------------------------- */

    currentProfile =
      await liff.getProfile();


    console.log(
      "LINE Profile:",
      currentProfile
    );


    /* ---------------------------------------------
       Check User
       --------------------------------------------- */

    const result =
      await portalRequest({

        action:
          "checkUser",

        userId:
          currentProfile.userId,

        profile:
          currentProfile,

        clientInfo:
          getClientInfo()

      });


    console.log(
      "checkUser:",
      result
    );


    /* ---------------------------------------------
       Handle Result
       --------------------------------------------- */

    if (
      result.status ===
      "success"
    ) {

      currentSession =
        result.session;


      saveSession(
        result.sessionId
      );


      showPortalPage();

      updateUserInfo();

      startKeepAlive();

      await loadMenu();

      return;

    }


    /* ---------------------------------------------
       Not Registered
       --------------------------------------------- */

    if (
      result.status ===
      "not_registered"
    ) {

      showRegisterPage();

      return;

    }


    /* ---------------------------------------------
       Pending
       --------------------------------------------- */

    if (
      result.status ===
      "pending"
    ) {

      showLoginMessage(
        result.message ||
        "รอการอนุมัติจากผู้ดูแลระบบ",
        "error"
      );

      return;

    }


    /* ---------------------------------------------
       Inactive
       --------------------------------------------- */

    if (
      result.status ===
      "inactive"
    ) {

      showLoginMessage(
        result.message ||
        "บัญชีของคุณไม่สามารถใช้งานได้",
        "error"
      );

      return;

    }


    /* ---------------------------------------------
       Error
       --------------------------------------------- */

    showLoginMessage(
      result.message ||
      "เข้าสู่ระบบไม่สำเร็จ",
      "error"
    );


  } catch (error) {

    console.error(
      "processLineLogin:",
      error
    );


    showLoginMessage(
      error.message ||
      "เกิดข้อผิดพลาดในการเข้าสู่ระบบ",
      "error"
    );

  } finally {

    setLoginButton(
      false,
      "เข้าสู่ระบบด้วย LINE"
    );

  }

}



/* =========================================================
   REGISTER
   ========================================================= */

async function handlePhoneSubmit(event) {

  event.preventDefault();


  try {

    const phone =
      document
        .getElementById(
          "phoneInput"
        )
        .value
        .trim();


    if (!phone) {

      showRegisterMessage(
        "กรุณาระบุหมายเลขโทรศัพท์",
        "error"
      );

      return;

    }


    if (!currentProfile) {

      showRegisterMessage(
        "ไม่พบข้อมูล LINE Profile",
        "error"
      );

      return;

    }


    const button =
      document.getElementById(
        "registerButton"
      );


    button.disabled =
      true;


    button.textContent =
      "กำลังตรวจสอบ...";


    const result =
      await portalRequest({

        action:
          "verifyPhone",

        userId:
          currentProfile.userId,

        phone:
          phone,

        profile:
          currentProfile,

        clientInfo:
          getClientInfo()

      });


    console.log(
      "verifyPhone:",
      result
    );


    if (
      result.status ===
      "success"
    ) {

      if (result.sessionId) {

        saveSession(
          result.sessionId
        );

      }


      currentSession =
        result.session;


      showPortalPage();

      updateUserInfo();

      startKeepAlive();

      await loadMenu();

      return;

    }


    showRegisterMessage(
      result.message ||
      "ไม่สามารถลงทะเบียนได้",
      "error"
    );


  } catch (error) {

    console.error(
      "handlePhoneSubmit:",
      error
    );


    showRegisterMessage(
      error.message ||
      "เกิดข้อผิดพลาด",
      "error"
    );


  } finally {

    const button =
      document.getElementById(
        "registerButton"
      );


    button.disabled =
      false;


    button.textContent =
      "ยืนยันการลงทะเบียน";

  }

}



/* =========================================================
   LOAD MENU
   ========================================================= */

async function loadMenu() {

  try {

    const sessionId =
      sessionStorage.getItem(
        SESSION_KEY
      );


    if (!sessionId) {

      throw new Error(
        "Session not found"
      );

    }


    showMenuLoading(
      true
    );


    const result =
      await portalRequest({

        action:
          "getMenu",

        sessionId:
          sessionId

      });


    console.log(
      "getMenu:",
      result
    );


    if (
      !result ||
      result.status !==
      "success"
    ) {

      if (
        result &&
        (
          result.code ===
          "SESSION_EXPIRED" ||
          result.code ===
          "SESSION_INVALID"
        )
      ) {

        handleSessionExpired();

        return;

      }


      throw new Error(
        result?.message ||
        "ไม่สามารถโหลดเมนูได้"
      );

    }


    /* ---------------------------------------------
       Update Role
       --------------------------------------------- */

    if (result.role) {

      currentSession =
        currentSession || {};

      currentSession.role =
        result.role;

      document
        .getElementById(
          "userRole"
        )
        .textContent =
        result.role;

    }


    /* ---------------------------------------------
       Render Menu
       --------------------------------------------- */

    renderDashboard(
      result.menuGroups || []
    );


  } catch (error) {

    console.error(
      "loadMenu:",
      error
    );


    const container =
      document.getElementById(
        "menuContainer"
      );


    container.style.display =
      "block";


    container.innerHTML = `

      <div class="no-menu">

        ไม่สามารถโหลดเมนูได้

        <br><br>

        <small>
          ${escapeHtml(
            error.message ||
            "Unknown error"
          )}
        </small>

      </div>

    `;


  } finally {

    showMenuLoading(
      false
    );

  }

}



/* =========================================================
   RENDER DASHBOARD
   =========================================================
 *
 * รับข้อมูลจาก PortalMenu.gs:
 *
 * menuGroups
 *   ↓
 * group
 *   ↓
 * menuGroups
 *   ↓
 * menus
 *   ↓
 * menuName
 *
 */

function renderDashboard(
  menuGroups
) {

  const container =
    document.getElementById(
      "menuContainer"
    );


  container.innerHTML =
    "";


  if (
    !Array.isArray(menuGroups) ||
    menuGroups.length === 0
  ) {

    container.innerHTML = `

      <div class="no-menu">
        คุณไม่มีสิทธิ์เข้าถึงเมนูใดๆ
      </div>

    `;

    container.style.display =
      "block";

    return;

  }


  /* ---------------------------------------------
     Backend เรียง group มาแล้ว
     มาก → น้อย

     แต่ Frontend sort ซ้ำอีกครั้ง
     เพื่อป้องกันกรณี Backend เปลี่ยน
     --------------------------------------------- */

  menuGroups.sort(
    function(a, b) {

      const aGroup =
        Number(a.group);

      const bGroup =
        Number(b.group);


      if (
        !isNaN(aGroup) &&
        !isNaN(bGroup)
      ) {

        return bGroup - aGroup;

      }


      return String(a.group || '')
        .localeCompare(
          String(b.group || ''),
          'th'
        );

    }
  );


  /* ---------------------------------------------
     Render Group
     --------------------------------------------- */

  menuGroups.forEach(
    function(group) {

      const groupSection =
        document.createElement(
          "section"
        );


      groupSection.className =
        "menu-group";


      /* -------------------------------------------
         Group Title
         ------------------------------------------- */

      const groupTitle =
        document.createElement(
          "div"
        );


      groupTitle.className =
        "group-title";


      const groupLine =
        document.createElement(
          "div"
        );


      groupLine.className =
        "group-line";


      const groupText =
        document.createElement(
          "h2"
        );


      /*
       * group ใช้จัดลำดับ
       *
       * ไม่แสดงเลข group
       *
       * ถ้าคุณต้องการให้ group
       * เป็นชื่อข้อความจาก Sheet
       * สามารถปรับตรงนี้ได้
       */

      groupText.textContent =
        getGroupDisplayName(
          group
        );


      groupTitle.appendChild(
        groupLine
      );


      groupTitle.appendChild(
        groupText
      );


      groupSection.appendChild(
        groupTitle
      );


      /* -------------------------------------------
         Menu Groups
         ------------------------------------------- */

      const subGroups =
        Array.isArray(
          group.menuGroups
        )
          ? group.menuGroups
          : [];


      subGroups.forEach(
        function(subGroup) {

          const menus =
            Array.isArray(
              subGroup.menus
            )
              ? subGroup.menus
              : [];


          if (
            menus.length === 0
          ) {

            return;

          }


          const subSection =
            document.createElement(
              "div"
            );


          subSection.className =
            "menu-subgroup";


          /* -----------------------------------------
             menuGroup
             ----------------------------------------- */

          if (
            subGroup.menuGroup &&
            subGroup.menuGroup !==
            "ทั่วไป"
          ) {

            const subTitle =
              document.createElement(
                "div"
              );


            subTitle.className =
              "menu-subgroup-title";


            subTitle.textContent =
              subGroup.menuGroup;


            subSection.appendChild(
              subTitle
            );

          }


          /* -----------------------------------------
             Menu Grid
             ----------------------------------------- */

          const grid =
            document.createElement(
              "div"
            );


          grid.className =
            "menu-grid";


          menus.forEach(
            function(menu) {

              /*
               * แสดงเฉพาะ canRead
               */

              if (
                menu.canRead !== true
              ) {

                return;

              }


              const card =
                document.createElement(
                  "a"
                );


              card.className =
                "menu-card";


              const icon =
                document.createElement(
                  "div"
                );


              icon.className =
                "menu-icon";


              icon.textContent =
                getMenuIcon(
                  menu.menuName
                );


              const name =
                document.createElement(
                  "div"
                );


              /*
               * สำคัญ:
               *
               * แสดง menuName
               * ไม่แสดง menuId
               */

              name.className =
                "menu-name";


              name.textContent =
                menu.menuName ||
                "เมนู";


              card.appendChild(
                icon
              );


              card.appendChild(
                name
              );


              /* -------------------------------------
                 Menu URL
                 ------------------------------------- */

              if (
                menu.menuUrl
              ) {

                card.href =
                  menu.menuUrl;

                card.target =
                  "_blank";

                card.rel =
                  "noopener noreferrer";

              } else {

                /*
                 * ไม่มี URL
                 *
                 * ยังแสดงเมนู
                 * แต่กดไม่ได้
                 */

                card.href =
                  "javascript:void(0)";

                card.style.cursor =
                  "default";

                card.title =
                  "ยังไม่ได้กำหนด URL";


                card.addEventListener(
                  "click",
                  function(event) {

                    event.preventDefault();

                    alert(
                      "เมนูนี้ยังไม่ได้กำหนด URL"
                    );

                  }
                );

              }


              grid.appendChild(
                card
              );

            }
          );


          if (
            grid.children.length > 0
          ) {

            subSection.appendChild(
              grid
            );

            groupSection.appendChild(
              subSection
            );

          }

        }
      );


      container.appendChild(
        groupSection
      );

    }
  );


  container.style.display =
    "block";

}



/* =========================================================
   GROUP DISPLAY NAME
   =========================================================
 *
 * ตอนนี้ group ใน Sheet ถูกใช้เป็น
 * ตัวเลขสำหรับเรียงลำดับ
 *
 * เช่น
 * 100
 * 90
 * 80
 *
 * จึงไม่ควรนำเลขมาแสดงเป็นชื่อ
 *
 * ถ้าคุณต้องการให้ group เป็นชื่อ
 * เช่น
 *
 * "ระบบบุคลากร"
 * "ระบบเอกสาร"
 *
 * ควรมี column สำหรับชื่อ Group
 *
 * ตอนนี้จึงใช้ค่า group ตามข้อมูลจริง
 *
 */

function getGroupDisplayName(
  group
) {

  return String(
    group?.group ||
    "ระบบ"
  ).trim();

}



/* =========================================================
   VERIFY SESSION
   ========================================================= */

async function verifyPortalSession(
  sessionId
) {

  return await portalRequest({

    action:
      "verifySession",

    sessionId:
      sessionId

  });

}



/* =========================================================
   KEEP ALIVE
   ========================================================= */

function startKeepAlive() {

  stopKeepAlive();


  keepAliveTimer =
    setInterval(
      async function() {

        try {

          const sessionId =
            sessionStorage.getItem(
              SESSION_KEY
            );


          if (!sessionId) {

            return;

          }


          const result =
            await portalRequest({

              action:
                "keepAlive",

              sessionId:
                sessionId

            });


          console.log(
            "keepAlive:",
            result
          );


          if (
            !result ||
            result.status !==
            "success"
          ) {

            handleSessionExpired();

          }

        } catch (error) {

          console.error(
            "keepAlive:",
            error
          );

        }

      },
      KEEP_ALIVE_MINUTES *
      60 *
      1000
    );

}



function stopKeepAlive() {

  if (
    keepAliveTimer
  ) {

    clearInterval(
      keepAliveTimer
    );

    keepAliveTimer =
      null;

  }

}



/* =========================================================
   LOGOUT
   ========================================================= */

async function logout() {

  try {

    const sessionId =
      sessionStorage.getItem(
        SESSION_KEY
      );


    if (sessionId) {

      try {

        await portalRequest({

          action:
            "logout",

          sessionId:
            sessionId

        });

      } catch (error) {

        console.warn(
          "logout API:",
          error
        );

      }

    }


  } finally {

    stopKeepAlive();


    sessionStorage.removeItem(
      SESSION_KEY
    );


    currentSession =
      null;

    currentProfile =
      null;


    if (
      typeof liff !==
      "undefined" &&
      liff.isLoggedIn()
    ) {

      try {

        liff.logout();

      } catch (error) {

        console.warn(
          "LIFF logout:",
          error
        );

      }

    }


    showLoginPage();

  }

}



/* =========================================================
   SESSION EXPIRED
   ========================================================= */

function handleSessionExpired() {

  stopKeepAlive();


  sessionStorage.removeItem(
    SESSION_KEY
  );


  currentSession =
    null;


  showLoginMessage(
    "Session หมดอายุ กรุณาเข้าสู่ระบบใหม่",
    "error"
  );


  showLoginPage();

}



/* =========================================================
   PORTAL REQUEST
   ========================================================= */

async function portalRequest(
  payload
) {

  const response =
    await fetch(
      CENTRAL_API_URL,
      {

        method:
          "POST",

        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify(
            payload
          )

      }
    );


  if (!response.ok) {

    throw new Error(
      "HTTP " +
      response.status
    );

  }


  const text =
    await response.text();


  let result;


  try {

    result =
      JSON.parse(
        text
      );

  } catch (error) {

    console.error(
      "Invalid JSON:",
      text
    );

    throw new Error(
      "Portal API returned invalid JSON"
    );

  }


  return result;

}



/* =========================================================
   SAVE SESSION
   ========================================================= */

function saveSession(
  sessionId
) {

  if (!sessionId) {

    return;

  }


  sessionStorage.setItem(
    SESSION_KEY,
    sessionId
  );

}



/* =========================================================
   CLIENT INFO
   ========================================================= */

function getClientInfo() {

  return {

    userAgent:
      navigator.userAgent,

    language:
      navigator.language,

    platform:
      navigator.platform,

    timezone:
      Intl.DateTimeFormat()
        .resolvedOptions()
        .timeZone,

    screen:
      window.screen
        ? {
            width:
              window.screen.width,

            height:
              window.screen.height
          }
        : null

  };

}



/* =========================================================
   UPDATE USER INFO
   ========================================================= */

function updateUserInfo() {

  if (
    !currentSession
  ) {

    return;

  }


  const name =
    currentSession.name ||
    currentProfile?.displayName ||
    "ผู้ใช้งาน";


  const role =
    currentSession.role ||
    "-";


  document
    .getElementById(
      "userName"
    )
    .textContent =
    name;


  document
    .getElementById(
      "userRole"
    )
    .textContent =
    role;


  document
    .getElementById(
      "welcomeName"
    )
    .textContent =
    "ยินดีต้อนรับ " +
    name;


  /* ---------------------------------------------
     Profile Image
     --------------------------------------------- */

  if (
    currentProfile &&
    currentProfile.pictureUrl
  ) {

    const image =
      document.getElementById(
        "profileImage"
      );


    image.src =
      currentProfile.pictureUrl;


    image.style.display =
      "block";

  }

}



/* =========================================================
   PAGE CONTROL
   ========================================================= */

function showLoginPage() {

  document
    .getElementById(
      "loginPage"
    )
    .style.display =
    "flex";


  document
    .getElementById(
      "registerPage"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "portalPage"
    )
    .style.display =
    "none";

}



function showRegisterPage() {

  document
    .getElementById(
      "loginPage"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "registerPage"
    )
    .style.display =
    "flex";


  document
    .getElementById(
      "portalPage"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "phoneInput"
    )
    .focus();

}



function showPortalPage() {

  document
    .getElementById(
      "loginPage"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "registerPage"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "portalPage"
    )
    .style.display =
    "block";


  updateUserInfo();

}



function backToLogin() {

  document
    .getElementById(
      "phoneInput"
    )
    .value =
    "";


  showLoginPage();

}

   LOADING

function showMenuLoading(

  document

      "menuLoading"
    )
    .style.display =

    );

function showRegisterMessage(
  message,
  type
) {

  const element =
    document.getElementById(
      "registerMessage"
    );


  element.textContent =
    message || "";


  element.className =
    "message " +
    (
      type ||

    );

/* =========================================================
   LOGIN BUTTON
   ========================================================= */

function setLoginButton(
  disabled,
  text
) {

  const button =
    document.getElementById(
      "loginButton"
    );


  if (!button) {

    return;

  }


  button.disabled =
    disabled;


  button.textContent =
    text;

}



/* =========================================================
   MENU ICON
   ========================================================= */

function getMenuIcon(
  menuName
) {

  const name =
    String(
      menuName || ''
    );


  if (
    name.includes("บุคลากร") ||
    name.includes("พนักงาน")
  ) {

    return "👤";

  }


  if (
    name.includes("เอกสาร")
  ) {

    return "📄";

  }


  if (
    name.includes("รายงาน")
  ) {

    return "📊";

  }


  if (
    name.includes("ตั้งค่า") ||
    name.includes("จัดการ")
  ) {

    return "⚙";

  }


  if (
    name.includes("อนุมัติ")
  ) {

    return "✓";

  }


  return "▣";

}



/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(
  value
) {

  return String(
    value || ''
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
