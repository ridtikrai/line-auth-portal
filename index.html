<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portal</title>

  <!-- LINE LIFF -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    /* =========================================================
       BASE
    ========================================================= */

    :root {
      --primary: #16a34a;
      --primary-dark: #15803d;
      --primary-soft: #f0fdf4;

      --text: #17211b;
      --text-soft: #66736b;

      --bg: #f5f7f6;
      --card: #ffffff;
      --border: #e5e9e6;

      --danger: #dc2626;

      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;

      --shadow:
        0 10px 30px rgba(20, 40, 25, 0.06);

      --shadow-hover:
        0 18px 40px rgba(20, 40, 25, 0.11);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        "Noto Sans Thai",
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }


    /* =========================================================
       LOADING
    ========================================================= */

    #loadingScreen {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at top right,
          rgba(22, 163, 74, 0.10),
          transparent 35%
        ),
        var(--bg);
    }

    .loading-card {
      width: min(90%, 380px);

      padding: 32px 24px;

      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);

      box-shadow: var(--shadow);

      text-align: center;
    }

    .loading-logo {
      width: 64px;
      height: 64px;

      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 18px;

      background: var(--primary-soft);
      color: var(--primary);

      font-size: 28px;
      font-weight: 800;
    }

    .spinner {
      width: 28px;
      height: 28px;

      margin: 18px auto 0;

      border: 3px solid #dce8df;
      border-top-color: var(--primary);

      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }


    /* =========================================================
       ERROR
    ========================================================= */

    #errorScreen {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .error-card {
      width: min(100%, 460px);

      padding: 30px;

      background: var(--card);
      border: 1px solid #fee2e2;
      border-radius: var(--radius-lg);

      box-shadow: var(--shadow);

      text-align: center;
    }

    .error-icon {
      width: 58px;
      height: 58px;

      margin: 0 auto 16px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #fef2f2;
      color: var(--danger);

      font-size: 26px;
      font-weight: 800;
    }

    .error-message {
      margin: 12px 0 22px;

      color: var(--text-soft);
      line-height: 1.6;

      word-break: break-word;
    }


    /* =========================================================
       BUTTON
    ========================================================= */

    .btn {
      min-height: 44px;

      padding: 0 18px;

      border: 0;
      border-radius: 12px;

      font-weight: 700;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        background 0.15s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: white;

      box-shadow:
        0 6px 16px rgba(22, 163, 74, 0.20);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #f3f5f4;
      color: var(--text);
    }

    .btn-danger {
      background: #fef2f2;
      color: var(--danger);
    }


    /* =========================================================
       APP
    ========================================================= */

    #app {
      min-height: 100vh;
    }


    /* =========================================================
       TOPBAR
    ========================================================= */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;

      background: rgba(255, 255, 255, 0.94);

      border-bottom: 1px solid var(--border);

      backdrop-filter: blur(14px);
    }

    .topbar-inner {
      width: min(1280px, calc(100% - 32px));

      min-height: 72px;

      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;

      gap: 12px;

      min-width: 0;
    }

    .brand-logo {
      width: 42px;
      height: 42px;

      flex: 0 0 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 13px;

      background: var(--primary-soft);
      color: var(--primary);

      font-size: 19px;
      font-weight: 900;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title {
      margin: 0;

      font-size: 17px;
      font-weight: 800;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-subtitle {
      margin: 2px 0 0;

      color: var(--text-soft);

      font-size: 11px;
    }


    /* =========================================================
       USER AREA
    ========================================================= */

    .user-area {
      display: flex;
      align-items: center;

      gap: 10px;
    }

    .user-info {
      text-align: right;
    }

    .user-name {
      font-size: 13px;
      font-weight: 700;
    }

    .user-role {
      display: inline-flex;

      margin-top: 3px;
      padding: 2px 8px;

      border-radius: 999px;

      background: var(--primary-soft);
      color: var(--primary-dark);

      font-size: 10px;
      font-weight: 800;
    }

    .avatar {
      width: 40px;
      height: 40px;

      flex: 0 0 40px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: var(--primary);
      color: white;

      font-size: 14px;
      font-weight: 800;
    }

    .logout-btn {
      width: 40px;
      height: 40px;

      padding: 0;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: white;
      color: var(--text-soft);

      font-size: 17px;

      transition: 0.15s ease;
    }

    .logout-btn:hover {
      background: #fef2f2;
      color: var(--danger);
      border-color: #fecaca;
    }


    /* =========================================================
       MAIN
    ========================================================= */

    .main {
      width: min(1280px, calc(100% - 32px));

      margin: 0 auto;

      padding: 28px 0 60px;
    }


    /* =========================================================
       WELCOME
    ========================================================= */

    .welcome {
      position: relative;

      overflow: hidden;

      padding: 28px;

      margin-bottom: 30px;

      border: 1px solid #dff0e3;
      border-radius: var(--radius-lg);

      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(22, 163, 74, 0.14),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #ffffff 0%,
          #f4fbf6 100%
        );

      box-shadow: var(--shadow);
    }

    .welcome-label {
      display: inline-flex;

      padding: 5px 10px;

      margin-bottom: 10px;

      border-radius: 999px;

      background: var(--primary-soft);
      color: var(--primary-dark);

      font-size: 11px;
      font-weight: 800;
    }

    .welcome-title {
      margin: 0;

      font-size: clamp(23px, 4vw, 32px);
      line-height: 1.25;
      font-weight: 850;
    }

    .welcome-description {
      margin: 9px 0 0;

      max-width: 720px;

      color: var(--text-soft);

      font-size: 14px;
      line-height: 1.7;
    }


    /* =========================================================
       MENU SECTION
    ========================================================= */

    .menu-section {
      margin-top: 30px;
    }

    .menu-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-bottom: 13px;
    }

    .menu-section-title {
      display: flex;
      align-items: center;

      gap: 9px;

      margin: 0;

      font-size: 17px;
      font-weight: 800;
    }

    .menu-section-title::before {
      content: "";

      width: 4px;
      height: 22px;

      border-radius: 99px;

      background: var(--primary);
    }

    .menu-count {
      color: var(--text-soft);

      font-size: 11px;
      font-weight: 600;
    }


    /* =========================================================
       MENU GRID
    ========================================================= */

    .menu-grid {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 14px;
    }

    .menu-card {
      position: relative;

      min-height: 145px;

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      padding: 17px;

      border: 1px solid var(--border);
      border-radius: var(--radius-md);

      background: white;

      box-shadow:
        0 4px 15px rgba(20, 40, 25, 0.035);

      text-decoration: none;

      color: var(--text);

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        border-color 0.18s ease;
    }

    .menu-card:hover {
      transform: translateY(-3px);

      border-color: #b9dfc3;

      box-shadow: var(--shadow-hover);
    }

    .menu-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      gap: 8px;
    }

    .menu-icon {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 13px;

      background: var(--primary-soft);
      color: var(--primary);

      font-size: 18px;
      font-weight: 900;
    }

    .menu-arrow {
      color: #a1aaa5;

      font-size: 17px;

      transition: 0.18s ease;
    }

    .menu-card:hover .menu-arrow {
      color: var(--primary);
      transform: translate(2px, -2px);
    }

    .menu-name {
      margin-top: 15px;

      font-size: 14px;
      font-weight: 750;

      line-height: 1.45;

      word-break: break-word;
    }


    /* =========================================================
       EMPTY
    ========================================================= */

    .empty-card {
      padding: 35px 20px;

      border: 1px dashed #cbd5ce;
      border-radius: var(--radius-md);

      background: white;

      color: var(--text-soft);

      text-align: center;
    }


    /* =========================================================
       SESSION BAR
    ========================================================= */

    .session-bar {
      position: fixed;
      left: 16px;
      bottom: 16px;

      z-index: 90;

      display: flex;
      align-items: center;

      gap: 7px;

      padding: 7px 11px;

      border: 1px solid var(--border);
      border-radius: 999px;

      background: rgba(255, 255, 255, 0.92);

      box-shadow: 0 8px 25px rgba(20, 40, 25, 0.08);

      color: var(--text-soft);

      font-size: 10px;

      backdrop-filter: blur(12px);
    }

    .session-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--primary);
    }


    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 1050px) {
      .menu-grid {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }
    }


    @media (max-width: 700px) {

      .topbar-inner {
        width: min(100% - 20px, 1280px);
        min-height: 64px;
      }

      .brand-subtitle {
        display: none;
      }

      .user-info {
        display: none;
      }

      .main {
        width: calc(100% - 20px);
        padding-top: 18px;
      }

      .welcome {
        padding: 21px;
        margin-bottom: 23px;
      }

      .welcome-description {
        font-size: 13px;
      }

      .menu-grid {
        /*
         * IMPORTANT:
         * Mobile = อย่างน้อย 3 เมนูต่อแถว
         */
        grid-template-columns:
          repeat(3, minmax(0, 1fr));

        gap: 8px;
      }

      .menu-card {
        min-height: 118px;

        padding: 10px;

        border-radius: 13px;
      }

      .menu-icon {
        width: 34px;
        height: 34px;

        border-radius: 10px;

        font-size: 14px;
      }

      .menu-arrow {
        font-size: 13px;
      }

      .menu-name {
        margin-top: 8px;

        font-size: 11.5px;
        line-height: 1.35;
      }

      .menu-section-title {
        font-size: 15px;
      }

      .menu-count {
        font-size: 10px;
      }
    }


    @media (max-width: 360px) {

      .topbar-inner {
        width: calc(100% - 14px);
      }

      .main {
        width: calc(100% - 14px);
      }

      .brand-title {
        font-size: 15px;
      }

      .avatar {
        width: 36px;
        height: 36px;
        flex-basis: 36px;
      }

      .logout-btn {
        width: 36px;
        height: 36px;
      }

      .menu-grid {
        gap: 6px;
      }

      .menu-card {
        min-height: 110px;
        padding: 8px;
      }

      .menu-name {
        font-size: 10.5px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================================
       LOADING
  ========================================================== -->

  <div id="loadingScreen">

      </div>

        id="loadingMessage"
        style="
          margin-top:7px;

      >

            </div>

        <h1 class="welcome-title">

        <p class="welcome-description">

<script>
/* ============================================================
   CONFIG
============================================================ */

const LIFF_ID =
  "2011487100-dldPQItq";

const CENTRAL_API_URL =
  "https://script.google.com/macros/s/AKfycbwphhIdSMHpTWHuFrRFTC3lEZe-QQCaZr2cebxb22C0e9ph1eYPscyrxdw29T44DaUT9/exec";


const SESSION_KEY =
  "portalSessionId";


const SESSION_MINUTES =
  60;


const KEEP_ALIVE_MINUTES =
  10;


/* ============================================================
   STATE
============================================================ */

let currentUser = null;

let keepAliveTimer = null;

let inactivityTimer = null;


/* ============================================================
   ELEMENTS
============================================================ */

const loadingScreen =
  document.getElementById("loadingScreen");

const loadingMessage =
  document.getElementById("loadingMessage");

const errorScreen =
  document.getElementById("errorScreen");

const errorMessage =
  document.getElementById("errorMessage");

const retryButton =
  document.getElementById("retryButton");

const app =
  document.getElementById("app");

const menuContainer =
  document.getElementById("menuContainer");

const userName =
  document.getElementById("userName");

const userRole =
  document.getElementById("userRole");

const userAvatar =
  document.getElementById("userAvatar");

const welcomeName =
  document.getElementById("welcomeName");

const logoutButton =
  document.getElementById("logoutButton");


/* ============================================================
   API REQUEST
   ============================================================
   IMPORTANT:
   ใช้ text/plain เพื่อหลีกเลี่ยง CORS preflight
============================================================ */

async function portalRequest(action, payload = {}) {

  const body = {
    action: action,
    ...payload
  };

  let response;

  try {

    response = await fetch(
      CENTRAL_API_URL,
      {
        method: "POST",

        /*
         * ห้ามเปลี่ยนเป็น application/json
         * เพราะจะทำให้ browser อาจส่ง OPTIONS preflight
         * และเกิด Failed to fetch กับ Apps Script ได้
         */
        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify(body),

        redirect: "follow"
      }
    );

  } catch (error) {

    console.error(
      "portalRequest fetch error:",
      error
    );

    throw new Error(
      "Failed to fetch Portal API"
    );
  }


  const text =
    await response.text();


  if (!response.ok) {

    throw new Error(
      "Portal API HTTP " +
      response.status
    );
  }


  let result;

  try {

    result =
      JSON.parse(text);

  } catch (error) {

    console.error(
      "Invalid API response:",
      text
    );

    throw new Error(
      "Portal API ส่งข้อมูลกลับมาไม่ถูกต้อง"
    );
  }


  if (
    result &&
    result.status === "error"
  ) {

    throw new Error(
      result.message ||
      "Portal API error"
    );
  }


  return result;
}


/* ============================================================
   LIFF
============================================================ */

async function initLIFF() {

  try {

    loadingMessage.textContent =
      "กำลังเชื่อมต่อ LINE...";


    await liff.init({
      liffId: LIFF_ID
    });


    console.log(
      "LIFF initialized"
    );


    if (!liff.isLoggedIn()) {

      loadingMessage.textContent =
        "กำลังเข้าสู่ระบบ LINE...";

      liff.login();

      return false;
    }


    return true;

  } catch (error) {

    console.error(
      "LIFF init error:",
      error
    );

    throw new Error(
      "ไม่สามารถเชื่อมต่อ LINE ได้: " +
      error.message
    );
  }
}


/* ============================================================
   LOGIN
============================================================ */

async function loginWithLINE() {

  loadingMessage.textContent =
    "กำลังตรวจสอบข้อมูลผู้ใช้งาน...";


  const profile =
    await liff.getProfile();


  console.log(
    "LINE UID:",
    profile.userId
  );


  /*
   * checkUser เดิม
   */
  const result =
    await portalRequest(
      "checkUser",
      {
        userId: profile.userId,

        profile: {
          userId: profile.userId,
          displayName: profile.displayName || "",
          pictureUrl: profile.pictureUrl || ""
        }
      }
    );


  if (
    !result ||
    result.status !== "success"
  ) {

    throw new Error(
      result?.message ||
      "เข้าสู่ระบบไม่สำเร็จ"
    );
  }


  /*
   * รองรับทั้ง result.user และ result.session
   */
  currentUser =
    result.user ||
    result.session ||
    null;


  /*
   * ถ้า API ส่ง sessionId กลับมา
   */
  if (result.sessionId) {

    sessionStorage.setItem(
      SESSION_KEY,
      result.sessionId
    );
  }


  /*
   * ถ้า user object มี sessionId
   */
  if (
    currentUser &&
    currentUser.sessionId
  ) {

    sessionStorage.setItem(
      SESSION_KEY,
      currentUser.sessionId
    );
  }


  return result;
}


/* ============================================================
   VERIFY SESSION
============================================================ */

async function verifyExistingSession() {

  const sessionId =
    sessionStorage.getItem(
      SESSION_KEY
    );


  if (!sessionId) {

    return false;
  }


  loadingMessage.textContent =
    "กำลังตรวจสอบ Session...";


  try {

    const result =
      await portalRequest(
        "verifySession",
        {
          sessionId: sessionId
        }
      );


    if (
      result &&
      result.status === "success"
    ) {

      currentUser =
        result.session ||
        result.user ||
        null;


      return true;
    }


  } catch (error) {

    console.warn(
      "Existing session invalid:",
      error.message
    );

    sessionStorage.removeItem(
      SESSION_KEY
    );
  }


  return false;
}


/* ============================================================
   GET MENU
============================================================ */

async function loadMenu() {

  const sessionId =
    sessionStorage.getItem(
      SESSION_KEY
    );


  if (!sessionId) {

    throw new Error(
      "ไม่พบ Session"
    );
  }


  loadingMessage.textContent =
    "กำลังโหลดเมนู...";


  const result =
    await portalRequest(
      "getMenu",
      {
        sessionId: sessionId
      }
    );


  if (
    !result ||
    result.status !== "success"
  ) {

    throw new Error(
      result?.message ||
      "ไม่สามารถโหลดเมนูได้"
    );
  }


  renderDashboard(
    result.menuGroups || []
  );
}


/* ============================================================
   RENDER DASHBOARD
   ============================================================
   UI ONLY:
   - group เรียงเลขน้อย -> มาก
   - ไม่แสดงเลข group
   - แสดง menuGroup
   - แสดง menuName
   - ไม่แสดง menuId
============================================================ */

function renderDashboard(menuGroups) {

  menuContainer.innerHTML = "";


  if (
    !Array.isArray(menuGroups) ||
    menuGroups.length === 0
  ) {

    menuContainer.innerHTML = `
      <div class="empty-card">
        ไม่พบเมนูที่คุณมีสิทธิ์เข้าถึง
      </div>
    `;

    return;
  }


  /*
   * เรียง group จากน้อยไปมาก
   *
   * สำคัญ:
   * ไม่แก้ข้อมูลต้นฉบับจาก API
   */
  const sortedGroups =
    [...menuGroups].sort(
      (a, b) =>
        Number(a.group || 0) -
        Number(b.group || 0)
    );


  let iconIndex = 0;


  sortedGroups.forEach(
    groupData => {

      /*
       * รองรับโครงสร้างเดิม:
       *
       * {
       *   group,
       *   menuGroups: [...]
       * }
       */

      const subGroups =
        Array.isArray(
          groupData.menuGroups
        )
          ? groupData.menuGroups
          : [];


      /*
       * เรียง menuGroup ตามลำดับที่ API ส่งมา
       */
      subGroups.forEach(
        subGroup => {

          const menus =
            Array.isArray(
              subGroup.menus
            )
              ? subGroup.menus
              : [];


          /*
           * UI เดิมจะไม่แสดงเมนูที่ไม่มี URL
           * เพราะไม่มีปลายทางให้เปิด
           */
          const validMenus =
            menus.filter(
              menu =>
                menu &&
                menu.menuUrl &&
                sanitizeUrl(
                  menu.menuUrl
                )
            );


          if (
            validMenus.length === 0
          ) {

            return;
          }


          /*
           * ใช้ menuGroup เป็นหัวข้อ
           * ไม่แสดงเลข group
           */
          const section =
            document.createElement(
              "section"
            );

            section.className =
              "menu-section";


          const header =
            document.createElement(
              "div"
            );

          header.className =
            "menu-section-header";


          const title =
            document.createElement(
              "h2"
            );

          title.className =
            "menu-section-title";


          title.textContent =
            subGroup.menuGroup ||
            "ระบบ";


          const count =
            document.createElement(
              "span"
            );

          count.className =
            "menu-count";


          count.textContent =
            validMenus.length +
            " เมนู";


          header.appendChild(title);
          header.appendChild(count);


          const grid =
            document.createElement(
              "div"
            );

          grid.className =
            "menu-grid";


          validMenus.forEach(
            menu => {

              const url =
                sanitizeUrl(
                  menu.menuUrl
                );


              if (!url) {
                return;
              }


              const card =
                document.createElement(
                  "a"
                );


              card.className =
                "menu-card";


              card.href =
                url;


              card.target =
                "_blank";


              card.rel =
                "noopener noreferrer";


              /*
               * ไม่แสดง menuId
               * ใช้ menuName เท่านั้น
               */
              card.innerHTML = `
                <div class="menu-card-top">

                  <div class="menu-icon">
                    ${getMenuIcon(iconIndex)}
                  </div>

                  <div class="menu-arrow">
                    ↗
                  </div>

                </div>

                <div class="menu-name">
                  ${escapeHtml(
                    menu.menuName ||
                    "เมนู"
                  )}
                </div>
              `;


              grid.appendChild(card);


              iconIndex++;
            }
          );


          section.appendChild(header);
          section.appendChild(grid);

          menuContainer.appendChild(section);

        }
      );

    }
  );


  if (
    menuContainer.children.length === 0
  ) {

    menuContainer.innerHTML = `
      <div class="empty-card">
        ไม่พบเมนูที่พร้อมใช้งาน
      </div>
    `;
  }
}


/* ============================================================
   MENU ICON
   ============================================================ */

function getMenuIcon(index) {

  const icons = [
    "⌂",
    "▦",
    "✓",
    "▤",
    "⚙",
    "◉",
    "◆",
    "▣",
    "＋",
    "☰"
  ];


  return icons[
    index % icons.length
  ];
}


/* ============================================================
   SANITIZE URL
============================================================ */

function sanitizeUrl(url) {

  if (!url) {
    return "";
  }


  try {

    const value =
      String(url).trim();


    if (!value) {
      return "";
    }


    const parsed =
      new URL(value);


    /*
     * อนุญาตเฉพาะ HTTPS
     */
    if (
      parsed.protocol !== "https:"
    ) {

      return "";
    }


    return parsed.href;

  } catch (error) {

    return "";
  }
}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/* ============================================================
   USER UI
============================================================ */

function renderUser(user) {

  if (!user) {
    return;
  }


  const name =
    user.name ||
    user.displayName ||
    "ผู้ใช้งาน";


  const role =
    user.role ||
    user.Job_Position ||
    "USER";


  userName.textContent =
    name;


  welcomeName.textContent =
    name;


  userRole.textContent =
    role;


  userAvatar.textContent =
    getInitials(name);
}


/* ============================================================
   INITIALS
============================================================ */

function getInitials(name) {

  const text =
    String(name || "")
      .trim();


  if (!text) {
    return "U";
  }


  /*
   * ภาษาไทยไม่เหมาะกับการ split แบบภาษาอังกฤษ
   * จึงใช้ตัวแรกเป็นหลัก
   */
  return text.substring(
    0,
    1
  ).toUpperCase();
}


/* ============================================================
   KEEP ALIVE
============================================================ */

function startKeepAlive() {

  stopKeepAlive();


  keepAliveTimer =
    setInterval(
      async () => {

        const sessionId =
          sessionStorage.getItem(
            SESSION_KEY
          );


        if (!sessionId) {
          return;
        }


        try {

          const result =
            await portalRequest(
              "keepAlive",
              {
                sessionId:
                  sessionId
              }
            );


          if (
            result.status !==
            "success"
          ) {

            console.warn(
              "KeepAlive failed"
            );

            sessionExpired();
          }


        } catch (error) {

          console.warn(
            "KeepAlive error:",
            error.message
          );

        }

      },
      KEEP_ALIVE_MINUTES *
      60 *
      1000
    );
}


function stopKeepAlive() {

  if (keepAliveTimer) {

    clearInterval(
      keepAliveTimer
    );

    keepAliveTimer =
      null;
  }
}


/* ============================================================
   INACTIVITY
============================================================ */

function startInactivityTimer() {

  resetInactivityTimer();


  const events = [
    "click",
    "mousemove",
    "keydown",
    "touchstart",
    "scroll"
  ];


  events.forEach(
    eventName => {

      document.addEventListener(
        eventName,
        resetInactivityTimer,
        {
          passive: true
        }
      );

    }
  );
}


function resetInactivityTimer() {

  if (inactivityTimer) {

    clearTimeout(
      inactivityTimer
    );
  }


  inactivityTimer =
    setTimeout(
      () => {

        sessionExpired();

      },
      SESSION_MINUTES *
      60 *
      1000
    );
}


/* ============================================================
   SESSION EXPIRED
============================================================ */

function sessionExpired() {

  stopKeepAlive();


  sessionStorage.removeItem(
    SESSION_KEY
  );


  showError(
    "Session หมดอายุ กรุณาเข้าสู่ระบบใหม่"
  );
}


/* ============================================================
   LOGOUT
============================================================ */

async function logout() {

  const sessionId =
    sessionStorage.getItem(
      SESSION_KEY
    );


  stopKeepAlive();


  try {

    if (sessionId) {

      await portalRequest(
        "logout",
        {
          sessionId:
            sessionId
        }
      );
    }

  } catch (error) {

    console.warn(
      "Logout API error:",
      error.message
    );

  } finally {

    sessionStorage.removeItem(
      SESSION_KEY
    );


    /*
     * ไม่เรียก liff.logout()
     *
     * เพื่อให้ refresh / กลับเข้า Portal
     * ไม่เกิดปัญหา LINE Login โดยไม่จำเป็น
     */

    location.reload();
  }
}


/* ============================================================
   SHOW APP
============================================================ */

function showApp() {

  loadingScreen.classList.add(
    "hidden"
  );

  errorScreen.classList.add(
    "hidden"
  );

  app.classList.remove(
    "hidden"
  );
}


/* ============================================================
   SHOW ERROR
============================================================ */

function showError(message) {

  loadingScreen.classList.add(
    "hidden"
  );

  app.classList.add(
    "hidden"
  );

  errorMessage.textContent =
    message ||
    "เกิดข้อผิดพลาด";

  errorScreen.classList.remove(
    "hidden"
  );
}


/* ============================================================
   MAIN
============================================================ */

async function startPortal() {

  try {

    /*
     * 1. LIFF
     */
    const liffReady =
      await initLIFF();


    if (!liffReady) {
      return;
    }


    /*
     * 2. ตรวจ Session เดิมก่อน
     *
     * เพื่อรองรับ refresh
     */
    let sessionValid =
      await verifyExistingSession();


    /*
     * 3. ถ้าไม่มี Session
     *    ให้ login ผ่าน LINE
     */
    if (!sessionValid) {

      await loginWithLINE();


      /*
       * หลัง login
       * ต้องตรวจ Session อีกครั้ง
       */
      sessionValid =
        await verifyExistingSession();


      /*
       * กรณี API login ส่ง sessionId
       * แต่ verifySession ยังไม่ผ่าน
       */
      if (!sessionValid) {

        const sessionId =
          sessionStorage.getItem(
            SESSION_KEY
          );


        if (!sessionId) {

          throw new Error(
            "เข้าสู่ระบบสำเร็จ แต่ไม่พบ Session"
          );
        }
      }
    }


    /*
     * 4. User UI
     */
    renderUser(
      currentUser
    );


    /*
     * 5. Menu
     */
    await loadMenu();


    /*
     * 6. Session timer
     */
    startKeepAlive();

    startInactivityTimer();


    /*
     * 7. Show
     */
    showApp();


    console.log(
      "Portal ready"
    );

  } catch (error) {

    console.error(
      "Portal startup error:",
      error
    );


    showError(
      error.message ||
      "ไม่สามารถเข้าสู่ระบบได้"
    );
  }
}


/* ============================================================
   EVENTS
============================================================ */

logoutButton.addEventListener(
  "click",
  async () => {

    const confirmed =
      confirm(
        "ต้องการออกจากระบบหรือไม่?"
      );


    if (!confirmed) {
      return;
    }


    await logout();
  }
);


retryButton.addEventListener(
  "click",
  () => {

    location.reload();

  }
);


/* ============================================================
   START
============================================================ */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    startPortal();

  }
);

</script>
