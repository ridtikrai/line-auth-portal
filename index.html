<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centralized Dashboard</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  
  <!-- LINE Template Colors -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            linePrimary: '#0084FF',
            lineLightBg: '#F7F7F7',
            lineDarkGray: '#6C757D'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-lineLightBg font-sans text-gray-800 antialiased min-h-screen flex flex-col">

  <!-- Header Classic Design -->
  <header class="bg-gradient-to-r from-linePrimary to-blue-700 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <img id="profile-img" src="" alt="Profile" class="h-10 w-10 rounded-full border-2 border-white hidden object-cover shadow-sm">
        <div>
          <h1 class="text-base font-bold tracking-wide leading-tight">Portal System</h1>
          <p id="user-info" class="text-[11px] opacity-90">กำลังตรวจสอบ...</p>
        </div>
      </div>
      
      <div class="flex flex-col items-end gap-1">
        <!-- ออกจากระบบ -->
        <button onclick="logoutApp()" class="text-[11px] sm:text-xs bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded border border-white/30 transition flex items-center shadow-sm font-medium">
          ออกจากระบบ
        </button>
        <!-- Auto TimeOut 60 นาที -->
        <div class="text-[9px] sm:text-[10px] opacity-90 flex items-center gap-1 mt-0.5 px-2 py-0.5 rounded bg-black/10">
          <span>⏱️</span>
          <span id="timer-display" class="font-mono font-bold tracking-wider">60:00</span>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 flex-grow w-full">
    
    <!-- 1. Loading -->
    <div id="loading-screen" class="flex flex-col items-center justify-center py-20">
      <div class="animate-spin rounded-full h-10 w-10 border-b-4 border-linePrimary mb-4"></div>
      <p class="text-lineDarkGray text-sm font-medium">กำลังโหลดเมนูระบบ...</p>
    </div>

    <!-- 2. Verify Phone -->
    <div id="register-screen" class="hidden max-w-md mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-6">
      <h2 class="text-xl font-bold mb-2">ลงทะเบียนใช้งาน</h2>
      <p class="text-sm text-lineDarkGray mb-5">กรุณากรอกเบอร์โทรศัพท์เพื่อยืนยันตัวตน</p>
      <form id="phone-form" class="space-y-4">
        <div>
          <input type="text" id="phone-input" maxlength="10" required
            class="w-full p-4 border border-gray-300 rounded-lg focus:outline-none focus:border-linePrimary text-center tracking-widest text-lg"
            placeholder="08xxxxxxxx" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        </div>
        <!-- Button size optimized for Touch-Friendly[cite: 1] -->
        <button type="submit" class="w-full bg-linePrimary text-white font-bold py-3.5 rounded-lg hover:bg-blue-700 transition">
          ตรวจสอบข้อมูล
        </button>
      </form>
    </div>

    <!-- 3. Copy User ID Screen -->
    <div id="copy-screen" class="hidden max-w-md mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-6 text-center">
      <div class="text-4xl mb-3">📱</div>
      <h2 class="text-lg font-bold mb-2">ยืนยันสำเร็จ</h2>
      <p class="text-sm text-lineDarkGray mb-4">คัดลอกรหัสอ้างอิงส่งให้ Admin เพื่อบันทึกข้อมูล</p>
      <div class="bg-gray-100 p-3 rounded-lg mb-4 font-mono text-xs break-all border border-gray-200 select-all" id="display-userid"></div>
      <button onclick="copyUserId()" class="w-full bg-green-500 text-white font-bold py-3 rounded-lg hover:bg-green-600 transition">
        คัดลอกรหัสอ้างอิง
      </button>
    </div>

    <!-- 4. Error Screen -->
    <div id="error-screen" class="hidden max-w-md mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-8 text-center">
      <div class="text-4xl mb-3 text-red-500">⚠️</div>
      <h2 id="error-title" class="text-lg font-bold mb-2">ข้อผิดพลาด</h2>
      <p id="error-message" class="text-sm text-lineDarkGray mb-5">-</p>
      <button onclick="showScreen('register-screen')" class="w-full bg-gray-200 text-gray-700 font-bold py-3.5 rounded-lg transition hover:bg-gray-300">
        กลับไปกรอกเบอร์โทรใหม่
      </button>
    </div>

    <!-- 5. Dashboard Menu Groups -->
    <div id="dashboard-screen" class="hidden pb-10">
      <div id="menu-container" class="space-y-6"></div>
    </div>

  </main>

  <script>
    // ==========================================
    // Version 2 - Portal Authentication
    // ==========================================
    const LIFF_ID = "2011487100-dldPQItq";
    //const CENTRAL_API_URL = "https://script.google.com/macros/s/AKfycbzDpOrouurlO_Wlr5RikWVYf8gAmQcN-TTC8yIk7nKLLEvwjYRio5utMrEdxUm4m5Ia/exec";
    const CENTRAL_API_URL = "https://script.google.com/macros/s/AKfycbwphhIdSMHpTWHuFrRFTC3lEZe-QQCaZr2cebxb22cE9ph1eYPscyrxdw29T44DaUT9/exec";

    // Session policy
    const INACTIVITY_LIMIT = 60 * 60;          // 60 นาที
    const KEEP_ALIVE_INTERVAL = 10 * 60 * 1000; // 10 นาที

    let lineProfile = null;
    let clientInfo = {
      ip: "Unknown",
      location: "Unknown",
      device: navigator.userAgent
    };

    let portalSessionId = null;
    let timeRemaining = INACTIVITY_LIMIT;
    let timerInterval = null;
    let keepAliveInterval = null;
    let lastActivityAt = Date.now();
    let isLoggingOut = false;

    // ------------------------------------------------
    // เริ่มต้นระบบ
    // ------------------------------------------------
    async function initApp() {
      try {
        showScreen('loading-screen');

        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        // LINE Profile ใช้สำหรับแสดงข้อมูลและ registration flow
        // การอนุญาตเข้า Portal จริงต้องผ่าน Central Auth + Emp + Session
        lineProfile = await liff.getProfile();

        document.getElementById('profile-img').src =
          lineProfile.pictureUrl || "";
        document.getElementById('profile-img').classList.remove('hidden');

        await fetchClientInfo();

        // Login จริง:
        // Central Auth ตรวจ LINE UID กับ Emp.userId
        // ถ้าไม่พบ/ยังไม่ผูก -> registration
        // ถ้าผูกและ Active -> สร้าง Portal Session
        await loginToPortal();

      } catch (err) {
        console.error(err);
        showError(
          "พบข้อผิดพลาด",
          "ไม่สามารถเชื่อมต่อ LINE หรือระบบยืนยันตัวตนได้"
        );
      }
    }

    // ------------------------------------------------
    // Login -> Central Auth
    // ------------------------------------------------
    async function loginToPortal() {
      showScreen('loading-screen');

      try {
        const response = await fetch(CENTRAL_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify({
            action: 'login',

            // UID นี้ได้จาก LINE LIFF หลัง liff.getProfile()
            // Central Auth ต้องตรวจสอบกับ Emp.userId
            userId: lineProfile.userId,

            profile: {
              displayName: lineProfile.displayName || "",
              pictureUrl: lineProfile.pictureUrl || ""
            },

            clientInfo: clientInfo
          })
        });

        const data = await response.json();

        if (data.status === 'not_registered') {
          // ยังไม่ผูก LINE UID กับ Emp
          showScreen('register-screen');
          document.getElementById('user-info').textContent =
            'กรุณายืนยันตัวตนด้วยเบอร์โทรศัพท์';
          return;
        }

        if (data.status === 'error') {
          showError(
            "ไม่สามารถเข้าใช้งานได้",
            data.message || "บัญชีไม่สามารถใช้งานได้"
          );
          return;
        }

        if (data.status !== 'success') {
          showError(
            "เข้าสู่ระบบไม่สำเร็จ",
            data.message || "เกิดข้อผิดพลาดในระบบ"
          );
          return;
        }

        // สำคัญ:
        // เก็บเฉพาะ Session ID ไม่ใช้ LINE UID เป็น Session Credential
        portalSessionId = data.sessionId;

        if (!portalSessionId) {
          throw new Error("Central Auth ไม่ได้ส่ง sessionId กลับมา");
        }

        // sessionStorage เหมาะสำหรับเก็บ session ระหว่าง tab/page
        // แต่ไม่ใช่ HttpOnly cookie และยังต้องป้องกัน XSS ฝั่งหน้าเว็บ
        sessionStorage.setItem('portalSessionId', portalSessionId);

        renderDashboard(data);
        startActivityTracker();

      } catch (error) {
        console.error(error);
        showError(
          "พบข้อผิดพลาด",
          "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้"
        );
      }
    }

    // ------------------------------------------------
    // Activity / Inactivity Timeout
    // ------------------------------------------------
    function startActivityTracker() {
      stopActivityTracker();

      lastActivityAt = Date.now();
      timeRemaining = INACTIVITY_LIMIT;

      const markActivity = () => {
        lastActivityAt = Date.now();
        timeRemaining = INACTIVITY_LIMIT;
      };

      [
        'mousemove',
        'keydown',
        'touchstart',
        'scroll',
        'click'
      ].forEach(evt => {
        window.addEventListener(evt, markActivity, { passive: true });
      });

      timerInterval = setInterval(async () => {
        const idleSeconds =
          Math.floor((Date.now() - lastActivityAt) / 1000);

        timeRemaining = Math.max(
          0,
          INACTIVITY_LIMIT - idleSeconds
        );

        updateTimerDisplay();

        if (timeRemaining <= 0) {
          await forceLogout(
            "หมดเวลาการเชื่อมต่อเนื่องจากไม่มีการใช้งาน 60 นาที"
          );
        }
      }, 1000);

      // ต่ออายุ Server Session ทุก 10 นาที
      keepAliveInterval = setInterval(async () => {
        if (isLoggingOut || !portalSessionId) return;

        // ไม่ต่ออายุถ้าใกล้หมด inactivity
        if (timeRemaining <= 300) return;

        await keepAlive();
      }, KEEP_ALIVE_INTERVAL);

      updateTimerDisplay();
    }

    function stopActivityTracker() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }

      if (keepAliveInterval) {
        clearInterval(keepAliveInterval);
        keepAliveInterval = null;
      }
    }

    function updateTimerDisplay() {
      const total = Math.max(0, timeRemaining);
      const m = Math.floor(total / 60).toString().padStart(2, '0');
      const s = (total % 60).toString().padStart(2, '0');

      const el = document.getElementById('timer-display');
      if (el) el.textContent = `${m}:${s}`;
    }

    // ------------------------------------------------
    // KeepAlive
    // ------------------------------------------------
    async function keepAlive() {
      try {
        const response = await fetch(CENTRAL_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify({
            action: 'keepAlive',
            sessionId: portalSessionId
          })
        });

        const data = await response.json();

        if (data.status !== 'success') {
          await forceLogout("Session หมดอายุ กรุณาเข้าสู่ระบบใหม่");
        }

      } catch (error) {
        console.error("KeepAlive failed:", error);
        // ไม่ Logout ทันทีเพราะอาจเป็น network ชั่วคราว
      }
    }

    // ------------------------------------------------
    // ตรวจสอบ Session กับ Server
    // ------------------------------------------------
    async function verifyPortalSession() {
      if (!portalSessionId) return false;

      try {
        const response = await fetch(CENTRAL_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify({
            action: 'verifySession',
            sessionId: portalSessionId,
            menuId: 'PORTAL'
          })
        });

        const data = await response.json();
        return data.status === 'success';

      } catch (error) {
        console.error("verifySession failed:", error);
        return false;
      }
    }

    // ------------------------------------------------
    // Verify Phone - Registration Flow เดิม
    // ------------------------------------------------
    document.getElementById('phone-form').addEventListener(
      'submit',
      async (e) => {
        e.preventDefault();

        const phoneInput =
          document.getElementById('phone-input').value.trim();

        if (!/^\d{10}$/.test(phoneInput)) {
          alert("กรุณากรอกเบอร์โทรศัพท์ 10 หลัก");
          return;
        }

        showScreen('loading-screen');

        try {
          const response = await fetch(CENTRAL_API_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify({
              action: 'verifyPhone',

              // UID จาก LINE
              userId: lineProfile.userId,

              phone: phoneInput,

              profile: {
                displayName: lineProfile.displayName || "",
                pictureUrl: lineProfile.pictureUrl || ""
              },

              clientInfo: clientInfo
            })
          });

          const data = await response.json();

          if (data.status === 'show_userid') {
            showScreen('copy-screen');

            // ใช้ UID ที่ Server ส่งกลับ
            document.getElementById('display-userid').textContent =
              data.lineUserId || lineProfile.userId;

          } else {
            showError(
              "ตรวจสอบไม่สำเร็จ",
              data.message || "ไม่สามารถตรวจสอบข้อมูลได้"
            );
          }

        } catch (error) {
          console.error(error);
          showError(
            "การตรวจสอบล้มเหลว",
            "โปรดลองอีกครั้ง"
          );
        }
      }
    );

    // ------------------------------------------------
    // Copy LINE UID -> ส่งให้ Admin
    // ------------------------------------------------
    function copyUserId() {
      const uid =
        lineProfile?.userId || "";

      if (!uid) {
        alert("ไม่พบ LINE UID");
        return;
      }

      navigator.clipboard.writeText(uid)
        .then(() => {
          alert(
            "คัดลอกรหัสสำเร็จ นำส่ง Admin เพื่อดำเนินการผูกบัญชี"
          );
        })
        .catch(() => {
          alert(
            "ไม่สามารถคัดลอกอัตโนมัติ กรุณาคัดลอกรหัสจากหน้าจอ"
          );
        });
    }

    // ------------------------------------------------
    // Render Dashboard
    // ------------------------------------------------
    function renderDashboard(data) {
      showScreen('dashboard-screen');

      document.getElementById('user-info').textContent =
        `${escapeHtml(lineProfile.displayName)} | ตำแหน่ง: ${escapeHtml(data.jobPosition || '-')}`;

      const container =
        document.getElementById('menu-container');

      container.innerHTML = '';

      if (!data.menuGroups || data.menuGroups.length === 0) {
        container.innerHTML =
          `<div class="bg-white p-6 rounded-lg text-lineDarkGray text-center border shadow-sm">
             คุณไม่มีสิทธิ์เข้าถึงเมนูใดๆ
           </div>`;
        return;
      }

      data.menuGroups.forEach(group => {
        const groupSection = document.createElement('div');

        const menusHtml = group.menus.map(menu => {
          /*
           * Version 2:
           * ไม่ควรใช้ menuUrl เป็น Security Credential
           * ในขั้นถัดไปควรเปลี่ยน href เป็นการเรียก
           * createLaunchToken แล้วจึงไป Dashboard
           */
          const safeUrl = sanitizeUrl(menu.menuUrl);

          return `
            <a href="${safeUrl}"
               class="flex flex-col items-center justify-start p-3 sm:p-4 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md hover:border-linePrimary transition active:scale-95 h-full">
              <div class="bg-blue-50 text-linePrimary p-2.5 sm:p-3 rounded-full mb-2 sm:mb-3">
                <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
                  </path>
                </svg>
              </div>
              <h3 class="text-[11px] sm:text-xs font-bold text-gray-800 text-center leading-tight line-clamp-2 w-full">
                ${escapeHtml(menu.menuName || '')}
              </h3>
            </a>
          `;
        }).join('');

        groupSection.innerHTML = `
          <h2 class="text-[14px] font-bold text-linePrimary mb-3 tracking-wide pl-2 border-l-[3px] border-linePrimary leading-none">
            ${escapeHtml(group.groupName || 'ทั่วไป')}
          </h2>
          <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3 sm:gap-4">
            ${menusHtml}
          </div>
        `;

        container.appendChild(groupSection);
      });
    }

    // ------------------------------------------------
    // URL validation / HTML escaping
    // ------------------------------------------------
    function sanitizeUrl(url) {
      try {
        if (!url) return '#';

        const parsed = new URL(url, window.location.href);

        // ไม่อนุญาต javascript:, data:, vbscript:
        if (!['http:', 'https:'].includes(parsed.protocol)) {
          return '#';
        }

        return parsed.href;
      } catch (e) {
        return '#';
      }
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // ------------------------------------------------
    // Logout
    // ------------------------------------------------
    async function logoutApp() {
      if (isLoggingOut) return;

      isLoggingOut = true;
      stopActivityTracker();

      try {
        if (portalSessionId) {
          await fetch(CENTRAL_API_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify({
              action: 'logout',
              sessionId: portalSessionId
            })
          });
        }
      } catch (error) {
        console.error("Logout server error:", error);
      }

      sessionStorage.removeItem('portalSessionId');
      portalSessionId = null;

      try {
        if (liff.isLoggedIn()) {
          liff.logout();
        }
      } catch (e) {
        console.error("LINE logout error:", e);
      }

      window.location.reload();
    }

    async function forceLogout(message) {
      if (isLoggingOut) return;

      alert(message);
      await logoutApp();
    }

    // ------------------------------------------------
    // Client information
    // ------------------------------------------------
    async function fetchClientInfo() {
      try {
        const res = await fetch('https://ipapi.co/json/');

        if (res.ok) {
          const data = await res.json();

          clientInfo.ip = data.ip || "Unknown";
          clientInfo.location =
            `${data.city || "Unknown"}, ${data.country_name || "Unknown"}`;
        }
      } catch (e) {
        // ไม่ให้ระบบ Login ล้มเพียงเพราะบริการ IP lookup ใช้งานไม่ได้
      }
    }

    // ------------------------------------------------
    // Screen helper
    // ------------------------------------------------
    function showScreen(id) {
      [
        'loading-screen',
        'register-screen',
        'error-screen',
        'dashboard-screen',
        'copy-screen'
      ].forEach(s => {
        document.getElementById(s).classList.add('hidden');
      });

      document.getElementById(id).classList.remove('hidden');
    }

    function showError(title, message) {
      document.getElementById('error-title').textContent = title;
      document.getElementById('error-message').textContent = message;
      showScreen('error-screen');
    }

    window.onload = initApp;
</script>
</body>
</html>
