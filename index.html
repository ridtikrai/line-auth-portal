<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบศูนย์กลาง - หน้าหลัก</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 min-h-screen">

  <!-- Navbar -->
  <nav class="bg-blue-800 shadow-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <div class="flex items-center gap-3">
          <!-- Profile Image (Optional, will be injected) -->
          <img id="profile-img" src="https://via.placeholder.com/40" alt="Profile" class="h-10 w-10 rounded-full border-2 border-white hidden">
          <span class="text-white text-lg font-bold">Portal Systems</span>
        </div>
        <div class="flex items-center space-x-4">
          <div class="hidden sm:block text-blue-100 text-sm text-right">
            <div id="user-name" class="font-bold">...</div>
            <div id="user-role" class="text-xs">...</div>
          </div>
          <button onclick="handleLogout()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded text-sm shadow transition flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            <span class="hidden sm:inline">ออกจากระบบ</span>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Loading Screen -->
  <div id="loading-screen" class="flex flex-col items-center justify-center h-[80vh]">
    <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-blue-800 mb-4"></div>
    <p class="text-gray-600 font-medium">กำลังโหลดข้อมูลระบบ...</p>
  </div>

  <!-- Error Screen -->
  <div id="error-screen" class="hidden flex items-center justify-center h-[80vh] px-4">
    <div class="bg-white p-8 rounded-lg shadow-md max-w-md w-full text-center border-t-4 border-red-500">
      <svg class="w-16 h-16 text-red-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
      <h2 class="text-xl font-bold text-gray-800 mb-2">ข้อผิดพลาด</h2>
      <p id="error-message" class="text-gray-600">ไม่สามารถเข้าถึงระบบได้</p>
    </div>
  </div>

  <!-- Main Dashboard Content -->
  <div id="app-content" class="hidden max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-8">
      <h1 class="text-2xl sm:text-3xl font-bold text-gray-800">ระบบที่คุณมีสิทธิ์เข้าใช้งาน</h1>
      <p class="text-gray-500 mt-2">โปรดเลือกเมนูด้านล่างเพื่อเข้าสู่ระบบงานต่างๆ</p>
    </div>

    <!-- Container สำหรับแสดง Group Menu -->
    <div id="menu-container" class="space-y-8">
      <!-- จะถูกสร้างโดย JavaScript -->
    </div>
  </div>

  <script>
    // ==========================================
    // 1. CONFIGURATION
    // ==========================================
    const LIFF_ID = "2011487100-dldPQItq";
    const CENTRAL_API_URL = "https://script.google.com/macros/s/AKfycbzDpOrouurlO_Wlr5RikWVYf8gAmQcN-TTC8yIk7nKLLEvwjYRio5utMrEdxUm4m5Ia/exec"; // ใส่ URL Web App ของคุณ

    let lineProfile = null;

    // ==========================================
    // 2. INITIALIZATION
    // ==========================================
    async function initApp() {
      try {
        await liff.init({ liffId: LIFF_ID });
        
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          lineProfile = await liff.getProfile();
          
          // นำรูปโปรไฟล์มาแสดงที่ Navbar
          document.getElementById('profile-img').src = lineProfile.pictureUrl;
          document.getElementById('profile-img').classList.remove('hidden');
          
          await loadDashboard(lineProfile.userId);
        }
      } catch (err) {
        console.error("LIFF Init Error:", err);
        showError("ไม่สามารถเชื่อมต่อระบบ LINE ได้");
      }
    }

    // ==========================================
    // 3. API & FETCH DATA
    // ==========================================
    async function loadDashboard(userId) {
      try {
        const response = await fetch(CENTRAL_API_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'getMenuDashboard',
            userId: userId
          })
        });

        const data = await response.json();

        if (data.status === 'success') {
          renderDashboard(data);
        } else if (data.status === 'not_registered') {
          showError("คุณยังไม่ได้ลงทะเบียนเข้าใช้งานระบบ โปรดติดต่อผู้ดูแลระบบ");
        } else {
          showError(data.message || "เกิดข้อผิดพลาดในการตรวจสอบสิทธิ์");
        }
      } catch (error) {
        console.error("API Error:", error);
        showError("ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ โปรดลองใหม่อีกครั้ง");
      }
    }

    // ==========================================
    // 4. UI RENDERER
    // ==========================================
    function renderDashboard(data) {
      // ซ่อน Loading, แสดง App
      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('error-screen').classList.add('hidden');
      document.getElementById('app-content').classList.remove('hidden');

      // อัปเดตข้อมูลผู้ใช้บน Navbar
      document.getElementById('user-name').textContent = lineProfile.displayName || `รหัสพนักงาน: ${data.empId}`;
      document.getElementById('user-role').textContent = `ตำแหน่ง: ${data.jobPosition}`;

      const container = document.getElementById('menu-container');
      container.innerHTML = ''; // ล้างค่าเดิม

      // ตรวจสอบว่ามีเมนูหรือไม่
      if (!data.menuGroups || data.menuGroups.length === 0) {
        container.innerHTML = `
          <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4">
            <p class="text-yellow-700">คุณยังไม่มีสิทธิ์เข้าถึงเมนูใดๆ ในขณะนี้ โปรดติดต่อผู้ดูแลระบบ</p>
          </div>
        `;
        return;
      }

      // วนลูปสร้างกลุ่มเมนู
      data.menuGroups.forEach(group => {
        // สร้าง Header กลุ่ม
        const groupSection = document.createElement('div');
        
        let menusHtml = group.menus.map(menu => `
          <a href="${menu.menuUrl}" class="block group">
            <div class="bg-white border border-gray-200 rounded-lg p-5 shadow-sm hover:shadow-md hover:border-blue-500 transition duration-200 h-full flex flex-col justify-between cursor-pointer">
              <div class="flex items-center gap-4">
                <div class="bg-blue-100 p-3 rounded-lg text-blue-700 group-hover:bg-blue-600 group-hover:text-white transition">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                </div>
                <div>
                  <h3 class="text-lg font-semibold text-gray-800 group-hover:text-blue-700 transition">${menu.menuName}</h3>
                  <p class="text-sm text-gray-500 mt-1">คลิกเพื่อเข้าสู่ระบบงาน</p>
                </div>
              </div>
            </div>
          </a>
        `).join('');

        groupSection.innerHTML = `
          <h2 class="text-xl font-bold text-gray-700 border-b pb-2 mb-4">${group.groupName}</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            ${menusHtml}
          </div>
        `;
        
        container.appendChild(groupSection);
      });
    }

    // ==========================================
    // 5. UTILITIES
    // ==========================================
    function showError(message) {
      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('app-content').classList.add('hidden');
      document.getElementById('error-screen').classList.remove('hidden');
      document.getElementById('error-message').textContent = message;
    }

    function handleLogout() {
      if (liff.isLoggedIn()) {
        liff.logout();
        window.location.reload(); 
      }
    }

    // Start App
    window.onload = initApp;
  </script>
</body>
</html>
