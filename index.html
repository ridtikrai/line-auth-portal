<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Portal System</title>

  <!-- =========================================================
       External Libraries
       ========================================================= -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- =========================================================
       Tailwind Configuration
       ========================================================= -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            linePrimary: '#0084FF',
            lineLightBg: '#F7F7F7',
            lineDarkGray: '#6C757D'
          }
        }
      }
    };
  </script>

  <style>
    html,
    body {
      min-height: 100%;
    }

    body {
      -webkit-tap-highlight-color: transparent;
    }

    button,
    a {
      touch-action: manipulation;
    }

    .loading-spinner {
      border-top-color: transparent;
      border-right-color: transparent;
    }
  </style>
</head>

<body
  class="bg-lineLightBg font-sans text-gray-800 antialiased min-h-screen flex flex-col"
>

  <!-- =========================================================
       HEADER
       ========================================================= -->
  <header
    class="bg-gradient-to-r from-linePrimary to-blue-700 text-white shadow-md sticky top-0 z-50"
  >
    <div
      class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center gap-3"
    >

      <!-- User Profile -->
      <div class="flex items-center gap-3 min-w-0">

        <img
          id="profile-img"
          src=""
          alt="Profile"
          class="h-10 w-10 rounded-full border-2 border-white hidden object-cover shadow-sm flex-shrink-0"
        >

        <div class="min-w-0">
          <h1
            class="text-base font-bold tracking-wide leading-tight"
          >
            Portal System
          </h1>

          <p
            id="user-info"
            class="text-[11px] opacity-90 truncate max-w-[220px] sm:max-w-[400px]"
          >
            กำลังตรวจสอบ...
          </p>
        </div>

      </div>

      <!-- Header Actions -->
      <div
        class="flex flex-col items-end gap-1 flex-shrink-0"
      >

        <button
          id="logout-button"
          type="button"
          onclick="logoutApp()"
          class="text-[11px] sm:text-xs bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded border border-white/30 transition flex items-center shadow-sm font-medium"
        >
          ออกจากระบบ
        </button>

        <div
          class="text-[9px] sm:text-[10px] opacity-90 flex items-center gap-1 mt-0.5 px-2 py-0.5 rounded bg-black/10"
        >
          <span>⏱️</span>

          <span
            id="timer-display"
            class="font-mono font-bold tracking-wider"
          >
            60:00
          </span>
        </div>

      </div>

    </div>
  </header>


  <!-- =========================================================
       MAIN
       ========================================================= -->
  <main
    class="max-w-4xl mx-auto p-4 flex-grow w-full"
  >

    <!-- =======================================================
         1. LOADING SCREEN
         ======================================================= -->
    <section
      id="loading-screen"
      class="flex flex-col items-center justify-center py-20"
    >

      <div
        class="animate-spin rounded-full h-10 w-10 border-4 border-linePrimary loading-spinner mb-4"
      ></div>

      <p
        id="loading-message"
        class="text-lineDarkGray text-sm font-medium text-center"
      >
        กำลังตรวจสอบสิทธิ์การใช้งาน...
      </p>

    </section>


    <!-- =======================================================
         2. REGISTER / VERIFY PHONE
         ======================================================= -->
    <section
      id="register-screen"
      class="hidden max-w-md mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-6"
    >

      <div class="text-center mb-5">

        <div class="text-4xl mb-3">
          📱
        </div>

        <h2
          class="text-xl font-bold mb-2"
        >
          ลงทะเบียนใช้งาน
        </h2>

        <p
          id="register-message"
          class="text-sm text-lineDarkGray"
        >
          กรุณากรอกเบอร์โทรศัพท์เพื่อยืนยันตัวตน
        </p>

      </div>


      <form
        id="phone-form"
        class="space-y-4"
      >

        <div>

          <input
            type="tel"
            id="phone-input"
            maxlength="10"
            inputmode="numeric"
            autocomplete="tel"
            required
            class="w-full p-4 border border-gray-300 rounded-lg focus:outline-none focus:border-linePrimary text-center tracking-widest text-lg"
            placeholder="08xxxxxxxx"
          >

        </div>


        <button
          id="verify-phone-button"
          type="submit"
          class="w-full bg-linePrimary text-white font-bold py-3.5 rounded-lg hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed"
        >
          ตรวจสอบข้อมูล
        </button>

      </form>

    </section>


    <!-- =======================================================
         3. COPY LINE UID / WAIT ADMIN
         ======================================================= -->
    <section
      id="copy-screen"
      class="hidden max-w-md mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-6 text-center"
    >

      <div class="text-4xl mb-3">
        📱
      </div>

      <h2
        class="text-lg font-bold mb-2"
      >
        ยืนยันข้อมูลสำเร็จ
      </h2>

      <p
        class="text-sm text-lineDarkGray mb-4"
      >
        กรุณาคัดลอกรหัสอ้างอิงส่งให้ Admin เพื่อดำเนินการผูกบัญชี
      </p>

      <div
        id="display-userid"
        class="bg-gray-100 p-3 rounded-lg mb-4 font-mono text-xs break-all border border-gray-200 select-all"
      >
        -
      </div>

      <button
        type="button"
        onclick="copyUserId()"
        class="w-full bg-green-500 text-white font-bold py-3 rounded-lg hover:bg-green-600 transition"
      >
        คัดลอกรหัสอ้างอิง
      </button>

      <button
        type="button"
        onclick="logoutApp()"
        class="w-full mt-3 bg-gray-100 text-gray-700 font-bold py-3 rounded-lg hover:bg-gray-200 transition"
      >
        ปิดและออกจากระบบ
      </button>

    </section>


    <!-- =======================================================
         4. ERROR SCREEN
         ======================================================= -->
    <section
      id="error-screen"
      class="hidden max-w-md mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-8 text-center"
    >

      <div class="text-4xl mb-3 text-red-500">
        ⚠️
      </div>

      <h2
        id="error-title"
        class="text-lg font-bold mb-2"
      >
        ข้อผิดพลาด
      </h2>

      <p
        id="error-message"
        class="text-sm text-lineDarkGray mb-5"
      >
        -
      </p>

      <button
        type="button"
        onclick="retryLogin()"
        class="w-full bg-linePrimary text-white font-bold py-3.5 rounded-lg transition hover:bg-blue-700"
      >
        ลองใหม่
      </button>

      <button
        type="button"
        onclick="logoutApp()"
        class="w-full mt-3 bg-gray-100 text-gray-700 font-bold py-3.5 rounded-lg transition hover:bg-gray-200"
      >
        ออกจากระบบ
      </button>

    </section>


    <!-- =======================================================
         5. DASHBOARD / PORTAL MENU
         ======================================================= -->
    <section
      id="dashboard-screen"
      class="hidden pb-10"
    >

      <div
        id="menu-container"
        class="space-y-6"
      ></div>

    </section>

  </main>


  <!-- =========================================================
       FOOTER
       ========================================================= -->
  <footer
    class="text-center text-[10px] text-gray-400 py-3"
  >
    Portal Authentication & Access Control
  </footer>


  <!-- =========================================================
       APPLICATION SCRIPT
       ========================================================= -->
  <script>

    // ==========================================================
    // VERSION
    // ==========================================================

    const APP_VERSION = '2.1';


    // ==========================================================
    // CONFIGURATION
    // ==========================================================

    const LIFF_ID =
      '2011487100-dldPQItq';

    const CENTRAL_API_URL =
      'https://script.google.com/macros/s/AKfycbwphhIdSMHpTWHuFrRFTC3lEZe-QQCaZr2cebxb22cE9ph1eYPscyrxdw29T44DaUT9/exec';


    // ==========================================================
    // SESSION POLICY
    // ==========================================================

    // Portal inactivity timeout = 60 minutes
    const INACTIVITY_LIMIT =
      60 * 60;

    // Server keepAlive every 10 minutes
    const KEEP_ALIVE_INTERVAL =
      10 * 60 * 1000;

    // Verify existing session after reload
    const VERIFY_SESSION_ON_LOAD =
      true;


    // ==========================================================
    // STORAGE KEY
    // ==========================================================

    const SESSION_STORAGE_KEY =
      'portalSessionId';


    // ==========================================================
    // GLOBAL STATE
    // ==========================================================

    let lineProfile = null;

    let clientInfo = {
      ip: 'Unknown',
      location: 'Unknown',
      device: navigator.userAgent || 'Unknown'
    };

    let portalSessionId = null;

    let timeRemaining =
      INACTIVITY_LIMIT;

    let timerInterval = null;

    let keepAliveInterval = null;

    let lastActivityAt =
      Date.now();

    let isLoggingOut = false;

    let isInitialized = false;


    // ==========================================================
    // INIT
    // ==========================================================

    async function initApp() {

      if (isInitialized) {
        return;
      }

      isInitialized = true;

      try {

        showScreen('loading-screen');

        setLoadingMessage(
          'กำลังเชื่อมต่อ LINE...'
        );


        // ------------------------------------------------------
        // Initialize LINE LIFF
        // ------------------------------------------------------

        await liff.init({
          liffId: LIFF_ID
        });


        // ------------------------------------------------------
        // Login LINE
        // ------------------------------------------------------

        if (!liff.isLoggedIn()) {

          liff.login();

          return;
        }


        // ------------------------------------------------------
        // Get LINE Profile
        // ------------------------------------------------------

        setLoadingMessage(
          'กำลังตรวจสอบบัญชี LINE...'
        );

        lineProfile =
          await liff.getProfile();


        if (!lineProfile || !lineProfile.userId) {

          throw new Error(
            'ไม่สามารถอ่าน LINE User ID ได้'
          );
        }


        // ------------------------------------------------------
        // Display Profile
        // ------------------------------------------------------

        const profileImage =
          document.getElementById('profile-img');

        if (
          profileImage &&
          lineProfile.pictureUrl
        ) {

          profileImage.src =
            lineProfile.pictureUrl;

          profileImage.classList.remove(
            'hidden'
          );
        }


        document.getElementById(
          'user-info'
        ).textContent =
          lineProfile.displayName ||
          'LINE User';


        // ------------------------------------------------------
        // Get Client Information
        // ------------------------------------------------------

        setLoadingMessage(
          'กำลังตรวจสอบข้อมูลอุปกรณ์...'
        );

        await fetchClientInfo();


        // ------------------------------------------------------
        // Existing Portal Session
        // ------------------------------------------------------

        const savedSession =
          sessionStorage.getItem(
            SESSION_STORAGE_KEY
          );


        if (
          VERIFY_SESSION_ON_LOAD &&
          savedSession
        ) {

          portalSessionId =
            savedSession;


          setLoadingMessage(
            'กำลังตรวจสอบ Session เดิม...'
          );


          const valid =
            await verifyPortalSession();


          if (valid) {

            setLoadingMessage(
              'กำลังโหลดเมนูระบบ...'
            );


            // --------------------------------------------------
            // Important:
            // We still need menu information.
            //
            // The safest way is to call login again.
            // Central Auth should reuse / refresh the session
            // if the backend supports it.
            // --------------------------------------------------

            await loginToPortal(
              true
            );

            return;
          }


          // Session invalid
          sessionStorage.removeItem(
            SESSION_STORAGE_KEY
          );

          portalSessionId = null;
        }


        // ------------------------------------------------------
        // Normal Login
        // ------------------------------------------------------

        await loginToPortal(
          false
        );

      } catch (error) {

        console.error(
          'initApp error:',
          error
        );

        showError(
          'ไม่สามารถเริ่มระบบได้',
          error &&
          error.message
            ? error.message
            : 'ไม่สามารถเชื่อมต่อ LINE หรือระบบยืนยันตัวตนได้'
        );
      }
    }


    // ==========================================================
    // LOGIN TO CENTRAL AUTH
    // ==========================================================

    async function loginToPortal(
      isExistingSession
    ) {

      showScreen(
        'loading-screen'
      );

      setLoadingMessage(
        'กำลังตรวจสอบสิทธิ์การใช้งาน...'
      );


      try {

        const payload = {

          action: 'login',

          // ----------------------------------------------------
          // LINE UID
          //
          // This is sent only to Central Auth over HTTPS.
          // It is NOT placed into destination URL.
          // ----------------------------------------------------

          userId:
            lineProfile.userId,

          profile: {

            displayName:
              lineProfile.displayName || '',

            pictureUrl:
              lineProfile.pictureUrl || ''

          },

          clientInfo:
            clientInfo
        };


        // ------------------------------------------------------
        // If we already have a session, send it to server too.
        // Backend may choose to reuse / validate it.
        // ------------------------------------------------------

        if (
          isExistingSession &&
          portalSessionId
        ) {

          payload.sessionId =
            portalSessionId;
        }


        const response =
          await fetch(
            CENTRAL_API_URL,
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'text/plain;charset=utf-8'
              },

              body:
                JSON.stringify(payload)
            }
          );


        if (!response.ok) {

          throw new Error(
            `Central Auth HTTP ${response.status}`
          );
        }


        const data =
          await response.json();


        // ====================================================
        // NOT REGISTERED
        // ====================================================

        if (
          data.status ===
          'not_registered'
        ) {

          portalSessionId = null;

          sessionStorage.removeItem(
            SESSION_STORAGE_KEY
          );


          document.getElementById(
            'user-info'
          ).textContent =
            lineProfile.displayName ||
            'LINE User';


          showScreen(
            'register-screen'
          );


          return;
        }


        // ====================================================
        // ERROR
        // ====================================================

        if (
          data.status === 'error'
        ) {

          showError(
            'ไม่สามารถเข้าใช้งานได้',
            data.message ||
              'บัญชีไม่สามารถใช้งานได้'
          );

          return;
        }


        // ====================================================
        // INVALID STATUS
        // ====================================================

        if (
          data.status !== 'success'
        ) {

          showError(
            'เข้าสู่ระบบไม่สำเร็จ',
            data.message ||
              'เกิดข้อผิดพลาดในระบบ'
          );

          return;
        }


        // ====================================================
        // SESSION
        // ====================================================

        if (
          !data.sessionId
        ) {

          throw new Error(
            'Central Auth ไม่ได้ส่ง sessionId กลับมา'
          );
        }


        portalSessionId =
          data.sessionId;


        // ------------------------------------------------------
        // Store only Session ID.
        //
        // Do NOT store LINE UID as credential.
        // ------------------------------------------------------

        sessionStorage.setItem(
          SESSION_STORAGE_KEY,
          portalSessionId
        );


        // ====================================================
        // RENDER PORTAL
        // ====================================================

        renderDashboard(
          data
        );


        // ====================================================
        // START SESSION TIMER
        // ====================================================

        startActivityTracker();

      } catch (error) {

        console.error(
          'loginToPortal error:',
          error
        );

        showError(
          'พบข้อผิดพลาด',
          'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้'
        );
      }
    }


    // ==========================================================
    // ACTIVITY TRACKER
    // ==========================================================

    function startActivityTracker() {

      stopActivityTracker();


      lastActivityAt =
        Date.now();

      timeRemaining =
        INACTIVITY_LIMIT;


      // --------------------------------------------------------
      // User activity
      // --------------------------------------------------------

      const markActivity =
        function () {

          if (isLoggingOut) {
            return;
          }

          lastActivityAt =
            Date.now();

          timeRemaining =
            INACTIVITY_LIMIT;

        };


      [
        'mousemove',
        'keydown',
        'touchstart',
        'scroll',
        'click'
      ].forEach(
        function (eventName) {

          window.addEventListener(
            eventName,
            markActivity,
            {
              passive: true
            }
          );

        }
      );


      // --------------------------------------------------------
      // Countdown
      // --------------------------------------------------------

      timerInterval =
        setInterval(
          async function () {

            if (isLoggingOut) {
              return;
            }


            const idleSeconds =
              Math.floor(
                (
                  Date.now() -
                  lastActivityAt
                ) / 1000
              );


            timeRemaining =
              Math.max(
                0,
                INACTIVITY_LIMIT -
                idleSeconds
              );


            updateTimerDisplay();


            if (
              timeRemaining <= 0
            ) {

              await forceLogout(
                'หมดเวลาการเชื่อมต่อเนื่องจากไม่มีการใช้งาน 60 นาที'
              );

            }

          },
          1000
        );


      // --------------------------------------------------------
      // KeepAlive
      // --------------------------------------------------------

      keepAliveInterval =
        setInterval(
          async function () {

            if (
              isLoggingOut ||
              !portalSessionId
            ) {

              return;
            }


            // If the user is already close to
            // inactivity timeout, do not renew.
            if (
              timeRemaining <= 300
            ) {

              return;
            }


            await keepAlive();

          },
          KEEP_ALIVE_INTERVAL
        );


      updateTimerDisplay();
    }


    // ==========================================================
    // STOP ACTIVITY TRACKER
    // ==========================================================

    function stopActivityTracker() {

      if (timerInterval) {

        clearInterval(
          timerInterval
        );

        timerInterval = null;
      }


      if (keepAliveInterval) {

        clearInterval(
          keepAliveInterval
        );

        keepAliveInterval = null;
      }
    }


    // ==========================================================
    // TIMER DISPLAY
    // ==========================================================

    function updateTimerDisplay() {

      const total =
        Math.max(
          0,
          timeRemaining
        );


      const minutes =
        Math.floor(
          total / 60
        )
          .toString()
          .padStart(2, '0');


      const seconds =
        (total % 60)
          .toString()
          .padStart(2, '0');


      const element =
        document.getElementById(
          'timer-display'
        );


      if (element) {

        element.textContent =
          `${minutes}:${seconds}`;

      }
    }


    // ==========================================================
    // KEEP ALIVE
    // ==========================================================

    async function keepAlive() {

      if (
        !portalSessionId
      ) {

        return;
      }


      try {

        const response =
          await fetch(
            CENTRAL_API_URL,
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'text/plain;charset=utf-8'
              },

              body:
                JSON.stringify({

                  action:
                    'keepAlive',

                  sessionId:
                    portalSessionId

                })
            }
          );


        if (!response.ok) {

          console.warn(
            'KeepAlive HTTP error:',
            response.status
          );

          return;
        }


        const data =
          await response.json();


        if (
          data.status !==
          'success'
        ) {

          await forceLogout(
            'Session หมดอายุ กรุณาเข้าสู่ระบบใหม่'
          );

        }

      } catch (error) {

        console.error(
          'KeepAlive failed:',
          error
        );

        // ----------------------------------------------------
        // IMPORTANT
        //
        // Do NOT logout immediately for network failures.
        // A temporary network failure should not destroy
        // the current session.
        // ----------------------------------------------------
      }
    }


    // ==========================================================
    // VERIFY PORTAL SESSION
    // ==========================================================

    async function verifyPortalSession() {

      if (
        !portalSessionId
      ) {

        return false;
      }


      try {

        const response =
          await fetch(
            CENTRAL_API_URL,
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'text/plain;charset=utf-8'
              },

              body:
                JSON.stringify({

                  action:
                    'verifySession',

                  sessionId:
                    portalSessionId,

                  menuId:
                    'PORTAL'

                })
            }
          );


        if (!response.ok) {

          return false;
        }


        const data =
          await response.json();


        return (
          data.status ===
          'success'
        );

      } catch (error) {

        console.error(
          'verifyPortalSession failed:',
          error
        );

        return false;
      }
    }


    // ==========================================================
    // VERIFY PHONE
    // ==========================================================

    function setupPhoneForm() {

      const form =
        document.getElementById(
          'phone-form'
        );


      if (!form) {
        return;
      }


      form.addEventListener(
        'submit',
        async function (event) {

          event.preventDefault();


          if (
            !lineProfile ||
            !lineProfile.userId
          ) {

            showError(
              'ไม่พบข้อมูล LINE',
              'กรุณาเข้าสู่ระบบ LINE ใหม่'
            );

            return;
          }


          const phoneInput =
            document.getElementById(
              'phone-input'
            );


          const button =
            document.getElementById(
              'verify-phone-button'
            );


          const phone =
            phoneInput.value.trim();


          if (
            !/^\d{10}$/.test(phone)
          ) {

            alert(
              'กรุณากรอกเบอร์โทรศัพท์ 10 หลัก'
            );

            phoneInput.focus();

            return;
          }


          button.disabled = true;

          button.textContent =
            'กำลังตรวจสอบ...';


          showScreen(
            'loading-screen'
          );


          setLoadingMessage(
            'กำลังตรวจสอบเบอร์โทรศัพท์...'
          );


          try {

            const response =
              await fetch(
                CENTRAL_API_URL,
                {
                  method: 'POST',

                  headers: {
                    'Content-Type':
                      'text/plain;charset=utf-8'
                  },

                  body:
                    JSON.stringify({

                      action:
                        'verifyPhone',

                      // Original registration flow:
                      // LINE UID + phone
                      userId:
                        lineProfile.userId,

                      phone:
                        phone,

                      profile: {

                        displayName:
                          lineProfile.displayName ||
                          '',

                        pictureUrl:
                          lineProfile.pictureUrl ||
                          ''

                      },

                      clientInfo:
                        clientInfo

                    })
                }
              );


            if (!response.ok) {

              throw new Error(
                `HTTP ${response.status}`
              );
            }


            const data =
              await response.json();


            if (
              data.status ===
              'show_userid'
            ) {

              document.getElementById(
                'display-userid'
              ).textContent =
                data.lineUserId ||
                lineProfile.userId;


              showScreen(
                'copy-screen'
              );


              return;
            }


            if (
              data.status ===
              'error'
            ) {

              showError(
                'ตรวจสอบไม่สำเร็จ',
                data.message ||
                  'ไม่สามารถตรวจสอบข้อมูลได้'
              );

              return;
            }


            showError(
              'ตรวจสอบไม่สำเร็จ',
              data.message ||
                'ไม่สามารถตรวจสอบข้อมูลได้'
            );

          } catch (error) {

            console.error(
              'verifyPhone error:',
              error
            );

            showError(
              'การตรวจสอบล้มเหลว',
              'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่'
            );

          } finally {

            button.disabled =
              false;

            button.textContent =
              'ตรวจสอบข้อมูล';

          }

        }
      );


      // --------------------------------------------------------
      // Only numbers
      // --------------------------------------------------------

      const phoneInput =
        document.getElementById(
          'phone-input'
        );


      phoneInput.addEventListener(
        'input',
        function () {

          this.value =
            this.value.replace(
              /[^0-9]/g,
              ''
            );

        }
      );
    }


    // ==========================================================
    // COPY LINE UID
    // ==========================================================

    async function copyUserId() {

      const uid =
        lineProfile &&
        lineProfile.userId
          ? lineProfile.userId
          : '';


      if (!uid) {

        alert(
          'ไม่พบ LINE UID'
        );

        return;
      }


      try {

        await navigator.clipboard.writeText(
          uid
        );


        alert(
          'คัดลอกรหัสสำเร็จ นำส่ง Admin เพื่อดำเนินการผูกบัญชี'
        );

      } catch (error) {

        console.error(
          'copyUserId error:',
          error
        );


        // ----------------------------------------------------
        // Fallback
        // ----------------------------------------------------

        const temp =
          document.createElement(
            'textarea'
          );


        temp.value =
          uid;

        temp.style.position =
          'fixed';

        temp.style.opacity =
          '0';


        document.body.appendChild(
          temp
        );


        temp.focus();

        temp.select();


        try {

          document.execCommand(
            'copy'
          );

          alert(
            'คัดลอกรหัสสำเร็จ นำส่ง Admin เพื่อดำเนินการผูกบัญชี'
          );

        } catch (fallbackError) {

          alert(
            'ไม่สามารถคัดลอกอัตโนมัติ กรุณาคัดลอกรหัสจากหน้าจอ'
          );

        }


        document.body.removeChild(
          temp
        );
      }
    }


    // ==========================================================
    // RENDER DASHBOARD
    // ==========================================================

    function renderDashboard(
      data
    ) {

      showScreen(
        'dashboard-screen'
      );


      const userInfo =
        document.getElementById(
          'user-info'
        );


      const displayName =
        lineProfile &&
        lineProfile.displayName
          ? lineProfile.displayName
          : '-';


      const jobPosition =
        data &&
        data.jobPosition
          ? data.jobPosition
          : '-';


      userInfo.textContent =
        `${displayName} | ตำแหน่ง: ${jobPosition}`;


      const container =
        document.getElementById(
          'menu-container'
        );


      container.innerHTML =
        '';


      // --------------------------------------------------------
      // No permission
      // --------------------------------------------------------

      if (
        !data ||
        !Array.isArray(
          data.menuGroups
        ) ||
        data.menuGroups.length === 0
      ) {

        container.innerHTML = `
          <div class="bg-white p-6 rounded-lg text-lineDarkGray text-center border shadow-sm">
            <div class="text-3xl mb-3">🔒</div>
            <p class="font-medium">
              คุณไม่มีสิทธิ์เข้าถึงเมนูใดๆ
            </p>
          </div>
        `;

        return;
      }


      // --------------------------------------------------------
      // Render menu groups
      // --------------------------------------------------------

      data.menuGroups.forEach(
        function (group) {

          const groupSection =
            document.createElement(
              'section'
            );


          const groupTitle =
            escapeHtml(
              group.groupName ||
              group.menuGroup ||
              'ทั่วไป'
            );


          const menus =
            Array.isArray(
              group.menus
            )
              ? group.menus
              : [];


          const menuItems =
            menus
              .map(
                function (menu) {

                  return createMenuCard(
                    menu
                  );

                }
              )
              .join('');


          groupSection.innerHTML = `

            <h2
              class="text-[14px] font-bold text-linePrimary mb-3 tracking-wide pl-2 border-l-[3px] border-linePrimary leading-none"
            >
              ${groupTitle}
            </h2>

            <div
              class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3 sm:gap-4"
            >
              ${menuItems}
            </div>

          `;


          container.appendChild(
            groupSection
          );

        }
      );
    }


    // ==========================================================
    // CREATE MENU CARD
    // ==========================================================

    function createMenuCard(
      menu
    ) {

      const menuId =
        normalizeMenuId(
          menu &&
          menu.menuId
        );


      const menuName =
        escapeHtml(
          menu &&
          menu.menuName
            ? menu.menuName
            : 'ระบบ'
        );


      const menuUrl =
        sanitizeUrl(
          menu &&
          menu.menuUrl
        );


      /*
       * IMPORTANT
       *
       * We DO NOT put userId into URL.
       *
       * Version 2.1 uses openMenu()
       * as the central navigation point.
       *
       * In the final Launch Token architecture:
       *
       * Portal
       *   ↓
       * createLaunchToken(menuId)
       *   ↓
       * target URL + short-lived token
       *
       * Target PortalClient.gs
       *   ↓
       * validate token
       *   ↓
       * create target session
       *
       * Refresh target page
       *   ↓
       * target session
       *
       * No LINE UID in URL.
       */


      const encodedUrl =
        encodeURIComponent(
          menuUrl
        );


      return `

        <button
          type="button"
          onclick="openMenu('${escapeJs(menuId)}', '${encodedUrl}')"
          class="w-full flex flex-col items-center justify-start p-3 sm:p-4 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md hover:border-linePrimary transition active:scale-95 h-full text-left"
        >

          <div
            class="bg-blue-50 text-linePrimary p-2.5 rounded-xl mb-2"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6 sm:h-7 sm:w-7"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
          </div>

          <h3
            class="text-[11px] sm:text-xs font-semibold text-gray-700 text-center leading-tight break-words"
          >
            ${menuName}
          </h3>

        </button>

      `;
    }


    // ==========================================================
    // OPEN MENU
    // ==========================================================

    async function openMenu(
      menuId,
      encodedUrl
    ) {

      if (
        isLoggingOut
      ) {

        return;
      }


      if (
        !portalSessionId
      ) {

        showError(
          'Session หมดอายุ',
          'กรุณาเข้าสู่ระบบใหม่'
        );

        return;
      }


      const safeMenuId =
        normalizeMenuId(
          menuId
        );


      if (!safeMenuId) {

        showError(
          'ไม่สามารถเปิดระบบได้',
          'ไม่พบ menuId'
        );

        return;
      }


      // --------------------------------------------------------
      // Verify Portal Session before opening target
      // --------------------------------------------------------

      const valid =
        await verifyPortalSession();


      if (!valid) {

        await forceLogout(
          'Session หมดอายุ กรุณาเข้าสู่ระบบใหม่'
        );

        return;
      }


      let destinationUrl =
        '';


      try {

        destinationUrl =
          decodeURIComponent(
            encodedUrl || ''
          );

      } catch (error) {

        destinationUrl =
          '';
      }


      destinationUrl =
        sanitizeUrl(
          destinationUrl
        );


      if (
        destinationUrl === '#'
      ) {

        alert(
          'เมนูนี้ยังไม่ได้กำหนด URL'
        );

        return;
      }


      /*
       * ======================================================
       * VERSION 2.1 NAVIGATION
       * ======================================================
       *
       * At this stage we preserve the menuUrl from the
       * RolePermissions sheet.
       *
       * The important change is:
       *
       *   - no UID in URL
       *   - no profile data in URL
       *   - no reusable credential in URL
       *   - all navigation goes through this function
       *
       * When the Portal backend exposes:
       *
       *   action: createLaunchToken
       *
       * this function can be changed to:
       *
       *   1. ask Central Auth for Launch Token
       *   2. receive short-lived token
       *   3. append token to destination URL
       *   4. Target PortalClient.gs exchanges token
       *   5. Target creates local session
       *
       * This keeps the Portal as the central security core.
       * ======================================================
       */


      window.location.href =
        destinationUrl;
    }


    // ==========================================================
    // SANITIZE URL
    // ==========================================================

    function sanitizeUrl(
      url
    ) {

      try {

        if (!url) {

          return '#';
        }


        const parsed =
          new URL(
            url,
            window.location.href
          );


        // Only HTTPS / HTTP
        if (
          ![
            'http:',
            'https:'
          ].includes(
            parsed.protocol
          )
        ) {

          return '#';
        }


        return parsed.href;

      } catch (error) {

        return '#';
      }
    }


    // ==========================================================
    // NORMALIZE MENU ID
    // ==========================================================

    function normalizeMenuId(
      value
    ) {

      if (
        value === null ||
        value === undefined
      ) {

        return '';
      }


      return String(
        value
      ).trim();
    }


    // ==========================================================
    // ESCAPE HTML
    // ==========================================================

    function escapeHtml(
      value
    ) {

      return String(
        value === null ||
        value === undefined
          ? ''
          : value
      )
        .replace(
          /&/g,
          '&amp;'
        )
        .replace(
          /</g,
          '&lt;'
        )
        .replace(
          />/g,
          '&gt;'
        )
        .replace(
          /"/g,
          '&quot;'
        )
        .replace(
          /'/g,
          '&#039;'
        );
    }


    // ==========================================================
    // ESCAPE JAVASCRIPT STRING
    // ==========================================================

    function escapeJs(
      value
    ) {

      return String(
        value === null ||
        value === undefined
          ? ''
          : value
      )
        .replace(
          /\\/g,
          '\\\\'
        )
        .replace(
          /'/g,
          "\\'"
        )
        .replace(
          /"/g,
          '\\"'
        )
        .replace(
          /\r/g,
          '\\r'
        )
        .replace(
          /\n/g,
          '\\n'
        );
    }


    // ==========================================================
    // FETCH CLIENT INFORMATION
    // ==========================================================

    async function fetchClientInfo() {

      /*
       * IP lookup is optional.
       *
       * If external IP service is unavailable,
       * Portal login must continue.
       */

      try {

        const response =
          await fetch(
            'https://ipapi.co/json/',
            {
              method: 'GET',

              cache: 'no-store'
            }
          );


        if (
          !response.ok
        ) {

          return;
        }


        const data =
          await response.json();


        clientInfo.ip =
          data.ip ||
          'Unknown';


        clientInfo.location =
          [
            data.city,
            data.country_name
          ]
            .filter(
              Boolean
            )
            .join(
              ', '
            ) ||
          'Unknown';

      } catch (error) {

        console.warn(
          'Client IP lookup unavailable:',
          error
        );

        // Keep default values.
      }
    }


    // ==========================================================
    // SHOW SCREEN
    // ==========================================================

    function showScreen(
      id
    ) {

      const screens = [

        'loading-screen',

        'register-screen',

        'error-screen',

        'dashboard-screen',

        'copy-screen'

      ];


      screens.forEach(
        function (screenId) {

          const element =
            document.getElementById(
              screenId
            );


          if (element) {

            element.classList.add(
              'hidden'
            );
          }

        }
      );


      const target =
        document.getElementById(
          id
        );


      if (target) {

        target.classList.remove(
          'hidden'
        );
      }
    }


    // ==========================================================
    // LOADING MESSAGE
    // ==========================================================

    function setLoadingMessage(
      message
    ) {

      const element =
        document.getElementById(
          'loading-message'
        );


      if (element) {

        element.textContent =
          message ||
          'กำลังโหลด...';
      }
    }


    // ==========================================================
    // SHOW ERROR
    // ==========================================================

    function showError(
      title,
      message
    ) {

      const titleElement =
        document.getElementById(
          'error-title'
        );


      const messageElement =
        document.getElementById(
          'error-message'
        );


      if (titleElement) {

        titleElement.textContent =
          title ||
          'ข้อผิดพลาด';
      }


      if (messageElement) {

        messageElement.textContent =
          message ||
          'เกิดข้อผิดพลาดในระบบ';
      }


      showScreen(
        'error-screen'
      );
    }


    // ==========================================================
    // RETRY LOGIN
    // ==========================================================

    async function retryLogin() {

      if (isLoggingOut) {
        return;
      }


      showScreen(
        'loading-screen'
      );


      setLoadingMessage(
        'กำลังเริ่มระบบใหม่...'
      );


      try {

        if (
          !lineProfile
        ) {

          await initApp();

          return;
        }


        await loginToPortal(
          false
        );

      } catch (error) {

        console.error(
          'retryLogin error:',
          error
        );


        showError(
          'ไม่สามารถเข้าสู่ระบบได้',
          'กรุณาลองใหม่อีกครั้ง'
        );
      }
    }


    // ==========================================================
    // FORCE LOGOUT
    // ==========================================================

    async function forceLogout(
      message
    ) {

      if (
        isLoggingOut
      ) {

        return;
      }


      alert(
        message ||
        'Session หมดอายุ'
      );


      await logoutApp();
    }


    // ==========================================================
    // LOGOUT
    // ==========================================================

    async function logoutApp() {

      if (
        isLoggingOut
      ) {

        return;
      }


      isLoggingOut =
        true;


      stopActivityTracker();


      // --------------------------------------------------------
      // Disable logout button
      // --------------------------------------------------------

      const logoutButton =
        document.getElementById(
          'logout-button'
        );


      if (logoutButton) {

        logoutButton.disabled =
          true;

        logoutButton.textContent =
          'กำลังออก...';
      }


      // --------------------------------------------------------
      // Server logout
      // --------------------------------------------------------

      try {

        if (
          portalSessionId
        ) {

          await fetch(
            CENTRAL_API_URL,
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'text/plain;charset=utf-8'
              },

              body:
                JSON.stringify({

                  action:
                    'logout',

                  sessionId:
                    portalSessionId

                })
            }
          );
        }

      } catch (error) {

        console.error(
          'Logout server error:',
          error
        );
      }


      // --------------------------------------------------------
      // Remove Portal Session
      // --------------------------------------------------------

      sessionStorage.removeItem(
        SESSION_STORAGE_KEY
      );


      portalSessionId =
        null;


      // --------------------------------------------------------
      // LINE Logout
      // --------------------------------------------------------

      try {

        if (
          typeof liff !==
          'undefined' &&
          liff.isLoggedIn()
        ) {

          liff.logout();
        }

      } catch (error) {

        console.error(
          'LINE logout error:',
          error
        );
      }


      // --------------------------------------------------------
      // Reload
      // --------------------------------------------------------

      window.location.reload();
    }


    // ==========================================================
    // INITIAL EVENT
    // ==========================================================

    document.addEventListener(
      'DOMContentLoaded',
      function () {

        // Register phone form only after DOM is ready
        setupPhoneForm();


        // Start application
        initApp();

      }
    );


    // ==========================================================
    // VERSION DEBUG
    // ==========================================================

    console.info(
      `Portal System Version ${APP_VERSION} initialized`
    );

  </script>
