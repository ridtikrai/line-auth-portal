<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Portal System</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>

    tailwind.config = {

      theme: {

        extend: {

          colors: {

            linePrimary:
              "#0084FF",

            lineLightBg:
              "#F7F7F7",

            lineDarkGray:
              "#6C757D"

          }

        }

      }

    };

  </script>

</head>


<body
  class="bg-lineLightBg text-gray-800 min-h-screen"
>


<header
  class="bg-gradient-to-r from-linePrimary to-blue-700 text-white shadow-md sticky top-0 z-50"
>

  <div
    class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center"
  >

    <div
      class="flex items-center gap-3 min-w-0"
    >

      <img
        id="profile-img"
        class="hidden w-10 h-10 rounded-full border-2 border-white object-cover"
      >

      <div class="min-w-0">

        <h1
          class="font-bold text-base"
        >
          Portal System
        </h1>

        <p
          id="user-info"
          class="text-xs opacity-90 truncate"
        >
          กำลังตรวจสอบ...
        </p>

      </div>

    </div>


    <div class="flex flex-col items-end gap-1">

      <button
        onclick="logoutApp()"
        class="text-xs px-3 py-1.5 rounded border border-white/30 bg-white/20 hover:bg-white/30"
      >
        ออกจากระบบ
      </button>

      <div
        class="text-[10px] opacity-90"
      >
        <span>Session</span>
        <span
          id="timer-display"
          class="font-mono"
        >
          60:00
        </span>
      </div>

    </div>

  </div>

</header>


<main
  class="max-w-5xl mx-auto px-4 py-5"
>


<!-- LOADING -->

<section
  id="loading-screen"
  class="flex flex-col items-center justify-center py-24"
>

  <div
    class="animate-spin rounded-full h-10 w-10 border-b-4 border-linePrimary mb-4"
  ></div>

  <p
    class="text-sm text-lineDarkGray"
  >
    กำลังตรวจสอบสิทธิ์การใช้งาน...
  </p>

</section>


<!-- REGISTER -->

<section
  id="register-screen"
  class="hidden max-w-md mx-auto bg-white rounded-2xl shadow-sm border p-6"
>

  <div
    class="text-4xl text-center mb-3"
  >
    📱
  </div>

  <h2
    class="text-xl font-bold text-center mb-2"
  >
    ลงทะเบียนใช้งาน
  </h2>

  <p
    class="text-sm text-lineDarkGray text-center mb-5"
  >
    ไม่พบ LINE UID ของคุณในระบบ
    กรุณากรอกเบอร์โทรศัพท์เพื่อยืนยันตัวตน
  </p>

  <form
    id="phone-form"
    class="space-y-4"
  >

    <input
      id="phone-input"
      type="text"
      maxlength="10"
      inputmode="numeric"
      placeholder="08xxxxxxxx"
      required
      class="w-full p-4 text-center text-lg tracking-widest border rounded-xl focus:outline-none focus:border-linePrimary"
    >

    <button
      type="submit"
      class="w-full py-3.5 bg-linePrimary hover:bg-blue-700 text-white rounded-xl font-bold"
    >
      ตรวจสอบข้อมูล
    </button>

  </form>

</section>


<!-- COPY UID -->

<section
  id="copy-screen"
  class="hidden max-w-md mx-auto bg-white rounded-2xl shadow-sm border p-6 text-center"
>

  <div class="text-4xl mb-3">
    📋
  </div>

  <h2
    class="text-xl font-bold mb-2"
  >
    ตรวจสอบสำเร็จ
  </h2>

  <p
    class="text-sm text-lineDarkGray mb-4"
  >
    กรุณาคัดลอก LINE UID
    ส่งให้ Admin เพื่อดำเนินการผูกบัญชี
  </p>

  <div
    id="display-userid"
    class="bg-gray-100 border rounded-xl p-4 text-xs font-mono break-all select-all mb-4"
  ></div>

  <button
    onclick="copyUserId()"
    class="w-full py-3 bg-green-500 hover:bg-green-600 text-white rounded-xl font-bold"
  >
    คัดลอก LINE UID
  </button>

</section>


<!-- ERROR -->

<section
  id="error-screen"
  class="hidden max-w-md mx-auto bg-white rounded-2xl shadow-sm border p-6 text-center"
>

  <div
    class="text-4xl mb-3"
  >
    ⚠️
  </div>

  <h2
    id="error-title"
    class="text-xl font-bold mb-2"
  >
    เกิดข้อผิดพลาด
  </h2>

  <p
    id="error-message"
    class="text-sm text-lineDarkGray mb-5"
  ></p>

  <button
    onclick="loadPortal()"
    class="w-full py-3 bg-gray-200 hover:bg-gray-300 rounded-xl font-bold"
  >
    ลองอีกครั้ง
  </button>

</section>


<!-- PORTAL -->

<section
  id="portal-screen"
  class="hidden pb-10"
>

  <div
    id="menu-container"
    class="space-y-7"
  ></div>

</section>


</main>


<script>

/* =====================================================
   CONFIGURATION
   ===================================================== */

const LIFF_ID =
  "2011487100-dldPQItq";


const CENTRAL_API_URL =
  "https://script.google.com/macros/s/AKfycbwphhIdSMHpTWHuFrRFTC3lEZe-QQCaZr2cebxb22cE9ph1eYPscyrxdw29T44DaUT9/exec";


const SESSION_TIMEOUT =
  60 * 60;


let lineProfile = null;

let clientInfo = {

  ip: "Unknown",

  location: "Unknown",

  device:
    navigator.userAgent

};


let timeRemaining =
  SESSION_TIMEOUT;

let timerInterval = null;

let keepAliveInterval = null;


/* =====================================================
   INIT
   ===================================================== */

async function initApp() {

  try {

    await liff.init({

      liffId:
        LIFF_ID

    });


    if (!liff.isLoggedIn()) {

      liff.login();

      return;

    }


    lineProfile =
      await liff.getProfile();


    if (
      lineProfile &&
      lineProfile.pictureUrl
    ) {

      const img =
        document.getElementById(
          "profile-img"
        );

      img.src =
        lineProfile.pictureUrl;

      img.classList.remove(
        "hidden"
      );

    }


    await fetchClientInfo();


    await loadPortal();


  } catch (error) {

    console.error(error);

    showError(
      "ไม่สามารถเข้าสู่ระบบ",
      "ไม่สามารถเชื่อมต่อ LINE LIFF ได้"
    );

  }

}


/* =====================================================
   LOAD PORTAL
   ===================================================== */

async function loadPortal() {

  showScreen(
    "loading-screen"
  );


  try {

    /**
     * ตรวจ UID โดยตรง
     *
     * จุดสำคัญ:
     * ไม่ใช้ localStorage เป็นตัวตัดสินว่า
     * User ลงทะเบียนแล้วหรือยัง
     */
    const response =
      await apiRequest({

        action:
          "authenticate",

        userId:
          lineProfile.userId,

        profile:
          lineProfile,

        clientInfo

      });


    if (
      response.status ===
      "not_registered"
    ) {

      document
        .getElementById(
          "user-info"
        )
        .textContent =
        "กรุณายืนยันตัวตน";

      showScreen(
        "register-screen"
      );

      return;

    }


    if (
      response.status ===
      "inactive"
    ) {

      showError(
        "บัญชีถูกระงับ",
        response.message
      );

      return;

    }


    if (
      response.status !==
      "success"
    ) {

      showError(
        "เข้าสู่ระบบไม่สำเร็จ",
        response.message ||
        "เกิดข้อผิดพลาด"
      );

      return;

    }


    await loadMenus();

    startSessionTimer();


  } catch (error) {

    console.error(error);

    showError(
      "เชื่อมต่อระบบไม่ได้",
      "ไม่สามารถเชื่อมต่อ Portal Core ได้"
    );

  }

}


/* =====================================================
   LOAD MENUS
   ===================================================== */

async function loadMenus() {

  const data =
    await apiRequest({

      action:
        "getPortalMenus",

      userId:
        lineProfile.userId

    });


  if (
    data.status !==
    "success"
  ) {

    showError(
      "ไม่สามารถโหลดเมนู",
      data.message ||
      "เกิดข้อผิดพลาด"
    );

    return;

  }


  document
    .getElementById(
      "user-info"
    )
    .textContent =
    `${lineProfile.displayName} | ตำแหน่ง: ${data.jobPosition}`;


  renderMenus(data);


  showScreen(
    "portal-screen"
  );

}


/* =====================================================
   RENDER MENU
   ===================================================== */

function renderMenus(data) {

  window.portalMenus =
    data.menuGroups || [];

  const container =
    document.getElementById(
      "menu-container"
    );

  container.innerHTML = "";

  if (
    !data.menuGroups ||
    data.menuGroups.length === 0
  ) {

    container.innerHTML = `
      <div class="bg-white border rounded-2xl p-8 text-center text-gray-500">
        คุณไม่มีสิทธิ์เข้าถึงระบบใด
      </div>
    `;

    return;
  }

  data.menuGroups.forEach(group => {

    const section =
      document.createElement("section");

    const menuHtml =
      group.menus.map(menu => {

        return `
          <button
            type="button"
            onclick="launchSystem('${escapeJs(menu.menuId)}')"
            class="text-left bg-white border border-gray-200 rounded-xl p-3 sm:p-4 shadow-sm hover:shadow-md hover:border-blue-400 active:scale-95 transition min-h-[82px]"
          >
            <div class="font-bold text-xs sm:text-sm leading-tight line-clamp-2">
              ${escapeHtml(menu.menuName)}
            </div>

            <div class="text-[10px] sm:text-xs text-gray-400 mt-2">
              เข้าใช้งานระบบ
            </div>
          </button>
        `;

      }).join("");

    section.innerHTML = `
      <div class="flex items-center mb-3">
        <div class="w-1 h-5 bg-linePrimary rounded mr-2"></div>

        <h2 class="font-bold text-sm sm:text-base text-linePrimary">
          ${escapeHtml(group.groupName)}
        </h2>
      </div>

      <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-2 sm:gap-3">
        ${menuHtml}
      </div>
    `;

    container.appendChild(section);

  });

}

  const container =
    document.getElementById(
      "menu-container"
    );


  container.innerHTML =
    "";


  if (
    !data.menuGroups ||
    data.menuGroups.length === 0
  ) {

    container.innerHTML = `

      <div
        class="bg-white border rounded-2xl p-8 text-center text-gray-500"
      >
        คุณไม่มีสิทธิ์เข้าถึงระบบใด
      </div>

    `;

    return;

  }


  data.menuGroups.forEach(
    group => {

      const section =
        document.createElement(
          "section"
        );


      const menuHtml =
        group.menus
          .map(menu => {

            return `

              <button
                type="button"
                onclick="launchSystem('${escapeJs(menu.menuId)}')"
                class="text-left bg-white border border-gray-200 rounded-xl p-3 sm:p-4 shadow-sm hover:shadow-md hover:border-blue-400 active:scale-95 transition min-h-[82px]"
              >

                <div
                  class="font-bold text-xs sm:text-sm leading-tight line-clamp-2"
                >
                  ${escapeHtml(menu.menuName)}
                </div>

                <div
                  class="text-[10px] sm:text-xs text-gray-400 mt-2"
                >
                  เข้าใช้งานระบบ
                </div>

              </button>

            `;

          })
          .join("");


      section.innerHTML = `

        <div
          class="flex items-center mb-3"
        >

          <div
            class="w-1 h-5 bg-linePrimary rounded mr-2"
          ></div>

          <h2
            class="font-bold text-sm sm:text-base text-linePrimary"
          >
            ${escapeHtml(group.groupName)}
          </h2>

        </div>


        <div
          class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-2 sm:gap-3"
        >

          ${menuHtml}

        </div>

      `;


      container.appendChild(
        section
      );

    }
  );

}


/* =====================================================
   LAUNCH DESTINATION
   ===================================================== */

async function launchSystem(menuId) {

  try {

    showScreen(
      "loading-screen"
    );


    const data =
      await apiRequest({

        action:
          "launch",

        userId:
          lineProfile.userId,

        menuId:
          menuId,

        profile:
          lineProfile,

        clientInfo

      });


    if (
      data.status !==
      "success"
    ) {

      showError(
        "ไม่สามารถเข้าใช้งาน",
        data.message ||
        "คุณไม่มีสิทธิ์"
      );

      return;

    }


    /**
     * menuUrl ไม่ถูกเชื่อถือจาก Client
     * แต่ Portal เป็นผู้กำหนดจาก RolePermissions
     */
    const menu =
      findMenuById(
        menuId
      );


    if (!menu || !menu.menuUrl) {

      showError(
        "ไม่พบระบบปลายทาง",
        "ยังไม่ได้กำหนด URL ของระบบนี้"
      );

      return;

    }


    /**
     * เติม Launch Token
     */
    const destinationUrl =
      appendToken(
        menu.menuUrl,
        data.token
      );


    window.location.href =
      destinationUrl;


  } catch (error) {

    console.error(error);

    showError(
      "เกิดข้อผิดพลาด",
      "ไม่สามารถเปิดระบบปลายทางได้"
    );

  }

}


/* =====================================================
   FIND MENU
   ===================================================== */

let cachedMenuData = null;


function findMenuById(menuId) {

  /**
   * menuUrl จาก API
   * จะเก็บไว้ตอน render
   *
   * เพื่อไม่ให้ Client สร้าง URL เอง
   */
  if (!window.portalMenus) {
    return null;
  }


  for (
    const group
    of window.portalMenus
  ) {

    for (
      const menu
      of group.menus
    ) {

      if (
        String(menu.menuId) ===
        String(menuId)
      ) {

        return menu;

      }

    }

  }


  return null;

}


/**
 * Override render เพื่อเก็บ Menu
 */



/* =====================================================
   API REQUEST
   ===================================================== */

async function apiRequest(payload) {

  const response =
    await fetch(
      CENTRAL_API_URL,
      {

        method:
          "POST",

        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify(
            payload
          )

      }
    );


  if (!response.ok) {

    throw new Error(
      "HTTP " +
      response.status
    );

  }


  return await response.json();

}


/* =====================================================
   PHONE FORM
   ===================================================== */

document
  .getElementById(
    "phone-form"
  )
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const phone =
        document
          .getElementById(
            "phone-input"
          )
          .value
          .replace(
            /[^0-9]/g,
            ""
          );


      if (
        phone.length !== 10
      ) {

        alert(
          "กรุณากรอกเบอร์โทรศัพท์ 10 หลัก"
        );

        return;

      }


      showScreen(
        "loading-screen"
      );


      try {

        const data =
          await apiRequest({

            action:
              "verifyPhone",

            userId:
              lineProfile.userId,

            phone,

            profile:
              lineProfile,

            clientInfo

          });


        if (
          data.status ===
          "show_userid"
        ) {

          document
            .getElementById(
              "display-userid"
            )
            .textContent =
            data.lineUserId;

          showScreen(
            "copy-screen"
          );

          return;

        }


        showError(
          "ตรวจสอบไม่สำเร็จ",
          data.message ||
          "ไม่สามารถตรวจสอบข้อมูลได้"
        );


      } catch (error) {

        console.error(error);

        showError(
          "ตรวจสอบล้มเหลว",
          "ไม่สามารถเชื่อมต่อระบบได้"
        );

      }

    }
  );


/* =====================================================
   COPY UID
   ===================================================== */

function copyUserId() {

  const value =
    lineProfile.userId;


  navigator
    .clipboard
    .writeText(value)
    .then(() => {

      alert(
        "คัดลอก LINE UID สำเร็จ"
      );

    });

}


/* =====================================================
   SESSION TIMER
   ===================================================== */

function startSessionTimer() {

  clearInterval(
    timerInterval
  );

  clearInterval(
    keepAliveInterval
  );


  timeRemaining =
    SESSION_TIMEOUT;


  timerInterval =
    setInterval(() => {

      timeRemaining--;

      if (
        timeRemaining < 0
      ) {

        timeRemaining = 0;

      }


      const minutes =
        Math.floor(
          timeRemaining / 60
        )
        .toString()
        .padStart(2, "0");


      const seconds =
        (
          timeRemaining % 60
        )
        .toString()
        .padStart(2, "0");


      document
        .getElementById(
          "timer-display"
        )
        .textContent =
        `${minutes}:${seconds}`;


      if (
        timeRemaining <= 0
      ) {

        logoutApp();

      }

    }, 1000);


  /**
   * Portal keepAlive
   *
   * ตัวนี้ไม่ใช่ Destination Session
   * เพราะ Portal ยังใช้ Login Session ของ LINE
   */
  keepAliveInterval =
    setInterval(
      async () => {

        if (
          timeRemaining > 300
        ) {

          try {

            await apiRequest({

              action:
                "authenticate",

              userId:
                lineProfile.userId,

              profile:
                lineProfile,

              clientInfo

            });

            timeRemaining =
              SESSION_TIMEOUT;

          } catch (error) {

            console.error(
              error
            );

          }

        }

      },
      15 * 60 * 1000
    );

}


/* =====================================================
   CLIENT INFO
   ===================================================== */

async function fetchClientInfo() {

  try {

    const response =
      await fetch(
        "https://ipapi.co/json/"
      );


    if (
      !response.ok
    ) {

      return;

    }


    const data =
      await response.json();


    clientInfo.ip =
      data.ip ||
      "Unknown";


    clientInfo.location =
      `${data.city || ""}, ${data.country_name || ""}`;


  } catch (error) {

    /**
     * IP ไม่ใช่ข้อมูลที่ใช้ตัดสินสิทธิ์
     * จึงไม่ให้ Login ล้มเหลว
     */

    console.warn(
      "Cannot get IP"
    );

  }

}


/* =====================================================
   SCREEN
   ===================================================== */

function showScreen(id) {

  const screens = [

    "loading-screen",

    "register-screen",

    "copy-screen",

    "error-screen",

    "portal-screen"

  ];


  screens.forEach(
    screenId => {

      document
        .getElementById(
          screenId
        )
        .classList.add(
          "hidden"
        );

    }
  );


  document
    .getElementById(id)
    .classList.remove(
      "hidden"
    );

}


/* =====================================================
   ERROR
   ===================================================== */

function showError(
  title,
  message
) {

  document
    .getElementById(
      "error-title"
    )
    .textContent =
    title;


  document
    .getElementById(
      "error-message"
    )
    .textContent =
    message;


  showScreen(
    "error-screen"
  );

}


/* =====================================================
   LOGOUT
   ===================================================== */

function logoutApp() {

  clearInterval(
    timerInterval
  );

  clearInterval(
    keepAliveInterval
  );


  try {

    if (
      liff.isLoggedIn()
    ) {

      liff.logout();

    }

  } catch (error) {

    console.error(
      error
    );

  }


  window.location.reload();

}


/* =====================================================
   URL
   ===================================================== */

function appendToken(
  url,
  token
) {

  const separator =
    url.includes("?")
      ? "&"
      : "?";


  return (
    url +
    separator +
    "launchToken=" +
    encodeURIComponent(
      token
    )
  );

}


/* =====================================================
   HTML SECURITY
   ===================================================== */

function escapeHtml(value) {

  return String(value || "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeJs(value) {

  return String(value || "")
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    );

}


/* =====================================================
   PATCH MENU CACHE
   ===================================================== */



/* =====================================================
   START
   ===================================================== */

window.onload =
  initApp;

</script>

</body>

</html>
