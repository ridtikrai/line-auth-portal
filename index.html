  <style>

    /* =====================================================
       BASE
    ===================================================== */

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        "Noto Sans Thai",
        "Inter",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }


    /* =====================================================
       MENU CARD
       Desktop
    ===================================================== */

    .menu-card {
      min-height: 118px;

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        border-color 0.18s ease,
        background-color 0.18s ease;
    }

    .menu-card:hover {
      transform: translateY(-2px);
    }

    .menu-card:active {
      transform: scale(0.97);
    }


    /* =====================================================
       MENU NAME
    ===================================================== */

    .menu-name {
      display: -webkit-box;
      -webkit-box-orient: vertical;

      /* Desktop แสดงสูงสุด 3 บรรทัด */
      -webkit-line-clamp: 3;

      overflow: hidden;

      word-break: break-word;
      overflow-wrap: anywhere;
    }


    /* =====================================================
       GROUP CONTENT
    ===================================================== */

    .group-content {
      overflow: hidden;

      transition:
        max-height 0.28s ease,
        opacity 0.2s ease;
    }

    .group-content.closed {
      max-height: 0 !important;
      opacity: 0;
    }


    /* =====================================================
       GROUP ARROW
    ===================================================== */

    .group-arrow {
      transition: transform 0.25s ease;
    }

    .group-arrow.rotate {
      transform: rotate(180deg);
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 640px) {

      /*
       * ---------------------------------------------------
       * Menu Card
       *
       * จากเดิมประมาณ 100px+
       * ลดเหลือ 54px
       * ---------------------------------------------------
       */

      .menu-card {
        min-height: 54px;
        height: 54px;

        padding: 5px !important;

        border-radius: 8px;

        justify-content: center;
      }


      /*
       * ---------------------------------------------------
       * ซ่อน Icon เฉพาะมือถือ
       * ---------------------------------------------------
       */

      .menu-icon {
        display: none !important;
      }


      /*
       * ---------------------------------------------------
       * Menu Name
       * ---------------------------------------------------
       */

      .menu-name {
        width: 100%;

        font-size: 11px;
        line-height: 1.35;

        font-weight: 600;

        text-align: center;

        /*
         * มือถือแสดงชื่อได้สูงสุด 2 บรรทัด
         */
        -webkit-line-clamp: 2;

        display: -webkit-box;
        -webkit-box-orient: vertical;

        overflow: hidden;

        word-break: break-word;
        overflow-wrap: anywhere;
      }


      /*
       * ---------------------------------------------------
       * ลดระยะห่างระหว่าง Menu
       * ---------------------------------------------------
       */

      .mobile-menu-grid {
        gap: 6px !important;
      }

    }


    /* =====================================================
       VERY SMALL MOBILE
       เช่น 320px
    ===================================================== */

    @media (max-width: 360px) {

      .menu-card {
        min-height: 50px;
        height: 50px;

        padding: 4px !important;
      }

      .menu-name {
        font-size: 10px;
        line-height: 1.3;
      }

    }


    /* =====================================================
       SCROLLBAR
    ===================================================== */

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 10px;
    }

  </style>

</head>

  <script>


    // =====================================================
    // CONFIGURATION
    // =====================================================

    const LIFF_ID =
      "2011487100-dldPQItq";


    const CENTRAL_API_URL =
      "https://script.google.com/macros/s/AKfycbzDpOrouurlO_Wlr5RikWVYf8gAmQcN-TTC8yIk7nKLLEvwjYRio5utMrEdxUm4m5Ia/exec";


    // =====================================================
    // STATE
    // =====================================================

    let lineProfile = null;


    let clientInfo = {
      ip: "Unknown",
      location: "Unknown",
      device: navigator.userAgent
    };


    /*
     * Session ID
     *
     * เก็บใน sessionStorage
     *
     * Refresh หน้าเดิมยังอยู่
     * แต่ปิด Tab แล้ว Session ID จะหาย
     */

    let sessionId =
      sessionStorage.getItem(
        "portalSessionId"
      ) || null;


    // =====================================================
    // TIMEOUT
    // =====================================================

    const timeoutLimit =
      60 * 60;


    let timeRemaining =
      timeoutLimit;


    let timerInterval =
      null;


    let keepAliveInterval =
      null;


    // =====================================================
    // INIT APP
    // =====================================================

    async function initApp() {

      try {

        await liff.init({
          liffId: LIFF_ID
        });


        // -----------------------------------------------
        // ยังไม่ได้ Login
        // -----------------------------------------------

        if (!liff.isLoggedIn()) {

          liff.login();

          return;

        }


        // -----------------------------------------------
        // Get LINE Profile
        // -----------------------------------------------

        lineProfile =
          await liff.getProfile();


        // -----------------------------------------------
        // Profile Image
        // -----------------------------------------------

        const profileImg =
          document.getElementById(
            "profile-img"
          );


        const profilePlaceholder =
          document.getElementById(
            "profile-placeholder"
          );


        if (
          lineProfile.pictureUrl
        ) {

          profileImg.src =
            lineProfile.pictureUrl;

          profileImg.classList.remove(
            "hidden"
          );

          profilePlaceholder.classList.add(
            "hidden"
          );

        }


        // -----------------------------------------------
        // Client Information
        // -----------------------------------------------

        await fetchClientInfo();


        // -----------------------------------------------
        // Load Dashboard
        // -----------------------------------------------

        await loadDashboard();


        // -----------------------------------------------
        // Start Session Timer
        // -----------------------------------------------

        startActivityTracker();

      }

      catch (error) {

        console.error(
          "INIT ERROR:",
          error
        );


        showError(
          "พบข้อผิดพลาด",
          "ไม่สามารถเชื่อมต่อ LINE LIFF ได้"
        );

      }

    }


    // =====================================================
    // ACTIVITY TRACKER
    // =====================================================

    function startActivityTracker() {

      /*
       * ทุกกิจกรรมของผู้ใช้
       * รีเซ็ตตัวนับฝั่ง UI
       */

      const resetTimer =
        () => {

          timeRemaining =
            timeoutLimit;

        };


      [
        "mousemove",
        "keydown",
        "touchstart",
        "scroll",
        "click"
      ].forEach(
        evt => {

          window.addEventListener(
            evt,
            resetTimer,
            {
              passive: true
            }
          );

        }
      );


      // -----------------------------------------------
      // Countdown
      // -----------------------------------------------

      if (timerInterval) {

        clearInterval(
          timerInterval
        );

      }


      timerInterval =
        setInterval(
          () => {

            timeRemaining--;


            const minutes =
              Math.floor(
                timeRemaining / 60
              )
                .toString()
                .padStart(2, "0");


            const seconds =
              (
                timeRemaining % 60
              )
                .toString()
                .padStart(2, "0");


            const timer =
              document.getElementById(
                "timer-display"
              );


            if (timer) {

              timer.textContent =
                `${minutes}:${seconds}`;

            }


            if (
              timeRemaining <= 0
            ) {

              clearInterval(
                timerInterval
              );


              clearInterval(
                keepAliveInterval
              );


              alert(
                "หมดเวลาการเชื่อมต่อ กรุณาเข้าสู่ระบบใหม่"
              );


              logoutApp();

            }

          },
          1000
        );


      // -----------------------------------------------
      // Keep Alive
      //
      // ทุก 15 นาที
      // ใช้ sessionId
      // ไม่ใช้ userId
      // -----------------------------------------------

      if (keepAliveInterval) {

        clearInterval(
          keepAliveInterval
        );

      }


      keepAliveInterval =
        setInterval(
          async () => {

            if (
              !sessionId ||
              timeRemaining <= 300
            ) {

              return;

            }


            try {

              const response =
                await fetch(
                  CENTRAL_API_URL,
                  {
                    method: "POST",

                    body:
                      JSON.stringify({
                        action:
                          "keepAlive",

                        sessionId:
                          sessionId
                      })
                  }
                );


              const data =
                await response.json();


              // Session หมดอายุ

              if (
                data.status ===
                "session_expired"
              ) {

                sessionStorage.removeItem(
                  "portalSessionId"
                );


                sessionId =
                  null;


                clearInterval(
                  timerInterval
                );


                clearInterval(
                  keepAliveInterval
                );


                showError(
                  "Session หมดอายุ",
                  "กรุณาเข้าสู่ระบบใหม่"
                );

              }

            }

            catch (error) {

              console.warn(
                "KeepAlive error:",
                error
              );

            }

          },
          15 * 60 * 1000
        );

    }


    // =====================================================
    // FETCH CLIENT INFO
    // =====================================================

    async function fetchClientInfo() {

      try {

        const response =
          await fetch(
            "https://ipapi.co/json/"
          );


        if (!response.ok) {

          return;

        }


        const data =
          await response.json();


        clientInfo.ip =
          data.ip ||
          "Unknown";


        clientInfo.location =
          `${data.city || "Unknown"}, ${data.country_name || "Unknown"}`;

      }

      catch (error) {

        console.warn(
          "Client info unavailable:",
          error
        );

      }

    }


    // =====================================================
    // LOAD DASHBOARD
    // =====================================================

    async function loadDashboard() {

      showScreen(
        "loading-screen"
      );


      try {

        /*
         * -------------------------------------------------
         * กรณีมี Session
         *
         * ใช้ sessionId
         * ไม่ส่ง userId เป็นตัวหลัก
         * -------------------------------------------------
         */

        const payload = {

          action:
            "getDashboard",

          profile:
            lineProfile,

          clientInfo:
            clientInfo

        };


        if (sessionId) {

          payload.sessionId =
            sessionId;

        }

        else {

          /*
           * Login ครั้งแรก
           */

          payload.userId =
            lineProfile.userId;

        }


        const response =
          await fetch(
            CENTRAL_API_URL,
            {
              method: "POST",

              body:
                JSON.stringify(
                  payload
                )
            }
          );


        const data =
          await response.json();


        // =================================================
        // SESSION EXPIRED
        // =================================================

        if (
          data.status ===
          "session_expired"
        ) {

          sessionStorage.removeItem(
            "portalSessionId"
          );


          sessionId =
            null;


          showError(
            "Session หมดอายุ",
            "กรุณาเข้าสู่ระบบใหม่"
          );


          return;

        }


        // =================================================
        // NOT REGISTERED
        // =================================================

        if (
          data.status ===
          "not_registered"
        ) {

          showScreen(
            "register-screen"
          );


          document.getElementById(
            "user-info"
          ).textContent =
            "กรุณายืนยันตัวตน";


          return;

        }


        // =================================================
        // SUCCESS
        // =================================================

        if (
          data.status ===
          "success"
        ) {

          /*
           * Backend สร้าง Session ใหม่
           */

          if (
            data.sessionId
          ) {

            sessionId =
              data.sessionId;


            sessionStorage.setItem(
              "portalSessionId",
              sessionId
            );

          }


          renderDashboard(
            data
          );


          return;

        }


        // =================================================
        // ERROR
        // =================================================

        showError(
          "ข้อผิดพลาด",
          data.message ||
          "เกิดข้อผิดพลาดในระบบ"
        );

      }

      catch (error) {

        console.error(
          "LOAD DASHBOARD ERROR:",
          error
        );


        showError(
          "พบข้อผิดพลาด",
          "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้"
        );

      }

    }


    // =====================================================
    // PHONE VERIFICATION
    // =====================================================

    document
      .getElementById(
        "phone-form"
      )
      .addEventListener(
        "submit",
        async function (event) {

          event.preventDefault();


          const phoneInput =
            document
              .getElementById(
                "phone-input"
              )
              .value
              .trim();


          if (
            phoneInput.length !== 10
          ) {

            alert(
              "กรุณากรอกเบอร์โทรศัพท์ 10 หลัก"
            );


            return;

          }


          showScreen(
            "loading-screen"
          );


          try {

            const response =
              await fetch(
                CENTRAL_API_URL,
                {
                  method: "POST",

                  body:
                    JSON.stringify({

                      action:
                        "verifyPhone",

                      userId:
                        lineProfile.userId,

                      phone:
                        phoneInput,

                      profile:
                        lineProfile,

                      clientInfo:
                        clientInfo

                    })
                }
              );


            const data =
              await response.json();


            // -------------------------------------------
            // Success
            // -------------------------------------------

            if (
              data.status ===
              "show_userid"
            ) {

              showScreen(
                "copy-screen"
              );


              document
                .getElementById(
                  "display-userid"
                )
                .textContent =
                data.lineUserId;


              return;

            }


            // -------------------------------------------
            // Error
            // -------------------------------------------

            showError(
              "ตรวจสอบไม่สำเร็จ",
              data.message ||
              "ไม่สามารถตรวจสอบข้อมูลได้"
            );

          }

          catch (error) {

            console.error(
              "VERIFY PHONE ERROR:",
              error
            );


            showError(
              "การตรวจสอบล้มเหลว",
              "โปรดลองอีกครั้ง"
            );

          }

        }
      );


    // =====================================================
    // COPY USER ID
    // =====================================================

    async function copyUserId() {

      try {

        await navigator.clipboard.writeText(
          lineProfile.userId
        );


        alert(
          "คัดลอกรหัสสำเร็จ นำส่ง Admin ได้เลยครับ"
        );

      }

      catch (error) {

        console.error(
          "COPY ERROR:",
          error
        );


        alert(
          "ไม่สามารถคัดลอกอัตโนมัติได้ กรุณากดค้างที่รหัสเพื่อคัดลอก"
        );

      }

    }


    // =====================================================
    // RENDER DASHBOARD
    // =====================================================

    function renderDashboard(
      data
    ) {

      showScreen(
        "dashboard-screen"
      );


      // -----------------------------------------------
      // User Information
      // -----------------------------------------------

      document.getElementById(
        "user-info"
      ).textContent =
        `${lineProfile.displayName} | ตำแหน่ง: ${data.jobPosition}`;


      const container =
        document.getElementById(
          "menu-container"
        );


      container.innerHTML =
        "";


      // =================================================
      // NO MENU
      // =================================================

      if (
        !data.menuGroups ||
        data.menuGroups.length === 0
      ) {

        container.innerHTML = `

          <div
            class="
              bg-white
              p-8
              rounded-2xl
              text-lineDarkGray
              text-center
              border
              border-gray-200
              shadow-sm
            "
          >

            <div class="text-4xl mb-3">
              📭
            </div>

            <p class="text-sm font-medium">
              คุณไม่มีสิทธิ์เข้าถึงเมนูใดๆ
            </p>

          </div>

        `;


        return;

      }


      // =================================================
      // SORT GROUP
      // =================================================

      const groups =
        [...data.menuGroups];


      groups.sort(
        (a, b) => {

          const aSort =
            Number(
              a.sortValue || 9999
            );


          const bSort =
            Number(
              b.sortValue || 9999
            );


          return aSort - bSort;

        }
      );


      // =================================================
      // RENDER GROUP
      // =================================================

      groups.forEach(
        (group, groupIndex) => {

          const groupSection =
            document.createElement(
              "section"
            );


          groupSection.className = `
            bg-white
            border
            border-gray-200
            rounded-2xl
            shadow-sm
            overflow-hidden
          `;


          // =================================================
          // GROUP HEADER
          // =================================================

          const header =
            document.createElement(
              "button"
            );


          header.type =
            "button";


          header.className = `
            w-full
            px-3
            sm:px-5
            py-3.5
            sm:py-4
            flex
            items-center
            justify-between
            gap-3
            text-left
            hover:bg-gray-50
            transition
          `;


          header.innerHTML = `

            <div
              class="
                flex
                items-center
                gap-2.5
                sm:gap-3
                min-w-0
              "
            >

              <div
                class="
                  shrink-0
                  w-8
                  h-8
                  sm:w-9
                  sm:h-9
                  rounded-xl
                  bg-blue-50
                  text-linePrimary
                  flex
                  items-center
                  justify-center
                "
              >

                <svg
                  class="w-4 h-4 sm:w-5 sm:h-5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >

                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="
                      M4 6h16
                      M4 12h16
                      M4 18h16
                    "
                  />

                </svg>

              </div>


              <div class="min-w-0">

                <h3
                  class="
                    font-bold
                    text-sm
                    sm:text-base
                    text-gray-800
                    truncate
                  "
                >
                  ${escapeHtml(
                    group.groupName
                  )}
                </h3>


                <p
                  class="
                    text-[10px]
                    sm:text-[11px]
                    text-gray-400
                    mt-0.5
                  "
                >
                  ${group.menus.length} เมนู
                </p>

              </div>

            </div>


            <svg
              class="
                group-arrow
                w-4
                h-4
                sm:w-5
                sm:h-5
                text-gray-400
                shrink-0
              "
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >

              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="
                  M19 9l-7 7-7-7
                "
              />

            </svg>

          `;


          // =================================================
          // GROUP CONTENT
          // =================================================

          const content =
            document.createElement(
              "div"
            );


          content.className =
            "group-content";


          const grid =
            document.createElement(
              "div"
            );


          /*
           * มือถือ:
           * 3 คอลัมน์
           *
           * Desktop:
           * 3 / 4 / 5 / 6 คอลัมน์
           */

          grid.className = `
            mobile-menu-grid

            px-3
            sm:px-5

            pb-4
            sm:pb-5

            grid

            grid-cols-3

            sm:grid-cols-3

            md:grid-cols-4

            lg:grid-cols-5

            xl:grid-cols-6

            gap-1.5

            sm:gap-3
          `;


          // =================================================
          // SORT MENU
          // =================================================

          const menus =
            [...(group.menus || [])];


          menus.sort(
            (a, b) => {

              return (
                Number(
                  a.menuId || 999999
                ) -
                Number(
                  b.menuId || 999999
                )
              );

            }
          );


          // =================================================
          // CREATE MENU CARD
          // =================================================

          menus.forEach(
            menu => {

              const link =
                document.createElement(
                  "a"
                );


              /*
               * ใช้ menuUrl จาก Backend
               *
               * ไม่แสดง menuId
               * ไม่แสดงรหัส
               */

              link.href =
                menu.menuUrl || "#";


              /*
               * ถ้าไม่มี URL
               * ให้ป้องกันการกดแล้วไม่เกิดอะไร
               */

              if (
                !menu.menuUrl
              ) {

                link.addEventListener(
                  "click",
                  function (event) {

                    event.preventDefault();

                    alert(
                      "เมนูนี้ยังไม่ได้กำหนด URL"
                    );

                  }
                );

              }


              link.className = `
                menu-card
                group

                flex
                flex-col
                items-center
                justify-center

                text-center

                p-3

                bg-white

                border
                border-gray-200

                rounded-xl

                shadow-sm

                hover:shadow-md
                hover:border-linePrimary

                active:scale-95

                transition
              `;


              /*
               * =================================================
               * IMPORTANT
               *
               * menuId ไม่ถูกแสดง
               * Code ไม่ถูกแสดง
               *
               * แสดงเฉพาะ Icon + menuName
               *
               * บนมือถือ Icon จะถูก CSS ซ่อน
               * =================================================
               */

              link.innerHTML = `

                <!-- MENU ICON -->

                <div
                  class="
                    menu-icon

                    w-10
                    h-10

                    rounded-xl

                    bg-blue-50
                    text-linePrimary

                    flex
                    items-center
                    justify-center

                    mb-2.5

                    shrink-0

                    group-hover:bg-linePrimary
                    group-hover:text-white

                    transition
                  "
                >

                  <svg
                    class="w-5 h-5"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >

                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="1.8"
                      d="
                        M4 6.5
                        A2.5 2.5 0 016.5 4
                        h11
                        A2.5 2.5 0 0120 6.5
                        v11
                        A2.5 2.5 0 0117.5 20
                        h-11
                        A2.5 2.5 0 014 17.5
                        v-11z
                      "
                    />

                    <path
                      stroke-linecap="round"
                      stroke-width="1.8"
                      d="
                        M8 8h8
                        M8 12h8
                        M8 16h5
                      "
                    />

                  </svg>

                </div>


                <!-- MENU NAME -->

                <span
                  class="
                    menu-name

                    text-[11px]
                    sm:text-xs

                    font-semibold

                    text-gray-700

                    leading-[1.45]

                    w-full
                  "
                >
                  ${escapeHtml(
                    menu.menuName || ""
                  )}
                </span>

              `;


              grid.appendChild(
                link
              );

            }
          );


          content.appendChild(
            grid
          );


          groupSection.appendChild(
            header
          );


          groupSection.appendChild(
            content
          );


          container.appendChild(
            groupSection
          );


          // =================================================
          // ACCORDION
          // =================================================

          let opened =
            true;


          header.addEventListener(
            "click",
            () => {

              opened =
                !opened;


              const arrow =
                header.querySelector(
                  ".group-arrow"
                );


              if (opened) {

                content.classList.remove(
                  "closed"
                );


                content.style.maxHeight =
                  content.scrollHeight +
                  "px";


                arrow.classList.add(
                  "rotate"
                );

              }

              else {

                content.classList.add(
                  "closed"
                );


                content.style.maxHeight =
                  "0px";


                arrow.classList.remove(
                  "rotate"
                );

              }

            }
          );


          // =================================================
          // OPEN GROUP
          // =================================================

          requestAnimationFrame(
            () => {

              content.style.maxHeight =
                content.scrollHeight +
                "px";


              const arrow =
                header.querySelector(
                  ".group-arrow"
                );


              arrow.classList.add(
                "rotate"
              );

            }
          );

        }
      );

    }


    // =====================================================
    // ESCAPE HTML
    // =====================================================

    function escapeHtml(
      value
    ) {

      return String(
        value || ""
      )

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    // =====================================================
    // SHOW SCREEN
    // =====================================================

    function showScreen(
      id
    ) {

      [
        "loading-screen",
        "register-screen",
        "error-screen",
        "dashboard-screen",
        "copy-screen"

      ].forEach(
        screen => {

          const element =
            document.getElementById(
              screen
            );


          if (element) {

            element.classList.add(
              "hidden"
            );

          }

        }
      );


      const target =
        document.getElementById(
          id
        );


      if (target) {

        target.classList.remove(
          "hidden"
        );

      }

    }


    // =====================================================
    // SHOW ERROR
    // =====================================================

    function showError(
      title,
      message
    ) {

      document.getElementById(
        "error-title"
      ).textContent =
        title;


      document.getElementById(
        "error-message"
      ).textContent =
        message;


      showScreen(
        "error-screen"
      );

    }


    // =====================================================
    // LOGOUT
    // =====================================================

    async function logoutApp() {

      /*
       * -----------------------------------------------
       * ทำลาย Server Session ก่อน
       * -----------------------------------------------
       */

      try {

        if (sessionId) {

          await fetch(
            CENTRAL_API_URL,
            {
              method: "POST",

              body:
                JSON.stringify({

                  action:
                    "logout",

                  sessionId:
                    sessionId

                })
            }
          );

        }

      }

      catch (error) {

        console.warn(
          "Logout API error:",
          error
        );

      }


      /*
       * -----------------------------------------------
       * Clear Browser Session
       * -----------------------------------------------
       */

      sessionStorage.removeItem(
        "portalSessionId"
      );


      sessionId =
        null;


      /*
       * -----------------------------------------------
       * Logout LINE LIFF
       * -----------------------------------------------
       */

      try {

        if (
          typeof liff !==
            "undefined" &&
          liff.isLoggedIn()
        ) {

          liff.logout();

        }

      }

      catch (error) {

        console.warn(
          "LIFF logout error:",
          error
        );

      }


      /*
       * -----------------------------------------------
       * Reload
       * -----------------------------------------------
       */

      window.location.reload();

    }


    // =====================================================
    // START APPLICATION
    // =====================================================

    window.onload =
      initApp;

  </script>

</body>
