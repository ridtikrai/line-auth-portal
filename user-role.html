<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Permission & Menu Management</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- LINE Template Colors -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Kanit', 'Arial', 'sans-serif'] },
          colors: {
            linePrimary: '#0084FF',
            lineSuccess: '#17C950',
            lineDanger: '#FF4458',
            lineWarning: '#FFC300',
            lineLightBg: '#F7F7F7',
            lineDarkGray: '#6C757D'
          }
        }
      }
    }
  </script>
  <style>
    .perm-hide { display: none !important; }
    .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .tab-active { border-bottom-width: 2px; border-color: #0084FF; color: #0084FF; font-weight: bold; }
    .tab-inactive { color: #6C757D; font-weight: 500; }
    .group-row { background-color: #f0f7ff; font-weight: bold; }
    .group-row-expand { cursor: pointer; user-select: none; }
    .group-row-expand:hover { background-color: #e6f2ff; }
    .sub-row { background-color: #fff; }
    .sub-row:hover { background-color: #f9f9f9; }
  </style>
</head>
<body class="bg-lineLightBg font-sans text-gray-800 antialiased min-h-screen flex flex-col">

  <script>
    const AUTH_API_URL = "https://script.google.com/macros/s/AKfycbwphhIdSMHpTWHuFrRFTC3lEZe-QQCaZr2cebxb22cE9ph1eYPscyrxdw29T44DaUT9/exec";
    const RESOURCE_API_URL = "https://script.google.com/macros/s/AKfycbwT92lC6xrr0MuDUNdjJKjL_jvkMZb7AjbOmA81uWKONXOf9dG2U-_6Y8qqW8bGsvoY/exec";
    const SESSION_KEY = 'portalSessionId';
    const CURRENT_MENU_ID = "902";
  </script>

  <!-- Topbar -->
  <div class="topbar sticky top-0 z-50 bg-white border-b border-gray-200 min-h-[76px] px-6 py-2.5 flex justify-between items-center max-sm:min-h-[72px] max-sm:px-3 max-sm:gap-2 max-[390px]:justify-end">
    <!-- BRAND -->
    <div class="brand-area flex items-center gap-3 max-sm:gap-2 max-[390px]:hidden">
      <div class="brand-logo w-11 h-11 flex-none rounded-[13px] bg-gradient-to-br from-green-800 to-green-600 text-white flex items-center justify-center max-sm:w-[38px] max-sm:h-[38px] max-sm:basis-[38px] max-sm:rounded-[11px]">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
      </div>
      <div class="brand-text flex flex-col justify-center leading-tight">
        <div class="brand flex items-center text-[18px] font-extrabold text-gray-900 tracking-[-0.3px] max-sm:text-[16px]">
          Permission & Menu
        </div>
      </div>
    </div>

    <!-- USER + LINE + SESSION -->
    <div class="user-info flex items-center gap-3 max-sm:gap-[7px]">
      <img id="profile-img" class="line-avatar hidden w-12 h-12 rounded-full object-cover border-2 border-white shadow-[0_2px_8px_rgba(0,0,0,0.08)] max-sm:w-[42px] max-sm:h-[42px]" src="" alt="Profile">

      <div class="user-detail flex flex-col items-end justify-center leading-tight max-sm:min-w-0">
        <div id="user-name-display" class="user-name text-[14px] font-bold text-gray-900 max-sm:text-[13px] max-[390px]:max-w-[85px] max-[390px]:truncate">กำลังตรวจสอบ...</div>
        <div class="flex items-center gap-[6px] mt-1">
          <div id="user-role-display" class="user-role text-[10px] font-semibold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-[10px]">-</div>
          <span class="session-dot w-[6px] h-[6px] rounded-full bg-green-500 shadow-[0_0_0_2px_rgba(34,197,94,0.13)]"></span>
        </div>
        <div id="sessionStatus" class="session-time text-[10px] text-gray-400 mt-0.5 max-sm:hidden">
           <span id="timer-display">60:00</span>
        </div>
      </div>

      <!-- BACK TO PORTAL -->
      <button onclick="goToHome()" class="bg-transparent border-none p-1 cursor-pointer hover:bg-gray-100 rounded-full transition-colors ml-1" title="กลับหน้า Portal">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-500"><path d="M15 19l-7-7 7-7"></path></svg>
      </button>

      <!-- LOGOUT -->
      <button onclick="logoutApp()" class="bg-transparent border-none p-1 cursor-pointer hover:bg-gray-100 rounded-full transition-colors ml-1" title="ออกจากระบบ">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-500"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      </button>
    </div>
  </div>

  <main class="max-w-7xl mx-auto p-3 sm:p-4 flex-grow w-full">
    
    <!-- Loading Screen -->
    <div id="loading-screen" class="flex flex-col items-center justify-center py-20">
      <div class="animate-spin rounded-full h-10 w-10 border-b-4 border-linePrimary mb-4"></div>
      <p class="text-lineDarkGray text-sm font-medium">กำลังตรวจสอบสิทธิ์และโหลดข้อมูล...</p>
    </div>

    <!-- Main System Area -->
    <div id="management-screen" class="hidden">
      
      <!-- Tabs (Mobile-friendly) -->
      <div class="flex border-b border-gray-200 mb-4 overflow-x-auto">
        <button onclick="switchTab('menu')" id="tab-menu" class="tab-active px-3 sm:px-4 py-3 whitespace-nowrap transition text-sm sm:text-base">📋 เมนู</button>
        <button onclick="switchTab('role')" id="tab-role" class="tab-inactive px-3 sm:px-4 py-3 whitespace-nowrap transition text-sm sm:text-base">🔐 สิทธิ์</button>
      </div>

      <!-- Action Bar -->
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4 bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-gray-200">
        <div class="flex-1">
          <h2 id="section-title" class="text-base sm:text-lg font-bold text-gray-800">📋 รายการเมนูระบบ</h2>
        </div>
        <button onclick="openForm('add', currentTab)" id="btn-add" class="perm-hide bg-linePrimary text-white font-bold py-2 px-3 sm:py-2.5 sm:px-4 rounded-lg shadow-sm hover:bg-blue-600 transition text-xs sm:text-sm flex items-center gap-1 whitespace-nowrap">
          <span>➕</span> <span class="hidden sm:inline">เพิ่มข้อมูล</span><span class="sm:hidden">เพิ่ม</span>
        </button>
      </div>

      <!-- Desktop Table View (Hidden on Mobile) -->
      <div class="hidden lg:block bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden table-container">
        
        <!-- Menu Table -->
        <table id="table-menu" class="w-full text-left text-sm text-gray-600 hidden">
            <thead class="bg-gray-50 text-gray-700 border-b sticky top-0">
                <tr>
                    <th class="p-3.5 font-bold w-12">➕</th>
                    <th class="p-3.5 font-bold">Group / MenuGroup</th>
                    <th class="p-3.5 font-bold">Menu ID</th>
                    <th class="p-3.5 font-bold">Menu Name</th>
                    <th class="p-3.5 font-bold">Audit Trail</th>
                    <th class="p-3.5 font-bold text-center">จัดการ</th>
                </tr>
            </thead>
            <tbody id="tbody-menu" class="divide-y divide-gray-100"></tbody>
        </table>

        <!-- Role Table -->
        <table id="table-role" class="w-full text-left text-sm text-gray-600 hidden">
          <thead class="bg-gray-50 text-gray-700 border-b sticky top-0">
              <tr>
                  <th class="p-3.5 font-bold w-12">➕</th>
                  <th class="p-3.5 font-bold">Job Position</th>
                  <th class="p-3.5 font-bold">Menu ID</th>
                  <th class="p-3.5 font-bold">Menu Name</th>
                  <th class="p-3.5 font-bold">สิทธิ์ (R/C/E/D/A)</th>
                  <th class="p-3.5 font-bold">Audit Trail</th>
                  <th class="p-3.5 font-bold text-center">จัดการ</th>
              </tr>
          </thead>
          <tbody id="tbody-role" class="divide-y divide-gray-100"></tbody>
        </table>

      </div>

      <!-- Mobile Card View (Visible on Mobile Only) -->
      <div id="adminListMobile" class="lg:hidden grid gap-3 grid-cols-1 sm:grid-cols-2"></div>

    </div>
  </main>

  <!-- FORM MODAL (Dynamic for both Menu and Role) -->
  <div id="formModal" class="hidden fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-4 overflow-y-auto">
      <div class="bg-white w-full max-w-2xl rounded-2xl overflow-hidden shadow-2xl max-h-[90vh] flex flex-col my-auto">
          <div class="bg-linePrimary p-4 text-white font-bold text-base flex justify-between items-center sticky top-0">
              <span id="modalTitle">ฟอร์มจัดการข้อมูล</span>
              <button onclick="document.getElementById('formModal').classList.add('hidden')" class="text-white text-lg font-bold">✕</button>
          </div>
          <div class="p-4 sm:p-6 space-y-4 text-sm overflow-y-auto flex-1">
              <input type="hidden" id="formMode">
              
              <!-- Audit Trail Info -->
              <div class="text-xs bg-gray-50 p-3 rounded-lg border border-gray-200 text-gray-700 space-y-1 mb-4">
                <div class="font-bold text-linePrimary">📌 ข้อมูลผู้บันทึก/แก้ไข (Audit Trail):</div>
                <div id="auditInfo" class="font-mono text-xs text-gray-600">--</div>
              </div>
              
              <!-- Menu Form Fields -->
              <div id="fields-menu" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden">
                <div><label class="block font-bold mb-1">Group *</label><input type="text" id="m_group" autocomplete="off" class="w-full border rounded-lg p-2.5 focus:border-linePrimary outline-none text-base"></div>
                <div><label class="block font-bold mb-1">Menu Group</label><input type="text" id="m_menuGroup" autocomplete="off" class="w-full border rounded-lg p-2.5 focus:border-linePrimary outline-none text-base"></div>
                <div><label class="block font-bold mb-1">Menu ID (PK) *</label><input type="text" id="m_menuId" autocomplete="off" class="w-full border rounded-lg p-2.5 focus:border-linePrimary outline-none text-base"></div>
                <div><label class="block font-bold mb-1">Menu Name *</label><input type="text" id="m_menuName" autocomplete="off" class="w-full border rounded-lg p-2.5 focus:border-linePrimary outline-none text-base"></div>
              </div>

              <!-- Role Form Fields -->
              <div id="fields-role" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden">
                <div><label class="block font-bold mb-1">Job Position (PK) *</label><input type="text" id="r_jobPosition" autocomplete="off" class="w-full border rounded-lg p-2.5 focus:border-linePrimary outline-none text-base"></div>
                <div><label class="block font-bold mb-1">Menu ID (PK) *</label><input type="text" id="r_menuId" autocomplete="off" class="w-full border rounded-lg p-2.5 focus:border-linePrimary outline-none text-base"></div>
                <div class="md:col-span-2"><label class="block font-bold mb-1">Menu URL</label><input type="text" id="r_menuUrl" autocomplete="off" class="w-full border rounded-lg p-2.5 focus:border-linePrimary outline-none text-base"></div>
                
                <div class="md:col-span-2 grid grid-cols-2 sm:grid-cols-5 gap-2 mt-2 p-3 bg-gray-50 rounded border">
                  <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" id="r_canRead" class="cursor-pointer"> <span class="text-xs">Read</span></label>
                  <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" id="r_canCreate" class="cursor-pointer"> <span class="text-xs">Create</span></label>
                  <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" id="r_canEdit" class="cursor-pointer"> <span class="text-xs">Edit</span></label>
                  <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" id="r_canDelete" class="cursor-pointer"> <span class="text-xs">Delete</span></label>
                  <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" id="r_canApprove" class="cursor-pointer"> <span class="text-xs">Approve</span></label>
                </div>
              </div>

          </div>
          <div class="p-3 sm:p-4 border-t flex justify-end gap-2 sm:gap-3 bg-gray-50 sticky bottom-0">
              <button onclick="document.getElementById('formModal').classList.add('hidden')" class="px-3 sm:px-4 py-2 bg-gray-200 text-gray-700 font-bold rounded-xl transition hover:bg-gray-300 text-sm">ยกเลิก</button>
              <button onclick="saveData()" class="px-4 sm:px-5 py-2 bg-lineSuccess text-white font-bold rounded-xl shadow-md transition hover:bg-green-600 text-sm">บันทึก</button>
          </div>
      </div>
  </div>

  <script>
    let portalSessionId = sessionStorage.getItem(SESSION_KEY);
    let currentUser = null;
    let currentPermissions = { read: false, create: false, edit: false, delete: false, approve: false };
    
    let allMenus = [];
    let allRoles = [];
    let currentTab = 'menu';
    let currentActionEmpId = ""; 
    let prefetchDataPromise = null;
    
    let timeoutLimit = 3600; 
    let timeRemaining = timeoutLimit;
    let timerInterval;

    window.onload = startApplication;

    async function startApplication() {
      // เริ่มดึงข้อมูลล่วงหน้า (Prefetch) ทันทีที่เปิดเว็บ เพื่อลดเวลารอ
      prefetchDataPromise = fetch(RESOURCE_API_URL, {
          method: 'POST', 
          body: JSON.stringify({ action: 'getManageData' })
      }).then(res => res.json()).catch(err => ({ status: 'error', message: err.message }));

      const params = new URLSearchParams(window.location.search);
      const launchToken = params.get('launchToken');
      
      if (launchToken) {
        await exchangeLaunchToken(launchToken);
        return;
      }
      
      if (portalSessionId) {
        await verifySession();
        return;
      }
      
      alert('ไม่พบสิทธิ์การใช้งาน กรุณาเข้าสู่ระบบผ่าน Portal');
      goToHome();
    }

    async function exchangeLaunchToken(launchToken) {
      try {
        const res = await fetch(AUTH_API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'validateLaunch', launchToken: launchToken, menuId: CURRENT_MENU_ID })
        });
        const result = await res.json();
        
        if (result.status === 'success') {
          handleAuthSuccess(result);
          window.history.replaceState({}, document.title, window.location.pathname);
        } else {
          alert(result.message || 'Token ไม่ถูกต้องหรือหมดอายุ');
          goToHome();
        }
      } catch (err) {
        alert('เชื่อมต่อ API ล้มเหลว');
        goToHome();
      }
    }

    async function verifySession() {
      try {
        const res = await fetch(AUTH_API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'verifySession', sessionId: portalSessionId })
        });
        const result = await res.json();
        
        if (result.status === 'success') {
          handleAuthSuccess(result);
        } else {
          sessionStorage.removeItem(SESSION_KEY);
          alert('Session หมดอายุ กรุณาเข้าสู่ระบบใหม่');
          goToHome();
        }
      } catch (err) {
        alert('เชื่อมต่อ API ล้มเหลว');
        goToHome();
      }
    }

    function handleAuthSuccess(result) {
      portalSessionId = result.sessionId || portalSessionId;
      sessionStorage.setItem(SESSION_KEY, portalSessionId);
      
      currentUser = result.user || result.session || currentUser;
      
      let perm = result.permission;
      if (perm) {
        sessionStorage.setItem('PORTAL_PERMISSIONS_ROLE', JSON.stringify(perm));
      } else {
        const stored = sessionStorage.getItem('PORTAL_PERMISSIONS_ROLE');
        if (stored) perm = JSON.parse(stored);
        else perm = {};
      }

      currentPermissions = {
        read: perm.canRead || perm.read || false,
        create: perm.canWrite || perm.create || perm.canRead || false,
        edit: perm.canWrite || perm.edit || perm.canRead || false,
        delete: perm.canDelete || perm.delete || perm.canRead || false
      };
      
      currentActionEmpId = currentUser?.empId || currentUser?.userId || '';

      if (!currentPermissions.read) {
        alert('Access Denied: คุณไม่มีสิทธิ์เข้าถึงหน้านี้');
        goToHome();
        return;
      }

      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('management-screen').classList.remove('hidden');
      
      if(document.getElementById('user-name-display')) document.getElementById('user-name-display').textContent = currentUser.displayName || currentUser.name || currentUser.userId || currentUser.Emp_ID;
      if(document.getElementById('user-role-display')) document.getElementById('user-role-display').textContent = currentUser.Job_Position || currentUser.role || 'User';

      startActivityTracker();
      applyPermissions();
      loadAllData();
    }

    function startActivityTracker() {
      const resetTimer = () => { timeRemaining = timeoutLimit; };
      ['mousemove', 'keydown', 'touchstart', 'scroll', 'click'].forEach(evt => window.addEventListener(evt, resetTimer, { passive: true }));

      timerInterval = setInterval(() => {
        timeRemaining--;
        let m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
        let s = (timeRemaining % 60).toString().padStart(2, '0');
        document.getElementById('timer-display').textContent = `${m}:${s}`;
        if (timeRemaining <= 0) { clearInterval(timerInterval); alert("หมดเวลาการเชื่อมต่อ กรุณาเข้าสู่ระบบใหม่"); logoutApp(); }
      }, 1000);
    }

    function applyPermissions() {
      const btnAdd = document.getElementById('btn-add');
      if (currentPermissions.create) btnAdd.classList.remove('perm-hide');
      else btnAdd.classList.add('perm-hide');
    }

    async function loadAllData() {
      try {
        let result;
        if (prefetchDataPromise) {
            result = await prefetchDataPromise;
            prefetchDataPromise = null; // ใช้ครั้งแรกครั้งเดียว
        } else {
            const res = await fetch(RESOURCE_API_URL, {
                method: 'POST', 
                body: JSON.stringify({ action: 'getManageData' })
            });
            result = await res.json();
        }
        
        if(result.status === 'success'){
          allMenus = result.menus || [];
          allRoles = result.roles || [];
          allRoles.sort((a, b) => String(a.menuId).localeCompare(String(b.menuId), undefined, { numeric: true }));
          renderData();
        } else {
          console.error("API Error:", result);
          alert("ไม่สามารถดึงข้อมูลได้: " + (result.message || 'Unknown error'));
          allMenus = []; allRoles = [];
          renderData();
        }
      } catch (err) {
        console.error("Fetch Error:", err);
        alert("เกิดข้อผิดพลาดในการเชื่อมต่อ API");
        allMenus = []; allRoles = [];
        renderData();
      }
    }

    function switchTab(tabName) {
      currentTab = tabName;
      document.getElementById('tab-menu').className = tabName === 'menu' ? 'tab-active px-3 sm:px-4 py-3 whitespace-nowrap transition text-sm sm:text-base' : 'tab-inactive px-3 sm:px-4 py-3 whitespace-nowrap transition text-sm sm:text-base';
      document.getElementById('tab-role').className = tabName === 'role' ? 'tab-active px-3 sm:px-4 py-3 whitespace-nowrap transition text-sm sm:text-base' : 'tab-inactive px-3 sm:px-4 py-3 whitespace-nowrap transition text-sm sm:text-base';
      
      document.getElementById('section-title').innerHTML = tabName === 'menu' ? '📋 รายการเมนูระบบ' : '🔐 สิทธิ์การใช้งานตามตำแหน่ง';
      
      renderData();
    }

    function formatDateTime(isoString) {
      if(!isoString) return '-';
      return new Date(isoString).toLocaleString('th-TH');
    }

    function toggleGroupMenu(groupKey) {
      const groupEl = document.getElementById(`group-menu-${groupKey}`);
      if (groupEl) {
        groupEl.classList.toggle('hidden');
        document.getElementById(`toggle-menu-${groupKey}`).textContent = 
          groupEl.classList.contains('hidden') ? '▶' : '▼';
      }
    }

    function toggleGroupRole(jobPos) {
      const groupEl = document.getElementById(`group-role-${jobPos}`);
      if (groupEl) {
        groupEl.classList.toggle('hidden');
        document.getElementById(`toggle-role-${jobPos}`).textContent = 
          groupEl.classList.contains('hidden') ? '▶' : '▼';
      }
    }

    function renderData() {
      const editClass = currentPermissions.edit ? '' : 'perm-hide';
      const deleteClass = currentPermissions.delete ? '' : 'perm-hide';

      if(currentTab === 'menu') {
        document.getElementById('table-menu').classList.remove('hidden');
        document.getElementById('table-role').classList.add('hidden');
        renderMenuDesktop(editClass, deleteClass);
        renderMenuMobile(editClass, deleteClass);
      } else {
        document.getElementById('table-role').classList.remove('hidden');
        document.getElementById('table-menu').classList.add('hidden');
        renderRoleDesktop(editClass, deleteClass);
        renderRoleMobile(editClass, deleteClass);
      }
    }

    function renderMenuDesktop(editClass, deleteClass) {
      // จัดกลุ่มตามหน่วยมัฒนา (Group)
      const groupedMenus = {};
      allMenus.forEach(m => {
        if (!groupedMenus[m.group]) groupedMenus[m.group] = [];
        groupedMenus[m.group].push(m);
      });

      let html = '';
      Object.keys(groupedMenus).forEach(group => {
        const items = groupedMenus[group];
        html += `
        <tr class="group-row group-row-expand" onclick="toggleGroupMenu('${group}')">
            <td class="p-3.5"><span id="toggle-menu-${group}" class="font-bold">▼</span></td>
            <td class="p-3.5 font-bold text-linePrimary" colspan="5">
              📁 ${group}
              <span class="text-xs text-gray-500 ml-2">(${items.length} items)</span>
            </td>
        </tr>`;
        
        html += `<tbody id="group-menu-${group}" class="divide-y divide-gray-100">`;
        items.forEach((m, idx) => {
          html += `
          <tr class="sub-row hover:bg-gray-50 transition">
              <td class="p-3.5"></td>
              <td class="p-3.5 text-xs text-gray-600">${m.menuGroup || '-'}</td>
              <td class="p-3.5 font-bold text-sm">${m.menuId}</td>
              <td class="p-3.5">${m.menuName}</td>

    function openForm(mode, tabType, pk1, pk2) {
      document.getElementById('formModal').classList.remove('hidden');
      document.getElementById('formMode').value = mode;
      
      const isMenu = tabType === 'menu';
      document.getElementById('fields-menu').classList.toggle('hidden', !isMenu);
      document.getElementById('fields-role').classList.toggle('hidden', isMenu);
      document.getElementById('modalTitle').textContent = mode === 'add' ? '➕ เพิ่มข้อมูล' : '✏️ แก้ไขข้อมูล';

      if (mode === 'add') {
        document.getElementById('auditInfo').innerHTML = `สร้างรายการใหม่โดย Admin ID: <b>${currentActionEmpId}</b>`;
        if (isMenu) {
          ['m_group', 'm_menuGroup', 'm_menuId', 'm_menuName'].forEach(id => document.getElementById(id).value = '');
          document.getElementById('m_group').readOnly = false;
          document.getElementById('m_menuId').readOnly = false;
        } else {
          ['r_jobPosition', 'r_menuId', 'r_menuUrl'].forEach(id => document.getElementById(id).value = '');
          ['r_canRead', 'r_canCreate', 'r_canEdit', 'r_canDelete', 'r_canApprove'].forEach(id => document.getElementById(id).checked = false);
          document.getElementById('r_jobPosition').readOnly = false;
          document.getElementById('r_menuId').readOnly = false;
        }
      } else {
        if (isMenu) {
          const m = allMenus.find(x => x.group === pk1 && x.menuId === pk2);
          if (m) {
            document.getElementById('m_group').value = m.group;
            document.getElementById('m_group').readOnly = true;
            document.getElementById('m_menuGroup').value = m.menuGroup;
            document.getElementById('m_menuId').value = m.menuId;
            document.getElementById('m_menuId').readOnly = true;
            document.getElementById('m_menuName').value = m.menuName;
            
            document.getElementById('auditInfo').innerHTML = `<div>• <b>สร้างโดย:</b> ${m.createEmpId || '-'} (${formatDateTime(m.createDate)})</div><div>• <b>แก้ไขล่าสุดโดย:</b> ${m.updateEmpId || '-'} (${formatDateTime(m.updateDate)})</div>`;
          }
        } else {
          const r = allRoles.find(x => x.Job_Position === pk1 && x.menuId === pk2);
          if (r) {
            document.getElementById('r_jobPosition').value = r.Job_Position;
            document.getElementById('r_jobPosition').readOnly = true;
            document.getElementById('r_menuId').value = r.menuId;
            document.getElementById('r_menuId').readOnly = true;
            document.getElementById('r_menuUrl').value = r.menuUrl;
            
            document.getElementById('r_canRead').checked = String(r.canRead).toUpperCase() === 'TRUE';
            document.getElementById('r_canCreate').checked = String(r.canCreate).toUpperCase() === 'TRUE';
            document.getElementById('r_canEdit').checked = String(r.canEdit).toUpperCase() === 'TRUE';
            document.getElementById('r_canDelete').checked = String(r.canDelete).toUpperCase() === 'TRUE';
            document.getElementById('r_canApprove').checked = String(r.canApprove).toUpperCase() === 'TRUE';

            document.getElementById('auditInfo').innerHTML = `<div>• <b>สร้างโดย:</b> ${r.createEmpId || '-'} (${formatDateTime(r.createDate)})</div><div>• <b>แก้ไขล่าสุดโดย:</b> ${r.updateEmpId || '-'} (${formatDateTime(r.updateDate)})</div>`;
          }
        }
      }
    }

    async function saveData() {
      const mode = document.getElementById('formMode').value;
      const isMenu = currentTab === 'menu';
      
      let payload = { mode: mode, actionByEmpId: currentActionEmpId };

      if (isMenu) {
        payload.action = 'manageMenu';
        payload.menuData = {
          group: document.getElementById('m_group').value.trim(),
          menuGroup: document.getElementById('m_menuGroup').value.trim(),
          menuId: document.getElementById('m_menuId').value.trim(),
          menuName: document.getElementById('m_menuName').value.trim()
        };
        if(!payload.menuData.group || !payload.menuData.menuId) { alert("กรุณากรอก Group และ Menu ID ให้ครบถ้วน"); return; }
      } else {
        payload.action = 'manageRole';
        payload.roleData = {
          Job_Position: document.getElementById('r_jobPosition').value.trim(),
          menuId: document.getElementById('r_menuId').value.trim(),
          menuUrl: document.getElementById('r_menuUrl').value.trim(),
          canRead: document.getElementById('r_canRead').checked,
          canCreate: document.getElementById('r_canCreate').checked,
          canEdit: document.getElementById('r_canEdit').checked,
          canDelete: document.getElementById('r_canDelete').checked,
          canApprove: document.getElementById('r_canApprove').checked
        };
        if(!payload.roleData.Job_Position || !payload.roleData.menuId) { alert("กรุณากรอก Job Position และ Menu ID ให้ครบถ้วน"); return; }
      }

      document.getElementById('modalTitle').textContent = 'กำลังบันทึก...';
      const res = await fetch(RESOURCE_API_URL, { 
          method: 'POST', 
          body: JSON.stringify(payload) 
      });
      const result = await res.json();
      
      if (result.status === 'success') {
        document.getElementById('formModal').classList.add('hidden');
        loadAllData();
      } else {
        alert(result.message);
        document.getElementById('modalTitle').textContent = 'ฟอร์มจัดการข้อมูล';
      }
    }

    async function deleteData(pk1, pk2) {
      if(!confirm(`ยืนยันการลบข้อมูล [${pk1}] - [${pk2}] อย่างถาวร?`)) return;
      
      const payload = { mode: 'delete' };
      if(currentTab === 'menu') {
        payload.action = 'manageMenu';
        payload.menuData = { group: pk1, menuId: pk2 };
      } else {
        payload.action = 'manageRole';
        payload.roleData = { Job_Position: pk1, menuId: pk2 };
      }

      const res = await fetch(RESOURCE_API_URL, { 
          method: 'POST', 
          body: JSON.stringify(payload) 
      });
      const result = await res.json();
      
      if(result.status === 'success') loadAllData();
      else alert(result.message);
    }

    function goToHome() { window.location.href = "index.html"; }
    function logoutApp() {
      try { fetch(AUTH_API_URL, { method: 'POST', body: JSON.stringify({ action: 'logout', sessionId: portalSessionId }) }); } catch(e) {}
      sessionStorage.removeItem(SESSION_KEY);
      sessionStorage.removeItem('PORTAL_PERMISSIONS_ROLE');
      goToHome();
    }
