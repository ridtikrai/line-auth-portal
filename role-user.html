<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Permission Template System</title>
    
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        // กำหนด Configuration และ Color Palette ตาม LINE Official Standard
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        line: {
                            primary: '#0084FF',
                            success: '#17C950',
                            danger: '#FF4458',
                            warning: '#FFC300',
                            gray: '#B6C2C7',
                            bg: '#F7F7F7'
                        }
                    },
                    maxWidth: {
                        'line-app': '500px'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        
        /* Utility Class เพื่อใช้ซ่อนปุ่มหากไม่มีสิทธิ์ */
        .no-permission { display: none !important; }
        
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95); z-index: 50;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
    </style>
</head>
<body class="bg-line-bg text-gray-800 antialiased">

    <!-- Configuration ตัวแปร (เพื่อให้แก้ไขได้ง่าย) -->
    <script>
        const LIFF_ID = "2011487100-dldPQItq";
        const CENTRAL_API_URL = "https://script.google.com/macros/s/AKfycbwT92lC6xrr0MuDUNdjJKjL_jvkMZb7AjbOmA81uWKONXOf9dG2U-_6Y8qqW8bGsvoY/exec";
        const CURRENT_MENU_ID = "902"; 
    </script>

    <!-- หน้าจอ Loading -->
    <div id="loader">
        <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-line-primary mb-4"></div>
        <p class="text-line-primary font-bold text-sm">กำลังตรวจสอบข้อมูลผู้ใช้งาน...</p>
    </div>

    <!-- Main Container (Responsive จำกัดความกว้าง 500px ตาม LINE Flex Message) -->
    <div class="max-w-line-app mx-auto bg-white min-h-screen shadow-md relative pb-10">
        
        <!-- HEADER (LINE Style Gradient) -->
        <header class="bg-gradient-to-br from-line-primary to-blue-600 text-white p-5 shadow-sm">
            <h1 id="sysTitle" class="text-xl font-bold mb-1">ระบบข้อมูล (กำลังโหลด...)</h1>
            <div class="flex items-center text-xs opacity-90">
                <span id="sysRole" class="bg-white/20 px-3 py-1 rounded-full inline-block">👤 -</span>
            </div>
        </header>

        <!-- CONTENT AREA -->
        <main class="p-4 space-y-4">
            
            <!-- Alert แจ้งเตือน กรณีไม่มีสิทธิ์ หรือไม่พบผู้ใช้ -->
            <div id="alertBox" class="bg-red-50 border-l-4 border-line-danger p-4 rounded-lg hidden">
                <p id="alertMsg" class="text-sm text-red-700 font-bold">⛔ คุณไม่มีสิทธิ์เข้าถึงเมนูนี้</p>
            </div>

            <!-- พื้นที่การทำงานจริง (แสดงเมื่ออนุญาต) -->
            <div id="workspace" class="hidden space-y-4">
                
                <!-- Action Buttons: ควบคุมการแสดงผลตาม Data Attribute -->
                <div class="grid grid-cols-2 gap-3">
                    <button data-perm="create" class="bg-line-success hover:bg-green-600 text-white font-bold h-11 rounded-lg shadow-sm transition text-sm flex items-center justify-center gap-1">
                        ➕ เพิ่มข้อมูล
                    </button>
                    <button data-perm="approve" class="bg-line-warning hover:bg-yellow-500 text-white font-bold h-11 rounded-lg shadow-sm transition text-sm flex items-center justify-center gap-1">
                        ✅ อนุมัติเอกสาร
                    </button>
                </div>

                <!-- Mockup Card Data -->
                <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm">
                    <div class="flex justify-between items-start mb-3 pb-3 border-b border-gray-100">
                        <div>
                            <h3 class="font-bold text-gray-800">เอกสารรหัส #DOC-001</h3>
                            <p class="text-xs text-gray-500 mt-1">วันที่: 10/09/2026</p>
                        </div>
                        <!-- ปุ่ม Delete -->
                        <button data-perm="delete" class="text-line-danger bg-red-50 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-red-100 transition">
                            🗑️ ลบ
                        </button>
                    </div>
                    
                    <!-- ปุ่ม Edit -->
                    <button data-perm="edit" class="w-full bg-blue-50 text-line-primary border border-blue-200 font-bold h-11 rounded-lg text-sm hover:bg-blue-100 transition">
                        ✏️ แก้ไขข้อมูลเอกสารนี้
                    </button>
                </div>
                
            </div>
        </main>
    </div>

    <!-- App Logic -->
    <script>
        // เริ่มต้นแอป
        async function initApp() {
            try {
                await liff.init({ liffId: LIFF_ID });
                
                // หากยังไม่ได้ Login ใน LINE ให้ Login ก่อน
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                // ดึงข้อมูลผู้ใช้จาก LINE
                const profile = await liff.getProfile();
                
                // ตรวจสอบสิทธิ์กับ Central API
                await checkPermission(profile.userId);

            } catch (err) {
                console.error("LIFF Init Error:", err);
                document.getElementById('loader').classList.add('hidden');
                showAlert("เกิดข้อผิดพลาดในการเชื่อมต่อ LINE SDK");
            }
        }

        // ฟังก์ชันส่ง Request ตรวจสอบสิทธิ์
        async function checkPermission(lineUserId) {
            try {
                const response = await fetch(CENTRAL_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'verifyAccess',
                        userId: lineUserId,
                        menuId: CURRENT_MENU_ID
                    })
                });

                const data = await response.json();
                document.getElementById('loader').classList.add('hidden');

                if (data.status === 'not_registered') {
                    showAlert('ไม่พบข้อมูลผู้ใช้งานของคุณในระบบ');
                    return;
                }

                if (data.status === 'success') {
                    if (data.allowed === false || data.permissions.read === false) {
                        showAlert(`ไม่มีสิทธิ์ใช้งานเมนู: ${data.menuName}`);
                        return;
                    }

                    // อนุญาตให้เข้าใช้งานได้
                    document.getElementById('sysTitle').innerText = data.menuName;
                    document.getElementById('sysRole').innerText = `👤 ${data.jobPosition} (ID: ${data.empId})`;
                    document.getElementById('workspace').classList.remove('hidden');

                    // ซ่อนปุ่มต่างๆ ตาม Permission (CanCreate, CanEdit, etc.)
                    applyPermissions(data.permissions);
                }

            } catch (err) {
                document.getElementById('loader').classList.add('hidden');
                showAlert("เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์ส่วนกลาง (API Error)");
                console.error("API Fetch Error:", err);
            }
        }

        // ฟังก์ชันควบคุม DOM อัตโนมัติด้วย Data Attribute
        function applyPermissions(permissions) {
            // permissions = { read: true, create: false, edit: true, delete: false, approve: false }
            
            // วนลูปหา Element ที่มี attribute 'data-perm' ทั้งหมด
            const elements = document.querySelectorAll('[data-perm]');
            
            elements.forEach(el => {
                const reqPerm = el.getAttribute('data-perm'); // เช่น 'create', 'edit'
                
                // หากค่าใน JSON เป็น false ให้เพิ่มคลาสเพื่อซ่อน element (display: none)
                if (permissions[reqPerm] === false) {
                    el.classList.add('no-permission');
                }
            });
        }

        // ตัวช่วยแสดงกล่องข้อความ Error
        function showAlert(message) {
            document.getElementById('alertBox').classList.remove('hidden');
            document.getElementById('alertMsg').innerText = "⛔ " + message;
        }

        // โหลดฟังก์ชันเมื่อสร้างหน้า HTML เสร็จ
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
