<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Permission Manager System</title>
    
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // กำหนด Color Palette ตาม LINE Official Standard
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    colors: {
                        line: {
                            primary: '#0084FF',
                            success: '#17C950',
                            danger: '#FF4458',
                            warning: '#FFC300',
                            gray: '#B6C2C7',
                            dark: '#111111',
                            bg: '#F7F7F7'
                        }
                    },
                    maxWidth: {
                        'line-app': '500px' // Flex Message Max Width
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .hide { display: none !important; }
        
        /* สไตล์หน้าจอ Loading */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9); z-index: 50;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
    </style>
</head>
<body class="bg-line-bg text-line-dark antialiased">

    <!-- Global Config (แก้ไขได้ง่ายที่นี่) -->
    <script>
        const LIFF_ID = "2011487100-dldPQItq";
        const CENTRAL_API_URL = "https://script.google.com/macros/s/AKfycbwT92lC6xrr0MuDUNdjJKjL_jvkMZb7AjbOmA81uWKONXOf9dG2U-_6Y8qqW8bGsvoY/exec"; // เปลี่ยน URL นี้
        const CURRENT_MENU_ID = "902"; // เปลี่ยนตามแต่ละระบบ
        
        let currentUser = null; // เก็บข้อมูลผู้ใช้และสิทธิ์
        
        // ระบบ Timeout 15 นาที
        let idleTime = 0;
        const TIMEOUT_MINUTES = 15;
        setInterval(() => {
            idleTime++;
            if (idleTime >= TIMEOUT_MINUTES) {
                alert("หมดเวลาการเชื่อมต่อ กรุณาโหลดหน้าจอใหม่");
                liff.closeWindow(); // หรือ window.location.href = 'index.html'
            }
        }, 60000); 
        document.addEventListener('mousemove', () => idleTime = 0);
        document.addEventListener('keypress', () => idleTime = 0);
        document.addEventListener('touchstart', () => idleTime = 0);
    </script>

    <div id="loader">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-line-primary"></div>
        <p class="mt-4 text-line-primary font-bold">กำลังตรวจสอบสิทธิ์...</p>
    </div>

    <!-- Main Container อิงความกว้างสูงสุด 500px ของ Flex Message -->
    <div class="max-w-line-app mx-auto bg-white min-h-screen shadow-md relative pb-16">
        
        <!-- HEADER -->
        <header class="bg-gradient-to-br from-line-primary to-blue-600 text-white p-4 sticky top-0 z-10 shadow-sm flex justify-between items-center">
            <div>
                <h1 id="headerMenuName" class="text-xl font-bold">ระบบจัดการเมนู</h1>
                <p id="headerJobPosition" class="text-xs bg-white/20 inline-block px-3 py-1 rounded-full mt-1">กำลังโหลด...</p>
            </div>
            <button onclick="goHome()" class="bg-white/20 hover:bg-white/30 p-2 rounded-full text-sm font-medium transition">
                🏠 หน้าหลัก
            </button>
        </header>

        <!-- CONTENT AREA -->
        <main class="p-4 space-y-4">
            
            <!-- Alert Box (ถ้าไม่มีสิทธิ์) -->
            <div id="alertBox" class="bg-red-50 border-l-4 border-line-danger p-4 rounded hide">
                <div class="flex items-center">
                    <span class="text-xl mr-2">⛔</span>
                    <p class="text-sm text-red-700 font-bold">คุณไม่มีสิทธิ์เข้าถึงเมนูนี้</p>
                </div>
            </div>

            <!-- Dashboard Content -->
            <div id="mainContent" class="hide space-y-4">
                
                <!-- Action Buttons ควบคุมด้วยสิทธิ์ (canCreate, canApprove) -->
                <div class="flex gap-2">
                    <button data-perm="canCreate" onclick="openModal('add')" class="flex-1 bg-line-success hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg shadow transition">
                        ➕ เพิ่มข้อมูล
                    </button>
                    <button data-perm="canApprove" class="flex-1 bg-line-warning hover:bg-yellow-500 text-white font-bold py-3 px-4 rounded-lg shadow transition">
                        ✅ อนุมัติเอกสาร
                    </button>
                </div>

                <!-- Data Card Layout แบบ LINE Template -->
                <div class="bg-white border border-gray-100 rounded-xl shadow-sm p-4 mt-4">
                    <div class="flex justify-between items-start border-b border-gray-100 pb-3 mb-3">
                        <div>
                            <h2 class="font-bold text-lg text-line-primary">Menu: Dashboard</h2>
                            <p class="text-xs text-line-gray">Group: Admin | ID: menu_01</p>
                        </div>
                        <!-- ควบคุมด้วยสิทธิ์ (canDelete) -->
                        <button data-perm="canDelete" class="text-line-danger bg-red-50 p-2 rounded-lg text-xs font-bold">ลบ</button>
                    </div>
                    
                    <div class="flex gap-2 mt-4">
                        <!-- ควบคุมด้วยสิทธิ์ (canEdit) -->
                        <button data-perm="canEdit" onclick="openModal('edit', { createEmpId: '10012', createDate: '2026-09-01T10:00:00Z', updateEmpId: '10055', updateDate: '2026-09-10T08:30:00Z' })" 
                                class="w-full bg-blue-50 text-line-primary border border-blue-100 font-bold py-2 rounded-lg text-sm transition">
                            ✏️ แก้ไขข้อมูล
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal สำหรับ เพิ่ม/แก้ไขข้อมูล -->
    <div id="dataModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hide">
        <div class="bg-white rounded-xl w-full max-w-line-app shadow-xl overflow-hidden">
            <div class="bg-line-primary p-4 text-white">
                <h3 id="modalTitle" class="font-bold text-lg">จัดการข้อมูล</h3>
            </div>
            <div class="p-4 space-y-3">
                <div>
                    <label class="block text-xs font-bold text-line-gray mb-1">Menu ID</label>
                    <input type="text" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:border-line-primary outline-none" placeholder="เช่น menu_01">
                </div>
                <div>
                    <label class="block text-xs font-bold text-line-gray mb-1">ชื่อเมนู</label>
                    <input type="text" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:border-line-primary outline-none" placeholder="กรอกชื่อเมนู">
                </div>

                <!-- ส่วนแสดงประวัติการดำเนินการ (Audit Trail) - จะแสดงเฉพาะตอนกด Edit -->
                <div id="auditTrail" class="bg-gray-50 p-3 rounded-lg border border-gray-200 mt-4 hide">
                    <p class="text-xs text-gray-500 mb-1 font-bold">⏱️ ประวัติการดำเนินการ</p>
                    <div class="grid grid-cols-2 gap-2 text-[10px] text-gray-600">
                        <p><b>สร้างโดย:</b> <span id="txtCreateEmp"></span></p>
                        <p><b>วันที่สร้าง:</b> <span id="txtCreateDate"></span></p>
                        <p><b>แก้ไขโดย:</b> <span id="txtUpdateEmp"></span></p>
                        <p><b>วันที่แก้ไข:</b> <span id="txtUpdateDate"></span></p>
                    </div>
                </div>

                <div class="flex gap-2 mt-6">
                    <button onclick="closeModal()" class="flex-1 bg-gray-100 text-gray-700 font-bold py-3 rounded-lg">ยกเลิก</button>
                    <button class="flex-1 bg-line-primary text-white font-bold py-3 rounded-lg shadow">💾 บันทึก</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // เริ่มต้นการทำงานของแอปพลิเคชัน
        async function initApp() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                const profile = await liff.getProfile();
                await verifyUserAccess(profile.userId);

            } catch (err) {
                console.error("LIFF Init Error:", err);
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อ LINE");
            }
        }

        // ฟังก์ชันตรวจสอบสิทธิ์ผ่าน API กลาง
        async function verifyUserAccess(userId) {
            try {
                const response = await fetch(CENTRAL_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'verifyAccess',
                        userId: userId,
                        menuId: CURRENT_MENU_ID
                    })
                });

                const data = await response.json();
                currentUser = data;

                document.getElementById('loader').classList.add('hide');

                if (data.status === 'not_registered') {
                    alert('ไม่พบข้อมูลผู้ใช้งานในระบบ');
                    liff.closeWindow();
                    return;
                }

                if (!data.allowed) {
                    document.getElementById('alertBox').classList.remove('hide');
                    return;
                }

                // กรณีผ่านเงื่อนไข มีสิทธิ์ใช้งาน
                document.getElementById('mainContent').classList.remove('hide');
                document.getElementById('headerMenuName').innerText = data.menuName;
                document.getElementById('headerJobPosition').innerText = `👤 ${data.jobPosition} | ID: ${data.empId}`;

                // นำสิทธิ์มาควบคุม DOM (ซ่อนปุ่มตามสิทธิ์)
                applyPermissions(data.permissions);

            } catch (err) {
                document.getElementById('loader').classList.add('hide');
                alert("ไม่สามารถเชื่อมต่อฐานข้อมูลได้");
            }
        }

        // จัดการ DOM Element ซ่อน/แสดงตามสิทธิ์ที่ได้รับมา
        function applyPermissions(perms) {
            // perms = { read: true, create: false, edit: true, delete: false, approve: false }
            const elements = document.querySelectorAll('[data-perm]');
            
            elements.forEach(el => {
                const reqPerm = el.getAttribute('data-perm'); // เช่น canCreate
                const permKey = reqPerm.replace('can', '').toLowerCase(); // แปลง canCreate -> create
                
                if (perms[permKey] === false) {
                    el.classList.add('hide');
                }
            });
        }

        // ฟังก์ชันเปิด Modal แก้ไข/เพิ่ม
        function openModal(mode, auditData = null) {
            document.getElementById('dataModal').classList.remove('hide');
            
            if (mode === 'edit' && auditData) {
                document.getElementById('modalTitle').innerText = '✏️ แก้ไขข้อมูล';
                document.getElementById('auditTrail').classList.remove('hide');
                
                // จัดรูปแบบวันที่ให้อ่านง่าย
                const formatDT = (dt) => dt ? new Date(dt).toLocaleString('th-TH') : '-';
                
                document.getElementById('txtCreateEmp').innerText = auditData.createEmpId || '-';
                document.getElementById('txtCreateDate').innerText = formatDT(auditData.createDate);
                document.getElementById('txtUpdateEmp').innerText = auditData.updateEmpId || '-';
                document.getElementById('txtUpdateDate').innerText = formatDT(auditData.updateDate);
            } else {
                document.getElementById('modalTitle').innerText = '➕ เพิ่มข้อมูล';
                document.getElementById('auditTrail').classList.add('hide');
            }
        }

        function closeModal() {
            document.getElementById('dataModal').classList.add('hide');
        }

        function goHome() {
            window.location.href = 'index.html'; // กลับไปหน้าหลัก
        }

        // รันฟังก์ชันเมื่อเอกสารโหลดเสร็จ
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
