<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Enterprise Permission System</title>
    
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        // กำหนด LINE Official Palette และ Layout 
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        line: {
                            primary: '#0084FF',
                            success: '#17C950',
                            danger: '#FF4458',
                            warning: '#FFC300',
                            bg: '#F7F7F7',
                            gray: '#B6C2C7'
                        }
                    },
                    maxWidth: {
                        'line-app': '500px' // อิงความกว้างสูงสุดของ Flex Message
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        
        /* Utility สำหรับซ่อน Component ผ่าน DOM DOM manipulation */
        .hide-perm { display: none !important; }
        
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95); z-index: 50;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        
        /* Touch-Friendly Buttons (Min 44x44px) */
        .btn-touch { min-height: 44px; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body class="bg-line-bg text-gray-800 antialiased">

    <!-- Configuration พื้นฐาน -->
    <script>
        const LIFF_ID = "2011487100-dldPQItq";
        const CENTRAL_API_URL = "https://script.google.com/macros/s/AKfycbwT92lC6xrr0MuDUNdjJKjL_jvkMZb7AjbOmA81uWKONXOf9dG2U-_6Y8qqW8bGsvoY/exec"; // ระบุ URL ของ Central API
        const CURRENT_MENU_ID = "902"; // เปลี่ยนตาม ID ของเมนูในระบบนี้
    </script>

    <!-- Loading Screen -->
    <div id="loader">
        <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-line-primary mb-4"></div>
        <p id="loaderText" class="text-line-primary font-bold text-sm">กำลังเชื่อมต่อ LINE...</p>
    </div>

    <!-- Main Container -->
    <div class="max-w-line-app mx-auto bg-white min-h-screen shadow-md relative pb-10">
        
        <!-- Header LINE Style -->
        <header class="bg-gradient-to-br from-line-primary to-blue-600 text-white p-5 shadow-sm">
            <h1 id="headerMenuName" class="text-xl font-bold mb-1">ระบบกำลังโหลด...</h1>
            <div class="flex items-center text-xs opacity-90 mt-2">
                <span id="headerRole" class="bg-white/20 px-3 py-1 rounded-full inline-block">👤 กำลังตรวจสอบสิทธิ์</span>
            </div>
        </header>

        <main class="p-4 space-y-4">
            
            <!-- Alert Box (กรณีแสดงข้อผิดพลาด หรือ ไม่มีสิทธิ์) -->
            <div id="alertBox" class="bg-red-50 border-l-4 border-line-danger p-4 rounded-lg hidden">
                <p id="alertMessage" class="text-sm text-red-700 font-bold">⛔ เกิดข้อผิดพลาด</p>
                <button onclick="liff.closeWindow()" class="mt-3 text-xs bg-red-100 text-red-800 px-4 py-2 rounded font-bold">ปิดหน้าจอ</button>
            </div>

            <!-- Workspace Area -->
            <div id="workspace" class="hidden space-y-4">
                
                <!-- กลุ่มปุ่มจัดการข้อมูล (เชื่อมโยงกับสิทธิ์ผ่าน data-permission) -->
                <div class="grid grid-cols-2 gap-3">
                    <button data-permission="create" class="btn-touch bg-line-success hover:bg-green-600 text-white font-bold rounded-lg shadow-sm text-sm transition">
                        ➕ สร้างเอกสาร
                    </button>
                    <button data-permission="approve" class="btn-touch bg-line-warning hover:bg-yellow-500 text-white font-bold rounded-lg shadow-sm text-sm transition">
                        ✅ อนุมัติข้อมูล
                    </button>
                </div>

                <!-- Data Card -->
                <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm">
                    <div class="flex justify-between items-start mb-4 pb-3 border-b border-gray-100">
                        <div>
                            <h3 class="font-bold text-gray-800">เอกสารรหัส #DOC-2026</h3>
                            <p class="text-xs text-line-gray mt-1">ข้อมูลตัวอย่างสำหรับการทดสอบระบบสิทธิ์</p>
                        </div>
                        <!-- ปุ่มลบถูกซ่อนหรือแสดงตามสิทธิ์ -->
                        <button data-permission="delete" class="text-line-danger bg-red-50 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-red-100 transition">
                            🗑️ ลบ
                        </button>
                    </div>
                    
                    <!-- ปุ่มแก้ไขถูกซ่อนหรือแสดงตามสิทธิ์ -->
                    <button data-permission="edit" class="btn-touch w-full bg-blue-50 text-line-primary border border-blue-200 font-bold rounded-lg text-sm hover:bg-blue-100 transition">
                        ✏️ แก้ไขข้อมูลเอกสาร
                    </button>
                </div>

            </div>
        </main>
    </div>

    <!-- Application Logic -->
    <script>
        const ui = {
            hideLoader: () => document.getElementById('loader').style.display = 'none',
            showLoaderText: (text) => document.getElementById('loaderText').innerText = text,
            showError: (msg) => {
                ui.hideLoader();
                document.getElementById('alertBox').classList.remove('hidden');
                document.getElementById('alertMessage').innerText = "⛔ " + msg;
            }
        };

        // 1. ฟังก์ชันเริ่มต้น
        async function initApp() {
            try {
                await liff.init({ liffId: LIFF_ID });
                
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                ui.showLoaderText("กำลังตรวจสอบสิทธิ์การใช้งาน...");
                const profile = await liff.getProfile();
                await checkPermission(profile.userId);

            } catch (err) {
                console.error("LIFF Init Error:", err);
                ui.showError("ไม่สามารถเชื่อมต่อ LINE SDK ได้");
            }
        }

        // 2. ฟังก์ชันตรวจสอบสิทธิ์ (แก้ไข Failed to Fetch แล้ว)
        async function checkPermission(userId) {
            try {
                const response = await fetch(CENTRAL_API_URL, {
                    method: 'POST',
                    // เปลี่ยน Content-Type เป็น text/plain เพื่อเลี่ยง Preflight ของ GAS
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    redirect: "follow", // ป้องกัน 302 Redirect หายไปกลางทาง
                    body: JSON.stringify({
                        action: 'verifyAccess',
                        userId: userId,
                        menuId: CURRENT_MENU_ID
                    })
                });

                if (!response.ok) throw new Error("HTTP Status " + response.status);

                const data = await response.json();
                ui.hideLoader();

                if (data.status === 'not_registered') {
                    ui.showError("ไม่พบข้อมูลผู้ใช้งานของคุณในระบบ");
                    return;
                }

                if (data.status === 'error') {
                    ui.showError("ข้อผิดพลาดฝั่งเซิร์ฟเวอร์: " + data.message);
                    return;
                }

                if (data.allowed === false || data.permissions.read === false) {
                    ui.showError(`คุณไม่มีสิทธิ์เข้าถึง: ${data.menuName}`);
                    return;
                }

                // 3. อนุญาตให้เข้าถึงพื้นที่การทำงาน
                document.getElementById('workspace').classList.remove('hidden');
                document.getElementById('headerMenuName').innerText = data.menuName;
                document.getElementById('headerRole').innerText = `👤 ${data.jobPosition} (รหัส: ${data.empId})`;
                
                // นำสิทธิ์ไปซ่อนปุ่มต่างๆ ใน DOM
                applyPermissionsToDOM(data.permissions);

            } catch (err) {
                console.error("Fetch Error:", err);
                ui.showError("เซิร์ฟเวอร์ส่วนกลางไม่ตอบสนอง (" + err.message + ")");
            }
        }

        // 4. ฟังก์ชันซ่อน/แสดงปุ่มจากสิทธิ์
        function applyPermissionsToDOM(permissions) {
            // permissions = { read: true, create: false, edit: true, delete: false, approve: false }
            const actionElements = document.querySelectorAll('[data-permission]');
            
            actionElements.forEach(el => {
                const reqPerm = el.getAttribute('data-permission'); // ดึงค่า create, edit, delete, approve
                
                if (permissions[reqPerm] === false) {
                    el.classList.add('hide-perm');
                }
            });
        }

        // โหลดแอปเมื่อหน้าเว็บพร้อม
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
