<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management Portal</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Kanit', 'Arial', 'sans-serif'] },
          colors: {
            linePrimary: '#16a34a',
            lineSuccess: '#22c55e',
            lineDanger: '#dc2626',
            lineWarning: '#f59e0b',
            lineLightBg: '#f4f8f5',
            lineDarkGray: '#374151',
          }
        }
      }
    }
  </script>
  <style>
    .perm-hide { display: none !important; }
    .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  </style>
</head>
<body class="bg-lineLightBg font-sans text-gray-800 antialiased min-h-screen flex flex-col">

  <!-- Topbar -->
  <div class="topbar sticky top-0 z-50 bg-white border-b border-gray-200 min-h-[76px] px-6 py-2.5 flex justify-between items-center max-sm:min-h-[72px] max-sm:px-3 max-sm:gap-2 max-[390px]:justify-end">
    <!-- BRAND -->
    <div class="brand-area flex items-center gap-3 max-sm:gap-2 max-[390px]:hidden">
      <div class="brand-logo w-11 h-11 flex-none rounded-[13px] bg-gradient-to-br from-green-800 to-green-600 text-white flex items-center justify-center max-sm:w-[38px] max-sm:h-[38px] max-sm:basis-[38px] max-sm:rounded-[11px]">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
      </div>
      <div class="brand-text flex flex-col justify-center leading-tight">
        <div class="brand flex items-center text-[18px] font-extrabold text-gray-900 tracking-[-0.3px] max-sm:text-[16px]">
          User Management
        </div>
      </div>
    </div>

    <!-- USER + LINE + SESSION -->
    <div class="user-info flex items-center gap-3 max-sm:gap-[7px]">
      <img id="profile-img" class="line-avatar hidden w-12 h-12 rounded-full object-cover border-2 border-white shadow-[0_2px_8px_rgba(0,0,0,0.08)] max-sm:w-[42px] max-sm:h-[42px]" src="" alt="Profile">

      <div class="user-detail flex flex-col items-end justify-center leading-tight max-sm:min-w-0">
        <div id="user-name-display" class="user-name text-[14px] font-bold text-gray-900 max-sm:text-[13px] max-[390px]:max-w-[85px] max-[390px]:truncate">กำลังตรวจสอบ...</div>
        <div class="flex items-center gap-[6px] mt-1">
          <div id="user-role-display" class="user-role text-[10px] font-semibold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-[10px]">-</div>
          <span class="session-dot w-[6px] h-[6px] rounded-full bg-green-500 shadow-[0_0_0_2px_rgba(34,197,94,0.13)]"></span>
        </div>
        <div id="sessionStatus" class="session-time text-[10px] text-gray-400 mt-0.5 max-sm:hidden">
           <span id="timer-display">60:00</span>
        </div>
      </div>

      <!-- BACK TO PORTAL -->
      <button onclick="goToHome()" class="bg-transparent border-none p-1 cursor-pointer hover:bg-gray-100 rounded-full transition-colors ml-1" title="กลับหน้า Portal">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-500"><path d="M15 19l-7-7 7-7"></path></svg>
      </button>

      <!-- LOGOUT -->
      <button onclick="logoutApp()" class="bg-transparent border-none p-1 cursor-pointer hover:bg-gray-100 rounded-full transition-colors ml-1" title="ออกจากระบบ">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-500"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      </button>
    </div>
  </div>

  <main class="max-w-7xl mx-auto p-3 sm:p-4 flex-grow w-full">
    <div id="loading-screen" class="flex flex-col items-center justify-center py-20">
      <div class="animate-spin rounded-full h-10 w-10 border-b-4 border-linePrimary mb-4"></div>
      <p class="text-lineDarkGray text-sm font-medium">กำลังตรวจสอบสิทธิ์และโหลดข้อมูลผู้ใช้งาน...</p>
    </div>

    <div id="user-management-screen" class="hidden">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4 bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-gray-200">
        <div class="flex-1">
          <h2 class="text-base sm:text-lg font-bold text-gray-800">📋 รายชื่อผู้ใช้งาน</h2>
          <p class="text-xs text-gray-500">จัดการ เพิ่ม ลบ แก้ไข ข้อมูลผู้ใช้งาน</p>
        </div>
        <button onclick="openForm('add')" id="btn-add-emp" class="perm-hide bg-linePrimary text-white font-bold py-2 px-3 sm:py-2.5 sm:px-4 rounded-lg shadow-sm hover:bg-blue-600 transition text-xs sm:text-sm flex items-center gap-1 whitespace-nowrap">
          <span>➕</span> <span class="hidden sm:inline">เพิ่มผู้ใช้งาน</span><span class="sm:hidden">เพิ่ม</span>
        </button>
      </div>

      <div class="hidden lg:block bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden table-container">
        <table class="w-full text-left text-sm text-gray-600">
            <thead class="bg-gray-50 text-gray-700 border-b sticky top-0">
                <tr>
                    <th class="p-3.5 font-bold">Emp ID</th>
                    <th class="p-3.5 font-bold">ชื่อ-นามสกุล</th>
                    <th class="p-3.5 font-bold">ตำแหน่ง</th>
                    <th class="p-3.5 font-bold">สถานะ</th>
                    <th class="p-3.5 font-bold">แก้ไขล่าสุดโดย</th>
                    <th class="p-3.5 font-bold text-center">จัดการ</th>
                </tr>
            </thead>
            <tbody id="adminUserListDesktop" class="divide-y divide-gray-100"></tbody>
        </table>
      </div>
      <div id="adminUserListMobile" class="lg:hidden grid gap-3 grid-cols-1 sm:grid-cols-2"></div>
    </div>
  </main>

  <div id="formModal" class="hidden fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-4 overflow-y-auto">
      <div class="bg-white w-full max-w-3xl rounded-2xl overflow-hidden shadow-2xl max-h-[90vh] flex flex-col my-auto">
          <div class="bg-linePrimary p-4 text-white font-bold text-base flex justify-between items-center sticky top-0">
              <span id="modalTitle">ฟอร์มผู้ใช้งาน</span>
              <button onclick="document.getElementById('formModal').classList.add('hidden')" class="text-white text-lg font-bold">✕</button>
          </div>
          <div class="p-4 sm:p-6 space-y-4 text-sm overflow-y-auto flex-1 grid grid-cols-1 md:grid-cols-2 gap-4">
              <input type="hidden" id="formMode">
              <div class="md:col-span-2 text-xs bg-gray-50 p-3 rounded-lg border border-gray-200 text-gray-700 space-y-1">
                <div class="font-bold text-linePrimary">📌 ข้อมูลผู้บันทึก/แก้ไข (Audit Trail):</div>
                <div id="auditInfo" class="font-mono text-xs text-gray-600">--</div>
              </div>
              
              <div>
                <label class="block font-bold text-gray-700 mb-1">Emp ID (Primary Key) *</label>
                <input type="text" id="v_Emp_ID" autocomplete="off" class="w-full border rounded-lg p-2.5 outline-none focus:border-linePrimary text-base">
              </div>
              <div>
                <label class="block font-bold text-gray-700 mb-1">LINE User ID</label>
                <input type="text" id="v_userId" autocomplete="off" class="w-full border rounded-lg p-2.5 outline-none focus:border-linePrimary text-base" placeholder="Uxxxxxxxxxxxxxxxx">
              </div>
              <div>
                <label class="block font-bold text-gray-700 mb-1">สถานะพนักงาน *</label>
                <select id="v_Emp_ID_Status" class="w-full border rounded-lg p-2.5 outline-none focus:border-linePrimary text-base bg-white">
                  <option value="Active">Active</option>
                  <option value="Inactive">Inactive</option>
                </select>
              </div>
              <div>
                <label class="block font-bold text-gray-700 mb-1">ตำแหน่ง *</label>
                <input type="text" id="v_Job_Position" autocomplete="off" class="w-full border rounded-lg p-2.5 outline-none focus:border-linePrimary text-base">
              </div>
              
              <div class="md:col-span-2">
                <label class="block font-bold text-gray-700 mb-1">ชื่อ-นามสกุล</label>
                <input type="text" id="v_Emp_Name" autocomplete="off" class="w-full border rounded-lg p-2.5 outline-none focus:border-linePrimary text-base">
              </div>
              <div>
                <label class="block font-bold text-gray-700 mb-1">ชื่อเล่น</label>
                <input type="text" id="v_Emp_Name_Nickname" autocomplete="off" class="w-full border rounded-lg p-2.5 outline-none focus:border-linePrimary text-base">
              </div>
              <div>
                <label class="block font-bold text-gray-700 mb-1">เลขบัตรประชาชน</label>
                <input type="text" id="v_Emp_IDCard_No" autocomplete="off" class="w-full border rounded-lg p-2.5 outline-none focus:border-linePrimary text-base">
              </div>
              <div>
                <label class="block font-bold text-gray-700 mb-1">วันเกิด</label>
                <input type="date" id="v_Emp_BirthDate" class="w-full border rounded-lg p-2.5 outline-none focus:border-linePrimary text-base">
              </div>
              <div>
                <label class="block font-bold text-gray-700 mb-1">เบอร์โทรศัพท์</label>
                <input type="text" id="v_Emp_Phone_No" autocomplete="off" class="w-full border rounded-lg p-2.5 outline-none focus:border-linePrimary text-base">
              </div>
              <div>
                <label class="block font-bold text-gray-700 mb-1">ธนาคาร</label>
                <input type="text" id="v_Emp_BankAccount" autocomplete="off" class="w-full border rounded-lg p-2.5 outline-none focus:border-linePrimary text-base">
              </div>
              <div>
                <label class="block font-bold text-gray-700 mb-1">เลขบัญชี</label>
                <input type="text" id="v_Emp_BankAccountNo" autocomplete="off" class="w-full border rounded-lg p-2.5 outline-none focus:border-linePrimary text-base">
              </div>
          </div>
          <div class="bg-gray-50 p-4 border-t border-gray-200 flex justify-end gap-3 sticky bottom-0">
              <button onclick="document.getElementById('formModal').classList.add('hidden')" class="px-3 sm:px-4 py-2 bg-gray-200 text-gray-700 font-bold rounded-xl transition hover:bg-gray-300 text-sm">ยกเลิก</button>
              <button onclick="saveUser()" class="px-4 sm:px-5 py-2 bg-lineSuccess text-white font-bold rounded-xl shadow-md transition hover:bg-green-600 text-sm">บันทึก</button>
          </div>
      </div>
  </div>

  <script>
    const AUTH_API_URL = "https://script.google.com/macros/s/AKfycbwphhIdSMHpTWHuFrRFTC3lEZe-QQCaZr2cebxb22cE9ph1eYPscyrxdw29T44DaUT9/exec";
    const RESOURCE_API_URL = "https://script.google.com/macros/s/AKfycbyhkjQPwFOVw1v9tYcDBS4UV1JdtVagw62aBMl0Hqa6wymbqpgx9lUPZRRxyFnEXX8NzA/exec";
    const SESSION_KEY = 'portalSessionId';
    
    let portalSessionId = sessionStorage.getItem(SESSION_KEY);
    let currentUser = null;
    let currentPermissions = { read: false, create: false, edit: false, delete: false, approve: false };
    
    let allUsersData = [];
    let currentActionEmpId = ""; 
    
    let timeoutLimit = 3600; 
    let timeRemaining = timeoutLimit;
    let timerInterval;

    window.onload = startApplication;

    async function startApplication() {
      showLoading(true);
      const params = new URLSearchParams(window.location.search);
      const launchToken = params.get('launchToken');
      
      if (launchToken) {
        await exchangeLaunchToken(launchToken);
        return;
      }
      
      if (portalSessionId) {
        await verifySession();
        return;
      }
      
      showError('ไม่พบสิทธิ์การใช้งาน กรุณาเข้าสู่ระบบผ่าน Portal');
    }

    async function exchangeLaunchToken(launchToken) {
      try {
        const res = await fetch(AUTH_API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'validateLaunch', launchToken: launchToken, menuId: '901' })
        });
        const result = await res.json();
        
        if (result.status === 'success') {
          handleAuthSuccess(result);
          window.history.replaceState({}, document.title, window.location.pathname);
        } else {
          showError(result.message || 'Token ไม่ถูกต้องหรือหมดอายุ');
        }
      } catch (err) {
        showError('เชื่อมต่อ API ล้มเหลว');
      }
    }

    async function verifySession() {
      try {
        const res = await fetch(AUTH_API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'verifySession', sessionId: portalSessionId })
        });
        const result = await res.json();
        
        if (result.status === 'success') {
          handleAuthSuccess(result);
        } else {
          sessionStorage.removeItem(SESSION_KEY);
          showError('Session หมดอายุ กรุณาเข้าสู่ระบบใหม่');
        }
      } catch (err) {
        showError('เชื่อมต่อ API ล้มเหลว');
      }
    }

    function handleAuthSuccess(result) {
      portalSessionId = result.sessionId || portalSessionId;
      sessionStorage.setItem(SESSION_KEY, portalSessionId);
      
      currentUser = result.user || result.session || currentUser;
      
      let perm = result.permission;
      if (perm) {
        sessionStorage.setItem('PORTAL_PERMISSIONS', JSON.stringify(perm));
      } else {
        const stored = sessionStorage.getItem('PORTAL_PERMISSIONS');
        if (stored) perm = JSON.parse(stored);
        else perm = {};
      }

      currentPermissions = {
        read: perm.canRead || perm.read || false,
        create: perm.canWrite || perm.create || perm.canRead || false,
        edit: perm.canWrite || perm.edit || perm.canRead || false,
        delete: perm.canDelete || perm.delete || perm.canRead || false
      };
      
      currentActionEmpId = currentUser?.empId || currentUser?.userId || '';

      if (!currentPermissions.read) {
        showError('Access Denied: คุณไม่มีสิทธิ์เข้าถึงหน้านี้');
        return;
      }

      showLoading(false);
      
      document.getElementById('user-name-display').textContent = currentUser.displayName || currentUser.name || '-';
      document.getElementById('user-role-display').textContent = currentUser.role || '-';
      if (currentUser.pictureUrl) {
        const img = document.getElementById('profile-img');
        img.src = currentUser.pictureUrl;
        img.classList.remove('hidden');
      }

      applyPermissions();
      startActivityTracker();
      loadUsers();
    }

    function showLoading(isLoading) {
      const screen = document.getElementById('loading-screen');
      const main = document.getElementById('user-management-screen');
      if (isLoading) {
        screen.classList.remove('hidden');
        main.classList.add('hidden');
      } else {
        screen.classList.add('hidden');
        main.classList.remove('hidden');
      }
    }

    function showError(msg) {
      alert(msg);
      window.location.href = "index.html";
    }

    function startActivityTracker() {
      const resetTimer = () => { timeRemaining = timeoutLimit; };
      ['mousemove', 'keydown', 'touchstart', 'scroll', 'click'].forEach(evt => window.addEventListener(evt, resetTimer, { passive: true }));

      timerInterval = setInterval(() => {
        timeRemaining--;
        let m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
        let s = (timeRemaining % 60).toString().padStart(2, '0');
        
        let timeStr = m + ":" + s;
        const timerDesktop = document.getElementById('timer-display');
        const timerMobile = document.getElementById('timer-display-mobile');
        
        if (timerDesktop) timerDesktop.textContent = timeStr;
        if (timerMobile) timerMobile.textContent = timeStr;
        
        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          alert("หมดเวลาการเชื่อมต่อ");
          logoutApp();
        }
      }, 1000);
    }

    function applyPermissions() {
      const btnAdd = document.getElementById('btn-add-emp');
      if (currentPermissions.create) {
        if (btnAdd) btnAdd.classList.remove('perm-hide');
      } else {
        if (btnAdd) btnAdd.classList.add('perm-hide');
      }
    }

    async function loadUsers() {
      const desktopList = document.getElementById('adminUserListDesktop');
      if (desktopList) desktopList.innerHTML = '<tr><td colspan="6" class="text-center p-6 text-gray-400">กำลังโหลด...</td></tr>';
      
      try {
        const res = await fetch(RESOURCE_API_URL, {
            method: 'POST', 
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'getUsers', sessionId: portalSessionId })
        });
        const result = await res.json();
        if (result.status === 'success') {
          allUsersData = result.data;
          renderDesktopTable();
          renderMobileCards();
        } else {
          alert('ไม่สามารถโหลดข้อมูลได้');
        }
      } catch(err) {
        alert('เกิดข้อผิดพลาดในการโหลดข้อมูล');
      }
    }

    function renderDesktopTable() {
      let html = '';
      allUsersData.forEach(u => {
          let lastUpdate = u.updateDate ? new Date(u.updateDate).toLocaleString('th-TH') : '-';
          let statusBadge = u.Emp_ID_Status === 'Active' 
            ? '<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded text-xs font-bold">Active</span>' 
            : '<span class="bg-red-100 text-red-700 px-2 py-0.5 rounded text-xs font-bold">Inactive</span>';

          let editClass = currentPermissions.edit ? '' : 'perm-hide';
          let deleteClass = currentPermissions.delete ? '' : 'perm-hide';

          html += `
          <tr class="hover:bg-gray-50 transition">
              <td class="p-3.5 font-bold text-linePrimary">${u.Emp_ID || '-'}</td>
              <td class="p-3.5">${u.Emp_Name || '-'}</td>
              <td class="p-3.5"><span class="bg-blue-50 text-blue-700 px-2 py-1 rounded text-xs font-bold">${u.Job_Position || '-'}</span></td>
              <td class="p-3.5">${statusBadge}</td>
              <td class="p-3.5 text-xs text-gray-500"><div>${lastUpdate}</div><div>By: ${u.updateEmpId || '-'}</div></td>
              <td class="p-3.5 text-center">
                <div class="inline-flex space-x-2">
                  <button onclick="openForm('edit', '${u.Emp_ID}')" class="${editClass} bg-lineWarning text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:opacity-80 shadow-sm transition">แก้ไข</button>
                  <button onclick="deleteUser('${u.Emp_ID}')" class="${deleteClass} bg-lineDanger text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:opacity-80 shadow-sm transition">ลบ</button>
                </div>
              </td>
          </tr>`;
      });
      const desktopList = document.getElementById('adminUserListDesktop');
      if (desktopList) desktopList.innerHTML = html || '<tr><td colspan="6" class="text-center p-6 text-gray-400">ไม่มีข้อมูลผู้ใช้งาน</td></tr>';
    }

    function renderMobileCards() {
      let html = '';
      allUsersData.forEach(u => {
          let updateDate = u.updateDate ? new Date(u.updateDate).toLocaleString('th-TH') : '-';
          let statusBadge = u.Emp_ID_Status === 'Active' 
            ? '<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded text-xs font-bold">Active</span>' 
            : '<span class="bg-red-100 text-red-700 px-2 py-0.5 rounded text-xs font-bold">Inactive</span>';

          let editClass = currentPermissions.edit ? '' : 'perm-hide';
          let deleteClass = currentPermissions.delete ? '' : 'perm-hide';

          html += `
          <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-3 hover:shadow-md transition">
              <div class="flex justify-between items-start mb-2">
                  <div>
                      <p class="text-xs text-gray-500">Emp ID</p>
                      <p class="font-bold text-linePrimary text-base">${u.Emp_ID || '-'}</p>
                  </div>
                  <div class="text-right">
                      <p class="text-xs text-gray-500">สถานะ</p>
                      ${statusBadge}
                  </div>
              </div>
              <div class="mb-2">
                  <p class="text-xs text-gray-500">ชื่อ-นามสกุล</p>
                  <p class="font-bold text-gray-800">${u.Emp_Name || '-'}</p>
              </div>
              <div class="mb-2">
                  <p class="text-xs text-gray-500">ตำแหน่ง</p>
                  <p class="text-sm bg-blue-50 text-blue-700 px-2 py-0.5 rounded inline-block font-bold">${u.Job_Position || '-'}</p>
              </div>
              <div class="mb-3 pb-3 border-b border-gray-200">
                  <p class="text-xs text-gray-500">แก้ไขล่าสุดโดย</p>
                  <p class="text-xs text-gray-600">${updateDate}</p>
                  <p class="text-xs text-gray-600">By: ${u.updateEmpId || '-'}</p>
              </div>
              <div class="flex gap-2 w-full">
                  <button onclick="openForm('edit', '${u.Emp_ID}')" class="${editClass} flex-1 bg-lineWarning text-white px-2 py-2 rounded-lg text-xs font-bold hover:opacity-80 shadow-sm transition">
                    ✏️ แก้ไข
                  </button>
                  <button onclick="deleteUser('${u.Emp_ID}')" class="${deleteClass} flex-1 bg-lineDanger text-white px-2 py-2 rounded-lg text-xs font-bold hover:opacity-80 shadow-sm transition">
                    🗑️ ลบ
                  </button>
              </div>
          </div>`;
      });
      
      const mobileList = document.getElementById('adminUserListMobile');
      if (mobileList) mobileList.innerHTML = html || '<div class="col-span-full text-center py-8 text-gray-400">ไม่มีข้อมูลผู้ใช้งาน</div>';
    }

    function openForm(mode, empId = null) {
      document.getElementById('formModal').classList.remove('hidden');
      document.getElementById('formMode').value = mode;
      document.getElementById('modalTitle').textContent = mode === 'add' ? '➕ เพิ่มผู้ใช้งานใหม่' : '✏️ แก้ไขข้อมูลผู้ใช้งาน';
      
      const fields = ['userId', 'Emp_ID', 'Emp_ID_Status', 'Job_Position', 'Emp_Name', 'Emp_Name_Nickname', 'Emp_IDCard_No', 'Emp_BirthDate', 'Emp_Phone_No', 'Emp_BankAccount', 'Emp_BankAccountNo'];
      
      if (mode === 'add') {
          fields.forEach(f => {
            const el = document.getElementById('v_' + f);
            if (el) el.value = '';
          });
          document.getElementById('v_Emp_ID').readOnly = false;
          document.getElementById('auditInfo').innerHTML = `สร้างรายการใหม่โดย Admin: <b>${currentActionEmpId}</b>`;
      } else {
          const user = allUsersData.find(u => String(u.Emp_ID) === String(empId));
          fields.forEach(f => {
              let mapKey = f === 'Emp_Name_Nickname' ? 'Emp_Name_&_Nickname' : f;
              let val = user[mapKey] || '';
              if (f === 'Emp_BirthDate' && val) {
                  try { val = new Date(val).toISOString().split('T')[0]; } catch(e) { val = ''; }
              }
              const el = document.getElementById('v_' + f);
              if (el) el.value = val;
          });
          document.getElementById('v_Emp_ID').readOnly = true;
          
          let createDate = user.createDate ? new Date(user.createDate).toLocaleString('th-TH') : '-';
          let updateDate = user.updateDate ? new Date(user.updateDate).toLocaleString('th-TH') : '-';
          document.getElementById('auditInfo').innerHTML = `
            <div>• <b>สร้างโดย:</b> ${user.createEmpId || '-'} (${createDate})</div>
            <div>• <b>แก้ไขล่าสุดโดย:</b> ${user.updateEmpId || '-'} (${updateDate})</div>
          `;
      }
    }

    async function saveUser() {
      const empIdVal = document.getElementById('v_Emp_ID').value.trim();
      const posVal = document.getElementById('v_Job_Position').value.trim();
      if (!empIdVal || !posVal) {
        alert("กรุณากรอกข้อมูล Emp ID และ Job Position ให้ครบถ้วน");
        return;
      }

      const payload = {
          action: 'manageUser',
          sessionId: portalSessionId,
          mode: document.getElementById('formMode').value,
          actionByEmpId: currentActionEmpId,
          user: {
              userId: document.getElementById('v_userId').value,
              Emp_ID: empIdVal,
              Emp_ID_Status: document.getElementById('v_Emp_ID_Status').value,
              Job_Position: posVal,
              Emp_Name: document.getElementById('v_Emp_Name').value,
              "Emp_Name_&_Nickname": document.getElementById('v_Emp_Name_Nickname').value,
              Emp_IDCard_No: document.getElementById('v_Emp_IDCard_No').value,
              Emp_BirthDate: document.getElementById('v_Emp_BirthDate').value,
              Emp_Phone_No: document.getElementById('v_Emp_Phone_No').value,
              Emp_BankAccount: document.getElementById('v_Emp_BankAccount').value,
              Emp_BankAccountNo: document.getElementById('v_Emp_BankAccountNo').value
          }
      };
      
      document.getElementById('modalTitle').textContent = 'กำลังบันทึกข้อมูล...';
      try {
        const res = await fetch(RESOURCE_API_URL, { 
            method: 'POST', 
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload) 
        });
        const result = await res.json();
        
        if (result.status === 'success') {
          document.getElementById('formModal').classList.add('hidden');
          loadUsers();
        } else {
          alert(result.message || "เกิดข้อผิดพลาดในการบันทึก");
          document.getElementById('modalTitle').textContent = document.getElementById('formMode').value === 'add' ? '➕ เพิ่มผู้ใช้งานใหม่' : '✏️ แก้ไขข้อมูลผู้ใช้งาน';
        }
      } catch(e) {
        alert('เชื่อมต่อ API ล้มเหลว');
      }
    }

    async function deleteUser(empId) {
      if(!confirm("คุณต้องการลบผู้ใช้งานรหัส " + empId + " นี้ออกจากระบบอย่างถาวรหรือไม่?")) return;
      try {
        const res = await fetch(RESOURCE_API_URL, {
            method: 'POST', 
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'manageUser', sessionId: portalSessionId, mode: 'delete', user: { Emp_ID: empId } })
        });
        const result = await res.json();
        if(result.status === 'success') {
          loadUsers();
        } else {
          alert(result.message);
        }
      } catch(e) {
        alert('เชื่อมต่อ API ล้มเหลว');
      }
    }

    function goToHome() {
      window.location.href = "index.html";
    }

    async function logoutApp() {
      if(portalSessionId) {
        try {
          await fetch(AUTH_API_URL, { method: 'POST', body: JSON.stringify({ action: 'logout', sessionId: portalSessionId }) });
        } catch(e) {}
      }
      sessionStorage.removeItem(SESSION_KEY);
      window.location.href = "index.html";
    }
  </script>
</body>
