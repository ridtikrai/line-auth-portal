<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการสิทธิ์ (Admin Dashboard)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

  <!-- ==================== UI โหลด & แจ้งเตือน ==================== -->
  <div id="loadingUI" class="fixed inset-0 bg-white flex flex-col items-center justify-center z-50">
    <div class="animate-spin rounded-full h-12 w-12 border-4 border-slate-200 border-t-blue-600 mb-4"></div>
    <p class="text-slate-500 font-medium" id="loadingText">กำลังตรวจสอบสิทธิ์...</p>
  </div>

  <div id="unauthorizedUI" class="hidden fixed inset-0 bg-slate-50 flex items-center justify-center z-40 px-4">
    <div class="bg-white p-8 rounded-xl shadow-lg border-t-4 border-red-500 text-center max-w-sm w-full">
      <h2 class="text-xl font-bold text-red-600 mb-2">ไม่มีสิทธิ์เข้าถึง</h2>
      <p class="text-slate-500 mb-4" id="errorMsgText">เฉพาะผู้ดูแลระบบ (ADMIN) เท่านั้นที่ใช้งานหน้านี้ได้</p>
      <button onclick="window.location.href='index.html'" class="bg-slate-200 hover:bg-slate-300 text-slate-700 py-2 px-6 rounded-lg font-bold transition">กลับหน้า Portal</button>
    </div>
  </div>

  <!-- ==================== UI หลักของ Admin Dashboard ==================== -->
  <div id="appUI" class="hidden min-h-screen flex flex-col">
    <!-- Navbar (มีปุ่มกลับหน้าหลัก) -->
    <nav class="bg-slate-900 text-white shadow-md">
      <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
        <h1 class="text-xl font-bold flex items-center gap-2">
          <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          Admin Dashboard
        </h1>
        <div class="flex flex-wrap items-center justify-center gap-2">
          <div class="flex gap-2 bg-slate-800 p-1 rounded-lg">
            <button onclick="switchTab('users')" id="tab-users" class="px-4 py-2 rounded-md bg-blue-600 text-white font-medium text-sm transition">ผู้ใช้งาน</button>
            <button onclick="switchTab('permissions')" id="tab-permissions" class="px-4 py-2 rounded-md text-slate-300 hover:text-white hover:bg-slate-700 font-medium text-sm transition">จัดการสิทธิ์</button>
          </div>
          <div class="hidden md:block w-px h-8 bg-slate-700 mx-2"></div>
          <button onclick="window.location.href='index.html'" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 hover:text-white font-medium text-sm transition flex items-center gap-2 border border-slate-600">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg> กลับหน้าหลัก
          </button>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">
      
      <!-- Section Users -->
      <section id="section-users">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="p-4 border-b bg-slate-50 flex justify-between items-center">
            <h2 class="font-bold text-slate-700">รายชื่อผู้ใช้งานระบบ</h2>
            <button onclick="loadAdminData()" class="text-blue-600 hover:text-blue-800 text-sm flex items-center gap-1 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> รีเฟรชข้อมูล
            </button>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm whitespace-nowrap">
              <thead class="bg-slate-100 text-slate-600"><tr><th class="p-4">UserID</th><th class="p-4">ชื่อ</th><th class="p-4">Role</th><th class="p-4">สถานะ</th><th class="p-4">เข้าใช้ล่าสุด</th><th class="p-4">จัดการ</th></tr></thead>
              <tbody id="userTableBody" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- Section Permissions -->
      <section id="section-permissions" class="hidden">
        <div class="flex justify-between items-center mb-4">
          <h2 class="font-bold text-slate-700">ตารางสิทธิ์การใช้งาน (Role Permissions)</h2>
          <button onclick="openPermModal()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-medium text-sm flex items-center gap-1 shadow-sm transition">
             <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg> เพิ่มระบบ
          </button>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm whitespace-nowrap">
              <thead class="bg-slate-100 text-slate-600"><tr><th class="p-4">Role</th><th class="p-4">ระบบ</th><th class="p-4 text-center">อ่าน</th><th class="p-4 text-center">เพิ่ม</th><th class="p-4 text-center">แก้</th><th class="p-4 text-center">ลบ</th><th class="p-4 text-center">อนุมัติ</th><th class="p-4">จัดการ</th></tr></thead>
              <tbody id="permTableBody" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- ==================== Modals ==================== -->
  <div id="userModal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-50 flex items-center justify-center z-50 px-4">
    <div class="bg-white rounded-xl p-6 w-full max-w-sm shadow-2xl">
      <h3 class="text-lg font-bold mb-4">แก้ไขผู้ใช้งาน</h3>
      <input type="hidden" id="eUserId">
      <div class="mb-4">
        <label class="block text-xs font-bold text-slate-500 mb-1">กลุ่มผู้ใช้ (Role)</label>
        <!-- ค่าที่กรอกจะถูกบันทึกลง Sheet (เช่น ADMIN) -->
        <input type="text" id="eRole" class="w-full border rounded-lg p-2.5 outline-none focus:border-blue-500 uppercase">
      </div>
      <div class="mb-6">
        <label class="block text-xs font-bold text-slate-500 mb-1">สถานะ</label>
        <select id="eStatus" class="w-full border rounded-lg p-2.5 outline-none focus:border-blue-500">
          <option value="ACTIVE">ACTIVE (อนุญาต)</option>
          <option value="INACTIVE">INACTIVE (ระงับ)</option>
        </select>
      </div>
      <div class="flex justify-end gap-2">
        <button onclick="closeModal('userModal')" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-medium transition">ยกเลิก</button>
        <button onclick="saveUser()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition">บันทึก</button>
      </div>
    </div>
  </div>

  <div id="permModal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-50 flex items-center justify-center z-50 px-4">
    <div class="bg-white rounded-xl p-6 w-full max-w-lg shadow-2xl max-h-[90vh] overflow-y-auto">
      <h3 class="text-lg font-bold mb-4" id="permTitle">ตั้งค่าระบบ</h3>
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div><label class="block text-xs font-bold text-slate-500 mb-1">กลุ่ม (Role)</label><input type="text" id="pRole" class="w-full border rounded-lg p-2 outline-none focus:border-blue-500 uppercase"></div>
        <div><label class="block text-xs font-bold text-slate-500 mb-1">ระบบ (SystemName)</label><input type="text" id="pSystem" class="w-full border rounded-lg p-2 outline-none focus:border-blue-500"></div>
      </div>
      <div class="mb-4">
        <label class="block text-xs font-bold text-slate-500 mb-1">URL (หน้าเว็บปลายทาง)</label>
        <input type="text" id="pUrl" class="w-full border rounded-lg p-2 outline-none focus:border-blue-500" placeholder="https://...">
      </div>
      <div class="mb-6 p-4 bg-slate-50 border rounded-lg">
        <label class="block text-xs font-bold text-slate-700 mb-3">กำหนดสิทธิ์พื้นฐาน (RBAC)</label>
        <div class="grid grid-cols-2 gap-3 text-sm">
          <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="pRead" class="w-4 h-4 text-blue-600 rounded"> canRead (เข้าถึง)</label>
          <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="pCreate" class="w-4 h-4 text-blue-600 rounded"> canCreate</label>
          <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="pEdit" class="w-4 h-4 text-blue-600 rounded"> canEdit</label>
          <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="pDelete" class="w-4 h-4 text-blue-600 rounded"> canDelete</label>
          <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="pApprove" class="w-4 h-4 text-blue-600 rounded"> canApprove</label>
        </div>
      </div>
      <div class="flex justify-end gap-2">
        <button onclick="closeModal('permModal')" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-medium transition">ยกเลิก</button>
        <button onclick="savePerm()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition">บันทึกสิทธิ์</button>
      </div>
    </div>
  </div>

  <!-- ==================== SCRIPT ==================== -->
  <script>
    // ⚠️ ใส่ค่าของคุณตรงนี้ให้เรียบร้อย
    const LIFF_ID = "2011487100-dldPQItq"; // แทนที่ด้วย LIFF ID ของคุณ
    const CENTRAL_AUTH_API = "https://script.google.com/macros/s/AKfycbyQJWRWPgoI-3YMuD596c7Uv7t2y6z25HLjwuvtIAdGnyxK3pPO7bFOqYg-QBeGic5Q/exec";
    
    let MY_USER_ID = "";
    let globalData = { users: [], permissions: [] };

    async function initApp() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) { liff.login(); return; }
        const profile = await liff.getProfile();
        MY_USER_ID = profile.userId;

        await loadAdminData();
      } catch (err) {
        document.getElementById("loadingUI").classList.add("hidden");
        document.getElementById("unauthorizedUI").classList.remove("hidden");
      }
    }

    async function fetchAPI(action, extraPayload = {}) {
      const payload = { action: action, userId: MY_USER_ID, ...extraPayload };
      const res = await fetch(CENTRAL_AUTH_API, { method: "POST", body: JSON.stringify(payload) });
      const data = await res.json();
      if (data.status === 'error' || (!data.allowed && action === 'checkAccess')) {
        throw new Error(data.message || "ไม่มีสิทธิ์เข้าถึง");
      }
      return data;
    }

    async function loadAdminData() {
      document.getElementById("loadingUI").classList.remove("hidden");
      document.getElementById("loadingText").innerText = "กำลังดึงข้อมูลฐานข้อมูล...";
      
      try {
        const data = await fetchAPI("adminGetData");
        globalData = data;
        
        renderUsers();
        renderPerms();
        
        document.getElementById("loadingUI").classList.add("hidden");
        document.getElementById("appUI").classList.remove("hidden");
      } catch (err) {
        document.getElementById("loadingUI").classList.add("hidden");
        document.getElementById("unauthorizedUI").classList.remove("hidden");
        document.getElementById("errorMsgText").innerText = err.message;
      }
    }

    function renderUsers() {
      document.getElementById('userTableBody').innerHTML = globalData.users.map(u => `
        <tr class="hover:bg-slate-50 transition border-b border-slate-50">
          <td class="p-4 text-xs text-slate-400 font-mono">${u.userId.substring(0,12)}...</td>
          <td class="p-4 font-bold text-slate-700">${u.displayName}</td>
          <td class="p-4"><span class="bg-slate-100 text-slate-700 px-2 py-1 rounded-md text-xs font-bold border border-slate-200">${u.role}</span></td>
          <td class="p-4"><span class="px-2 py-1 rounded-md text-xs font-bold ${u.status==='ACTIVE'?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}">${u.status}</span></td>
          <td class="p-4 text-xs text-slate-500">${u.lastLogin || '-'}</td>
          <td class="p-4"><button onclick="openUserModal('${u.userId}','${u.role}','${u.status}')" class="text-blue-600 font-bold hover:underline bg-blue-50 hover:bg-blue-100 px-3 py-1 rounded-md transition">แก้ไข</button></td>
        </tr>
      `).join('');
    }

    function renderPerms() {
      const check = v => (v===true || String(v).toUpperCase()==='TRUE') ? '<span class="text-green-500 font-bold">✓</span>' : '<span class="text-slate-300">-</span>';
      document.getElementById('permTableBody').innerHTML = globalData.permissions.map(p => `
        <tr class="hover:bg-slate-50 transition border-b border-slate-50">
          <td class="p-4 font-bold text-slate-700">${p.role}</td><td class="p-4 font-bold text-blue-600">${p.systemName}</td>
          <td class="p-4 text-center">${check(p.canRead)}</td><td class="p-4 text-center">${check(p.canCreate)}</td>
          <td class="p-4 text-center">${check(p.canEdit)}</td><td class="p-4 text-center">${check(p.canDelete)}</td>
          <td class="p-4 text-center">${check(p.canApprove)}</td>
          <td class="p-4">
            <button onclick="openPermModal('${p.role}','${p.systemName}')" class="text-amber-500 font-bold hover:underline mr-2 bg-amber-50 px-2 py-1 rounded-md">แก้ไข</button>
            <button onclick="delPerm('${p.role}','${p.systemName}')" class="text-red-500 font-bold hover:underline bg-red-50 px-2 py-1 rounded-md">ลบ</button>
          </td>
        </tr>
      `).join('');
    }

    function switchTab(tab) {
      document.getElementById('section-users').style.display = tab === 'users' ? 'block' : 'none';
      document.getElementById('section-permissions').style.display = tab === 'permissions' ? 'block' : 'none';
      
      const btnUsers = document.getElementById('tab-users');
      const btnPerms = document.getElementById('tab-permissions');
      
      if(tab === 'users') {
        btnUsers.className = 'px-4 py-2 rounded-md bg-blue-600 text-white font-medium text-sm transition';
        btnPerms.className = 'px-4 py-2 rounded-md text-slate-300 hover:text-white hover:bg-slate-700 font-medium text-sm transition';
      } else {
        btnPerms.className = 'px-4 py-2 rounded-md bg-blue-600 text-white font-medium text-sm transition';
        btnUsers.className = 'px-4 py-2 rounded-md text-slate-300 hover:text-white hover:bg-slate-700 font-medium text-sm transition';
      }
    }

    function openUserModal(id, role, status) {
      document.getElementById('eUserId').value = id; 
      document.getElementById('eRole').value = role; 
      document.getElementById('eStatus').value = status;
      document.getElementById('userModal').classList.remove('hidden');
    }

    function openPermModal(role = '', sys = '') {
      const isEdit = role !== '';
      document.getElementById('permTitle').innerText = isEdit ? 'แก้ไขสิทธิ์' : 'เพิ่มระบบใหม่';
      document.getElementById('pRole').value = role; document.getElementById('pSystem').value = sys;
      document.getElementById('pRole').readOnly = isEdit; document.getElementById('pSystem').readOnly = isEdit;
      
      if(isEdit) {
        const p = globalData.permissions.find(x => String(x.role).toUpperCase() === String(role).toUpperCase() && String(x.systemName).toUpperCase() === String(sys).toUpperCase());
        document.getElementById('pUrl').value = p.menuUrl || '';
        ['Read','Create','Edit','Delete','Approve'].forEach(k => {
          document.getElementById('p'+k).checked = (p['can'+k] === true || String(p['can'+k]).toUpperCase() === 'TRUE');
        });
      } else {
        document.getElementById('pUrl').value = '';
        ['Read','Create','Edit','Delete','Approve'].forEach(k => document.getElementById('p'+k).checked = false);
      }
      document.getElementById('permModal').classList.remove('hidden');
    }

    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    async function saveUser() {
      closeModal('userModal');
      document.getElementById("loadingUI").classList.remove("hidden");
      try {
        await fetchAPI("adminUpdateUser", { 
          targetUserId: document.getElementById('eUserId').value, 
          newRole: document.getElementById('eRole').value.trim().toUpperCase(), // เปลี่ยนเป็น Upper Case ป้องกันพิมพ์ผิด
          newStatus: document.getElementById('eStatus').value 
        });
        await loadAdminData();
      } catch(e) { alert(e.message); document.getElementById("loadingUI").classList.add("hidden"); }
    }

    async function savePerm() {
      if(!document.getElementById('pRole').value || !document.getElementById('pSystem').value) return alert('กรอก Role และ SystemName');
      closeModal('permModal');
      document.getElementById("loadingUI").classList.remove("hidden");
      
      const formData = {
        role: document.getElementById('pRole').value.trim().toUpperCase(), 
        systemName: document.getElementById('pSystem').value.trim(), 
        menuUrl: document.getElementById('pUrl').value,
        canRead: document.getElementById('pRead').checked, 
        canCreate: document.getElementById('pCreate').checked, 
        canEdit: document.getElementById('pEdit').checked, 
        canDelete: document.getElementById('pDelete').checked, 
        canApprove: document.getElementById('pApprove').checked
      };
      
      try {
        await fetchAPI("adminSavePerm", { formData: formData });
        await loadAdminData();
      } catch(e) { alert(e.message); document.getElementById("loadingUI").classList.add("hidden"); }
    }

    async function delPerm(role, sys) {
      if(!confirm(`ลบสิทธิ์ ${role} ใน ${sys}?`)) return;
      document.getElementById("loadingUI").classList.remove("hidden");
      try {
        await fetchAPI("adminDeletePerm", { role: role, systemName: sys });
        await loadAdminData();
      } catch(e) { alert(e.message); document.getElementById("loadingUI").classList.add("hidden"); }
    }

    window.onload = initApp;
  </script>
</body>
</html>
